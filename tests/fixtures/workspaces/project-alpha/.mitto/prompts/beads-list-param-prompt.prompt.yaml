name: Beads List Param Test
description: A beadsList prompt with an interactive-picker (boolean) param for E2E shortcut dialog testing.
menus: beadsList
group: ListParam
# NOTE: This fixture uses a boolean param, but that is no longer required.
# `fetchBeadsListPromptsForWorkspace` in useBeadsIntegration.js no longer
# applies `menuSatisfies(p, "beadsList")` — the dispatch path opens the
# parameter dialog for anything it cannot auto-fill (any menu-supplied param,
# interactive picker, or required text param), so a beadsList prompt with a
# plain `type: text, required: true` param will now render as an enabled
# shortcut and open the dialog on click too. Boolean is kept here only for
# UI-level assertion continuity (the checkbox is easy to interact with).
parameters:
  - name: DRY_RUN
    type: boolean
    description: Perform a dry run instead of executing the review.
    required: false
prompt: |
  Review the beads list (dry_run=${DRY_RUN}).
