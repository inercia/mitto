name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check Go formatting
        run: make fmt-check

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=5m

      # Static validation of every builtin prompt + fragment + model-tag
      # reference (mitto-11m). Fails the build if any builtin prompt
      # references an unknown modelTag, any processor calls
      # Session.HasModelTag("<tag>") with an unknown tag, or any prompt has
      # bad YAML, an unresolved fragment reference, or an uncompilable
      # template/CEL expression. Reproduce locally with: make check-prompts
      - name: Validate prompts and model tags
        run: make check-prompts

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Lint frontend code
        run: make lint-frontend

      - name: Check CodeMirror bundle is up to date
        run: |
          make vendor-codemirror
          if ! git diff --quiet -- web/static/vendor/codemirror/codemirror.js; then
            echo "::error::CodeMirror bundle is out of date. Run 'make vendor-codemirror' and commit web/static/vendor/codemirror/codemirror.js."
            git diff --stat -- web/static/vendor/codemirror/codemirror.js
            exit 1
          fi

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: make deps

      - name: Build Tailwind CSS
        run: make tailwind

      - name: Build mock ACP server
        run: make build-mock-acp

      - name: Run Go unit tests
        run: make test-go

      - name: Run JavaScript unit tests
        run: make test-js

  # NOTE: Integration tests use a mock ACP server.
  # UI/Playwright tests are excluded - they require a real ACP server and browser.
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: make deps

      - name: Build Tailwind CSS
        run: make tailwind

      - name: Build mock ACP server
        run: make build-mock-acp

      - name: Build Mitto
        run: make build

      - name: Run integration tests
        run: make test-integration
        env:
          MITTO_TEST_MODE: '1'

  smoke-tests:
    # mitto-3vb spike: temporary strategy.matrix.run fans this job out into
    # 5 parallel Ubuntu runs on a single push, giving us the "5+ consecutive
    # smoke-tests runs" signal the bead's acceptance criteria requires without
    # waiting for 5 sequential re-triggers. Revert the strategy block (and
    # restore the plain job name) once mitto-3vb's review phase has recorded
    # the CI results — the setup-node removal and bunx swap stay.
    name: Smoke Tests (Docker) (run ${{ matrix.run }})
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run smoke tests
        continue-on-error: true  # Smoke tests are informational while we stabilize CI timing
        run: make smoke-test

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: tests/ui/test-results/
          retention-days: 7

  # Runs the restricted-runner smoke script on Linux with firejail installed so
  # the `Linux → firejail` branch of tests/manual/restricted-runner-smoke.sh is
  # actually exercised (mitto-6yi.4). The script's assert_runner_log_line
  # already hard-fails on Linux if firejail was requested but the runner fell
  # back to exec, so no assertion changes are needed here.
  runner-smoke-linux:
    name: Restricted-Runner Smoke (Linux/firejail)
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install firejail
        run: |
          sudo apt-get update
          sudo apt-get install -y firejail

      - name: Prepare scratch dir for smoke logs
        run: |
          echo "SMOKE_SCRATCH_DIR=$GITHUB_WORKSPACE/smoke-scratch" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/smoke-scratch"

      - name: Run restricted-runner smoke test
        run: make test-runner-smoke

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runner-smoke-linux-logs
          path: ${{ github.workspace }}/smoke-scratch/
          if-no-files-found: warn
          retention-days: 7

  # Runs the restricted-runner smoke script on macOS so the `Darwin → sandbox-exec`
  # branch of tests/manual/restricted-runner-smoke.sh is actually exercised on CI
  # (mitto-6yi.5). Mirrors runner-smoke-linux minus the firejail install step
  # (sandbox-exec is built into macOS).
  runner-smoke-macos:
    name: Restricted-Runner Smoke (macOS/sandbox-exec)
    runs-on: macos-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Prepare scratch dir for smoke logs
        run: |
          echo "SMOKE_SCRATCH_DIR=$GITHUB_WORKSPACE/smoke-scratch" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/smoke-scratch"

      - name: Run restricted-runner smoke test
        run: make test-runner-smoke

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runner-smoke-macos-logs
          path: ${{ github.workspace }}/smoke-scratch/
          if-no-files-found: warn
          retention-days: 7
