icon: save
name: Commit changes
menus: prompts, conversation, !promptsLoop
description: Stage and commit changes with descriptive messages
group: Submission of changes
backgroundColor: '#B2DFDB'
preferredModels:
  - modelTag: Coding
target:
  title: 'Commit changes'
  reuse:
    title: true
    coalesce: true
prompt: |
  Create Git commits for changes in this repository with proper organization and messages.

  ### 0. Prerequisites

  **Formatting:** Run project formatters. Report any files modified and include in commit analysis.

  **Tests:**

  - If not run recently: warn user, ask to proceed or run tests first
  - If failing: warn user, ask to fix or proceed

  ### 1. Ensure Feature Branch

  ```bash
  git branch --show-current
  ```

  If on `main`/`master`/protected branch:

  - Check recent branch naming: `git branch -r --sort=-committerdate | head -20`
  - Suggest branch name following detected convention (based on the changes to commit)
  - **With Mitto UI**: Use `mitto_ui_form` to let the user choose:
    ```
    mitto_ui_form(self_id: "{{ .Session.ID }}", title: "Create Feature Branch?", html: "
      <label for='action'>Action:</label>
      <select name='action' id='action'>
        <option value='create_branch'>Create feature branch</option>
        <option value='continue'>Continue on current branch</option>
      </select>
      <div>
        <label for='branch_name'>Branch name:</label>
        <input type='text' name='branch_name' id='branch_name' placeholder='feat/my-feature' value='<suggested-name>'>
      </div>
    ")
    ```
    If `action == "create_branch"`: `git checkout -b <branch_name>`
  - **Without**: Ask in conversation

  If on feature branch: fetch and rebase on target branch (usually "main").

  ### 2. Analyze Changes

  {{- if .Session.HasMessages }}
  This conversation has been running for a while — focus the commits on the work
  **we did together**, not on unrelated changes that may already exist in the
  working tree.

  1. Review the conversation so far and enumerate the files we actually touched
     (edits, creations, deletions, renames). Prefer explicit tool traces (edits,
     writes, deletes) over guessing.
  2. Run `git status --porcelain` and intersect it with that list — the resulting
     set is the **only** set of files you may propose for commits.
  3. If files in `git status` are **not** in that set (someone else's uncommitted
     work, prior WIP, unrelated in-flight changes), leave them alone: do **not**
     `git add` them, do **not** `git stash` them, do **not** `git checkout` them.
     Mention them briefly in the plan under an "Ignoring (not part of this
     conversation)" note so the user knows they were seen and skipped.
  4. If our conversation touched a file but `git status` shows it as clean, note
     it (it was likely reverted or already committed) and skip it.
  5. Group the in-scope files by scope: feature/component, type (config/docs/
     deps), path (module/directory).
  6. Ask if the mapping between the conversation's work and the file set is
     uncertain.
  {{- else }}
  This is the first message in this conversation, so there is no prior context
  to narrow the scope. Analyze the whole repository state:

  1. Run `git status --porcelain` and inspect **everything** — modified, added,
     deleted, renamed, untracked.
  2. Group by scope: feature/component, type (config/docs/deps), path (module/
     directory).
  3. Check for already-staged changes: should they go first, or be unstaged and
     re-grouped with the rest?
  4. Ask if uncertain about intent or grouping.
  {{- end }}

  ### 3. Propose Commits

  SEQUENCE | COMMIT MESSAGE | FILES | REASON

  Use conventional prefixes: `feat:`, `fix:`, `docs:`, `refactor:`, `test:`, `chore:`
  Files can use wildcards (`*.md`, `docs/*`). Order logically.

  ### 4. Wait for Approval

  **With Mitto UI**: Use `mitto_ui_options` for the top-level decision:
  ```
  mitto_ui_options(self_id: "{{ .Session.ID }}", question: "Proposed N commits (see above). How to proceed?",
    options: [{label: "Approve all"}, {label: "Edit commit messages"}, {label: "Modify plan"}, {label: "Cancel"}])
  ```
  - If **"Edit commit messages"**: proceed to step 4a.
  - If **"Approve all"**: proceed to step 5.
  - If **"Modify plan"**: discuss changes, update plan, return to step 4.
  - If **"Cancel"**: stop.

  **Without**: Ask in conversation. Wait for explicit approval.

  ### 4a. Edit Commit Messages (With Mitto UI)

  For each commit, present the message in a textbox for editing:
  ```
  mitto_ui_textbox(self_id: "{{ .Session.ID }}",
    title: "Edit commit message (1/N)",
    text: "<type>(<scope>): <description>\n\n<body>",
    result: "edited_text")
  ```
  Use the edited text as the final commit message. If `changed == false`, use the original.

  ### 5. Execute

  Per commit: `git add <files>` → `git commit -m "<message>"`. Report results.

  {{ if .Session.BeadsIssue -}}
  ### 6. Close Linked Beads Issue

  This conversation is linked to beads issue `{{ .Session.BeadsIssue }}`. Now that the commits are made, check whether the issue is fully resolved.

  - Load the issue and its acceptance criteria:

    ```bash
    bd show {{ .Session.BeadsIssue }} --long --json
    ```

  - Compare the acceptance criteria against the committed changes.
  - **If nothing else is left to do** for this issue:
    1. Confirm with the user via
       `mitto_ui_options(self_id: "{{ .Session.ID }}", question: "All work for {{ .Session.BeadsIssue }} appears complete. Close it now?", options: [{label: "Yes, close it"}, {label: "No, keep it open"}])`.
    2. If approved, close with a specific reason that references the commits:

       ```bash
       bd close {{ .Session.BeadsIssue }} --reason "<what shipped and where — e.g. 'Implemented in <sha>; tests pass'>"
       ```

  - **If work remains**, leave the issue open and append a short progress note so the finding is not lost:

    ```bash
    bd update {{ .Session.BeadsIssue }} --append-notes "<what shipped in these commits and what still remains>"
    ```

  Be conservative: when it is unclear whether every acceptance criterion is met, keep the issue open.

  ### 7. Update Agent Rules (Optional)
  {{- else }}
  ### 6. Update Agent Rules (Optional)
  {{- end }}

  If you discovered project conventions or the user corrected assumptions, update Agent rules/memories (with user approval).

  ## Guidelines

  - Respect `.gitignore`
  - Skip empty commits
  - Handle binary/large files appropriately
