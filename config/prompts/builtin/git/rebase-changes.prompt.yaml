icon: sync
name: Rebase changes
menus: prompts, !promptsLoop
description: Rebase changes on top of main
group: Submission of changes
backgroundColor: "#B2DFDB"
enabledWhen: '!(Session.HasBeadsIssue && BeadHasLabels(Session.BeadsIssue, "support-question"))'
preferredModels:
  - modelTag: Coding
  - modelTag: Smart
target:
  title: "Submission of changes"
  reuse:
    title: true
    coalesce: true
prompt: |
  Rebase the current branch onto the target branch, resolving conflicts and pushing the result.

  ### 1. Check Repository Status

  ```bash
  git branch --show-current
  git status --porcelain --untracked-files=no
  git status --short
  ```

  Only tracked changes block the rebase. Untracked files do not: leave them
  untouched and proceed. Do not stash, commit, or discard untracked work just
  to start the rebase.

  If tracked uncommitted changes exist, ask user whether to stash, commit, or
  discard. Do not proceed until the tracked working tree is clean.

  If Git refuses to rebase because an untracked file would be overwritten, stop
  and ask the user how to preserve or move that file. Never delete untracked
  work to clear the way.

  ### 2. Identify Target Remote and Branch

  {{ template "git/shared/identify-remote-branch" . }}

  ### 3. Rebase and Resolve Conflicts

  {{ template "git/shared/rebase-onto-base" . }}

  ### 4. Report

  ```console
  ✅ Rebase completed successfully!
  Rebased X commits onto <target-remote>/<target-branch>
  ```

  ### 5. Push

  ```bash
  git push --force-with-lease origin <current-branch>
  ```

  In fork workflows: push to `origin` (your fork), not `upstream`.

  ## Guidelines

  - Protect uncommitted changes — no work should be lost
  - Detect the correct remote and confirm with user
  - Ask when uncertain about any decision
  - Fetch before rebasing
  - Use `--force-with-lease` when force pushing
  - Push to the branch's tracking remote (usually `origin`), not the rebase target remote
  - Offer to abort (`git rebase --abort`) if rebase becomes too complex
  - Preserve commit messages and authorship
  - Ask rather than guess on conflict resolution
  - Remind user that collaborators may need to reset local branches after push
