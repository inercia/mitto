icon: list
name: Follow instructions
menus: prompts, !promptsLoop
description: Run a scripted test by following setup and test instructions from Markdown files in the workspace
group: Testing
backgroundColor: '#FFE0B2'
preferredModels:
  - modelTag: Coding
parameters:
  - name: Setup
    type: filename
    glob: "**/setup_test_*.md"
    remember: folder
    required: false
    description: Markdown file describing the one-time setup steps for this test run
  - name: Test
    type: filename
    glob: "**/test_*.md"
    remember: folder
    required: true
    description: Markdown file describing the test procedure to follow
  - name: CreateIssues
    type: boolean
    default: "false"
    required: false
    description: When enabled, file a beads issue for each error found during the run
prompt: |
  You are going to run a scripted test by carefully following instructions
  that a human wrote for you in Markdown files. The setup and test
  procedures are **inlined below** — do NOT open or re-read those files
  from disk; the exact bytes the author intended you to follow are already
  embedded in this prompt.

  ## Ground rules

  - Follow the instructions **literally and in order**. Do not skip steps,
    do not reorder them, and do not "optimize" a step you do not understand
    — ask the user first.
  - After each step, briefly state what you did and what you observed
    (command output, file changes, UI state). Keep it concise.
  - If a step fails or produces an unexpected result, stop and report the
    failure before moving on — do not paper over it.
  - Do not commit, push, or perform any destructive git operation unless a
    step explicitly tells you to.

  {{- if .Args.Setup }}

  ## Setup

  The following setup instructions come from `{{ .Args.Setup }}`. Run them
  once, in order, before starting the test procedure.

  {{ if FileExists .Args.Setup -}}
  ---
  {{ ReadFile .Args.Setup }}
  ---
  {{- else -}}
  **⚠️ Setup file `{{ .Args.Setup }}` could not be read** (missing, outside
  the workspace, oversize, or unreadable). Report this to the user and stop
  before starting the test.
  {{- end }}
  {{- else }}

  ## Setup

  No setup file was supplied. Assume the environment is already prepared
  and go straight to the test procedure.
  {{- end }}

  ## Test procedure

  The following test instructions come from `{{ .Args.Test }}`. Execute
  them step by step after the setup above is complete.

  {{ if FileExists .Args.Test -}}
  ---
  {{ ReadFile .Args.Test }}
  ---
  {{- else -}}
  **⚠️ Test file `{{ .Args.Test }}` could not be read** (missing, outside
  the workspace, oversize, or unreadable). Report this to the user and
  stop.
  {{- end }}

  ## Reporting

  When the procedure is finished (or when you had to stop early because a
  step failed), produce a short report with:

  - Which steps passed, which failed, and which were skipped.
  - For each failure: the command / action, the observed result, and the
    expected result according to the instructions.
  - Any deviations from the instructions and why they were necessary.

  {{ if eq (Arg "CreateIssues" "false") "true" -}}
  ## File beads issues for errors

  For **each distinct error** you observed during the run, file a beads
  issue so the failure is tracked:

  ```bash
  bd create "<short summary of the failure>" \
    --type bug \
    --priority 2 \
    --body-file <(printf '%s\n' "<detailed description: which step, expected vs actual, relevant output>")
  ```

  Guidelines:

  - One bead per **distinct** error — do not file duplicates for the same
    root cause across multiple steps; instead file one bead and mention the
    other affected steps in its body.
  - Include the exact step reference from `{{ .Args.Test }}` (e.g. "Step 3
    of the test procedure") so the bead is traceable back to the source.
  - Include the observed command output / error message verbatim (trim to
    the relevant lines).
  - If the failure looks like an environment / setup issue rather than a
    product bug, label it accordingly in the summary (e.g. `[env]
    <summary>`) so triage can route it.

  After filing, list the created bead IDs in the final report.
  {{- else -}}
  ## Errors

  Report any errors in the final report above. Do **not** file beads
  issues — the user did not enable issue creation for this run.
  {{- end }}

  {{- $cleanupFile := printf "%s/cleanup.md" (Dir .Args.Test) }}
  {{- if FileExists $cleanupFile }}

  ## Additional cleanup instructions

  After finishing the test procedure and producing the report above, follow
  the cleanup steps below. These come from `{{ $cleanupFile }}` (a sibling
  of the test file) and are inlined here — do NOT re-read the file from
  disk. Execute them in order, briefly noting what you did for each step.

  ---
  {{ ReadFile $cleanupFile }}
  ---
  {{- else }}

  ## Cleanup (none provided)

  No cleanup instructions were supplied. If this test needs a teardown
  step (e.g. removing temporary files, restoring config, stopping a
  service), mention to the user at the end of the run that they can
  describe a cleanup procedure by creating `{{ $cleanupFile }}` next to
  the test file — future runs of this prompt will pick it up
  automatically.
  {{- end }}

  ## Self-reflection on the instructions

  After the report (and cleanup, if any) is complete, reflect on the
  instructions in `{{ .Args.Test }}` that you just followed. This is
  feedback for the **user who authored the test file**, so they can
  refine it for future runs.

  Restrict this reflection to the **procedure and flow** of the
  instructions — do NOT comment on *what* is being tested or on the
  product under test. The user owns the test's subject matter; you are
  only reviewing how the steps were written.

  Evaluate, briefly:

  - Were the steps **clear** and **easy to follow** in the order given?
  - Was any step **ambiguous**, **missing context**, or **misleading**
    (e.g. an implicit prerequisite, an undefined term, a command whose
    expected output was not stated, a branch condition without a clear
    "otherwise" path)?
  - Did any step send you down a **wrong path** that you had to back
    out of, or force you to guess?
  - Were **expected results** stated concretely enough that pass/fail
    was unambiguous at each step?

  If — and only if — you found weaknesses, produce a short
  **"Instructions feedback"** section with:

  1. A bullet list of each concrete weakness, quoting the offending
     step (by number or short excerpt) and explaining the problem in
     one sentence.
  2. A concrete, actionable improvement for each — a suggested rewrite,
     an added clarification, or the specific context that should be
     added. Keep suggestions minimal and surgical; do not propose
     rewriting the whole file.

  If the instructions were clear and no changes are warranted, say so
  in a single line (e.g. "Instructions feedback: none — the procedure
  was clear and unambiguous.") and stop. Do not manufacture nits.
