icon: check
name: Run tests
menus: prompts
description: Run the test suite and report results
group: Testing
backgroundColor: '#FFE0B2'
preferredModels:
  - modelTag: Coding
loop:
  trigger: [onCompletion]
  onCompletion:
    delay: 60
  mode: optional
  default: false
target:
  title: 'Run tests'
  reuse:
    title: true
    coalesce: true
parameters:
  - name: FixTests
    type: boolean
    default: "false"
    required: false
    description: When enabled, fix failing tests immediately and re-run until green instead of only reporting them
  - name: CreateIssues
    type: boolean
    default: "false"
    required: false
    description: When enabled, file a beads issue for each important test failure that is left unresolved
prompt: |
  Run the project's test suite and report results.
  {{ if and (Model "Expensive") (not (Model "Coding")) }}
  ### 0. Cost check — delegate this run

  This prompt declares `preferredModels: [{modelTag: Coding}]`, but the active
  model is `{{ if .Session.ModelName }}{{ .Session.ModelName }}{{ else }}<unknown>{{ end }}`
  (tags: {{ range $i, $t := .Session.ModelTags }}{{ if $i }}, {{ end }}{{ $t }}{{ end }}) —
  an **expensive** tier that did not pick up the `Coding` tag. Running a test
  suite is mechanical work, so hand this run to a cheaper child conversation
  when one is available.

  {{ template "_shared/delegation-context" . }}

  1. Pick a delegate among the children listed above: one that is **not**
     currently prompting and whose ACP server carries a `coding` / `fast` /
     `cheap` tag in the catalog above. If no child qualifies, skip to section 1
     and run the tests yourself — do **not** create a new conversation just for
     this.
  2. Hand the run over by re-sending this same prompt with your arguments, so
     the delegate gets the full instructions:

     ```
     mitto_conversation_send_prompt(
       self_id: "{{ .Session.ID }}",
       conversation_id: "<child id>",
       prompt_name: "Run tests",
       arguments: {"FixTests": "{{ Arg "FixTests" "false" }}", "CreateIssues": "{{ Arg "CreateIssues" "false" }}"})
     ```

  3. Wait for it:
     `mitto_children_tasks_wait(self_id: "{{ .Session.ID }}", children_list: ["<child id>"], task_id: "run-tests", timeout_seconds: 1800)`
  4. Relay the delegate's report as your own summary (sections 3 and 4 below).
     Do **not** re-run the suite yourself, and do not delete the child — it was
     not created by this run.

  Continue with the sections below yourself only when delegation is not
  possible (no suitable child) or the delegate failed to report back.
  {{ end }}
  ### 1. Discover and Run

  Identify test framework from project config:
  - Go: `go test` | Python: `pytest`, `unittest` | JS/TS: `jest`, `vitest` | Rust: `cargo test` | Java: `mvn test`
  - Check Makefile targets, package.json scripts

  Run all tests or tests related to recent changes.

  ### 2. Analyze

  Pass: report success.

  {{ if eq (Arg "FixTests" "false") "true" -}}
  Fail: **fix the failures**, starting with the simplest ones.

  - Fix the root cause, re-run the affected tests, and repeat until they pass.
  - Do not weaken a test (skip, delete, loosen an assertion) to make it pass —
    if the test is genuinely wrong, say so explicitly and explain why.
  - Stage nothing and do not commit; leave the fixes in the working tree.
  - If a failure resists a safe fix (unclear intent, needs a product decision,
    or the fix would be large/risky), stop working on it and report it under
    "Unresolved Failures" below.
  {{- else -}}
  Fail:

  - Simple failures (typos, missing imports): fix immediately, re-run, repeat
  - Complex failures: report for manual review
  {{- end }}

  ### 3. Summary

  | Test Group | Passed | Failed | Skipped | Status |
  |------------|--------|--------|---------|--------|
  | unit       | 45     | 0      | 2       | ✅     |
  | integration| 12     | 1      | 0       | ❌     |
  | **Total**  | **57** | **1**  | **2**   | ❌     |

  ### 4. Unresolved Failures

  Per failure: **Test**, **Error**, **Cause**, **Suggested fix**
  {{ if eq (Arg "CreateIssues" "false") "true" }}
  ### 5. File beads issues for important failures

  {{ if and (CommandExists "bd") (DirExists ".beads") -}}
  This project uses beads, so file an issue for each **important** unresolved
  failure from section 4. Write the description to a temporary Markdown file
  and pass it via `--body-file` (this preserves formatting and avoids
  shell-escaping bugs — `bd` does NOT support `@file` expansion for `-d`):

  ```bash
  cat > /tmp/test-failure.md <<'EOF'
  ## Test

  `<fully qualified test name>` (<package / file>)

  ## Expected

  <what the test asserts>

  ## Actual

  <observed failure output, trimmed to the relevant lines, in a fenced code block>

  ## Notes

  <optional: suspected cause, other tests affected by the same root cause>
  EOF

  bd create "<short summary of the failure>" \
    --type bug \
    --priority 2 \
    --labels "tests" \
    --body-file /tmp/test-failure.md
  ```

  Guidelines:

  - Only file **important** failures: a real product bug, a broken invariant,
    or a persistently failing test. Do NOT file flakes you could not reproduce,
    environment/setup problems you already fixed, or failures you resolved in
    section 2.
  - One bead per **distinct root cause** — mention the other affected tests in
    the body instead of filing duplicates.
  - Before filing, check for an existing open bead covering the same failure
    (`bd list --label tests --status open`) and comment on it instead of
    creating a duplicate.
  - If the failure is an environment / setup issue rather than a product bug,
    prefix the summary with `[env]`.
  - `bd create` prints the new bead ID on success (e.g. `Created mitto-abc`).
    Capture it — never invent IDs like `BUG-1`; if no ID was printed, the bead
    was not filed.

  End the report with a **"Beads filed"** section listing each new bead as
  `<bd-id> — <title>`. If nothing was filed (no important failures, or filing
  failed), say so in one line instead of omitting the section.
  {{- else -}}
  This project does **not** use beads (no `bd` command and/or no `.beads`
  directory), so no issues can be filed. Say so in one line in the report and
  leave the unresolved failures in section 4 as the record.
  {{- end }}
  {{- end }}
