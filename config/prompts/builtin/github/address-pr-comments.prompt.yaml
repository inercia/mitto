icon: chat-bubble
name: Address PR Comments
menus: prompts, !promptsLoop
description: Systematically address all pull request review feedback
group: Submission of changes
backgroundColor: '#B2DFDB'
tags:
- loop
- github
target:
  title: "PR #{{ .Args.Pr }}"
  reuse:
    title: true
    coalesce: true
parameters:
  - name: Pr
    type: text
    required: false
    description: 'Optional PR to address — a number, URL, or branch name. If omitted, uses the current branch.'
enabledWhen: 'FileExists(".git/config") && (Tools.HasPattern("github_*") || CommandExists("gh") || CommandExists("glab")) && !(Session.HasBeadsIssue && BeadHasLabels(Session.BeadsIssue, "support-question"))'
prompt: |
  Address all review comments on the current pull request with thoughtful responses and code changes.

  {{ template "_shared/session-context" . }}

  ## Interaction Mode
  {{- if and .Session.IsLoop (not .Session.IsLoopForced) }}

  **Scheduled mode** — a loop run; the user is not watching.
  {{ template "_shared/silent-notify-only" . }}
  - Apply the author-aware policy and "Autonomy criteria" below. Follow clear,
    safe author requests without demanding objective agreement. For genuinely
    blocked items, clarify once and notify — do not guess or repeat objections.
  - If no PR matches the current branch (or the match is ambiguous), end the run
    quietly with a single notification — do not block waiting for input.
  {{- else }}

  **Interactive mode** — a force-triggered run or a non-loop conversation; the user may be present.
  - You may freely use `mitto_ui_options`, `mitto_ui_form`, and other interactive
    tools in addition to `mitto_ui_notify`.
  - Clarify blocking analysis choices and ask before pushing, as described below.
  {{- end }}

  ### Autonomy criteria (scheduled mode)

  - **Other reviewers/bots:** implement objectively supported, low-risk changes
    after validation; do not autonomously choose subjective product/architecture
    direction on their behalf.
  - **Verified user-author:** Clear author requests may be subjective, including
    style/design/scope preferences. That alone is not a reason to defer them.
    Implement when intent is clear, the work is understood and safe, and it can
    be tested. Ordinary trade-offs do not require reconfirmation.
  - **For everyone:** pause only the affected item when intent is materially
    ambiguous, a specific material concern needs an answer, or an existing
    safety/permission gate blocks it. Reply/notify once, leave it pending, and
    continue independent safe work. Never resolve a thread you did not author
    unless the user explicitly authorizes it.

  ### 1. Identify the PR/MR

  {{ template "github/shared/identify-pr-by-branch" . }}

  ### 2. Retrieve All Comments

  {{ template "github/shared/pr-fetch-comments" . }}

  {{ template "github/shared/pr-feedback-policy" . }}

  {{ template "github/shared/pr-feedback-checkpoint" . }}

  ### 3. Analyze Each Comment

  For each pending item (with its full discussion context), evaluate:

  - **Speaker/intent**: Other human, bot, or verified user-author? A request,
    question, endorsement, or status reply? Apply the shared policy first.
  - **Concern**: What issue is raised? Correctness, style, performance, security?
  - **Validity**: Is it technically valid? Aligned with project conventions? Missing context?
  - **Priority**: Blocking (must fix) / Important (should fix) / Optional (nice-to-have) / Discussion (needs clarification)

  ### 4. Formulate Responses

  - **Agree**: Implement and validate the fix; reply with "✅ Fixed in [hash]"
    only after successful push and remote-head verification
  - **Need clarification**: Ask specific questions, provide context
  - **Disagree**: Acknowledge perspective, explain reasoning with evidence, offer alternatives
  - **Already addressed**: Point to relevant code/commit

  {{- if and .Session.IsLoop (not .Session.IsLoopForced) }}
  In scheduled mode: apply the **Autonomy criteria** above. Do not defer a
  clear author preference solely for being subjective. Raise a necessary
  clarification once and collect blocked items for the final notification.
  {{- else }}
  Ask a focused question only when the answer is necessary to proceed;
  ordinary author-requested trade-offs do not need another confirmation.
  {{- end }}

  ### 5. Group and Prioritize

  1. Group related comments (multiple about same issue)
  2. Identify dependencies (some fixes resolve multiple comments)
  3. Prioritize: blocking first, related changes together, independent in parallel



  | Comment | Speaker | Intent | Validity / material concern | Priority | Action |
  |---------|---------|--------|-----------------------------|----------|--------|
  | ...     | ...     | ...    | ...                         | ...      | ...    |

  {{- if and .Session.IsLoop (not .Session.IsLoopForced) }}
  In scheduled mode: skip confirmation — proceed with the autonomy-approved
  subset and defer the rest (no blocking UI).
  {{- else }}
  Confirm unresolved analysis choices via `mitto_ui_options` when necessary.
  Do not ask the user to reconfirm a clear request already made in the PR.
  The separate pre-push confirmation below remains required.
  {{- end }}

  ### 6. Implement Changes

  Per change:
  1. Make the change
  2. Run relevant tests
  3. Commit: `fix: address review feedback on [topic]`
  4. Record pending-push; defer fix-completion replies/resolution until Step 11

  #### Delegating Significant Fixes to Child Conversations

  For fixes requiring **significant work** (3+ files, substantial new code, risky refactors), delegate to Mitto child conversations for parallel execution.

  {{- if and .Session.IsLoop (not .Session.IsLoopForced) }}
  In scheduled mode: before spawning, check `{{ .Children.AllText }}` for an
  existing child for the same PR/comment and reuse it instead of creating a
  duplicate. Spawn at most **3 conversations per run**. **Spawned conversations
  must never be loops** — they are one-off tasks.
  {{- end }}

  **How to delegate (requires Mitto MCP tools):**

  {{ template "_shared/session-id-line" . }}
  Available ACP servers: `{{ Default "(none)" .ACP.AvailableText }}`
  {{- if .Children.AllText }}
  Existing children: `{{ .Children.AllText }}`
  {{- end }}

  1. Select ACP server: prefer `"coding"`/`"fast"` tagged servers for implementation tasks. Fallback: current server (marked `(current)` in the list above).
  2. If relevant children already exist, consider sending work to them via `mitto_conversation_send_prompt` instead of creating new ones
  3. `mitto_conversation_new(self_id: "{{ .Session.ID }}")`:
     ```
     title: "PR fix: <description>"
     initial_prompt: |
       Addressing a PR review comment.
       **Repo/Branch/PR**: <context>
       **Review feedback**: <pending items with full discussion, IDs/URLs, author types and timestamps>
       **Identity**: <PR_AUTHOR_LOGIN and verified user-owned accounts/evidence>
       **Policy**: <copy the full Author-aware feedback policy above>
       **Progress**: <copy the Feedback progress and deduplication rules and latest checkpoint>
       **Interaction mode**: <inherit this run's scheduled/interactive mode; a scheduled parent means no blocking UI>
       **What to do**: <detailed fix description>
       **Constraints**: Only modify related files, run tests, follow project style.

       When done, report via mitto_children_tasks_report(self_id, task_id: "<task_id>", status, summary, details).
       (Get your own self_id by calling mitto_conversation_get_current(self_id: "init").)
     acp_server: <selected server>
     ```
  4. `mitto_children_tasks_wait(self_id: "{{ .Session.ID }}", children_list: [...], task_id: "<short task description>", timeout_seconds: 600)`
  5. Review results, verify changes, run tests
  6. `mitto_conversation_delete` for completed children
  7. Commit combined changes

  **Without Mitto tools**: implement all fixes directly.

  ### 7. Account for All Requests Before Pushing

  Before pushing:

  - Every actionable request has a planned outcome or a pending clarification; do not
    repeat prior replies or respond to status-only acknowledgments
  - Reply on the original review thread, or link the source in a PR comment
    for general comments/review summaries (they have no resolvable thread ID)
  - Post necessary clarification/disagreement replies, but do not post
    fix-completion replies or resolve fixed threads before publication
  - Leave unresolved any needing discussion; update the PR feedback checkpoint
    with IDs, versions, outcomes and replies. Record local fixes as pending-push;
    add pushed commits and mark handled only after verifying the remote PR head

  ### 8. Identify Push Remote

  {{ template "git/shared/identify-remote-branch" . }}

  In fork workflows: push to `origin` (your fork), not `upstream`. Verify via PR's `head.repo.full_name`.

  ### 9. Preflight — Check if Branch is Behind Base

  Before pushing fixes on top of a branch that is behind its PR base, verify
  the branch is current. Missing base commits can re-break what you just
  addressed, and CI will fail on the exact issue you thought you resolved.

  {{ template "git/shared/check-behind-base" . }}

  ### 11. Push and Request Re-review

  {{- if and .Session.IsLoop (not .Session.IsLoopForced) }}
  In scheduled mode: push the autonomy-approved fixes and request re-review
  automatically (no confirmation), then `mitto_ui_notify` the result. If there
  are **no** autonomy-approved changes AND no pending-push fixes from previous
  runs, do not push — just notify which items need a human. Pending-push fixes
  remain work even with no new comments: validate and retry their push.
  {{- else }}
  **With Mitto UI**: `mitto_ui_options(self_id: "{{ .Session.ID }}", ...)` → "Ready to push and request re-review?"
  **Without**: Ask in conversation.
  {{- end }}

  ```bash
  git push <push-remote> <branch-name>
  gh pr ready && gh pr comment --body "Ready for re-review"   # GitHub
  glab mr update --ready                                       # GitLab
  ```

  After successful push and remote-head verification, post fix-completion
  replies referencing the published commits and only then resolve fixed threads
  under the existing authorship/permission rule. If a gate stops the push, it is
  declined, or it fails, leave those threads unresolved and fixes pending-push.

  ### 12. Summary Report

  ```console
  ✅ PR Review Comments Addressed

  📊 Summary:
  - Total comments: X
  - Resolved with code changes: Y
  - Resolved with explanation: Z
  - Pending discussion: W

  🔄 Changes made:
  - [Brief description of key changes]

  🔗 PR: <pr-url>
  ```

  ## Guidelines

  - Consider all feedback carefully — reviewers may have context you're missing
  - Account for every actionable request; avoid duplicate/status-only replies
  - Provide evidence when disagreeing (code, docs, benchmarks)
  - Ask for clarification rather than guessing intent
  - Group related changes in single commits
  - Run tests before pushing
  - Only mark conversations resolved if you authored the comment (unless asked)
  - For larger refactors, discuss scope first — consider delegating to a child conversation
  - When delegating, prefer `"coding"`/`"fast"` tagged ACP servers
  - Max 4 parallel child conversations
  - In fork workflows, push to `origin`, not `upstream`
  - **Interaction mode** (see "Interaction Mode" section above):
  {{- if and .Session.IsLoop (not .Session.IsLoopForced) }}
    - **Scheduled loop**: use only `mitto_ui_notify`; apply the author-aware
      Autonomy criteria; clarify genuinely blocked items once; never resolve
      threads you didn't author unless explicitly authorized; children are one-off.
  {{- else }}
    - **Force-triggered or non-loop**: you may use `mitto_ui_options`,
      `mitto_ui_form`, and other interactive tools; clarify blocking choices
      without re-confirming clear author requests, and ask before pushing.
  {{- end }}
