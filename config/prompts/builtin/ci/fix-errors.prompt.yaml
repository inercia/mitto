icon: error
name: Fix errors
menus: prompts, !promptsLoop
description: Analyze and fix the errors shown
group: Development
backgroundColor: '#FFE0B2'
tags:
- loop
prompt: |
  {{- if .Session.HasMessages }}
  Analyze this conversation so far and think about the errors we have been
  finding. Look for patterns: recurring failure modes, a shared root cause
  across multiple errors, or a fix that regressed something we already
  addressed. Read relevant source files to confirm the current state of the
  code — do not speculate about code you haven't opened.

  Then fix the outstanding errors identified from the conversation history.
  {{- else }}
  This is the first message in this conversation, so there is no error
  output already in context. Run the project's tests (and/or build) to
  surface the current errors, then read the relevant source files to
  understand code context around each error. Do not speculate about code
  you haven't opened.

  Then analyze and fix the errors that showed up.
  {{- end }}

  Your session ID is `{{ .Session.ID }}` — use as `self_id` for all `mitto_*` MCP tool calls.

  ## Interaction Mode
  {{- if and .Session.IsLoop (not .Session.IsLoopForced) }}

  **Scheduled mode** — a loop run; the user is not watching.
  {{ template "_shared/silent-notify-only" . }}
  - Decide **autonomously**; determine the errors to fix from the latest
    build/test output yourself.
  - **Commit** your fixes as follows:

    {{ template "git/safe-stage" . }}
  - If an error is genuinely ambiguous or underspecified, do **not** guess — notify
    what's blocked and stop, rather than asking.
  {{- else }}

  **Interactive mode** — a force-triggered run or a non-loop conversation; the
  user may be present. Ask for clarification if intent is unclear before changing code.
  {{- end }}

  Only fix the identified errors. Keep changes minimal and focused on root causes.

  Fix root causes, not symptoms. Ensure fixes work for all valid inputs.
  Report deeper design issues rather than applying narrow workarounds.

  ### Per error:

  1. **Identify**: Quote exact error message
  2. **Diagnose**: Root cause — what triggered it, why it failed
  3. **Fix**: Implement and explain the change
  4. **Verify**: Run code/tests, check for related issues

  ### Multiple errors:

  - Fix in dependency order (causes before symptoms)
  - Group errors sharing a root cause
  - Final verification after all fixes

  #### Delegating Complex Error Fixes to Child Conversations

  When there are **3+ unrelated errors** that can be fixed independently (different files, no shared root cause), delegate fixes to parallel child conversations.

  **Do NOT delegate** for: a single error, errors sharing a root cause, cascading errors from one issue, or trivial one-line fixes.

  {{- if and .Session.IsLoop (not .Session.IsLoopForced) }}
  In scheduled mode: before spawning, check `{{ .Children.AllText }}` and reuse an
  existing child instead of duplicating. Spawn at most **3 per run**. **Spawned
  conversations must never be loops.**
  {{- end }}

  {{ template "_shared/delegation-context" . }}

  **How to delegate:**

  1. Group errors by root cause — only independent groups get separate children
  2. Choose ACP server: clear fix path → prefer `"coding"`/`"fast"` servers; requires investigation/design decisions → prefer `"reasoning"`/`"planning"` servers; no match → server marked `(current)`, then first available
  3. If relevant children already exist, consider sending work to them via `mitto_conversation_send_prompt` instead of creating new ones
  4. `mitto_conversation_new(self_id: "{{ .Session.ID }}")` per task — include: exact error message(s), relevant file paths and context, what to fix, constraints (minimal changes, root cause fixes only), and reporting directive
  5. `mitto_children_tasks_wait(self_id: "{{ .Session.ID }}", task_id: "<error-fix-description>", timeout_seconds: 600)`
  6. Review all results — check for conflicts between fixes
  7. Run full verification after combining all changes
  8. `mitto_conversation_delete` for completed children

  **Without Mitto tools**: fix all issues directly in dependency order.
