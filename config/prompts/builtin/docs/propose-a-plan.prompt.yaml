icon: list
name: Propose a plan
menus: prompts, !promptsLoop
description: Create a detailed plan for the current task
group: Planning
backgroundColor: '#BBDEFB'
prompt: |
  Explore relevant codebase parts. Read affected files and check for existing
  patterns and reusable utilities.

  Create a detailed plan for the current task.

  ### Structure

  1. **Goal**: What we're achieving
  2. **Current state**: What exists, what's missing
  3. **Steps**: Numbered concrete actions with file paths, complexity estimates, dependencies
  4. **Risks**: Potential issues and mitigations
  5. **Verification**: How we'll know it's complete

  ### Present Plan for Review

  Generate the plan, then present it for review and editing.

  **With Mitto UI**: Present the plan in a textbox so the user can edit it directly:

  ```
  mitto_ui_textbox(self_id: "{{ .Session.ID }}",
    title: "Review Plan — edit before approving",
    text: "<generated-plan-markdown>",
    result: "edited_text")
  ```

  - If `changed == true`: use the edited plan as the approved version.
  - If `aborted == true`: ask the user what they'd like to change, revise, and present again.

  Then present the next-step choices. Build the options list with the entries
  below, **including only the ones whose gating condition matches this
  session**:

  1. **Refine this plan** — always present. Selecting this returns to the
     textbox flow above so the user can iterate on the wording.
  2. **Execute the plan here** — always present. Selecting this means the
     agent starts executing the plan inline, in this conversation.
  3. **Execute the plan in a new child conversation** — include this option
     ONLY when `{{ if not .Session.IsChild }}true{{ end }}` (i.e. this
     conversation is not itself a child of another one). On selection, spawn
     a fresh child with `mitto_conversation_new`:

     - `initial_prompt`: the approved plan (verbatim) plus a short preamble
       instructing the child to execute it and report progress back.
     - `acp_server`: **pick the most appropriate ACP for the work.** Consult
       the current session's available agents (`available_acp_servers` in
       `mitto_conversation_get_current`) and choose based on the plan's
       characteristics — e.g. coding-heavy work → a `Coding`-tagged agent;
       broad reasoning / design → a `Thinking`/`Deep` agent; short cheap
       edits → a `Fast`/`Cheap` agent. Do NOT hardcode a specific ACP; the
       set varies per workspace. If no clear winner, keep the current ACP.
     - `title`: a short label derived from the plan's Goal section.
  4. **File this as a beads issue (or epic) instead** — see the fragment
     below for the exact wording and safety rails. Include this option
     ONLY when beads is configured in this workspace.
  5. **Cancel** — always present. Stop without executing, spawning, or
     filing anything.

  {{ template "_shared/offer-file-as-bead" . }}

  Present the menu:

  ```
  mitto_ui_options(self_id: "{{ .Session.ID }}",
    question: "Plan reviewed. What next?",
    options: [
      {label: "Refine this plan"},
      {label: "Execute the plan here"},
      {{- if not .Session.IsChild }}
      {label: "Execute the plan in a new child conversation"},
      {{- end }}
      {{- if and (CommandExists "bd") (DirExists ".beads") }}
      {label: "File this as a beads issue (or epic) instead"},
      {{- end }}
      {label: "Cancel"}
    ])
  ```

  **Without Mitto UI**: Present the plan in conversation and offer the same
  choices as a numbered list, applying the same gating rules (skip the child
  conversation option in a child session; skip the beads option when
  `bd` is unavailable).
