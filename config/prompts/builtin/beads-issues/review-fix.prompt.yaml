icon: search
name: Review fix
menus: beadsIssues
parameters:
  - name: IssueID
    type: beadsId
    required: false
    description: The fixed bug bead to review
description: 'Critically review an attempted bug fix against symptoms, root cause and requirements, and propose corrections without implementing them'
backgroundColor: '#B3E5FC'
group: Tasks
enabledWhen: 'CommandExists("bd") && DirExists(".beads") && Item.Type == "bug" && Item.Labels != null && "fixed" in Item.Labels && !(Item.Labels != null && "support-question" in Item.Labels) && !(Session.HasBeadsIssue && BeadHasLabels(Session.BeadsIssue, "support-question"))'
preferredModels:
  - modelTag: Smartest
  - modelTag: Reasoning
  - modelTag: Smart
target:
  reuse:
    issue: true
    coalesce: true
prompt: |
  {{ template "_shared/session-context" . }}

  # Beads: Review Fix

  {{ $target := "" -}}
  {{ if .Session.BeadsIssue }}{{ $target = .Session.BeadsIssue }}{{ else if .Args.IssueID }}{{ $target = .Args.IssueID }}{{ end -}}
  {{ template "beads-issues/shared/target-bead-header-strict" (dict
      "Target" $target "Noun" "bug fix to review"
      "FromLink" (ne .Session.BeadsIssue "")
  ) }}
  {{ if $target -}}
  {{ template "beads-issues/shared/review-code" (dict "Ctx" . "Target" $target "Kind" "fix") }}
  {{- end }}
