icon: play
name: Start work
menus: beadsIssues, conversation
parameters:
  - name: IssueID
    type: beadsId
    required: false
    description: The beads issue ID to act on
description: Check whether this bead is actionable, then advance it one phase (investigate → implement → test/review) by dispatching the phase prompt that matches its labels
backgroundColor: '#B2DFDB'
group: Tasks
enabledWhen: '!Session.IsChild && CommandExists("bd") && DirExists(".beads") && Permissions.CanStartConversation && Item.Status != "closed" && !(Item.Labels != null && "support-question" in Item.Labels) && !(Session.HasBeadsIssue && BeadHasLabels(Session.BeadsIssue, "support-question"))'
target:
  reuse:
    issue: true
    coalesce: true
prompt: |
  {{ template "_shared/session-context" . }}
  Available ACP servers: `{{ Default "(none)" .ACP.AvailableText }}`
  {{- if .Children.AllText }}
  Existing children: `{{ .Children.AllText }}`
  {{- end }}

  {{ $target := "" -}}
  {{ if .Session.BeadsIssue }}{{ $target = .Session.BeadsIssue }}{{ else if .Args.IssueID }}{{ $target = .Args.IssueID }}{{ end -}}
  {{ template "beads-issues/shared/target-bead-header" (dict
      "Target"   $target
      "NoTarget" "Work on the **current problem** under discussion: read the conversation history to understand what needs to be built or fixed, then plan and implement that. Do **not** run any `bd` commands."
  ) }}

  {{ if $target -}}
  ## Live state and blockers
  On **every run**, load and analyze the full current issue, dependencies, children, and comments:
  ```bash
  bd show {{ $target }} --long --json
  bd dep tree {{ $target }}
  bd show {{ $target }} --children --json
  bd comments {{ $target }}
  ```
  Use live fields and comments, not remembered state. If status is blocked/deferred, `defer_until` is
  in the future, `needs-human` is present, a blocking dependency is unresolved, or an epic has no
  workable child, stop before linking/claiming/dispatching. Use
  {{ template "beads-issues/shared/unblock-guidance" (dict "SessionID" .Session.ID) }}
  and wait for actual resolution; never clear blockers yourself.

  ## Choose work and link
  For an epic **or any parent with children**, inspect child details as needed; combine explicit and
  inferred dependencies, respect topological order, and exclude closed/done, in-progress, blocked,
  and transitively blocked children. If none are workable, use the blocked handoff above. Rank the
  workable set with the canonical ranking below; ask via `mitto_ui_options` with free text, recommending
  the top child. When independent children exist, offer together and each individually. Wait for the
  choice; work only the selected child(ren), leaving the parent open. A non-epic leaf with no children
  is worked directly.
  {{- else }}
  ## Current problem
  Derive goal, scope, constraints, and acceptance from conversation history. Do not run any `bd`
  command in this no-target mode.
  {{- end }}

  {{ if $target -}}
  {{ template "beads-issues/shared/rank-candidates" (dict
      "Set"         "the workable children"
      "PreFiltered" true
  ) }}
  Set the effective ID to the selected leaf (or `$target` for a leaf); link using
  `mitto_conversation_update(self_id: "{{ .Session.ID }}", conversation_id: "self", beads_issue: "<effective-id>")`.
  For multiple children keep the parent linked. Claim only now, idempotently; if claiming fails, stop:
  ```bash
  bd update <effective-id> --claim
  ```

  ## Route exactly one phase from the live labels
  Use Step 1's current `issue_type` and labels; first matching row wins (terminal rows first):

  | Flow | Live labels, in precedence order | Next action |
  |---|---|---|
  | bug | `fixed`; else `reproduced`; else `researched`; else `implementation-refined`; else | Done; Bug fix — fix phase; Bug fix — reproduce phase; Bug fix — investigate phase (research-only); Bug fix — investigate phase |
  | feature/task/chore | `verified`; else `tested`; else `implemented`; else `planned`; else `implementation-refined`; else | Done; Feature — review phase; Feature — test phase; Feature — implement phase; Feature — plan phase (label-only); Feature — plan phase |

  Dispatch only that phase. Before dispatch, propose it with `mitto_ui_options` (`self_id`, recommended
  `Continue to <phase>` then `Not now`, free text enabled, 60-second timeout); decline or changed
  instructions means stop without dispatch or follow-up. For the first Fix/Implement when labels
  include `implementation-refined`, `researched`, or `planned`, summarize the latest `Investigation:` /
  `Plan:` report (decomposition, instructions, no-touch constraints) as this same approval; do not ask
  twice. Record feedback with `bd comment` and return to investigation/planning. A timeout follows the
  shared routine timeout-default-continue rule (not cancellation or decline):
  {{ template "_shared/timeout-default-continue" . }}
  On successful approved/timed-out dispatch, send the selected named phase to `self` with the effective
  leaf `IssueID`, then queue named **Start work** with that same ID so it runs after the phase. Never
  queue if blocked, declined, dispatch failed, or terminal. For multiple approved independent children,
  create one child conversation per child, each starting Start work; wait at most 600 seconds and clean
  up only completed children. Keep the parent as orchestrator; don't queue Start work on it.
  {{ template "_shared/cleanup-child-conversations" . }}
  Log `Start work: dispatched <phase prompt name>; next phase after it adds its label.` on the effective
  bead; then end the turn.

  ## Done
  `fixed`/`verified` is terminal: report delivered work from phase comments. **Do not close the bead**;
  the orchestrator closes terminal-label beads after child work completes. Never close the parent from
  a child workflow.
  {{- else }}
  Investigate the no-target problem, present a short plan and request UI approval before implementing.
  {{- end }}

  Offer conversation deletion only after terminal completion or completed no-target work; never after
  dispatching a nonterminal phase.

  {{ template "_shared/offer-delete-conversation" . }}
