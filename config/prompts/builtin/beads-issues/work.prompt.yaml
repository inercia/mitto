icon: play
name: Start work
menus: beadsIssues, conversation
parameters:
  - name: IssueID
    type: beadsId
    required: false
    description: The beads issue ID to act on
  - name: Commit
    type: boolean
    default: "true"
    description: Commit task-related changes after successful phases; never push automatically
  - name: ClosePolicy
    type: text
    default: Ask
    options: [Ask, Leave open, Close if validated]
    description: Ask (default), leave open for the caller, or close immediately when the ticket already has its terminal validation label (verified for feature/task/chore, fixed for bug); no verifier is spawned
description: Check whether this bead is actionable, then advance it one phase (investigate → implement → test/review) by dispatching the phase prompt that matches its labels
backgroundColor: '#B2DFDB'
group: Tasks
enabledWhen: '!Session.IsChild && CommandExists("bd") && DirExists(".beads") && Permissions.CanStartConversation && Item.Status != "closed" && !(Item.Labels != null && "support-question" in Item.Labels) && !(Session.HasBeadsIssue && BeadHasLabels(Session.BeadsIssue, "support-question"))'
target:
  reuse:
    issue: true
    coalesce: true
prompt: |
  {{ template "_shared/session-context" . }}
  Available ACP servers: `{{ Default "(none)" .ACP.AvailableText }}`
  {{- if .Children.AllText }}
  Children: `{{ .Children.AllText }}`
  {{- end }}

  {{ $target := "" -}}
  {{ $commit := ne .Args.Commit "false" -}}
  {{ $close := Default "Ask" .Args.ClosePolicy -}}
  Explicit policy: Commit={{ $commit }}; ClosePolicy={{ $close }}.
  Never push automatically. Commit task paths/hunks only; preserve unrelated staging/conventions.
  Validation is the terminal phase label (`verified` for feature/task/chore, `fixed` for bug);
  no independent verifier is spawned. A normal feature review phase continues with Start work in
  this conversation to process the resulting label.
  {{ if not $commit }}Do not commit; report uncommitted files.{{ end }}
  {{ if and (ne $close "Ask") (ne $close "Leave open") (ne $close "Close if validated") }}Invalid ClosePolicy: report and stop.{{ end }}
  {{ if .Session.BeadsIssue }}{{ $target = .Session.BeadsIssue }}{{ else if .Args.IssueID }}{{ $target = .Args.IssueID }}{{ end -}}
  {{ template "beads-issues/shared/target-bead-header" (dict
      "Target"   $target
      "NoTarget" "Work on the **current problem** under discussion: read the conversation history to understand what needs to be built or fixed, then plan and implement that. Do **not** run any `bd` commands."
  ) }}

  {{ if $target -}}
  ## Live state and blockers
  Reconcile notes diagnosis/recovery before readiness (contract below).
  ```bash
  bd show {{ $target }} --long --json
  bd dep tree {{ $target }}
  bd show {{ $target }} --children --json
  bd comments {{ $target }} --json | jq '.[-10:]'
  ```
  Fetch reports by prefix. Recheck blockers. Evidence/authority required for stale-state fixes
  or scoped prerequisites; else ask. Preserve dependencies/holds/scope/claims.
  Blocked: stop before linking/claiming/dispatching implementation; diagnosis/recovery below excepted. Use
  {{ template "beads-issues/shared/blocked-explanation" . }}
  {{ template "beads-issues/shared/blocked-diagnosis" . }}
  Resolved: reload/resume.
  Confirmed waits: owner/event; skip per candidate, not epic. Active uncertain handoff:
  read-only diagnosis, no takeover. Reconcile pending first;
  Unchanged: no new offer except authorized infrastructure retry.
  Uncertain blockers/no workable children: offer
  `mitto_ui_options`, "Check blockers" / "Not now". Only explicit Check blockers approves;
  timeout/cancellation/decline/free text grants nothing. Ask one direct, specific question
  if the user can unblock it; else report owner/event/retry.
  {{ template "beads-issues/shared/resolve-blocked-dispatch" (dict "SessionID" .Session.ID "Corrections" "false") }}
  Anchor: original target, no relink. ready/prerequisite: end turn; next Start work reloads
  recovery/readiness/selection/approval. blocked/unknown: save recovery, report owner/event/retry, stop.
  Keep Commit/ClosePolicy.

  ## Choose work and link
  Parents: exclude closed/done, in-progress, transitively blocked children. None workable:
  blocked handoff above. Rank; ask `mitto_ui_options`, free text, recommend top child;
  independent children: offer together/individually. Wait; selected only, parent stays open.
  Work non-epic leaves directly.
  {{- else }}
  ## Current problem
  Derive goal, scope, constraints, and acceptance from conversation history. Do not run any `bd`
  command.
  {{- end }}

  {{ if $target -}}
  {{ template "beads-issues/shared/rank-candidates" (dict
      "Set"         "the workable children"
      "PreFiltered" true
  ) }}
  Effective ID = selected leaf (else `$target`); link:
  `mitto_conversation_update(self_id: "{{ .Session.ID }}", conversation_id: "self", beads_issue: "<effective-id>")`.
  Multiple: keep parent linked. Claim; stop on failure:
  ```bash
  bd update <effective-id> --claim
  ```

  ## Route exactly one phase from the live labels
  Live labels/type; first match:

  | Flow | Live labels, in precedence order | Next action |
  |---|---|---|
  | bug | `fixed`; else `reproduced`; else `researched`; else `implementation-refined`; else | Done; Bug fix — fix phase; Bug fix — reproduce phase; Bug fix — investigate phase (research-only); Bug fix — investigate phase |
  | feature/task/chore | `verified`; else `tested`; else `implemented`; else `planned`; else `implementation-refined`; else | Done; Feature — review phase; Feature — test phase; Feature — implement phase; Feature — plan phase (label-only); Feature — plan phase |

  `tested` routes to Review only once per state: a failed review must record NOT VERIFIED and
  regress `tested` (plus `implemented` when code/docs must change). Never re-dispatch against
  unchanged labels: if the latest `Review:` comment says NOT VERIFIED while `tested` remains,
  remove `tested` and dispatch Test/Implement.

  Before dispatch, propose it with `mitto_ui_options` (`self_id`, recommended `Continue to <phase>`,
  then `Not now`, free text, 60-second timeout); decline or changed instructions stops dispatch/follow-up. At
  first Fix/Implement with `implementation-refined`, `researched`, or `planned`, include latest
  `Investigation:`/`Plan:` decomposition, instructions, and no-touch constraints. Never ask twice.
  Record feedback with `bd comment`; return to investigation/planning. Timeout:
  {{ template "_shared/timeout-default-continue" . }}
  On successful approved/timed-out dispatch, send the selected named phase to `self`:
  `{ "IssueID": "<effective-id>", "SubmitStrategy": "{{ if $commit }}Commit{{ else }}None{{ end }}", "AdditionalInstructions": "<handoff>" }`.
  Handoff: user clarifications verbatim with source; agent inferences separately, never as user
  decisions. Carry forward on every phase dispatch. For Review,
  require a failed review to regress labels; never stop unchanged, then queue named **Start work** with that same ID and arguments
  `{ "IssueID": "<effective-id>", "Commit": "{{ $commit }}", "ClosePolicy": "{{ $close }}" }`.
  Never queue if blocked, declined, dispatch failed, or terminal. Parallel independent children:
  one conversation each, named Start work with arguments
  `{ "IssueID": "<child-id>", "Commit": "{{ $commit }}", "ClosePolicy": "{{ $close }}" }`.
  If looped, mirror these arguments into `loop_arguments`. Wait ≤600s; never queue on parent.
  {{ template "_shared/cleanup-child-conversations" . }}
  Log `Start work: dispatched <phase prompt name>; next phase after it adds its label.` on the effective
  bead; end the turn.

  ## Done
  `fixed`/`verified` is terminal: report delivered work from phase comments.
  {{ if $commit -}}
  After checks pass, commit attributable leftovers (reproduction/tests included), scoped above.
  No empty commits; uncertainty/failure: report and stop.
  {{- else -}}
  Report uncommitted files; closure follows ClosePolicy.
  {{- end }}
  Never close the parent from a child workflow. Reload ticket/children: closed skips closure;
  open children or unverified hierarchy: leave open, report why.
  {{ if eq $close "Ask" -}}
  Ask `mitto_ui_options` (`self_id: "{{ .Session.ID }}"`, question: "Close completed <effective-id>?",
  options: "Yes, close it" / "No, keep it open", timeout_seconds: 60).
  Only an explicit **Yes, close it** permits `bd close <effective-id> --reason "<delivered work>"`.
  Timeout (`timed_out: true`), cancellation, decline, free text, or tool errors leave it open.
  Never default-continue closure; report close errors.
  {{- else if eq $close "Close if validated" -}}
  Reload the effective ticket. If it carries `verified` (feature/task/chore) or `fixed` (bug),
  run `bd close <effective-id> --reason "Validated (<label>): <delivered work>"`, reload status,
  and require a confirmed closed result; report any close error. If it carries neither label,
  leave it open and report that validation is not complete. No further checks.
  {{- else -}}
  Do not ask about closure or run `bd close`; report completion.
  {{- end }}
  {{- else }}
  Investigate, present a plan, request UI approval, implement.
  {{ if $commit }}After checks pass, commit task changes.{{ else }}Leave task changes uncommitted.{{ end }}
  No ticket to close.
  {{- end }}

  Delete only after completion, never nonterminal dispatch.

  {{ template "_shared/offer-delete-conversation" . }}
