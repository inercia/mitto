icon: play
name: Start work
menus: beadsIssues, conversation
parameters:
  - name: IssueID
    type: beadsId
    required: false
    description: The beads issue ID to act on
  - name: Commit
    type: boolean
    default: "true"
    description: Commit task-related changes after successful phases; never push automatically
  - name: ClosePolicy
    type: text
    default: Ask
    options: [Ask, Leave open, Verify and close]
    description: Ask (default), leave open for the caller, or close only after fresh independent acceptance verification
description: Check whether this bead is actionable, then advance it one phase (investigate → implement → test/review) by dispatching the phase prompt that matches its labels
backgroundColor: '#B2DFDB'
group: Tasks
enabledWhen: '!Session.IsChild && CommandExists("bd") && DirExists(".beads") && Permissions.CanStartConversation && Item.Status != "closed" && !(Item.Labels != null && "support-question" in Item.Labels) && !(Session.HasBeadsIssue && BeadHasLabels(Session.BeadsIssue, "support-question"))'
target:
  reuse:
    issue: true
    coalesce: true
prompt: |
  {{ template "_shared/session-context" . }}
  Available ACP servers: `{{ Default "(none)" .ACP.AvailableText }}`
  {{- if .Children.AllText }}
  Children: `{{ .Children.AllText }}`
  {{- end }}

  {{ $target := "" -}}
  {{ $commit := ne .Args.Commit "false" -}}
  {{ $close := Default "Ask" .Args.ClosePolicy -}}
  Explicit policy: Commit={{ $commit }}; ClosePolicy={{ $close }}.
  Never push automatically. Commit task paths/hunks only; preserve unrelated staging/conventions.
  Restricted verifier/reviewer: retain role, target, permissions and stop condition.
  Do not take over implementation, dispatch or closure. Report the mismatch and stop.
  {{ if not $commit }}Do not commit; report uncommitted files.{{ end }}
  {{ if and (ne $close "Ask") (ne $close "Leave open") (ne $close "Verify and close") }}Invalid ClosePolicy: report and stop.{{ end }}
  {{ if .Session.BeadsIssue }}{{ $target = .Session.BeadsIssue }}{{ else if .Args.IssueID }}{{ $target = .Args.IssueID }}{{ end -}}
  {{ template "beads-issues/shared/target-bead-header" (dict
      "Target"   $target
      "NoTarget" "Work on the **current problem** under discussion: read the conversation history to understand what needs to be built or fixed, then plan and implement that. Do **not** run any `bd` commands."
  ) }}

  {{ if $target -}}
  ## Live state and blockers
  Reload every run:
  ```bash
  bd show {{ $target }} --long --json
  bd dep tree {{ $target }}
  bd show {{ $target }} --children --json
  bd comments {{ $target }}
  ```
  Blocked/deferred, future `defer_until`, `needs-human`, unresolved blockers, or no workable epic
  child: stop before linking/claiming/dispatching. Use
  {{ template "beads-issues/shared/unblock-guidance" (dict "SessionID" .Session.ID) }}
  and wait for actual resolution; never clear blockers yourself.

  ## Choose work and link
  Parents: inspect children/dependencies; exclude closed/done, in-progress and transitively blocked.
  If none are workable, use the blocked handoff above. Rank; ask `mitto_ui_options` with free
  text, recommending the top child; for independent children, offer together and each individually.
  Wait; work selected children only, leaving parent open. Work non-epic leaves directly.
  {{- else }}
  ## Current problem
  Derive goal, scope, constraints, and acceptance from conversation history. Do not run any `bd`
  command.
  {{- end }}

  {{ if $target -}}
  {{ template "beads-issues/shared/rank-candidates" (dict
      "Set"         "the workable children"
      "PreFiltered" true
  ) }}
  Effective ID = selected leaf (else `$target`); link:
  `mitto_conversation_update(self_id: "{{ .Session.ID }}", conversation_id: "self", beads_issue: "<effective-id>")`.
  Multiple: keep parent linked. Claim; stop on failure:
  ```bash
  bd update <effective-id> --claim
  ```

  ## Route exactly one phase from the live labels
  Live labels/type; first match:

  | Flow | Live labels, in precedence order | Next action |
  |---|---|---|
  | bug | `fixed`; else `reproduced`; else `researched`; else `implementation-refined`; else | Done; Bug fix — fix phase; Bug fix — reproduce phase; Bug fix — investigate phase (research-only); Bug fix — investigate phase |
  | feature/task/chore | `verified`; else `tested`; else `implemented`; else `planned`; else `implementation-refined`; else | Done; Feature — review phase; Feature — test phase; Feature — implement phase; Feature — plan phase (label-only); Feature — plan phase |

  Before dispatch, propose it with `mitto_ui_options` (`self_id`, recommended
  `Continue to <phase>` then `Not now`, free text enabled, 60-second timeout); decline or changed
  instructions stops dispatch/follow-up. At first Fix/Implement with `implementation-refined`,
  `researched`, or `planned`, include latest `Investigation:`/`Plan:` decomposition, instructions,
  and no-touch constraints. Never ask twice. Record feedback with `bd comment`;
  return to investigation/planning. Timeout:
  {{ template "_shared/timeout-default-continue" . }}
  On successful approved/timed-out dispatch, send the selected named phase to `self`:
  `{ "IssueID": "<effective-id>", "SubmitStrategy": "{{ if $commit }}Commit{{ else }}None{{ end }}", "AdditionalInstructions": "<handoff>" }`.
  Handoff: user clarifications verbatim with source; agent inferences/proposals separately,
  never as user decisions. Carry these forward on every phase dispatch,
  then queue named **Start work** with that same ID and arguments
  `{ "IssueID": "<effective-id>", "Commit": "{{ $commit }}", "ClosePolicy": "{{ $close }}" }`.
  Never queue if blocked, declined, dispatch failed, or terminal. Parallel independent children:
  one conversation each, named Start work with arguments
  `{ "IssueID": "<child-id>", "Commit": "{{ $commit }}", "ClosePolicy": "{{ $close }}" }`.
  If looped, mirror these arguments into `loop_arguments`. Wait ≤600s; never queue on parent.
  {{ if eq $close "Verify and close" -}}
  Children hand acceptance coordination back to this parent; process each queued handoff in its
  own turn for the explicit child ticket. A handoff is NOT a PASS. Do not close/reap the worker
  from terminal labels or a wait wrapper; retain it until independent verification is recorded.
  {{- else }}
  {{ template "_shared/cleanup-child-conversations" . }}
  {{- end }}
  Log `Start work: dispatched <phase prompt name>; next phase after it adds its label.` on the effective
  bead; end the turn.

  ## Done
  `fixed`/`verified` is terminal: report delivered work from phase comments.
  {{ if $commit -}}
  After checks pass, commit attributable leftovers (including reproduction/tests), scoped above.
  No empty commits; uncertainty/failure: report and stop.
  {{- else -}}
  Report uncommitted files; {{ if eq $close "Verify and close" }}the independent gate still applies{{ else }}explicit approval may still close{{ end }}.
  {{- end }}
  Never close the parent from a child workflow. Reload ticket/children: closed skips closure;
  open children or unverified hierarchy: leave open, report why.
  {{ if eq $close "Ask" -}}
  Ask `mitto_ui_options` (`self_id: "{{ .Session.ID }}"`, question: "Close completed <effective-id>?",
  options: "Yes, close it" / "No, keep it open", timeout_seconds: 60).
  Only an explicit **Yes, close it** permits `bd close <effective-id> --reason "<delivered work>"`.
  Timeout (`timed_out: true`), cancellation, decline, free text, or tool errors leave it open.
  Never default-continue closure. Report close errors.
  {{- else if eq $close "Verify and close" }}
  {{ template "beads-issues/shared/acceptance-close" . }}
  {{- else -}}
  Do not ask about closure or run `bd close`; report completion.
  {{- end }}
  {{- else }}
  Investigate, present a plan, request UI approval, implement.
  {{ if $commit }}After checks pass, commit task changes.{{ else }}Leave task changes uncommitted.{{ end }}
  No ticket to close.
  {{- end }}

  Delete only after completion, never nonterminal dispatch.{{ if and $target (eq $close "Verify and close") }}
  Skip deletion while verification is pending or unsuccessful; do not delete a live verifier.{{ end }}

  {{ if and $target (eq $close "Verify and close") -}}
  Only after this ticket's acceptance PASS and confirmed closure, with no pending handoffs or live
  children, may you offer conversation cleanup. Otherwise keep it and report the incomplete outcome.
  {{- else }}
  {{ template "_shared/offer-delete-conversation" . }}
  {{- end }}
