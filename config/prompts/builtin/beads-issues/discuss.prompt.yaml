icon: chat-bubble
name: Discuss a topic
menus: beadsIssues, conversation
parameters:
  - name: IssueID
    type: beadsId
    required: false
    description: The beads issue ID to discuss
description: 'Discuss a bead interactively — ask what to explore, work it through together, and capture any agreed decisions back into the tracker (beads only, no code changes)'
backgroundColor: '#F8BBD0'
group: Tasks
enabledWhen: CommandExists("bd") && DirExists(".beads")
target:
  reuse:
    issue: true
    coalesce: true
prompt: |
  {{ template "_shared/session-context" . }}

  # Beads: Discuss a Bead

  Beads is a CLI issue tracker (`bd`). Issues are called "beads" and have IDs like `bd-xyz`.

  {{ $target := "" -}}
  {{ if .Session.BeadsIssue }}{{ $target = .Session.BeadsIssue }}{{ else if .Args.IssueID }}{{ $target = .Args.IssueID }}{{ end -}}
  {{ template "beads-issues/shared/target-bead-header" (dict
      "Target"   $target
      "Role"     "The user wants to **discuss** it with you. Ask them what they would like to explore, then work through it together — grounded in the bead and (read-only) in the codebase — and capture any agreed outcome back into the tracker."
      "NoTarget" "Ask the user which bead they want to discuss and what about it. Do **not** run any `bd` commands until a bead is identified."
  ) }}

  ## Scope — read this first (hard limits)

  This is a **discussion** prompt. Your job is to talk the topic through and, only with
  the user's agreement, record decisions in the **beads issue tracker** — and nowhere else.

  - **Do NOT write, edit, or refactor any source code.** No implementation of any kind.
  - **Do NOT modify anything outside the beads tracker** — do not edit files, config,
    scripts, or docs, and do not run commands that change the working tree or system
    state. Read-only inspection of the codebase (to ground the discussion) is fine;
    mutations are not.
  - You **MAY** update {{ if $target }}the current bead `{{ $target }}`{{ else }}the bead under discussion{{ end }}:
    close / reopen it, defer / undefer it, edit its fields (title, description, acceptance
    criteria, priority, type), adjust its labels, and add comments.
  - You **MAY** create additional beads, or link / update related beads, if the discussion
    warrants it.
  - Every tracker mutation stays **read-only until the user explicitly confirms it** (see Step 5).

  ## Step 1 — Ask what to discuss

  {{ if $target -}}
  Open by asking the user what they want to discuss — do this **before** any investigation:

  > **What would you like to discuss about `{{ $target }}`?**

  Ask via `mitto_ui_options(self_id: "{{ .Session.ID }}", allow_free_text: true)`, offering
  a few likely angles as options — e.g. "Refine the description / acceptance criteria",
  "Re-evaluate priority or scope", "Should it be closed or reopened?", "Break it into
  sub-issues" — plus free text so they can steer. Wait for their answer before going further.
  {{- else -}}
  Ask the user which bead they want to discuss and what about it, via
  `mitto_ui_options(self_id: "{{ .Session.ID }}", allow_free_text: true)`. Once they name a
  bead, load it (Step 2) and continue.
  {{- end }}

  {{ if $target -}}
  ## Step 2 — Load the bead and its context

  {{ template "beads-issues/shared/load-context" $target }}

  Read everything carefully so you can discuss knowledgeably. Where the bead or the user's
  topic references code or features, investigate the **codebase read-only** just enough to
  ground the conversation — never to implement anything.
  {{- end }}

  ## Step 3 — Investigate and form a view

  Gather the evidence needed to have a concrete discussion — read {{ if $target }}the bead,
  related beads, comments, {{ end }}and the relevant codebase (read-only). Then form an
  initial, reasoned position on the topic: what you would recommend and why, along with the
  trade-offs, risks, and any open questions it raises.

  ## Step 4 — Discuss it with the user

  Engage the user in **focused, iterative discussion** on the topic. Present your view, then
  batch related questions into a single `mitto_ui_options(self_id: "{{ .Session.ID }}",
  allow_free_text: true)` call — offering your best-guess answer plus free text — and iterate
  until the topic is resolved into an **actionable conclusion**. Keep the discussion grounded
  in evidence rather than speculation; investigate further whenever a point is uncertain.

  {{ if $target -}}
  ## Step 5 — Capture the outcome in the tracker (after confirming)

  Everything above is **read-only until the user confirms**. Present exactly what you intend
  to change and get approval via `mitto_ui_options(self_id: "{{ .Session.ID }}",
  allow_free_text: true)`, e.g. "Apply these updates to `{{ $target }}`?" with options like
  **"Apply all"**, **"Apply some"** (free text), and **"Make no changes"**. Never write
  anything the user did not approve, and never touch anything outside the beads tracker.

  Once approved, record the conclusion with `bd` — for example:

  ```bash
  bd update {{ $target }} --body-file /tmp/bead-desc.md        # revise the description
  bd update {{ $target }} --acceptance "<now-clear criteria>"  # if the discussion sharpened "done"
  bd update {{ $target }} --append-notes "<decisions + rationale>"
  bd update {{ $target }} --add-label <label>                  # or --remove-label <label>
  bd close  {{ $target }} -r "<reason>"                        # close, or reopen with: bd update {{ $target }} -s open
  bd update {{ $target }} --add-label needs-human --defer +1d  # defer, or undefer with: bd update {{ $target }} --remove-label needs-human --defer ''
  ```

  **Whenever you change the description** (or another substantive field), **add a comment
  documenting the change and the reasoning behind it** — this preserves the decision history:

  ```bash
  bd comment {{ $target }} "Discussed <topic> — outcome: <what changed> — rationale: <why>"
  ```

  If the discussion revealed separable or related work, you may (after confirmation) create
  additional beads or link related ones:

  ```bash
  bd create "<child title>" --parent {{ $target }} --type <type> --priority <0-4> --body-file /tmp/child.md
  bd dep add {{ $target }} --blocked-by <blocker-id>   # or: bd dep relate {{ $target }} <other-id>
  ```

  For a full breakdown into child beads, defer to the **"Decompose issue"** prompt.
  {{- else }}
  ## Step 5 — Capture the outcome in the tracker (after confirming)

  Once the user has named a bead, apply the agreed changes to it exactly as above — **beads
  tracker only**, and only after explicit confirmation. If the discussion produced trackable
  work and there is still no bead, offer (with confirmation) to create one. Make no changes
  outside the beads tracker.
  {{- end }}

  ## Step 6 — Final summary

  Summarise the discussion: the conclusion reached and the reasoning behind it.
  {{ if $target -}}
  Include which bead fields / labels / status changed, the comments added, and any beads
  created or linked (IDs + titles).
  {{- end }}
  Reiterate that **no code was written and nothing outside the beads tracker was changed** —
  point the user to the **"Start work"** prompt when the bead is ready to be worked on.

  ## Final step — Offer to delete this conversation

  {{ template "_shared/offer-delete-conversation" . }}
