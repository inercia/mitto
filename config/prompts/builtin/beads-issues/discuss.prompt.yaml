icon: chat-bubble
name: Discuss a topic
menus: beadsIssues, conversation
parameters:
  - name: IssueID
    type: beadsId
    required: false
    description: The beads issue ID to discuss
  - name: Topic
    type: text
    required: true
    multiLine: true
    description: 'What you want to discuss, refine, or add — the question, idea, concern, or change to explore in the context of this bead'
description: 'Raise a topic on a bead — a question, idea, concern, or change — and work it through together in the context of the issue, capturing any decisions back into the tracker'
backgroundColor: '#F8BBD0'
group: Tasks
enabledWhen: CommandExists("bd") && DirExists(".beads") && Item.Status != "closed"
target:
  reuse:
    issue: true
    coalesce: true
prompt: |
  {{ template "_shared/session-context" . }}

  # Beads: Discuss a Topic on a Bead

  Beads is a CLI issue tracker (`bd`). Issues are called "beads" and have IDs like `bd-xyz`.

  {{ $target := "" -}}
  {{ if .Session.BeadsIssue }}{{ $target = .Session.BeadsIssue }}{{ else if .Args.IssueID }}{{ $target = .Args.IssueID }}{{ end -}}
  {{ template "_shared/beads/target-bead-header" (dict
      "Target"   $target
      "Role"     "The user wants to **discuss, refine, or add something** to it. Your job is to explore the topic below together with them — grounded in the bead and the codebase — and, once you reach a conclusion, **capture the outcome back into the tracker**."
      "NoTarget" "Discuss the topic below with the user in the context of the current problem under discussion here. Do **not** run any `bd` commands — there is no bead to load or update (you may, with confirmation, create one to capture the outcome)."
  ) }}

  ## The topic to discuss

  The user raised the following (treat it as the starting point, not the whole conversation):

  > {{ .Args.Topic }}

  > **Scope:** this is a *discussion* prompt. Do **not** implement the work or write code.
  > {{ if $target -}}
  > You may investigate, discuss, and — with the user's confirmation — update this bead or create new beads.
  > {{- else -}}
  > You may only investigate and discuss; there is no bead to modify (you may, with confirmation, create a new bead to capture the outcome).
  > {{- end }}

  {{ if $target -}}
  ## Step 1 — Load the bead and its context

  {{ template "_shared/load-bead-context" $target }}

  Read everything carefully so you can discuss the topic knowledgeably. Where the bead or the topic
  references code or features, investigate the **codebase** just enough to ground the conversation —
  but remember you are not here to implement anything.
  {{- end }}

  ## Step 2 — Understand the topic

  Restate the topic in your own words to confirm you understood it, and classify what is being asked:
  a **question** to answer, an **idea** to evaluate, a **gap** to fill, or a **change** to consider.
  Note how it relates to {{ if $target }}the bead's current description, acceptance criteria, and
  dependencies{{ else }}the current problem under discussion{{ end }}. If the topic is ambiguous,
  ask a single clarifying question via `mitto_ui_options(self_id: "{{ .Session.ID }}",
  allow_free_text: true)` before going further.

  ## Step 3 — Investigate and form a view

  Gather the evidence needed to have a concrete discussion — read {{ if $target }}the bead, related
  beads, comments, {{ end }}and the relevant codebase. Then form an initial, reasoned position on the
  topic: what you'd recommend and why, along with the trade-offs, risks, and any open questions it
  raises.

  ## Step 4 — Discuss it with the user

  Engage the user in **focused, iterative discussion** on the topic. Present your view, then batch
  related questions into a single `mitto_ui_options(self_id: "{{ .Session.ID }}",
  allow_free_text: true)` call — offering your best-guess answer plus free text — and iterate until
  the topic is resolved into an **actionable conclusion**. Keep the discussion grounded in evidence
  rather than speculation; investigate further whenever a point is uncertain.

  {{ if $target -}}
  ## Step 5 — Capture the outcome (after confirming)

  Everything above is **read-only until the user confirms**. Present exactly what you intend to change
  and get approval via `mitto_ui_options(self_id: "{{ .Session.ID }}", allow_free_text: true)`,
  e.g. "Apply these updates to `{{ $target }}`?" with options like **"Apply all"**, **"Apply some"**
  (free text), and **"Make no changes"**. Never write anything the user did not approve.

  Once approved, update the bead to reflect the conclusion:

  ```bash
  bd update {{ $target }} --body-file /tmp/bead-desc.md       # revise the description
  bd update {{ $target }} --acceptance "<now-clear criteria>" # if the discussion sharpened "done"
  bd update {{ $target }} --append-notes "<decisions + rationale>"
  ```

  **Whenever you change the description** (or other substantive fields), **add a comment documenting
  the change and the reasoning behind it** — this preserves the decision history:

  ```bash
  bd comment {{ $target }} "Discussed <topic> — outcome: <what changed> — rationale: <why>"
  ```

  If the discussion revealed separable work, you may propose sub-issues (title, one-line scope,
  type/priority); for a full breakdown defer to the **"Decompose issue"** prompt. After confirmation:

  ```bash
  bd create "<child title>" --parent {{ $target }} --type <type> --priority <0-4> --body-file /tmp/child.md
  ```
  {{- else }}
  ## Step 5 — Capture the outcome (no bead to update)

  There is no bead to update. If the discussion produced work worth tracking, offer (with
  confirmation) to create a new bead via the **"Decompose issue"** or **"Start work"** prompt. No
  `bd` commands.
  {{- end }}

  ## Step 6 — Final summary

  Summarise the discussion: the conclusion reached and the reasoning behind it.
  {{ if $target -}}
  Include which bead fields / labels / status changed, the comments added, and any sub-issues created (IDs + titles).
  {{- end }}
  Reiterate that **no implementation was done** — point the user to the **"Start work"** prompt when
  the bead is ready to be worked on.

  ## Final step — Offer to delete this conversation

  {{ template "_shared/offer-delete-conversation" . }}
