icon: question
name: Why is deferred?
menus: beadsIssues, conversation
parameters:
  - name: IssueID
    type: beadsId
    required: false
    description: The deferred beads issue to diagnose
description: Explain why this bead is deferred, determine what is still needed, and ask for the smallest help required to resume it
backgroundColor: '#FFE0B2'
group: Tasks
enabledWhen: 'CommandExists("bd") && DirExists(".beads") && ((Item.Id != "" && Item.Status == "deferred") || (Item.Id == "" && Session.HasBeadsIssue && BeadHasStatus(Session.BeadsIssue, "deferred")))'
target:
  reuse:
    issue: true
    coalesce: true
prompt: |
  {{- $target := .Session.BeadsIssue -}}
  {{- if not $target -}}{{ $target = .Args.IssueID }}{{- end -}}
  {{ template "_shared/session-context" . }}

  {{ template "beads-issues/shared/state-diagnosis" (dict
      "Target"    $target
      "SessionID" .Session.ID
      "State"     "deferred"
  ) }}