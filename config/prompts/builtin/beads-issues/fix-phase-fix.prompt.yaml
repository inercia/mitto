icon: build
name: Bug fix — fix phase
menus: internal
parameters:
  - name: IssueID
    type: beadsId
    required: false
    description: The beads issue ID to fix
  - name: SubmitStrategy
    type: text
    group: Advanced
    required: false
    description: How finished work is submitted. "Commit" (default) commits after tests pass; "Pull Request" commits on the configured task/epic branch; "None" leaves changes for review.
  - name: AdditionalInstructions
    type: text
    group: Advanced
    required: false
    multiLine: true
    description: Optional additional instructions for this phase, forwarded by the driver that dispatched it.
description: Internal phase-tier prompt — implement the fix so the reproducing test passes, add the `fixed` label, and (optionally) commit. Invoked by name from the bug-fix driver; runs on the Coding tier.
group: Tasks
backgroundColor: '#C8E6C9'
preferredModels:
  - modelTag: Coding
target:
  reuse:
    issue: true
    coalesce: true
prompt: |
  {{ template "_shared/session-context" . }}

  # Bug Fix — Fix Phase

  This is the **fix** stage of the label-encoded bug-fix state machine
  (`researched` → `reproduced` → `fixed`). It is normally invoked by name from the
  `Loop fixing bug` driver (or by a list orchestrator), which selects this phase
  when the target bead carries `reproduced` but not yet `fixed`.

  {{ $target := "" -}}
  {{ if .Session.BeadsIssue }}{{ $target = .Session.BeadsIssue }}{{ else if .Args.IssueID }}{{ $target = .Args.IssueID }}{{ end -}}
  {{ $submit := .Args.SubmitStrategy -}}
  {{ $commit := ne $submit "None" -}}
  {{ $pr := eq $submit "Pull Request" -}}
  {{ $suffix := "Submit strategy is **None** (`SubmitStrategy` argument) — commit-after-fix is disabled." -}}
  {{ if $pr }}{{ $suffix = "Submit strategy is **Pull Request** — commit on the configured task/epic branch." }}{{ else if $commit }}{{ $suffix = "Submit strategy is **Commit** (`SubmitStrategy` argument) — commit-after-fix is enabled." }}{{ end -}}
  {{ template "beads-issues/shared/target-bead-header-strict" (dict
      "Target"      $target
      "Noun"        "target bug"
      "FromLink"    (ne .Session.BeadsIssue "")
      "PhaseSuffix" $suffix
  ) }}

  {{ if $target -}}
  {{ template "beads-issues/shared/additional-instructions" . }}

  {{ template "beads-issues/shared/tier-check" (dict
      "Target"    $target
      "Tier"      "Coding"
      "Phase"     "fix"
      "Confirmed" (Model "Coding")
      "ModelName" .Session.ModelName
      "ModelTags" .Session.ModelTags
  ) }}

  ## Step 1 — Load LIVE state

  Labels drift between runs. Load the bead's **current** state fresh:

  ```bash
  bd show {{ $target }} --json --include-comments
  ```

  Read its `labels` array and prior comments (especially the `Investigation:` and
  `Reproduction:` comments recorded during the earlier phases — they tell you the
  root cause and where the failing test lives). If `fixed` is already present, this
  phase's work is already done — `bd comment` a note that the phase re-ran
  redundantly and stop **without** re-adding the label.

  {{ template "beads-issues/shared/investigation-handoff" (dict "Role" "consumer") }}

  ## Step 2 — Implement the fix

  {{ template "beads-issues/shared/implement-work" (dict "Kind" "fix" "Silent" true) }}

  ## Step 3 — Record, advance the label{{ if $commit }}, and commit{{ end }} — MANDATORY CLOSURE

  Execute the checklist **in order**; every item must complete before the turn ends. Historically
  this closure is the most common execution miss (comment written, then no label / commit), so the
  final self-verification must pass.

  {{ template "beads-issues/shared/implement-closure" (dict
      "Ctx"    .
      "Target" $target
      "Kind"   "fix"
      "Label"  "fixed"
      "Tag"    "Fix"
      "Commit" $commit
      "PR"     $pr
  ) }}

  Only after all checks print `OK`, stop — the driver's next scheduled run will
  observe `fixed` and close the bug via its inline "Done" branch.
  {{- end }}

  ## Step 4 — Blocked → Defer + Handoff

  {{ template "beads-issues/shared/blocked-defer-handoff" (dict
      "Target"      $target
      "SessionID"   .Session.ID
      "Placeholder" "<target-bug>"
      "Label"       "fixed"
      "Intro"       "(tests will not go green, the required change is architecturally larger than a bug fix, external input is needed)"
      "BlockedAt"   "fix"
  ) }}

  ## Guidelines

  - **One stage only.** This phase advances at most one label (`fixed`).
    Do not close the bead — the driver's Done branch handles closure.
  - **Minimum change.** Fix the root cause, not the symptom; do not refactor unrelated
    code in the same pass.
  - **Green before green label.** Never add `fixed` while the reproduction test or
    adjacent tests are red.
  {{ template "beads-issues/shared/phase-guidelines-footer" (dict
      "IncludeItemNote" false
      "TagNoun"         "summary"
      "TagPrefix"       "Fix"
      "Tier"            "Coding"
  ) }}
