icon: build
name: Mention — implement phase
menus: internal
parameters:
  - name: IssueID
    type: beadsId
    required: false
    description: The beads issue ID whose @mitto mention is being implemented
  - name: MentionTS
    type: text
    required: false
    description: RFC3339 timestamp of the @mitto mention being processed (dedup key)
  - name: MentionBody
    type: text
    required: false
    description: Verbatim body of the @mitto mention (already scoped by the router)
description: Internal phase-tier prompt — implement code changes for a fix/feature @mitto mention and add the `mention-implemented` label. Invoked by name from the mention driver; runs on the Coding tier. The mention driver (not this phase) owns commit + close.
group: Tasks
backgroundColor: '#C8E6C9'
preferredModels:
  - modelTag: Coding
target:
  reuse:
    issue: true
    coalesce: true
prompt: |
  ## Session Context

  Your session ID is `{{ .Session.ID }}` — use this as `self_id` for all `mitto_*` MCP tool calls.

  # Mention — Implement Phase

  This is the **implement** stage of the label-encoded @mitto-mention state machine
  (`mention-investigated` → `mention-planned` → `mention-implemented`). It is normally
  invoked by name from the `Mention — driver` router, which selects this phase when a
  fix/feature-style mention carries `mention-planned` but not yet `mention-implemented`.

  {{ $target := "" -}}
  {{ if .Session.BeadsIssue }}{{ $target = .Session.BeadsIssue }}{{ else if .Args.IssueID }}{{ $target = .Args.IssueID }}{{ end -}}
  {{ if $target -}}
  The **target bead** for this phase is `{{ $target }}`{{ if .Session.BeadsIssue }} (from this conversation's linked beads issue){{ else }} (supplied as the `IssueID` argument){{ end }}.
  {{ if .Args.MentionTS -}}Mention timestamp (dedup key): `{{ .Args.MentionTS }}`.{{- end }}
  {{- else -}}
  No target bead is resolvable (neither `.Session.BeadsIssue` nor an `IssueID` argument
  was supplied). Do not guess. Post a `mitto_ui_notify` explaining the missing target,
  then stop this phase without changing anything.
  {{- end }}

  {{ if $target -}}
  ## Step 1 — Load LIVE state

  Labels drift between runs. Load the bead's **current** state fresh:

  ```bash
  bd show {{ $target }} --json --include-comments
  ```

  Read its `labels` array and prior comments (especially the `Plan [tier: Reasoning]:`
  comment recorded when `mention-planned` was added — it tells you the approach and
  files to touch). If `mention-implemented` is already present, this phase's work is
  already done — `bd comment` a note that the phase re-ran redundantly and stop
  **without** re-adding the label.

  **Important — this phase runs in its own loop iteration.** The mention driver (not
  this phase) owns commit and close; this phase leaves changes on disk for the router
  to inspect on its next turn.

  ## Step 2 — Implement the mention

  This is a **scheduled, silent** phase (invoked by the router's on-completion loop).
  Do **not** call `mitto_ui_options`, `mitto_ui_form`, or `mitto_ui_textbox` — decide
  autonomously; if something is genuinely unclear or unsolvable without user input,
  defer via **Step 4**.

  The mention body (already scoped by the router){{ if .Args.MentionBody }}:

  ```
  {{ .Args.MentionBody }}
  ```
  {{ else }} is available in the bead's comment stream at the timestamp above.{{ end }}

  Write the code per the plan, in the **smallest coherent increment** that satisfies
  the mention:

  - Follow the design decisions recorded in the `Plan [tier: Reasoning]:` comment.
  - Stay in scope: only work directly relevant to the mention. Do not refactor
    unrelated code.
  - Match the surrounding style and conventions.
  - Do not gold-plate — implement exactly what the plan calls for.

  When the increment is **functionally complete** (it builds and does what the
  mention asked for), proceed to Step 3.

  ## Step 3 — Record and advance the label

  ```bash
  bd comment {{ $target }} "Implementation [tier: Coding]: <what was built, files touched, any deviations from the plan and why>."
  bd update {{ $target }} --add-label mention-implemented
  ```

  Only add the label after the comment is posted.

  Do **not** commit and do **not** close the bead. The mention driver (router) owns
  the commit decision, the `[addressed-comment: <ts>]` back-reference, and the
  four-condition close check. Leave the implementation changes on disk (staged or
  unstaged); the router will inspect them on its next turn.

  Then stop — the router's next scheduled run will observe `mention-implemented` and
  proceed to its own back-reference / commit / close step.
  {{- end }}

  ## Step 4 — Blocked → Defer + Handoff

  Use this whenever this phase cannot make progress autonomously. **Do not** advance
  the `mention-implemented` label. Instead:

  1. Defer and flag the bead so it drops out of `bd ready`:

     ```bash
     bd update {{ if $target }}{{ $target }}{{ else }}<target-bead>{{ end }} --add-label needs-human --defer <when>
     ```

  2. Write a structured handoff comment (FIRST line must be the `[deferred: <ts>]`
     marker so the orchestrator's Step 2Z can undefer on human reply):

     ```bash
     bd comment {{ if $target }}{{ $target }}{{ else }}<target-bead>{{ end }} "[deferred: <now-RFC3339>]
     Why: Blocked at mention-implement — <root cause>.
     What human intervention is required: <the ONE concrete question/decision/info/action>.
     How to resume: reply to this bead; the orchestrator will detect the reply on its next pass, clear needs-human, and re-queue."
     ```

  3. End with a concise handoff and disable the enclosing conversation's loop flag so
     the router loop does not spin on the blocker:

     ```
     mitto_conversation_update(self_id: "{{ .Session.ID }}", conversation_id: "self", loop_enabled: false)
     ```

  ## Guidelines

  - **One stage only.** This phase advances at most one label (`mention-implemented`).
    Do not commit, do not write the back-reference, do not close the bead — those are
    the router's job.
  - **Live state only.** Always re-read labels via `bd show --json` at the start of
    the phase; never assume labels from a prior run or from `Item.*`.
  - **Always log to the tracker** with `bd comment` so progress is auditable.
  - **Tier tag every comment.** Prefix implementation notes with
    `Implementation [tier: Coding]:` so the tier split is observable in the bead
    history (mitto-91wk acceptance criteria).
