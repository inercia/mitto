icon: list
name: Check status
menus: beadsIssues, conversation
parameters:
  - name: IssueID
    type: beadsId
    required: false
    description: The beads issue ID to act on
description: Check progress, readiness, blockers, and resolution; optionally record the report or close resolved tickets after approval
backgroundColor: '#F0F4C3'
group: Tasks
enabledWhen: 'CommandExists("bd") && DirExists(".beads") && !(Item.Labels != null && "support-question" in Item.Labels) && !(Session.HasBeadsIssue && BeadHasLabels(Session.BeadsIssue, "support-question"))'
preferredModels:
  - modelTag: Coding
target:
  reuse:
    issue: true
    coalesce: true
prompt: |
  # Beads: Check Status

  Beads is a CLI issue tracker (`bd`). Issues are called "beads" and have IDs like `bd-xyz`.

  {{ $target := "" -}}
  {{ if .Session.BeadsIssue }}{{ $target = .Session.BeadsIssue }}{{ else if .Args.IssueID }}{{ $target = .Args.IssueID }}{{ end -}}
  {{ template "beads-issues/shared/target-bead-header" (dict
      "Target"   $target
      "Role"     "Assess progress, readiness, blockers, and resolution against live evidence. Recommend the next action; only record a report or close eligible tickets with explicit approval."
      "NoTarget" "Check the progress, readiness, blockers, and resolution of the **current problem / topic under discussion here** against the codebase. Distinguish agreed requirements from assumptions. Do **not** run any `bd` commands — there is no bead to load, create, or modify."
  ) }}

  {{ template "_shared/session-context" . }}

  {{ if $target -}}
  ## Step 1 — Load live context

  Load everything about the target bead:

  {{ template "beads-issues/shared/load-context" $target }}

  Read the current status, labels, metadata, dependencies, children, and discussion. Check comments
  for the newest `[deferred: <ts>]` marker, decisions, and evidence. **Open and closed tickets**
  are both in scope, across issue types. Treat status and phase labels as claims to verify, not proof.
  If this is a support question, stop and use its support workflow instead.

  **Epic / child roll-up:** if the ticket is an epic or has children, load each child's full detail,
  comments, dependencies, and children; recurse into nested epics. Assess each child's acceptance
  criteria and evidence, including already-closed children, then roll up progress, readiness, and
  resolution. An epic with no children is assessed as a single ticket. The epic's own acceptance
  criteria still apply; child closure alone is not proof that those criteria are met.

  Also run locally to gather implementation evidence:

  ```bash
  # Find commits that reference this bead ID
  git log --oneline --all | grep -i "{{ $target }}"

  # Check branches containing the bead ID
  git branch -a | grep -i "{{ $target }}"
  ```
  {{- else }}
  ## Step 1 — Gather codebase evidence for the current problem

  There is no bead to load. Gather evidence about the current problem or topic under discussion by
  inspecting the relevant codebase areas:

  ```bash
  git log --oneline -50                  # recent work that touches the area
  ```

  Locate the relevant files, symbols, or config by exploring the codebase directly so you can assess
  the current implementation state against the work being discussed.
  {{- end }}

  ## Step 2 — Assess readiness and actual progress

  Keep this a bounded status check, not an implementation or exhaustive review. Inspect relevant
  code, callers, configuration, history, and tests. Identify the actual version being assessed
  (commit / branch / worktree); do not attribute unrelated dirty work to this ticket. A matching
  commit message or branch name alone does not prove completion. Run focused tests only when safe
  and economical; report missing coverage, failures, and tests not run without claiming they passed.

  Check **readiness**: is the goal clear, is scope unambiguous, are acceptance criteria testable,
  are dependencies understood/satisfied, and could an implementer proceed without guessing? List
  concrete missing decisions or evidence rather than inventing requirements or refining fields here.

  Check **resolution** against every requirement: Still relevant / Partially resolved / Fully resolved /
  Obsolete / Duplicate / Unknown. For bugs, check the defective path and regression evidence, not just
  a claimed fix. For obsolete work, identify what superseded or removed the need. For a duplicate,
  verify the canonical ticket and full scope overlap; partial overlap is not enough to close.
  Ambiguous or incomplete evidence means **not eligible for closure**, even if labels say done.

  Produce a concise **Status Report**:

  {{ if $target -}}
  ### Bead: `{{ $target }}` — `<Title>`
  {{- else -}}
  ### Current problem — `<topic>`
  {{- end }}

  **Goal** (one sentence restating what this bead or current problem is supposed to deliver)

  {{ if $target -}}
  #### Blocked or Deferred — Why, and How to Unblock

  Include this section **only if the bead is blocked or deferred** (`blocked` / `deferred` status,
  an unresolved blocking dependency, a future `defer_until` / snooze timestamp, or a `needs-human`
  label). Omit it entirely otherwise — do not render an empty placeholder.

  Never leave the reader guessing why work stopped:

  - **Blocked/deferred since**: for a deferral, give the newest `[deferred: <ts>]` marker or
    `defer_until`; for an ordinary blocker, give the earliest relevant dependency/comment timestamp
    when known. State when a timed deferral is scheduled to wake.
  - **Recorded reason**: quote or summarise the actual root cause. If none was recorded, say so and
    label any cause inferred from dependencies or comments as an inference.

  {{ template "beads-issues/shared/unblock-guidance" (dict
      "SessionID" .Session.ID
  ) }}

  - **How to resume**: explain the smallest safe path and its owner. If clearing deferral is
    appropriate, show the command **as a recommendation only; do not execute it here**:

    ```bash
    bd update {{ $target }} --remove-label needs-human --defer ''
    ```

    If the recorded handoff prescribes a different resume path (e.g. "reply to this bead and
    the orchestrator will undefer it on its next pass"), quote that path instead — it is
    authoritative over the generic command above.

  {{ end -}}
  #### Acceptance Criteria — Status

  For each acceptance criterion listed in the bead (or, when there is no bead, each requirement
  inferred from the current discussion):

  | # | Criterion | Status | Evidence |
  |---|-----------|--------|----------|
  | 1 | `<criterion text>` | ✅ Done / ⚠️ Partial / ❌ Not done / ❓ Unknown | `<commit, branch, or code reference>` |

  #### Related Development Work

  | Type | Reference | Status |
  |------|-----------|--------|
  | Branch | `<branch name>` | Active / Stale |
  | Commit | `<sha> — message` | — |

  #### Overall Assessment

  - **Progress**: Not started / Partial / Done / Unknown, with supporting evidence (no invented percentages).
  - **Readiness**: Ready / Needs clarification / Blocked / Unknown; checklist of goal, scope, acceptance criteria, dependencies, and actionability.
  - **Resolution verdict**: Still relevant / Partially resolved / Fully resolved / Obsolete / Duplicate / Unknown, with rationale.
  - **What appears to be done**: bullet list of concrete evidence of completed work
  - **What appears to be missing**: bullet list of acceptance criteria with no evidence of completion
  - **Blockers or risks**: anything preventing completion (e.g., a failing test, an unanswered question in notes). If the bead is blocked or deferred, lead with that and point back to the "Blocked or Deferred" section above.

  - **Next recommended action**: one concrete step and owner. Recommend **Investigate** for missing
    evidence or clarification, **Start work** when ready, or the appropriate **Review plan**,
    **Review conclusions**, **Review implementation**, or **Review fix** for deeper scrutiny.
    Recommend only; do not invoke those workflows or begin their work here.

  {{ if $target -}}
  For epics, include a per-child table (ID, title, live status, verdict, key evidence, blocker / next
  action), followed by the epic roll-up and any remaining epic-level work. Distinguish already closed
  children from merely resolved candidates. If closed tickets have remaining gaps, flag the mismatch;
  do not silently reopen them or close them again.

  ## Step 3 — Confirm simple actions

  Everything above is **read-only until explicit approval**. Show exact target IDs, reasons, proposed
  comment text, and any duplicate relationship before asking via
  `mitto_ui_options(self_id: "{{ .Session.ID }}", allow_free_text: true)`:

  - **Just the report** — no tracker writes; keeping a ticket open does not imply recording anything.
  - **Record status report** — append only the approved Status Report comment, without editing fields.
  - **Close resolved ticket** — offer only for an open ticket proven Fully resolved, Obsolete, or
    Duplicate, with no untracked remaining acceptance work and no active work / driver / claim.
    For duplicates, this approval must explicitly include linking to the verified canonical ticket.

  For an epic, obtain **individual approval for each child closure**, with IDs, verdicts, and reasons;
  never interpret approval for the parent as approval for its children. Obtain separate approval for
  the epic itself, conditional on every child being closed and its own criteria being satisfied.
  If interactive tools are unavailable, ask in the conversation and wait; **do not assume consent**.

  ## Step 4 — Revalidate and apply only approved actions

  **Before any write**, reload the affected bead and comments, dependencies, children, status, labels,
  and claim metadata; recheck the relevant code/test evidence. If anything material changed, stop
  and reassess; get fresh approval for a changed proposal. Respect `in-flight`, `claimed_by`,
  `claim_heartbeat_at`, and any active work / driver / claim: **do not close actively owned tickets**,
  including duplicates. Never force closure, bypass dependencies, or clear someone else's claim.

  - **Record status report**: use `bd comment {{ $target }} "Status Report: <approved report and evidence>"`.
    No edits to description, acceptance criteria, design, notes, status, priority, or labels.
  - **Duplicate closure**: first run `bd dep relate {{ $target }} <canonical-id>` (or the approved child ID).
    Verify the relationship succeeded or already exists before closing; if linking fails, do not close.
  - **Approved closure**: use `bd close {{ $target }} --reason "<approved evidence-backed reason>"`
    (substitute the individually approved child ID for child closures). Recheck each child immediately
    before acting. **Close an epic only once all its children are closed**, after reloading the child
    list and verifying its own acceptance criteria. If any child is open, unknown, or actively owned,
    leave the epic open. Already-closed tickets need no closure and must not be reopened here.

  Do not add an extra comment unless it too was approved. Report failed or partially completed actions
  honestly; do not claim success, retry with force, or broaden approval. Finish by reporting the final
  verdict, exact actions actually taken, and any remaining work.
  {{- else }}
  This is a **read-only report**: no code changes, tracker writes, ticket creation, or workflow starts.
  Give the recommended next step and stop.
  {{- end }}

  ## Boundaries

  Do not implement code, edit repository files, run unsafe experiments, claim work, start a driver,
  rewrite requirements or plans, decompose work, or create follow-up issues. Do not change labels,
  priority, deferrals, or status except the explicitly approved eligible closures above. A user's
  request for deeper work should be handed off to the appropriate prompt, not performed here.
  Do not introduce a new workflow label. Stop after the status check and any approved simple actions.

  ## Final step — Offer to delete this conversation

  {{ template "_shared/offer-delete-conversation" . }}
