  bd update <id> --add-label researched --add-label reproduced --add-label fixed
  ```

  Keep the similarity check **narrow** — over-spawning a driver (it self-verifies
  and terminates quickly) is safer than mis-closing on a coincidental match.

  Order survivors with the canonical ranking:

  {{ template "beads-issues/shared/rank-candidates" (dict
      "Set"           "the surviving bugs"
      "Deterministic" true
