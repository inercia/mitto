  {{ if .Args.PostIterationPrompt -}}
  {{ template "beads-issues/shared/loop-processing-post-task-hook" . }}
  {{- end }}

  ## Step 6 — End-of-pass notification and yield

  ```
  mitto_ui_notify(
    self_id: "{{ .Session.ID }}",
    title: "Loop processing tasks — pass complete",
    message: "<Class ran (A/B/C) and target processed | 'nothing eligible' if Step 3 fell through | 'at cap' if concurrency gate skipped>. Sets: A=<count> B=<count> C=<count>. Active drivers: <count of running Fix/Implement children after this pass>/{{ $maxWorkers }}.{{ if ne $maxWorkers "1" }} Parallel: <n dispatched this pass, and for n>1 the disjointness basis in ≤10 words | 'serial' when only one>.{{ end }} Reaped: <count from Step 2P, 0 if none>. Closed: <count of terminal-label beads closed this pass, 0 if none>. Reaped-epics: <count from Step 2P epic-reaper, 0 if none>. Recovered-in-progress: <count from Step 2Q, 0 if none>. Reaper: released=<n> skipped=<n> (from Step 2R, 0/0 if none). Undeferred: <count from Step 2Z, 0 if none>.{{ if .Args.PostIterationPrompt }} Post-task hook: <ran-ok|timed-out|spawn-failed|skipped-worker-active|not-run>.{{ end }} Will re-fire on beads changes.",
    style: "success"
  )
  ```

  End the turn — the next `.beads/` change (new `@mitto` comment, a bug's label
  advancing, a feature landing) will wake this supervisor. Do NOT call
  `mitto_conversation_update(loop_enabled: false)` just because sets were empty;
  the loop stays armed and idle until the next real change.

  Likewise, an empty pass must never poll: do NOT call `mitto_conversation_wait` to poll for eligibility, and do NOT re-run Step 2's enumeration within this same turn, merely because sets are empty — there is no sanctioned wait for a bead to become eligible. The bead-state waits in §B/§C only block on a bead THIS pass already dispatched; they are never a mechanism for discovering new work. Ending the turn is the entire mechanism: the next `onTasks` re-fire is what produces a fresh view of eligibility (mitto-d6h).

  ## Step 7 — Blocked → Defer + Handoff (canonical deferral template)

  Use when a target hits a wall: spawn impossible (flag missing, quota,
  `mitto_conversation_new` errored) or intrinsically un-actionable (credentials,
  ambiguity, decision, external access). Never guess; never silently drop.

  {{ template "beads-issues/shared/blocked-explanation" . }}

  **§B / §C — canonical defer:**

  ```bash
  bd update <id> --add-label needs-human --defer +1d
  bd comment <id> "[deferred: <now-RFC3339>]
  Blocked summary: We are trying to <goal>, but cannot continue until <A/B/C prerequisites with owners and causal reasons>.
  Why: <root cause — what was tried, what error/blocker, or which autonomy boundary>.
  What human intervention is required: <the ONE concrete action — e.g. 'enable Can start conversation flag', 'provide API key for X', 'decide between A and B'>.
  How to resume: reply to this bead; the orchestrator will detect it, clear \`needs-human\`, and re-queue."
  ```

  **§A — spawn failure only**: use the SAME `[deferred: ...]` template, but do
  NOT write `[addressed-comment: <ts>]` (the mention was never dispatched).

  After deferring, post Step 6's notification and end; do NOT try another target
  this pass.

  ## Guidelines

  - **One increment per pass.** {{ if eq $maxWorkers "1" }}Exactly one worker, one class.{{ else }}One class per pass, and at most
    {{ $maxWorkers }} workers within it, more than one ONLY on a Step 3D disjointness
    proof.{{ end }} The `onTasks` re-fire drives cross-pass progress — never batch.
  - **Strict class priority A{{ if ne .Args.FixBugs "false" }} → B{{ end }}{{ if ne .Args.WorkOnFeatures "false" }} → C{{ end }}, then bead priority within class**
    (`critical → high → medium → low`) per the §2B/§2C ranking, including its
    epic-finishing promotion (the only sanctioned way a lower-priority bead
    outranks a higher one). Never promote a feature over an eligible bug.
  - **Top-level only.** `Session.IsChild` → notify + STOP; no `bd` writes, no spawns.
  - **Silent unless it matters.** `mitto_ui_notify` only at Step 6, degrade paths
    (Step 7, wait errors), and wait-timeout milestones. Never per-target.
  - **Milestone toasts only.** `mitto_workspace_ui_notify` fires ONLY on terminal
    close (§B/§C "Bead closed") and on `@mitto` mention addressed (§A "Driver
    done"). Never on phase transitions, dispatches, timeouts, or failures.
    `sound`/`sticky`/`native` stay off.
  - **Live state every pass.** Re-run 2P/2Z/2A/2B/2C fresh; never cache.
  - **Uncommitted changes never justify skipping a pass.** Drivers stage only the
    paths they edited; the orchestrator does not second-guess that. The ONLY
    pass-level yields: (a) sets empty after 2A/2B/2C, (b) concurrency cap
    (Step 3), (c) Step 7 deferral, (d) preflight failure.
  {{ if or (ne .Args.FixBugs "false") (ne .Args.WorkOnFeatures "false") -}}
  - **Cap: {{ $maxWorkers }} active worker{{ if ne $maxWorkers "1" }}s{{ end }}.** {{ if and (ne .Args.FixBugs "false") (ne .Args.WorkOnFeatures "false") }}§B and §C share{{ else }}{{ if ne .Args.FixBugs "false" }}§B has{{ else }}§C has{{ end }}{{ end }}{{ if .Args.PostIterationPrompt }} — together with the Step 5H
    post-task hook —{{ end }} a budget of     {{ $maxWorkers }} concurrent worker conversation{{ if ne $maxWorkers "1" }}s{{ end }}.
    {{ if eq $maxWorkers "1" }}Serial execution prevents overlapping-file races.{{ else }}Workers share ONE working tree: extra slots only for provably code-disjoint beads (Step 3D, proof on a *recorded* file surface of BOTH beads). Never parallelize on a hunch{{ if .Args.PostIterationPrompt }}; the post-task hook still runs alone{{ end }}.{{ end }} At cap → skip the spawn;
    Step 2P frees the slot. §A mention drivers don't count.
  {{- end }}
  - **Reap aggressively.** Step 2P deletes (not archives) terminal/orphaned/idle-2h/
    duplicate children every pass.
  - **Never duplicate a spawn.** Cross-check `beads_issue` (§A: also mention `<ts>`
    in child title) on `{{ .Children.MCPText }}` before every create.
  - **Never reuse a child for a different task.** One child ↔ one bead / one
    mention, for life; its context would poison the new task. If every eligible
    child is busy, wait (Step 6 at-cap yield). `send_prompt` on an existing child
    is legit only to nudge the SAME child about the SAME bead, or to stop it.
  - **Skip beads with active conversations (workspace-scoped).** Any bead whose
    `beads_issue` matches a non-archived conversation in **either** this session's
    `{{ .Children.MCPText }}` **or** `.Workspace.Peers.All` (ours, a peer
    orchestrator's, or a user's) is excluded from all three sets — racing loses
    updates. `.Workspace.Peers` is already scoped to non-archived siblings
    sharing this session's `(WorkingDir, ACPServer)`.
  - **Skip beads with an `in-flight` claim (mitto-ial).** L2 drivers mark beads
    with the `in-flight` label plus `claimed_by`/`claimed_at`/`claim_heartbeat_at`
    metadata while leaving `status=open`. 2B/2C exclude such beads; Step 2R
    releases malformed or stale claims. Every close site strips the claim before
    `bd close`.
  - **Legacy `in_progress` (Step 2Q).** Current drivers never set it. Preserve it
    while a conversation owner, `in-flight` claim, or 24h activity exists;
    otherwise return it to `open` — never close from stale prose.
  - **Honor scope flags.** `FixBugs` and `WorkOnFeatures` (default `"true"`) gate
    §B and §C; `"false"` = skipped and empty in Step 3. §A is ALWAYS on.
  {{ if .Args.PostIterationPrompt -}}
  - **Post-task hook is best-effort AND mutually exclusive with drivers.** Step 5H
    runs `{{ .Args.PostIterationPrompt }}` in its own child only after a task
    completed (§A driver done, §B/§C bead closed). It holds the single worker
    slot: skipped when any `Fix …` / `Implement …` / `Post-task: …` conversation is
    live (re-checked live at Step 5H), and §B/§C refuse to spawn while it runs.
    Its failure never blocks the next task or re-opens the bead; new work it
    finds must be filed as a bead.
  {{- end }}
  - **Expand epics; don't spawn them.** An `epic` is a container. 2B/2C walk each
    open epic's open children: `bug` → §B, other non-epic types → §C. Step 2P
    closes children as drivers terminate and reaps the epic once its last child
    is closed. Candidate parents come only from this pass's closures, reaped
    workers, and the current `onTasks` delta — never a global epic sweep.
  {{ if or (ne .Args.FixBugs "false") (ne .Args.WorkOnFeatures "false") -}}
  - **Close terminal-label leaves and completed parents.** Step 2P first removes a
    class-terminal label carried through a later reopen, then closes an open bead
    carrying the current-episode terminal label ({{ if ne .Args.FixBugs "false" }}`fixed` for bugs{{ if ne .Args.WorkOnFeatures "false" }}, {{ end }}{{ end }}{{ if ne .Args.WorkOnFeatures "false" }}`verified` for features{{ end }}) only when it has no non-closed direct children. `needs-human` beads stay with the human.
  {{- end }}
  - **`[addressed-comment: <ts>]` is the §A dedup key** — never delete or rewrite.
  - **Defer instead of guessing.** Anything needing a decision/credential/external
    access/clarification → Step 7, with a machine-parseable marker (Step 2Z relies on it).
  - **Undefer on human response.** Step 2Z re-opens `needs-human` beads whose newest
    `[deferred: <ts>]` has a later non-orchestrator comment or description edit,
    posting `[undeferred: <deferred-ts>]`.
  - **Always log to the tracker.** Short `bd comment` for every orchestration
    action (spawn, timeout, completion, defer, undefer, reap).
  - **No `Item.*`.** `beadsList` prompt — all targeting comes from Step 2.
