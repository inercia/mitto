  ## Step 6 — End-of-pass notification and yield

  ```
  mitto_ui_notify(
    self_id: "{{ .Session.ID }}",
    title: "Loop processing tasks — pass complete",
    message: "<Class ran (A/B/C) and target processed | 'nothing eligible' if Step 3 fell through | 'at cap' if concurrency gate skipped>. Sets: A=<count> B=<count> C=<count>. Active drivers: <count of running Fix/Implement children after this pass>/1. Reaped: <count from Step 2P, 0 if none>. Closed: <count of terminal-label beads closed this pass, 0 if none>. Reaped-epics: <count from Step 2P epic-reaper, 0 if none>. Undeferred: <count from Step 2Z, 0 if none>. Will re-fire on beads changes.",
    style: "success"
  )
  ```

  End the turn — the next `.beads/` change (new `@mitto` comment, a bug's label
  advancing, a feature landing) will wake this supervisor. Do NOT call
  `mitto_conversation_update(loop_enabled: false)` just because sets were empty;
  the loop stays armed and idle until the next real change.

  ## Step 7 — Blocked → Defer + Handoff (canonical deferral template)

  Use whenever the orchestrator hits a wall on a specific target — spawn
  impossible (flag missing, quota, `mitto_conversation_new` errored) or the
  target is intrinsically un-actionable (credentials, ambiguity, decision,
  external access, manual verification). Never guess; never silently drop.

  **§B / §C — canonical defer:**

  ```bash
  bd update <id> --add-label needs-human --defer +1d
  bd comment <id> "[deferred: <now-RFC3339>]
  Why: <root cause — what was tried, what error/blocker, or which autonomy boundary>.
  What human intervention is required: <the ONE concrete action — e.g. 'enable Can start conversation flag', 'provide API key for X', 'decide between A and B'>.
  How to resume: reply to this bead; the orchestrator will detect it, clear \`needs-human\`, and re-queue."
  ```

  **§A — spawn failure only** (mention drivers handle ambiguous-mention deferral
  themselves). Use the SAME `[deferred: ...]` template on the bead, but do NOT
  write `[addressed-comment: <ts>]` — the mention was never dispatched. Step 2Z
  will undefer and §A will re-see the mention.

  After deferring, post Step 6's notification and end. Do NOT try another target
  this pass — a flag/quota failure likely affects them all.

  ## Guidelines

  - **One increment per pass.** Exactly one worker, one class. The `onTasks`
    re-fire drives cross-pass progress — never batch.
  - **Strict class priority A{{ if ne .Args.FixBugs "false" }} → B{{ end }}{{ if ne .Args.WorkOnFeatures "false" }} → C{{ end }}, then bead priority within class.** Class comes first
    (bugs always before features), then within the chosen class pick the
    highest-priority bead (`critical → high → medium → low`, i.e. `P0` before
    `P1` before `P2` before `P3`), tie-broken by bead ID asc. Never demote by
    "looks small" / "looks urgent"; never promote a feature over an eligible
    bug on urgency vibes.
  - **Top-level only.** `Session.IsChild` → notify + STOP; no `bd` writes, no spawns.
  - **Silent unless it matters.** `mitto_ui_notify` only at Step 6, degrade paths
    (Step 7, wait errors), and wait-timeout milestones. Never per-target.
  - **Live state every pass.** Re-run 2P/2Z/2A/2B/2C fresh; never cache — sets go
    stale by design.
  - **Uncommitted changes never justify skipping a pass.** A dirty working tree is
    informational only. Per-bead drivers protect unrelated work by staging only
    paths they edited (`git add <file>` — never `-A`/`-a`/`.`), so unrelated
    uncommitted changes stay untouched. The orchestrator enumerates and
    dispatches; it does NOT second-guess drivers' path-scoped-add discipline.
    Genuine edit collisions surface inside the driver (via `needs-human` defer).
    The ONLY legitimate pass-level yields: (a) sets empty after 2A/2B/2C,
    (b) concurrency cap (Step 3), (c) Step 7 deferral, (d) preflight failure.
  {{ if or (ne .Args.FixBugs "false") (ne .Args.WorkOnFeatures "false") -}}
  - **Cap: 1 active driver.** {{ if and (ne .Args.FixBugs "false") (ne .Args.WorkOnFeatures "false") }}§B and §C share{{ else }}{{ if ne .Args.FixBugs "false" }}§B has{{ else }}§C has{{ end }}{{ end }} a budget of 1 persistent `onCompletion` child.
    Serial execution prevents overlapping-file races. At cap → skip the spawn;
    Step 2P will free the slot. §A mention drivers self-terminate and don't count.
  {{- end }}
  - **Reap aggressively.** Step 2P deletes (not archives) terminal/orphaned/idle-2h/
    duplicate children every pass. Never let the child list grow unbounded.
  - **Never duplicate a spawn.** Cross-check `beads_issue` (§A: also mention `<ts>`
    in child title) on `{{ .Children.MCPText }}` before every create.
  - **Never reuse a child for a different task.** One child ↔ one bead / one
    mention, for life. Do NOT `mitto_conversation_send_prompt` a child a different
    bead or unrelated instruction — its accumulated context poisons the new task
    (wrong bead ID in commits, wrong `bd close` target, stale notes). If every
    eligible child is busy, the correct action is "wait" (Step 6, at-cap yield) —
    NOT "repurpose an idle child". `send_prompt` on an existing child is legit only
    for (a) nudging the SAME child about the SAME bead, or (b) telling it to stop.
    For any new bead / mention, always spawn fresh with `mitto_conversation_new`.
  - **Skip beads with active conversations (workspace-scoped).** Any bead whose
    `beads_issue` matches a non-archived conversation returned by
    `mitto_conversation_list(self_id, workspace: "{{ .Workspace.UUID }}", archived: false)`
    (ours, a peer orchestrator's, or a user's) is excluded from all three sets —
    racing loses updates. Enumerate workspace-wide, not just this session's own
    children (mitto-9mk). Re-enumerated once the conversation is done or archived.
  - **Honor scope flags.** `FixBugs` and `WorkOnFeatures` (both default `"true"`)
    gate §B and §C. When `"false"`, the section is skipped and treated as empty
    in Step 3. §A is ALWAYS on regardless.
  - **Expand epics; don't spawn them.** An `epic` bead is a container — never
    dispatched itself. 2B and 2C walk each open epic's open children: `bug`
    children → §B, other non-epic types (`feature`/`task`/`story`/`chore`) → §C
    via `Loop implementing feature` (its planned→implemented→tested→verified
    machine applies to all types). The epic stays open while children run;
    Step 2P closes each child as its driver terminates, and Step 2P's
    epic-reaper closes the epic itself in the same pass once its last child is
    closed (pass-local: only epics whose children were closed by this pass are
    considered — never sweep all open epics).
  {{ if or (ne .Args.FixBugs "false") (ne .Args.WorkOnFeatures "false") -}}
  - **Close terminal-label beads.** Step 2P closes any open bead carrying the
    class-terminal label ({{ if ne .Args.FixBugs "false" }}`fixed` for bugs{{ if ne .Args.WorkOnFeatures "false" }}, {{ end }}{{ end }}{{ if ne .Args.WorkOnFeatures "false" }}`verified` for features{{ end }}) — the driver
    already satisfied its terminal contract. `needs-human` beads are excluded by
    the label filter (deferred beads carry `needs-human`, not the terminal label);
    those stay with the human.
  {{- end }}
  - **`[addressed-comment: <ts>]` is the §A dedup key** — never delete or rewrite;
    re-processing means a fresh `@mitto` with a new `<ts>`.
  - **Defer instead of guessing.** Anything needing a decision/credential/external
    access/clarification → Step 7. Never leave a half-processed bead without a
    machine-parseable marker — Step 2Z's undeferral relies on it.
  - **Undefer on human response.** Step 2Z re-opens `needs-human` beads whose newest
    `[deferred: <ts>]` has a subsequent non-orchestrator comment or description
    edit. Always post `[undeferred: <deferred-ts>]` when stripping the label.
    Bug/feature drivers defer internally the same way; §2B/§2C exclusion honors
    their `needs-human` and undefers identically.
  - **Always log to the tracker.** Short `bd comment` for every orchestration
    action (spawn, timeout, completion, defer, undefer, reap).
  - **No `Item.*`.** `beadsList` prompt — all targeting comes from Step 2.
