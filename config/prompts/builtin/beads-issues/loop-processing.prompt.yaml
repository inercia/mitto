icon: loop
name: Loop processing tasks
menus: beadsList
parameters:
  - name: Commit
    type: boolean
    default: "true"
    description: When true (default), workers commit their changes — §A one-shot workers commit inline and §B/§C drivers commit at each terminal stage. When false, changes are left uncommitted (working tree only) for human review.
  - name: FixBugs
    type: boolean
    default: "true"
    description: When true (default), the loop processes open bugs via §B. Set to false to disable bug handling entirely — Step 2B is skipped and §B is never dispatched. Useful when the operator only wants the loop to work on features (or on @mitto mentions).
  - name: WorkOnFeatures
    type: boolean
    default: "true"
    description: When true (default), the loop processes open features via §C. Set to false to disable feature handling entirely — Step 2C is skipped and §C is never dispatched. Useful when the operator only wants the loop to work on bugs (or on @mitto mentions).
description: "Unified standing supervisor — on every beads change, process at most one increment from whichever class has work — (A) unaddressed @mitto comments, (B) eligible open bugs, (C) eligible open features. Comments first, then bugs, then features. One worker in flight at a time."
backgroundColor: '#E1BEE7'
group: Tasks
enabledWhen: '!Session.IsChild && CommandExists("bd") && DirExists(".beads") && Permissions.CanStartConversation'
loop:
  # Standing supervisor: never stops on its own (maxIterations/maxDuration = 0);
  # runOnStart fires once at boot so it picks up work without waiting for a task
  # change; freshContext keeps token spend bounded and prevents stale reasoning;
  # coalesceDuringBusy: false ensures §A/§B/§C children's own .beads/ mutations
  # re-fire the supervisor (mitto-cwg) instead of being silently rebased.
  trigger: onTasks
  maxIterations: 0
  maxDuration: 0
  runOnStart: true
  freshContext: true
  coalesceDuringBusy: false
target:
  title: 'Loop processing tasks'
  reuse:
    title: true
    coalesce: true
# Pure procedural orchestration (enumerate → decide → dispatch → yield); real
# reasoning is delegated to §A/§B/§C driver children which switch tier themselves.
# Coding tier pin prevents inheriting the seeding conversation's model.
preferredModels:
  - modelTag: Coding
prompt: |
  {{ template "_shared/session-context" . }}
  Available ACP servers: `{{ .ACP.AvailableText }}`
  Existing children: `{{ .Children.MCPText }}`

  {{- with .Trigger }}{{ with .OnTasks }}

  ## Triggered by these beads changes

  This pass was fired by the changes below (deltas since the previous baseline). Use these as **hints
  for triage priority** — a bead in this list is more likely to have new `@mitto` comments (§A), a
  fresh reproduction (§B), or a design update (§C) than a random bead — but do NOT skip the normal
  Step-2 filtering: a change here does not by itself make a bead eligible for a §A/§B/§C worker.

  {{- if .Changes.Touched }}
  {{ range .Changes.Touched -}}
  - `{{ .id }}` ({{ .status }}, P{{ .priority }}): {{ .title }}
  {{ end -}}
  {{- else }}
  _(no touched beads reported — likely a rebase-driven re-fire; proceed with the normal scan)_
  {{- end }}
  {{ end }}{{ end }}

  # Beads: Loop Processing Beads (unified list-level orchestrator)

  Beads is a CLI issue tracker (`bd`); IDs look like `bd-xyz`. This is a list-level
  `onTasks` supervisor (`menus: beadsList`, no `Item.*`) that wakes on any `.beads/`
  change, processes **one increment** from one class, then yields. Three classes, strict
  priority **A → B → C**:

  - **§A — Address `@mitto` comments.** One per-mention driver child that walks a
    small phase state machine (investigate → plan → implement, or answer, on the
    appropriate model tier), writes `[addressed-comment: <ts>]` back-reference, and
    self-terminates.
  - **§B — Fix eligible open bugs.** Spawn `Loop fixing bug` as an `onCompletion` child
    (one `researched → reproduced → fixed` step per re-fire).
  - **§C — Implement eligible open features.** Spawn `Loop implementing feature` as an
    `onCompletion` child (one `planned → implemented → tested → verified` step per re-fire).

  Comments first (small, human-driven); bugs before features (defects block). Multiple
  pending increments are safe: each worker's `bd` mutation triggers a fresh `onTasks` pass.

  **Epics are containers, not work items.** An `epic` bead is never dispatched to a driver
  on its own; instead, Step 2 **expands every open epic into its open children** and merges
  those children into the eligible sets by their own `issue_type`: `bug` children flow into
  §B, and every other non-epic child type (`feature`, `task`, `story`, `chore`, etc.) flows
  into §C via the `Loop implementing feature` driver. The epic itself stays open until all
  its children reach a terminal state — Step 2P's "Close terminal-label beads" sweep closes
  the individual children as their drivers finish, and Step 2P's "Reap epics" sub-step
  automatically closes the epic in the same pass once its last child is closed (pass-local
  scope: only epics whose children were closed by this pass are considered).

  ### Concurrency, deferral, preflight (summary — enforced in Steps 2P/2Z/§B/§C/7)

  - **Cap: 1 active driver per workspace** total across §B + §C (`onCompletion`
    children with title `Fix …` / `Implement …` in a non-terminal state). The
    cap is workspace-scoped (enumerated via `mitto_conversation_list` filtered
    by `workspace: "{{ .Workspace.UUID }}"`), not per-orchestrator — parallel
    `Loop processing tasks` sessions in the same workspace share the single
    slot (mitto-9mk). §A mention drivers self-terminate and are NOT counted.
    Serial execution prevents overlapping-file races. Step 2P prunes stale
    children every pass to free the slot.
  - **Deferral:** any un-progressable bead gets `--add-label needs-human --defer +1d`
    plus a comment starting `[deferred: <RFC3339>]` (full template in Step 7).
    Step 2Z undefers when the human replies, posting `[undeferred: <deferred-ts>]`.
  - **Preflight:** requires **Can start conversation** and **Can Send Prompt** flags
    plus a non-child session. Any tool error from a disabled flag, or
    `Session.IsChild` true → single `mitto_ui_notify` naming the blocker, then STOP
    (no `bd` writes, no spawns).

  ## Step 1 — Validate the nested driver prompts

  §B/§C spawn children by name; resolve each enabled driver up front (closes
  mitto-dj9 short-circuit). On failure, disable that class for this pass only.

  ```
  {{ if ne .Args.FixBugs "false" -}}
  mitto_prompt_get(self_id: "{{ .Session.ID }}", name: "Loop fixing bug")
  {{ end -}}
  {{ if ne .Args.WorkOnFeatures "false" -}}
  mitto_prompt_get(self_id: "{{ .Session.ID }}", name: "Loop implementing feature")
  {{ end -}}
  ```

  ## Step 2P — Prune stale children (reap before you spawn)

  Run FIRST every pass, before Step 2Z. Walk `{{ .Children.MCPText }}` and delete
  (via `mitto_conversation_delete`, NOT archive — delete frees the ACP slot fully)
  any child matching the FIRST applicable category. Do NOT reap §A mention drivers
  (they self-terminate; §A owns their wait/archive path).

  1. **Terminal** — child status `done`/`completed`/`stopped`/`failed`, OR its
     `beads_issue` carries the class-terminal label ({{ if ne .Args.FixBugs "false" }}`fixed` for `Fix …`{{ if ne .Args.WorkOnFeatures "false" }}, {{ end }}{{ end }}{{ if ne .Args.WorkOnFeatures "false" }}`verified` for
     `Implement …`{{ end }}). Also close the bead in the same pass (see below).
  2. **Orphaned** — `beads_issue` bead is closed OR carries `needs-human` (driver
     is deferred; §B/§C will re-spawn once Step 2Z undefers).
  3. **Idle 2h+** — status `iterating`/`queued` with no fresh `Investigation:` /
     `Reproduction:` / `Fix:` / `Plan:` / `Implementation:` / `Verification:`
     comment on `beads_issue` in 2h.
  4. **Duplicate** — two children share the same `beads_issue`; keep the older,
     reap the younger.

  For each reap, one bead comment then delete:

  ```bash
  bd comment <bead-id> "Orchestrator: reaping child <child-id> (reason: <terminal|orphaned|idle-2h|duplicate>). Bead will be re-picked if still eligible."
  ```
  ```
  mitto_conversation_delete(self_id: "{{ .Session.ID }}", conversation_id: "<child-id>")
  ```

  {{ if or (ne .Args.FixBugs "false") (ne .Args.WorkOnFeatures "false") -}}
  ### Close terminal-label beads

  Right after the reap loop, close any open bead carrying the class-terminal label
  (independent of whether its driver still exists). Track the closed IDs in
  `closed_this_pass` so 2B/2C's "recently-closed parent" exclusion can skip their
  parent-child dependents this pass, AND so the epic-reaper below can walk their
  parent epics.

  ```bash
  closed_this_pass=()
  {{ if ne .Args.FixBugs "false" -}}
  for id in $(bd list --type bug --status open --label fixed --json | jq -r '.[].id'); do
    bd comment "$id" "Orchestrator: terminal label=fixed; closing."
    bd close "$id"
    closed_this_pass+=("$id")
  done
  {{ end }}
  {{- if ne .Args.WorkOnFeatures "false" }}
  for id in $(bd list --type feature --status open --label verified --json | jq -r '.[].id'); do
    bd comment "$id" "Orchestrator: terminal label=verified; closing."
    bd close "$id"
    closed_this_pass+=("$id")
  done
  {{- end }}
  ```

  Log one-line counts for Step 6: `Closed: <n>`.

  ### Reap epics whose children are all closed

  Right after the terminal-label close loop, walk the parents of `closed_this_pass`
  to reap any epic whose last open child was just closed. **Pass-local scope**: only
  epics touched by this pass are considered — never sweep all open epics (that would
  surprise humans working on unrelated epics whose last child was closed manually).
  Reaping lives ONLY in this orchestrator (never in per-driver prompts) to avoid
  parent-close races between concurrent §B/§C drivers touching different children
  of the same epic.

  ```bash
  reaped_epics=()
  # Derive touched epics: union of parent fields on beads closed this pass.
  declare -A touched_epics_set=()
  for cid in "${closed_this_pass[@]}"; do
    pid=$(bd show "$cid" --json 2>/dev/null | jq -r '.[0].parent // empty')
    if [ -n "$pid" ]; then
      touched_epics_set["$pid"]=1
    fi
  done
  touched_epics=("${!touched_epics_set[@]}")

  # Hard cap: 20 reaped epics per pass; log-and-skip beyond.
  reap_cap=20
  reap_count=0
  overflow_epics=()
  for epic_id in "${touched_epics[@]}"; do
    if [ "$reap_count" -ge "$reap_cap" ]; then
      overflow_epics+=("$epic_id")
      continue
    fi
    # Confirm it's an open epic (idempotency: a concurrent pass may already have closed it).
    meta=$(bd show "$epic_id" --json 2>/dev/null | jq -r '.[0] | "\(.issue_type)|\(.status)"')
    if [ "$meta" != "epic|open" ]; then
      continue
    fi
    # All children closed? A child-epic counts as satisfied only when its own status==closed,
    # so nested epics reap in dependency order across successive passes.
    open_children=$(bd children "$epic_id" --json 2>/dev/null | jq '[.[] | select(.status != "closed")] | length')
    if [ "${open_children:-1}" -eq 0 ]; then
      bd comment "$epic_id" "Orchestrator: reaping epic $epic_id — all children closed by this pass."
      bd close "$epic_id" --reason "All children closed by L1 orchestrator pass"
      reaped_epics+=("$epic_id")
      reap_count=$((reap_count + 1))
    fi
  done
  if [ "${#overflow_epics[@]}" -gt 0 ]; then
    echo "Epic reaper cap ($reap_cap) reached; remaining touched epics: ${overflow_epics[*]}"
  fi
  ```

  Log one-line count for Step 6: `Reaped epics: <n>`.
  {{- end }}

  Log one-line count for Step 6: `Reaped: <n>`.

  ## Step 2Z — Undefer any bead the user has replied to

  Run BEFORE Step 2 so undeferred beads are eligible in the *same* pass. Load the
  `needs-human` set and each bead's context:

  ```bash
  bd list --status open --label needs-human --json
  # for each <id>:
  bd show <id> --long --json
  bd comments <id> --json
  ```

  Locate the **most recent** comment whose FIRST line matches
  `[deferred: <RFC3339-timestamp>]` — call it `<deferred-ts>`. If a bead carries
  `needs-human` with no deferral marker (legacy/hand-labelled), skip it (let the human
  clear the label manually).

  **Undefer** when any of these fires vs. `<deferred-ts>`:

  1. Non-orchestrator comment after `<deferred-ts>` whose body does not start with
     `[deferred:`, `[undeferred:`, `[addressed-comment:`, or `Orchestrator:` (those
     are our own bookkeeping — not the human replying).
  2. Description edited after `<deferred-ts>` (proxy: `updated_at` bump with no
     orchestrator comment at the same time; when in doubt count as a reply).

  On either signal:

  ```bash
  bd update <id> --remove-label needs-human --defer ''
  bd comment <id> "[undeferred: <deferred-ts>]
  Orchestrator: detected human response — <which signal fired>. Bead is back in the normal work queue."
  ```

  If the human already removed `needs-human` themselves, the bead won't appear in the
  query above — nothing to do here, but if you notice a lingering `--defer` date on
  such a bead elsewhere, clear it with `bd update <id> --defer ''`.

  Do NOT spawn workers inside Step 2Z; Step 2 will pick undeferred beads up via the
  normal §B/§C enumeration once `needs-human` is gone. Step 2Z is a full pre-scan
  (unlike Steps 3-6 which are one-target).

  ## Step 2 — Build the three eligible sets

  Enumerate all three classes so the priority decision is one comparison.

  ### 2A — Unaddressed `@mitto` mentions

  Load open beads and each bead's comments (mentions on closed beads don't count):

  ```bash
  bd list --status open --json
  # for each candidate <id>:
  bd comments <id> --json
  ```

  Classify each comment: a **mention** contains `@mitto` (case-insensitive) authored by
  someone other than this orchestrator; a **back-reference** is any orchestrator/worker
  comment whose first line is `[addressed-comment: <RFC3339-timestamp>]`. A mention is
  **unaddressed** iff no later back-reference names its exact timestamp. Collect
  `(id, ts, body)` tuples, ordered by ascending `ts` then bead ID (oldest first).

  **Exclude** any tuple whose `<id>` matches an existing non-archived conversation's
  `beads_issue` in `{{ .Children.MCPText }}` — another agent (or user-driven session)
  is already working on that bead, so this pass leaves the mention alone; it will
  re-surface on a future pass once the active conversation is done or archived.

  **Formal-match only — no title inference.** The "already working on it"
  exclusion fires ONLY when a non-archived conversation's `beads_issue` field
  **literally equals `<id>`**. Do NOT exclude based on similarity between the
  bead title and a session title (e.g. a user session titled "Dashboard" does
  NOT exclude beads whose scope words happen to overlap with "dashboard"). If
  a human wants a session to reserve a bead, they set `beads_issue` on that
  session — an empty `beads_issue` means "no claim". This rule applies
  identically to 2A / 2B / 2C.

  ### 2B — Eligible open bugs

  {{ if eq .Args.FixBugs "false" -}}
  **Bug processing is disabled** (`FixBugs=false`). Skip this section entirely —
  treat 2B as empty (count = 0) in Steps 3 and 6. Do NOT enumerate or dispatch bugs.
  {{- else -}}
  **Eligibility rule.** A bug's eligibility is decided by its **own** `status`
  (must be `open`) and its **own** labels/in-progress/needs-human state. Parent
  epic status is **irrelevant** — open children of closed epics are processed the
  same as open children of open epics or top-level bugs. The "recently-closed
  parent" exclusion below is narrowly scoped to parents THIS outer run just
  closed in Step 2P (mitto-fko: avoid rushing into `.n` subtasks before human
  re-triage), NOT any-closed-parent.

  ```bash
  bd ready --json          # prefer ready set; filter type=="bug"
  bd list --type bug --status open --json      # fallback

  # Epic expansion — bug children of every epic (open OR closed).
  for epic_id in $(bd list --type epic --all --json | jq -r '.[].id'); do
    bd children "$epic_id" --json | jq '.[] | select(.status == "open" and .issue_type == "bug")'
  done
  ```

  Merge and de-duplicate by `id`, then apply exclusions.

  **Exclude** any bug that:

  - carries terminal label `fixed` (Step 2P will close it this pass), OR
  - is `in_progress` elsewhere, OR
  - carries `needs-human` (previously deferred), OR
  - **formally** matches a non-archived conversation's `beads_issue` in
    `{{ .Children.MCPText }}` (literal `==` — NOT fuzzy title match; see 2A's
    "Formal-match only" note), OR
  - **appears already fixed** (see below), OR
  - has a `parent-child` dependency whose parent was closed **by THIS pass's
    Step 2P** (pass-local set only — mitto-fko; check `bd show <id> --json`
    dependencies).

  **Already-landed fix detection.** Before adding a bead to the set, scan for a
  commit that already resolves it (typical when a human fixed the bug directly
  and forgot the `(refs <id>)` footer):

  ```bash
  bd show <id> --json | jq -r '.[0].commits[]?.hash' | head -3
  git log --since=<bead.created_at> --oneline --format='%h %s' \
    | grep -iE '<2-4 distinctive keywords from bead title, joined by |>' | head -5
  ```

  If either returns a commit whose diff/subject plausibly resolves the bead
  (matches the bead's file surface or has distinctive unambiguous keywords),
  **exclude AND self-heal** — post a repair comment and add the class-terminal
  chain so Step 2P closes it:

  ```bash
  bd comment <id> "Orchestrator: fix appears to have landed at <hash> ('<subject>') outside the beads workflow (missing '(refs <id>)' footer). Adding terminal labels so Step 2P closes the bead. If incorrect, remove the labels and comment to re-open the workflow."
  bd update <id> --add-label researched --add-label reproduced --add-label fixed
  ```

  Keep the similarity check **narrow** — over-spawning a driver (it self-verifies
  and terminates quickly) is safer than mis-closing on a coincidental match.

  Order survivors by **priority** (`critical → high → medium → low` — i.e.
  `bd` numeric `priority` **ascending**: `P0` before `P1` before `P2` before
  `P3`), then bead ID asc. **Priority is authoritative within §B** — a P0 bug
  ALWAYS runs before a P3 bug; never demote by "looks small" or "looks urgent".
  {{- end }}

  ### 2C — Eligible open features

  {{ if eq .Args.WorkOnFeatures "false" -}}
  **Feature processing is disabled** (`WorkOnFeatures=false`). Skip this section
  entirely — treat 2C as empty (count = 0) in Steps 3 and 6. Do NOT enumerate or
  dispatch features.
  {{- else -}}
  Same shape as 2B — same exclusions, same eligibility rule (bead's own
  `status`/labels decide; parent epic's status is irrelevant; recently-closed
  parent is pass-local, mitto-fko), and **same ordering**: priority
  (`critical → high → medium → low`, i.e. `P0` before `P1` before `P2` before
  `P3`) then bead ID asc. Priority is authoritative within §C — a P0 feature
  ALWAYS runs before a P3 feature. Differences:

  - Terminal label is `verified`.
  - Self-heal chain (already-landed fix) adds `planned`, `implemented`, `tested`,
    `verified` (the §C terminal chain) instead of the §B chain.
  - §C is the catch-all for every non-bug work item, including epic members
    typed `task` / `story` / `chore`.

  ```bash
  bd ready --json          # prefer ready set; filter type=="feature"
  bd list --type feature --status open --json      # fallback

  # Epic expansion — every open non-bug, non-epic child of any epic (open OR
  # closed) routes through the feature driver.
  for epic_id in $(bd list --type epic --all --json | jq -r '.[].id'); do
    bd children "$epic_id" --json \
      | jq '.[] | select(.status == "open" and .issue_type != "bug" and .issue_type != "epic")'
  done
  ```

  Merge and de-duplicate by `id`, then apply exclusions and ordering.
  {{- end }}

  ## Step 2T — Emit the candidates table

  Before Step 3, print ONE Markdown table summarising every enumerated candidate
  and its disposition. This is the ONE place per pass where per-bead reasoning is
  exposed — no per-bead prose outside this table.

  One row per candidate across all three sets. Order: class A → B → C, then
  class-native (2A: `ts` asc; 2B/2C: priority `critical → high → medium → low`
  — i.e. `P0` before `P1` before `P2` before `P3` — then bead ID asc).
  Include EVERY candidate, including excluded — those rows are the whole point.

  - **Class** — `A` / `B` / `C`.
  - **Issue** — bead ID (for 2A, append ` [<ts>]`).
  - **Status** — one emoji:
    - 🟢 `spawnable` — passed all exclusions; considered in Step 3.
    - 🔴 `excluded` — failed at least one exclusion (see Reason).
    - 🟡 `blocked` — unmet `bd` dependencies.
    - ⏸️ `queued` — eligible but deferred to a later pass (concurrency cap,
      epic container). Not an error; reconsidered on next fire.
  - **Reason** — 🟢: blank or `ready`; otherwise ONE dominant reason
    (`beads_issue match: <session-id>` — always include the literal session ID,
    `label: needs-human`, `label: fixed (terminal)`,
    `already-landed fix (commit <hash>)`, `recently-closed parent <id>`,
    `blocked-by <id>`, `scope disabled`, `concurrency cap`, `epic (container)`).

  Format exactly:

  ```
  Candidates (A=<count> B=<count> C=<count> Reaped-epics=<count>):

  | Class | Issue | Status | Reason |
  |-------|-------|--------|--------|
  | A | <id> [<ts>] | 🟢 spawnable | ready |
  | B | <id> | 🔴 excluded | beads_issue match: <session-id> |
  | C | <id> | 🟡 blocked | blocked-by <id> |
  | C | <id> | ⏸️ queued | concurrency cap |
  ```

  If Step 2P's epic-reaper closed any epics this pass, append a small bulleted
  list below the table (one line per reaped epic, `<id> (children=<n>)`) under
  the header `Reaped epics:` — this satisfies the "reap actions appear in §2T"
  audit requirement without widening the candidates-table schema (reap is a
  fundamentally different action from candidate dispatch).

  If ALL three sets are empty (nothing even entered enumeration) AND no epics
  were reaped, print `Candidates: none (A=0 B=0 C=0 Reaped-epics=0).` and skip
  the table. If epics were reaped but candidate sets are empty, still print the
  header line plus the `Reaped epics:` list (skip the empty table body).

  ## Step 3 — Pick the class for this pass

  Strict priority{{ if or (ne .Args.FixBugs "false") (ne .Args.WorkOnFeatures "false") }} **A{{ if ne .Args.FixBugs "false" }} → B{{ end }}{{ if ne .Args.WorkOnFeatures "false" }} → C{{ end }}**{{ else }} (only §A enabled — bugs and features are both disabled){{ end }}:

  1. 2A non-empty → §A on the oldest unaddressed mention.
  {{ if ne .Args.FixBugs "false" -}}
  2. Else 2B non-empty AND Step 1 "Loop fixing bug" preflight succeeded → §B on the
     **highest-priority bug** (2B's first row: lowest numeric priority — `P0`
     before `P1` before `P2` before `P3` — tie-broken by bead ID asc).
  {{ end -}}
  {{ if ne .Args.WorkOnFeatures "false" -}}
  {{ if ne .Args.FixBugs "false" }}3{{ else }}2{{ end }}. Else 2C non-empty AND Step 1 "Loop implementing feature" preflight
     succeeded → §C on the **highest-priority feature** (2C's first row: same
     `P0 → P3` rule as §B, tie-broken by bead ID asc).
  {{ end -}}
  {{ if ne .Args.FixBugs "false" }}{{ if ne .Args.WorkOnFeatures "false" }}4{{ else }}3{{ end }}{{ else }}{{ if ne .Args.WorkOnFeatures "false" }}3{{ else }}2{{ end }}{{ end }}. Otherwise → Step 6 with reason "nothing eligible" (include `scope: bugs={{ if ne .Args.FixBugs "false" }}on{{ else }}off{{ end }}
     features={{ if ne .Args.WorkOnFeatures "false" }}on{{ else }}off{{ end }}` so the operator can see whether the empty result is real or
     just a disabled-scope pass).

  One class per pass only — the `onTasks` fire that lands after the chosen worker's
  `bd` mutations will re-enter this prompt with a fresh view of all three sets.

  ---

  ## §A — Address ONE `@mitto` mention

  Take the first tuple from 2A — call it **`(<id>, <ts>, <body>)`**. If any existing
  child in `{{ .Children.MCPText }}` carries the literal trailing `{<id>}` suffix
  (the rendered `beads_issue` — e.g. `... {mitto-59b}`) AND its `(name)` mentions
  `[<ts>]`, this mention was already dispatched — drop it and re-run Step 3. Otherwise
  spawn ONE per-mention router driver whose seed AND `onCompletion` re-fire are both
  the named mention driver (which itself dispatches phase-tiered prompts —
  Reasoning for investigate/plan/answer, Coding for implement — one per turn):

  ```
  mitto_conversation_new(
    self_id: "{{ .Session.ID }}",
    title: "Address @mitto on <id> [<ts>]",
    beads_issue: "<id>",
    prompt_name: "Mention — driver",
    arguments: { "IssueID": "<id>", "MentionTS": "<ts>", "MentionBody": "<body>", "Commit": "{{ if eq .Args.Commit "false" }}false{{ else }}true{{ end }}" },
    loop_prompt_name: "Mention — driver",
    loop_arguments: { "IssueID": "<id>", "MentionTS": "<ts>", "MentionBody": "<body>", "Commit": "{{ if eq .Args.Commit "false" }}false{{ else }}true{{ end }}" },
    loop_trigger: "onCompletion",
    loop_completion_delay_seconds: 30,
    loop_max_iterations: 8,
    loop_max_duration_seconds: 3600
  )
  ```

  `beads_issue` links the driver (`.Session.BeadsIssue` resolves; UI puts it on
  the right row). `title` includes `[<ts>]` as the dedup key — cross-check
  prevents double-spawn before the driver posts its back-reference.
  `prompt_name` (not `initial_prompt`) closes mitto-dj9: the server expands the
  named prompt on every seed and every re-fire. Budget mirrors the driver's own
  `loop:` frontmatter (`delay: 30`, `maxIterations: 8`, `maxDuration: "1h"`).

  Record the returned `conversation_id` as **`<child-id>`**. On create failure, jump
  to Step 7 for `(<id>, <ts>)`.

  ### §A wait, verify, archive

  ```
  mitto_children_tasks_wait(
    self_id: "{{ .Session.ID }}",
    children_list: ["<child-id>"],
    timeout_seconds: 1800
  )
  ```

  - **Driver done** — re-read `bd comments <id> --json`. If `[addressed-comment: <ts>]`
    is present, archive the driver (the mention driver has already logged its own
    per-phase `Investigation:` / `Plan:` / `Implementation:` / `Answer:` comments
    tagged with their tier). If missing (driver crashed / forgot), write a fallback
    back-reference yourself so the mention is not re-dispatched forever, then
    archive:

    ```bash
    bd comment <id> "[addressed-comment: <ts>]
    Orchestrator fallback: mention driver <child-id> did not post a back-reference. Marking processed to prevent re-dispatch; re-open by adding a fresh @mitto comment if not actually carried out."
    ```
    ```
    mitto_conversation_archive(self_id: "{{ .Session.ID }}", conversation_id: "<child-id>")
    ```

  - **Timeout** — log on the bead, do NOT kill/archive (driver may still be walking
    its phases): `bd comment <id> "Orchestrator: 30-minute wait for @mitto driver (mention at <ts>) timed out; leaving driver running."`
  - **Wait errored** (flag missing at runtime) → notify and STOP; do not archive.

  Then Step 6.

