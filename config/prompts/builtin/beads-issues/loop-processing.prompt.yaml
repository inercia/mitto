  `maxIterations: 20`, `maxDuration: "4h"`. Record `conversation_id` as
  **`<child-id>`**. On create failure → Step 7.
  {{- if ne $maxWorkers "1" }}

  If **Step 3D** cleared additional candidates, repeat this exact spawn block once
  per cleared candidate (each with its own `<id>` / `<child-id>`), stopping when the
  live worker count reaches {{ $maxWorkers }}. Call the resulting set **`<ids>`** /
  **`<child-ids>`**.
  {{- end }}

  ### §B wait, log, archive

  Wait on the **bead's terminal state** (`closed`), not on the child agent's
  yield. This is strictly more correct — "child agent stopped talking" ≠ "bead
  closed" (the child may yield mid-turn, hit its context budget, crash, or be
  archived without a terminal `bd` action) — and dramatically reduces
  orchestrator activations (~1 per real terminal event instead of ~1 per
  child turn). 4h timeout mirrors the per-bug driver's `maxDuration: "4h"`.

  ```
  mitto_conversation_wait(
    self_id: "{{ .Session.ID }}",
    conversation_id: "self",
    what: "beads_issues_reached_state",
    beads_issues: [{{ if ne $maxWorkers "1" }}"<ids…>"{{ else }}"<id>"{{ end }}],
    beads_target_state: "closed",
    beads_match: "{{ if ne $maxWorkers "1" }}any{{ else }}all{{ end }}",
    timeout_seconds: 14400
  )
  ```
  {{- if ne $maxWorkers "1" }}

  With several workers in flight, list every dispatched `<id>` and use
  `beads_match: "any"` — the pass ends as soon as the FIRST bead closes; the others
  keep running and are picked up by the next `onTasks` fire (Step 2P reaps their
  children once their beads reach terminal state). Apply the branches below to the
  bead(s) the wait reports as reached, and leave the still-running ones untouched.
  {{- end }}

  - **Bead closed** (happy path) — write one bookkeeping comment then archive
    the child (the driver has already logged its own `Investigation:` /
    `Reproduction:` / `Fix:` comments):

    ```bash
    title=$(bd show <id> --json | jq -r '.[0].title')
    bd comment <id> "Orchestrator: bead reached terminal state (closed); archiving worker conversation <child-id>."
    ```
    ```
    mitto_conversation_archive(self_id: "{{ .Session.ID }}", conversation_id: "<child-id>")
    ```

    Then surface the terminal close to the operator (workspace-scoped toast;
    clicking opens the closed bead — mitto-9yz):

    ```
    mitto_workspace_ui_notify(
      self_id: "{{ .Session.ID }}",
      workspace_uuid: "{{ .Workspace.UUID }}",
      title: "Task completed",
      message: "Closed <id>: <title>",
      style: "success",
      beads_issue: "<id>"
    )
    ```

  - **Timeout** (4h wall-clock cap) — log and move on, do NOT kill/archive
    (the child's own `maxDuration` is the authoritative upper bound):
    `bd comment <id> "Orchestrator: 4h bead-state wait timed out; leaving child running."`
  - **Wait errored** → notify and STOP.

  Then {{ if .Args.PostIterationPrompt }}Step 5H{{ else }}Step 6{{ end }}.

  ---
  {{- end }}

  {{ if ne .Args.WorkOnFeatures "false" -}}
  ## §C — Implement ONE feature

  Take the first entry from 2C as **`<id>`**. **Concurrency gate (workspace-scoped):**
  same rule as §B — read the pre-rendered `Workspace peers:` block at the top
  (backed by `.Workspace.Peers.All`, scoped to non-archived siblings sharing
  this session's `(WorkingDir, ACPServer)`) and count a peer ONLY when its `(name)`
  starts with `Fix `{{ if .Args.PostIterationPrompt }}, `Implement ` or `Post-task: `{{ else }} or `Implement `{{ end }}
  **AND** it also carries a `{<bd-id>}` beads_issue suffix in that same rendered
  line (genuine workers are always spawned with `beads_issue` set; an idle
  human/non-child conversation sharing the title prefix has no `beads_issue`
  and must not be counted, mitto-e1x). {{ if .Args.PostIterationPrompt }}§B, §C and the Step 5H hook share
  the {{ $maxWorkers }}-worker budget{{ else }}§B and §C share the {{ $maxWorkers }}-driver budget{{ end }}
  workspace-wide, not per-orchestrator; mitto-9mk.
  At cap → `bd comment <id> "Orchestrator: concurrency cap ({{ $maxWorkers }} active worker{{ if ne $maxWorkers "1" }}s{{ end }} in workspace) reached; feature queued for a later pass."`
  and jump to Step 6. Otherwise spawn ONE child (seed AND `onCompletion` re-fire both the
  named per-feature driver):

  ```
  mitto_conversation_new(
    self_id: "{{ .Session.ID }}",
    title: "Implement <id>: <slug>",
    beads_issue: "<id>",
    prompt_name: "Loop implementing feature",
    arguments: { "IssueID": "<id>", "SubmitStrategy": "{{ $submit }}", "FromBranch": {{ $fromBranch | printf "%q" }}, "GroupEpics": "{{ $groupEpics }}"{{ with .Args.AdditionalInstructions }}, "AdditionalInstructions": {{ . | printf "%q" }}{{ end }} },
    loop_prompt_name: "Loop implementing feature",
    loop_arguments: { "IssueID": "<id>", "SubmitStrategy": "{{ $submit }}", "FromBranch": {{ $fromBranch | printf "%q" }}, "GroupEpics": "{{ $groupEpics }}"{{ with .Args.AdditionalInstructions }}, "AdditionalInstructions": {{ . | printf "%q" }}{{ end }} },
    loop_trigger: "onCompletion",
    loop_completion_delay_seconds: 30,
    loop_max_iterations: 30,
    loop_max_duration_seconds: 28800
  )
  ```

  Budget mirrors the per-feature driver's `delay: 30`, `maxIterations: 30`,
  `maxDuration: "8h"` (28800s). On create failure → Step 7.

  `<id>` may be a top-level feature OR a non-bug epic child (`feature`/`task`/
  `story`/`chore`); the driver's state machine is type-agnostic. For epic
  members use `Implement <id> (child of <epic-id>): <slug>` so the epic context
  is visible in the conversation list.
  {{- if ne $maxWorkers "1" }}

  If **Step 3D** cleared additional candidates, repeat this spawn block once per
  cleared candidate, stopping when the live worker count reaches {{ $maxWorkers }}.
  Note that Step 3D's criterion 4 rejects two children of the same epic, so epic
  siblings are never fanned out together.
  {{- end }}

  ### §C wait, log, archive

  Same rule as §B — wait on the **feature bead's terminal state** (`closed`),
  not on the child agent's yield. Same rationale (correctness + activation
  reduction) and same 4h timeout mirroring the per-feature driver's
  `maxDuration: "8h"` (the wait cap is intentionally shorter than the driver's
  own cap so the orchestrator recovers even if the driver is still going).

  ```
  mitto_conversation_wait(
    self_id: "{{ .Session.ID }}",
    conversation_id: "self",
    what: "beads_issues_reached_state",
    beads_issues: [{{ if ne $maxWorkers "1" }}"<ids…>"{{ else }}"<id>"{{ end }}],
    beads_target_state: "closed",
    beads_match: "{{ if ne $maxWorkers "1" }}any{{ else }}all{{ end }}",
    timeout_seconds: 14400
  )
  ```
  {{- if ne $maxWorkers "1" }}

  Same multi-worker rule as §B: list every dispatched `<id>`, `beads_match: "any"`,
  and apply the branches below only to the bead(s) reported as reached.
  {{- end }}

  - **Bead closed** (happy path) — write one bookkeeping comment then archive
    the child (the driver has already logged its own per-phase `Plan:` /
    `Implementation:` / `Testing:` / `Review:` comments):

    ```bash
    title=$(bd show <id> --json | jq -r '.[0].title')
    bd comment <id> "Orchestrator: bead reached terminal state (closed); archiving worker conversation <child-id>."
    ```
    ```
    mitto_conversation_archive(self_id: "{{ .Session.ID }}", conversation_id: "<child-id>")
    ```

    Then surface the terminal close to the operator (workspace-scoped toast;
    clicking opens the closed bead — mitto-9yz):

    ```
    mitto_workspace_ui_notify(
      self_id: "{{ .Session.ID }}",
      workspace_uuid: "{{ .Workspace.UUID }}",
      title: "Task completed",
      message: "Closed <id>: <title>",
      style: "success",
      beads_issue: "<id>"
    )
    ```

  - **Timeout** (4h wall-clock cap) — log and move on, do NOT kill/archive.
    Epic containers that legitimately stay open after the child finishes will
    also land here (the child closed the leaf, not the epic; Step 2P will
    reap the child on the next pass):
    `bd comment <id> "Orchestrator: 4h bead-state wait timed out; leaving child running."`
  - **Wait errored** → notify and STOP.

  Then {{ if .Args.PostIterationPrompt }}Step 5H{{ else }}Step 6{{ end }}.

