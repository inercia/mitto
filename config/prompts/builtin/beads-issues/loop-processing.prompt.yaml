  {{ if ne .Args.FixBugs "false" -}}
  ## §B — Fix ONE bug

  Take the first entry from 2B as **`<id>`**. **Concurrency gate (workspace-scoped):**
  enumerate ALL active drivers in this workspace — not just this orchestrator's own
  children — by calling:

  ```
  mitto_conversation_list(
    self_id: "{{ .Session.ID }}",
    workspace: "{{ .Workspace.UUID }}",
    is_running: true,
    archived: false,
    exclude_self: "{{ .Session.ID }}"
  )
  ```

  Count returned entries whose `title` starts with `Fix ` or `Implement ` (any
  non-terminal status: running / iterating / queued). This counts drivers spawned
  by any orchestrator in the workspace, so parallel `Loop processing tasks`
  sessions share the single slot instead of each spawning their own (mitto-9mk).
  If the workspace-wide count is already ≥ **1**, skip the spawn this pass — write
  `bd comment <id> "Orchestrator: concurrency cap (1 active driver in workspace) reached; bug queued for a later pass."`
  and jump to Step 6. Otherwise spawn ONE child whose seed AND `onCompletion` re-fire
  are both the named per-bug driver:

  ```
  mitto_conversation_new(
    self_id: "{{ .Session.ID }}",
    title: "Fix <id>",
    beads_issue: "<id>",
    prompt_name: "Loop fixing bug",
    arguments: { "IssueID": "<id>", "Commit": "{{ if eq .Args.Commit "false" }}false{{ else }}true{{ end }}" },
    loop_prompt_name: "Loop fixing bug",
    loop_arguments: { "IssueID": "<id>", "Commit": "{{ if eq .Args.Commit "false" }}false{{ else }}true{{ end }}" },
    loop_trigger: "onCompletion",
    loop_completion_delay_seconds: 30,
    loop_max_iterations: 20,
    loop_max_duration_seconds: 14400
  )
  ```

  `prompt_name` (not `initial_prompt`) closes mitto-dj9 (server expands on every
  seed and re-fire). Budget mirrors the per-bug driver's `delay: 30`,
  `maxIterations: 20`, `maxDuration: "4h"`. Record `conversation_id` as
  **`<child-id>`**. On create failure → Step 7.

  ### §B wait, log, archive

  Wait on the **bead's terminal state** (`closed`), not on the child agent's
  yield. This is strictly more correct — "child agent stopped talking" ≠ "bead
  closed" (the child may yield mid-turn, hit its context budget, crash, or be
  archived without a terminal `bd` action) — and dramatically reduces
  orchestrator activations (~1 per real terminal event instead of ~1 per
  child turn). 4h timeout mirrors the per-bug driver's `maxDuration: "4h"`.

  ```
  mitto_conversation_wait(
    self_id: "{{ .Session.ID }}",
    conversation_id: "self",
    what: "beads_issues_reached_state",
    beads_issues: ["<id>"],
    beads_target_state: "closed",
    beads_match: "all",
    timeout_seconds: 14400
  )
  ```

  - **Bead closed** (happy path) — write one bookkeeping comment then archive
    the child (the driver has already logged its own `Investigation:` /
    `Reproduction:` / `Fix:` comments):

    ```bash
    bd comment <id> "Orchestrator: bead reached terminal state (closed); archiving worker conversation <child-id>."
    ```
    ```
    mitto_conversation_archive(self_id: "{{ .Session.ID }}", conversation_id: "<child-id>")
    ```

  - **Timeout** (4h wall-clock cap) — log and move on, do NOT kill/archive
    (the child's own `maxDuration` is the authoritative upper bound):
    `bd comment <id> "Orchestrator: 4h bead-state wait timed out; leaving child running."`
  - **Wait errored** → notify and STOP.

  Then Step 6.

