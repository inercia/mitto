icon: loop
name: Loop processing tasks
menus: beadsList, promptsLoop
parameters:
  - name: SubmitStrategy
    type: text
    group: Changes
    description: 'How finished work is submitted. "Commit" (default) — workers commit their changes. "Pull Request" — workers branch from FromBranch and open PRs according to GroupEpics. "None" — changes remain uncommitted for human review.'
    options: ["Commit", "Pull Request", "None"]
    default: "Commit"
  - name: FromBranch
    type: text
    group: Changes
    default: "main"
    description: Base branch for new Pull Request branches. Each new top-level task starts from a fresh branch based on this ref; grouped epic children share the epic branch created from it.
  - name: GroupEpics
    type: boolean
    group: Changes
    default: "true"
    description: When true (default), children of one epic share a branch and produce one PR for the epic after its last child finishes. When false, every child task gets its own branch and PR.
  - name: FixBugs
    type: boolean
    default: "true"
    description: When true (default), the loop processes open bugs via §B. Set to false to disable bug handling entirely — Step 2B is skipped and §B is never dispatched. Useful when the operator only wants the loop to work on features (or on @mitto mentions).
  - name: WorkOnFeatures
    type: boolean
    default: "true"
    description: When true (default), the loop processes open features via §C. Set to false to disable feature handling entirely — Step 2C is skipped and §C is never dispatched. Useful when the operator only wants the loop to work on bugs (or on @mitto mentions).
  - name: MaxParallelWorkers
    type: text
    group: Advanced
    options: ["1", "2", "3"]
    default: "1"
    description: 'Upper bound on concurrent §B/§C worker conversations in the workspace. "1" (default) is strictly serial. Raising it only raises the CEILING — a second worker is dispatched only when Step 3D can prove from recorded evidence that the candidates touch disjoint code; absence of evidence keeps the pass at one worker. Forced back to "1" when SubmitStrategy is "Pull Request" because branch switching races in the shared working tree.'
  - name: PostIterationPrompt
    type: prompts
    group: Advanced
    required: false
    description: Optional prompt to run after a task completes and before the next one is picked (e.g. "Run tests"). Dispatched as its own short-lived child conversation from Step 5H; best-effort — a failing hook never blocks the next task. Leave empty to disable.
  - name: AdditionalInstructions
    type: text
    group: Advanced
    required: false
    multiLine: true
    description: 'Optional additional instructions applied on top of the steps below, and propagated verbatim to every §A/§B/§C driver (and from there to their phase prompts) so the whole chain follows them (e.g. "only work on beads labelled `frontend`", "always run `make lint` before committing", "never touch files under vendor/"). Used for this run only; nothing is persisted.'
description: "Unified standing supervisor — on every beads change and every 60 minutes as a recovery fallback, process at most one increment from whichever class has work — (A) unaddressed @mitto comments, (B) eligible open bugs, (C) eligible open features. Comments first, then bugs, then features. One worker in flight at a time, unless MaxParallelWorkers is raised and the candidates are provably code-disjoint."
backgroundColor: '#E1BEE7'
group: Tasks
enabledWhen: '!Session.IsChild && CommandExists("bd") && DirExists(".beads") && Permissions.CanStartConversation'
loop:
  # Standing supervisor: never stops on its own (maxIterations/maxDuration = 0);
  # runOnStart fires once at boot so it picks up work without waiting for a task
  # change; freshContext keeps token spend bounded and prevents stale reasoning;
  # coalesceDuringBusy: false ensures §A/§B/§C children's own .beads/ mutations
  # re-fire the supervisor (mitto-cwg) instead of being silently rebased;
  # onChild immediately re-evaluates the queue when a spawned worker finishes or
  # is deleted; schedule supplies an hourly recovery pass if an event trigger is
  # missed or coalesced before the supervisor can process it.
  # cooldown (600s) is shared by onTasks AND onChild: a burst of child
  # completions/bead mutations collapses into one pass at most every 10 minutes
  # instead of re-sending this large prompt on every event (credit burn).
  trigger: [onTasks, onChild, schedule]
  schedule:
    value: 60
    unit: minutes
  onTasks:
    coalesceDuringBusy: false
    settleWindow: 30
    cooldown: 600
  onChild:
    when: [anyEndResponse, anyDeleted]
  maxIterations: 0
  maxDuration: 0
  runOnStart: true
  freshContext: true
target:
  title: 'Loop processing tasks'
  reuse:
    title: true
    coalesce: true
  # Standing supervisor with maxIterations/maxDuration = 0 (see loop: above) —
  # archiving this conversation silently stops all task processing for the
  # workspace, with no signal to the operator. Protect it (mitto-yvel.5).
  noArchive: true
# Pure procedural orchestration (enumerate → decide → dispatch → yield); real
# reasoning is delegated to §A/§B/§C driver children, each of which pins its own
# (Coding) tier. Cheap tier (Haiku) keeps the long-lived supervisor inexpensive
# and prevents inheriting the seeding conversation's model.
preferredModels:
  - modelTag: Cheap
prompt: |
  {{ template "_shared/session-context" . }}
  Available ACP servers: `{{ Default "(none)" .ACP.AvailableText }}`
  Existing children: `{{ Default "(none)" .Children.MCPText }}`
  Workspace peers: `{{ Default "(none)" .Workspace.Peers.AllText }}`
  Active peer drivers: {{ .Workspace.Peers.PromptingCount }} / {{ .Workspace.Peers.Count }}

  {{- with .Trigger }}{{ if .IsRunOnStart }}

  ## Bootstrap pass

  Mitto just started — this is the first loop pass since boot. Orphaned children that ran (or were reaped) while Mitto was down may still hold `[<ts>]` deduplication markers on their linked beads without a matching alive conversation. Give Step 2Q (deduplication cross-check) and Step 2P (terminal-label reap) extra attention on this pass; do not skip them even if `.beads/` looks quiet.

  {{ end }}{{ end }}

  {{- with .Trigger }}{{ with .OnTasks }}

  ## Triggered by these beads changes

  This pass was fired by the changes below (deltas since the previous baseline). Use these as **hints
  for triage priority** — a bead in this list is more likely to have new `@mitto` comments (§A), a
  fresh reproduction (§B), or a design update (§C) than a random bead — but do NOT skip the normal
  Step-2 filtering: a change here does not by itself make a bead eligible for a §A/§B/§C worker.

  {{- if .Changes.Touched }}
  {{ range .Changes.Touched -}}
  - `{{ .id }}` ({{ .status }}, P{{ .priority }}): {{ .title }}
  {{ end -}}
  {{- else }}
  _(no touched beads reported — likely a rebase-driven re-fire; proceed with the normal scan)_
  {{- end }}
  {{ end }}{{ end }}

  {{- with .Trigger }}{{ with .OnChild }}

  ## Triggered by child conversation

  This pass was fired by child conversation `{{ .ChildID }}` (event: `{{ .Event }}`){{ if .StoppedReason }}, with stopped reason `{{ .StoppedReason }}`{{ end }}.

  Before running the broader Step 2 sweep, do a small focused reconciliation of THIS child in Step 2P:

  - Look up its `beads_issue` (via `mitto_conversation_get` on the child ID above), and check whether that bead has reached a terminal-label state now that the child has finished.
  - If yes, close it via the normal Step 2P terminal-label handling.
  - Only after this focused reconciliation, run the full Step 2 sweep as usual.

  {{ if eq .Event "anyLoopStopped" }}The child driver's own loop has stopped — its linked bead is a **high-priority reap candidate** for Step 2P even if the terminal-label heuristics are ambiguous.
  {{ end }}
  {{ end }}{{ end }}

  {{- with .Trigger }}{{ if and (and (eq .Kind "schedule") (not .OnTasks)) (and (not .OnChild) (not .IsRunOnStart)) }}

  ## Scheduled recovery pass

  Neither an `onTasks` beads change nor an `onChild` lifecycle event fired this pass — this is the hourly `schedule` recovery run. External triggers may have been coalesced during a busy window; run the full Step 2 sweep even if nothing looks urgent. This pass exists precisely to catch what the event-driven triggers missed.

  {{ end }}{{ end }}

  {{- $submit := Default "Commit" .Args.SubmitStrategy }}
  {{- $fromBranch := Default "main" .Args.FromBranch }}
  {{- $groupEpics := ne .Args.GroupEpics "false" }}
  {{- /* Pull Request work is serial because all branches share one working tree. */ -}}
  {{- $maxWorkers := Default "1" .Args.MaxParallelWorkers }}
  {{- if eq $submit "Pull Request" }}{{ $maxWorkers = "1" }}{{ end }}

  {{ template "beads-issues/shared/additional-instructions" . }}
  # Beads: Loop Processing Beads (unified list-level orchestrator)

  Beads is a CLI issue tracker (`bd`); IDs look like `bd-xyz`. This is a list-level
  `onTasks` supervisor (`menus: beadsList`, no `Item.*`) that wakes on any `.beads/`
  change, processes **one increment** from one class, then yields. Three classes, strict
  priority **A → B → C**:

  - **§A — Address `@mitto` comments.** One per-mention driver child that walks a
    small phase state machine (investigate → plan → implement, or answer, on the
    appropriate model tier), writes `[addressed-comment: <ts>]` back-reference, and
    self-terminates.
  - **§B — Fix eligible open bugs.** Spawn `Loop fixing bug` as an `onCompletion` child
    (one `researched → reproduced → fixed` step per re-fire).
  - **§C — Implement eligible open features.** Spawn `Loop implementing feature` as an
    `onCompletion` child (one `planned → implemented → tested → verified` step per re-fire).

  Comments first (small, human-driven); bugs before features (defects block). Multiple
  pending increments are safe: each worker's `bd` mutation triggers a fresh `onTasks` pass.

  **Epics are containers, not work items.** An `epic` bead is never dispatched to a driver
  on its own; instead, Step 2 **expands every open epic into its open children** and merges
  those children into the eligible sets by their own `issue_type`: `bug` children flow into
  §B, and every other non-epic child type (`feature`, `task`, `story`, `chore`, etc.) flows
  into §C via the `Loop implementing feature` driver. The epic itself stays open until all
  its children reach a terminal state — Step 2P's "Close terminal-label beads" sweep closes
  the individual children as their drivers finish, and Step 2P's "Reap epics" sub-step
  automatically closes the epic once its last child is closed. Reconciliation stays bounded
  to this pass's closures, linked beads from children reaped this pass, and the current
  `onTasks` delta — it never sweeps unrelated open epics.

  {{ if eq $submit "Pull Request" -}}
  ### Changes policy

  Before doing any task work, its driver must switch to a deterministic working branch
  created from `{{ $fromBranch }}` — never branch from the current HEAD or a previous
  task's branch. {{ if $groupEpics }}For an epic child, use the epic's shared branch; reuse it for later siblings and open
  **one epic PR** only when the last open child finishes. Top-level tasks still get one
  branch and PR each.{{ else }}Epic grouping is disabled: every task, including each epic child, gets a fresh branch
  and its own PR.{{ end }}
  {{- end }}

  ### Concurrency, recovery, deferral, preflight (summary — enforced in Steps 2P/2Q/2R/2Z/§B/§C/7)

  - **Cap: {{ $maxWorkers }} active worker{{ if ne $maxWorkers "1" }}s{{ end }} per workspace** total across §B + §C{{ if .Args.PostIterationPrompt }} + the Step 5H
    post-task hook{{ end }} (non-archived conversations whose title starts with `Fix ` /
    `Implement `{{ if .Args.PostIterationPrompt }} / `Post-task: `{{ end }} AND which
    also carries a `{<bd-id>}` beads_issue suffix in the rendered `Workspace peers:`
    block — a bare title-prefix match on an idle human/non-child conversation does
    NOT count, mitto-e1x). The
    cap is workspace-scoped (enumerated via `.Workspace.Peers.All` — non-archived
    sibling conversations sharing this session's `(WorkingDir, ACPServer)`,
    populated at template-dispatch time), not per-orchestrator — parallel
    `Loop processing tasks` sessions in the same workspace share the {{ if eq $maxWorkers "1" }}single
    slot{{ else }}same {{ $maxWorkers }} slots{{ end }} (mitto-9mk). §A mention drivers self-terminate and are NOT counted.
    {{ if eq $maxWorkers "1" }}Serial execution prevents overlapping-file races{{ if .Args.PostIterationPrompt }} — including between a
    driver editing the tree and a post-task hook (e.g. `Run tests`) reading it{{ end }}.{{ else }}The cap is a **ceiling, not a target** — Step 3D still has to prove code
    disjointness before a second worker starts, so most passes stay at one{{ if .Args.PostIterationPrompt }}, and the
    Step 5H post-task hook always runs alone (it may read/mutate the whole tree){{ end }}.{{ end }} Step 2P prunes
    stale children every pass to free {{ if eq $maxWorkers "1" }}the slot{{ else }}slots{{ end }}.
  - **Deferral:** any un-progressable bead gets `--add-label needs-human --defer +1d`
    plus a comment starting `[deferred: <RFC3339>]` (full template in Step 7).
    Step 2Z undefers when the human replies, posting `[undeferred: <deferred-ts>]`.
  - **Legacy status recovery:** Step 2Q returns an ownerless non-epic bead from
    legacy `in_progress` to `open` only after 24h without issue/comment activity.
    Fresh human work, passive `in-flight` claims, and formal conversation owners
    are preserved. Recovery never means completion; §B/§C still verify and close.
  - **Preflight:** requires **Can start conversation** and **Can Send Prompt** flags
    plus a non-child session. Any tool error from a disabled flag, or
    `Session.IsChild` true → single `mitto_ui_notify` stating the intended dispatch goal, **but**
    naming the unavailable capability and why it prevents dispatch, then STOP
    (no `bd` writes, no spawns).

  ## Step 1 — Validate the nested driver prompts

  §B/§C spawn children by name; each enabled driver must be registered in the
  workspace prompt view. Checked in-template via `.Prompts.Enabled` (mitto-s1w
  — same source of truth as `mitto_prompt_get` / `mitto_prompt_list`, no MCP
  round-trip). On failure, disable that class for this pass only.

  **The verdicts below are AUTHORITATIVE and already final.** They were computed
  by Mitto against the live workspace prompt registry at dispatch time. Do NOT
  re-verify them with `mitto_prompt_get`, `mitto_prompt_list`, `grep`, or any
  shell command — a prompt whose YAML has no `enabled:` key IS enabled (the
  registry prunes disabled prompts before the snapshot is built, so absence of
  the key means enabled, never disabled). Overriding a `PASSED` verdict with a
  hand-rolled check is a bug, not diligence.

  {{- $fixBugsEnabled := ne .Args.FixBugs "false" }}
  {{- $workOnFeaturesEnabled := ne .Args.WorkOnFeatures "false" }}
  {{- $bugDriverPresent := .Prompts.Enabled "Loop fixing bug" }}
  {{- $featureDriverPresent := .Prompts.Enabled "Loop implementing feature" }}
  {{ if $fixBugsEnabled }}
  {{- if $bugDriverPresent }}
  - §B driver check: **PASSED** — `Loop fixing bug` is registered and enabled. §B may spawn.
  {{- else }}
  - §B disabled this pass: `Loop fixing bug` is not enabled in the workspace prompt registry.
  {{- end }}
  {{- else }}
  - §B not applicable this pass (`FixBugs=false`).
  {{- end }}
  {{ if $workOnFeaturesEnabled }}
  {{- if $featureDriverPresent }}
  - §C driver check: **PASSED** — `Loop implementing feature` is registered and enabled. §C may spawn.
  {{- else }}
  - §C disabled this pass: `Loop implementing feature` is not enabled in the workspace prompt registry.
  {{- end }}
  {{- else }}
  - §C not applicable this pass (`WorkOnFeatures=false`).
  {{- end }}

  ## Step 2P — Prune stale children (reap before you spawn)

  Run FIRST every pass, before Step 2Z.

  ### Reject terminal labels carried through a reopen

  Mandatory before walking children (else the reaper deletes a recurrence's
  worker over a stale terminal label). Build `current_terminal_labels` from each
  `id` + `terminal_label` (`fixed` for bugs, `verified` for other non-epics).
  History is newest-first status snapshots (`CommitDate` + `Issue`, no labels).
  The probe finds the
  most recent transition into the current non-closed episode
  and the
  most recent terminal phase comment
  (`Fix [tier:` for bugs, `Review [tier:`
  otherwise). `datetime.fromisoformat` compares parsed instants, never strings.
  A never-reopened bead is current; a reopened one is current only if its comment is
  strictly newer than the current episode
  open transition. Missing or malformed
  evidence is stale (fail safe):

  ```bash
  declare -A current_terminal_labels=()
  while IFS=$'\t' read -r id terminal_label; do
    [ -n "$id" ] || continue
    history=$(bd history "$id" --json 2>/dev/null || printf '[]')
    current=$(bd show "$id" --json --include-comments 2>/dev/null || printf '[]')
    payload=$(printf '%s\n%s\n' "$history" "$current" \
      | jq -s '{history:.[0],current:.[1]}' 2>/dev/null \
      || printf '{"history":[],"current":[]}')
    verdict=$(printf '%s' "$payload" | python3 -c '
  import json, sys
  from datetime import datetime

  label = sys.argv[1]
  prefixes = {"fixed": "Fix [tier:", "verified": "Review [tier:"}
  try:
      payload = json.load(sys.stdin)
      entries = payload.get("history")
      current = payload.get("current")
      if not isinstance(entries, list) or not entries or not isinstance(current, list) or not current:
          raise ValueError("missing evidence")
      issue = lambda e: e.get("Issue") or {}
      status = lambda e: issue(e).get("status")
      when = lambda e: e.get("CommitDate")
      live = current[0]
      if live.get("status") not in ("open", "in_progress") or label not in (live.get("labels") or []):
          raise ValueError("candidate no longer terminal")
      reopened_at = next((when(entries[i]) for i in range(len(entries) - 1)
          if status(entries[i]) in ("open", "in_progress") and status(entries[i + 1]) == "closed"), None)
      if reopened_at is None:
          print("current")
          raise SystemExit
      prefix = prefixes[label]
      terminal_at = max((comment.get("created_at") for comment in (live.get("comments") or [])
          if (comment.get("text") or "").startswith(prefix) and comment.get("created_at")), default=None)
      parse = lambda value: datetime.fromisoformat(value.replace("Z", "+00:00"))
      print("current" if terminal_at and parse(terminal_at) > parse(reopened_at) else "stale")
  except (AttributeError, KeyError, TypeError, ValueError, json.JSONDecodeError):
      print("stale")
  ' "$terminal_label" 2>/dev/null || printf 'stale')
    if [ "$verdict" = "current" ]; then
      current_terminal_labels["$id"]="$terminal_label"
      continue
    fi
    bd comment "$id" "Orchestrator: terminal label=$terminal_label is not newer than the current open episode; removing the stale label so the recurrence remains actionable."
    bd update "$id" --remove-label "$terminal_label"
  done < <(
    {{ if ne .Args.FixBugs "false" -}}
    bd list --type bug --status open,in_progress --label fixed --json | jq -r '.[] | "\(.id)\tfixed"'
    {{ end -}}
    {{ if ne .Args.WorkOnFeatures "false" -}}
    bd list --status open,in_progress --label verified --json \
      | jq -r '.[] | select(.issue_type != "bug" and .issue_type != "epic") | "\(.id)\tverified"'
    {{ end -}}
  )
  ```

  A stale result removes only the class-terminal label so preserved phase labels route the recurrence to the next required driver phase
  and leave the bead actionable. Only IDs in `current_terminal_labels` may be reaped as terminal or
  closed below.

  After this normalization, walk `{{ .Children.MCPText }}` and delete
  (via `mitto_conversation_delete`, NOT archive — delete frees the ACP slot fully)
  any child matching the FIRST applicable category. Do NOT reap §A mention drivers
  (they self-terminate; §A owns their wait/archive path){{ if .Args.PostIterationPrompt }}. `Post-task: …` hook
  children are owned by Step 5H's wait/delete path and are NOT reaped here — with
  one exception: a hook child older than **2h** is stale (its owning Step 5H pass
  died mid-wait) and MUST be reaped, otherwise it holds the workspace worker slot
  forever and every subsequent pass yields at-cap{{ end }}.

  1. **Terminal** — child status `done`/`completed`/`stopped`/`failed`, OR its
     `beads_issue` is present in `current_terminal_labels` with the class-terminal label ({{ if ne .Args.FixBugs "false" }}`fixed` for `Fix …`{{ if ne .Args.WorkOnFeatures "false" }}, {{ end }}{{ end }}{{ if ne .Args.WorkOnFeatures "false" }}`verified` for
     `Implement …`{{ end }}). Also close the bead in the same pass (see below).
  2. **Orphaned** — `beads_issue` bead is closed OR carries `needs-human` (driver
     is deferred; §B/§C will re-spawn once Step 2Z undefers).
  3. **Idle 2h+** — status `iterating`/`queued` with no fresh `Investigation:` /
     `Reproduction:` / `Fix:` / `Plan:` / `Implementation:` / `Verification:`
     comment on `beads_issue` in 2h.
  4. **Duplicate** — two children share the same `beads_issue`; keep the older,
     reap the younger.

  Initialise `reaped_child_beads=()` before walking the children. For each reap,
  append the child's non-empty `beads_issue` to that array, write one bead comment,
  then delete. This preserves the owning bead after deletion so the epic-reaper can
  reconcile a parent whose leaf was already closed by its driver:

  ```bash
  reaped_child_beads=()
  # For each reaped child with a linked bead:
  reaped_child_beads+=("<bead-id>")
  bd comment <bead-id> "Orchestrator: reaping child <child-id> (reason: <terminal|orphaned|idle-2h|duplicate>). Bead will be re-picked if still eligible."
  ```
  ```
  mitto_conversation_delete(self_id: "{{ .Session.ID }}", conversation_id: "<child-id>")
  ```

  {{ if or (ne .Args.FixBugs "false") (ne .Args.WorkOnFeatures "false") -}}
  ### Close terminal-label beads

  After the reap loop, close any open OR legacy-`in_progress` bead still carrying
  the class-terminal label (regardless of driver), **only when it has no non-closed
  direct children**; a terminal parent with open children keeps its label and stays
  open for §B/§C. Fail closed on child-enumeration failure or malformed JSON. Track
  closed IDs in `closed_this_pass` (2B/2C skip their parent-child dependents this
  pass; the epic-reaper below walks their parents).

  Strip the `in-flight` label + `claimed_*` metadata before `bd close` (mitto-ial: ghost claims must not survive into archives).
  First promote `claimed_at` into `work_started_at` if that is absent
  (earliest-start semantics; mitto-v3en):

  ```bash
  closed_this_pass=()
  {{ if ne .Args.FixBugs "false" -}}
  for id in $(bd list --type bug --status open,in_progress --label fixed --json | jq -r '.[].id'); do
    [ "${current_terminal_labels[$id]:-}" = "fixed" ] || continue
    open_children=$(bd children "$id" --json 2>/dev/null \
      | jq '[.[] | select(.status != "closed")] | length' 2>/dev/null || printf '1')
    if [ "${open_children:-1}" -ne 0 ]; then
      echo "Orchestrator: keeping terminal parent $id open; non-closed children=$open_children"
      continue
    fi
    bd comment "$id" "Orchestrator: terminal label=fixed; closing."
    started=$(bd show "$id" --json | jq -r '.[0].metadata.claimed_at // empty')
    prior=$(bd show "$id" --json | jq -r '.[0].metadata.work_started_at // empty')
    if [ -n "$started" ] && [ -z "$prior" ]; then
      bd update "$id" --remove-label in-flight \
        --unset-metadata claimed_by --unset-metadata claimed_at \
        --unset-metadata claim_heartbeat_at \
        --set-metadata "work_started_at=$started"
    else
      bd update "$id" --remove-label in-flight \
        --unset-metadata claimed_by --unset-metadata claimed_at \
        --unset-metadata claim_heartbeat_at
    fi
    bd close "$id"
    closed_this_pass+=("$id")
  done
  {{ end }}
  {{- if ne .Args.WorkOnFeatures "false" }}
  for id in $(bd list --status open,in_progress --label verified --json \
    | jq -r '.[] | select(.issue_type != "bug" and .issue_type != "epic") | .id'); do
    [ "${current_terminal_labels[$id]:-}" = "verified" ] || continue
    open_children=$(bd children "$id" --json 2>/dev/null \
      | jq '[.[] | select(.status != "closed")] | length' 2>/dev/null || printf '1')
    if [ "${open_children:-1}" -ne 0 ]; then
      echo "Orchestrator: keeping terminal parent $id open; non-closed children=$open_children"
      continue
    fi
    bd comment "$id" "Orchestrator: terminal label=verified; closing."
    started=$(bd show "$id" --json | jq -r '.[0].metadata.claimed_at // empty')
    prior=$(bd show "$id" --json | jq -r '.[0].metadata.work_started_at // empty')
    if [ -n "$started" ] && [ -z "$prior" ]; then
      bd update "$id" --remove-label in-flight \
        --unset-metadata claimed_by --unset-metadata claimed_at \
        --unset-metadata claim_heartbeat_at \
        --set-metadata "work_started_at=$started"
    else
      bd update "$id" --remove-label in-flight \
        --unset-metadata claimed_by --unset-metadata claimed_at \
        --unset-metadata claim_heartbeat_at
    fi
    bd close "$id"
    closed_this_pass+=("$id")
  done
  {{- end }}
  ```

  Log one-line counts for Step 6: `Closed: <n>`.

  ### Reap epics whose children are all closed

  After the terminal-label close loop, derive candidate epics from `closed_this_pass`,
  `reaped_child_beads`, and the current `onTasks` delta's touched bead IDs (the latter
  two cover a leaf already closed by a driver/human). Bounded: never sweep all open
  epics. Reaping lives ONLY here (never in per-driver prompts) to avoid parent-close
  races between concurrent drivers.

  ```bash
  reaped_epics=()
  touched_child_beads=()
  {{- with .Trigger }}{{ with .OnTasks }}
  {{- range .Changes.Touched }}
  touched_child_beads+=({{ .id | printf "%q" }})
  {{- end }}
  {{- end }}{{ end }}

  # Touched epics + their parents (nested epics reconcile on successive events).
  declare -A touched_epics_set=()
  candidate_beads=("${closed_this_pass[@]}" "${reaped_child_beads[@]}" "${touched_child_beads[@]}")
  for cid in "${candidate_beads[@]}"; do
    candidate=$(bd show "$cid" --json 2>/dev/null)
    kind=$(jq -r '.[0].issue_type // empty' <<<"$candidate")
    pid=$(jq -r '.[0].parent // empty' <<<"$candidate")
    if [ "$kind" = "epic" ]; then
      touched_epics_set["$cid"]=1
    fi
    if [ -n "$pid" ]; then
      touched_epics_set["$pid"]=1
    fi
  done
  touched_epics=("${!touched_epics_set[@]}")

  # Hard cap: 20 reaped epics per pass; log-and-skip beyond.
  reap_cap=20
  reap_count=0
  overflow_epics=()
  for epic_id in "${touched_epics[@]}"; do
    if [ "$reap_count" -ge "$reap_cap" ]; then
      overflow_epics+=("$epic_id")
      continue
    fi
    # Idempotency: skip if already closed.
    meta=$(bd show "$epic_id" --json 2>/dev/null | jq -r '.[0] | "\(.issue_type)|\(.status)"')
    if [ "$meta" != "epic|open" ]; then
      continue
    fi
    # A child epic counts only when itself closed (reaps in dependency order).
    open_children=$(bd children "$epic_id" --json 2>/dev/null | jq '[.[] | select(.status != "closed")] | length')
    if [ "${open_children:-1}" -eq 0 ]; then
      bd comment "$epic_id" "Orchestrator: reaping epic $epic_id — all children closed after activity-local reconciliation."
      bd close "$epic_id" --reason "All children closed by L1 orchestrator pass"
      reaped_epics+=("$epic_id")
      reap_count=$((reap_count + 1))
    fi
  done
  if [ "${#overflow_epics[@]}" -gt 0 ]; then
    echo "Epic reaper cap ($reap_cap) reached; remaining touched epics: ${overflow_epics[*]}"
  fi
  ```

