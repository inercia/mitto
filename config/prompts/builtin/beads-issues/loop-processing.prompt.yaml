  Merge and de-duplicate by `id`, then apply exclusions.

  **Exclude** any bug that:

  - carries terminal label `fixed` (Step 2P closes it), OR
  - carries the `in-flight` label (an L2 driver holds a passive claim; Step 2R
    releases stale ones), OR
  - is `in_progress` elsewhere, OR carries `needs-human`, OR
  - **formally** matches a non-archived conversation's `beads_issue` in
    **either** this session's `{{ .Children.MCPText }}` **or** the `Workspace peers:`
    block at the top (literal `==`, see 2A's "Formal-match only" note), OR
  - **appears already fixed** (see below), OR
  - has a `parent-child` dependency whose parent was closed **by THIS pass's
    Step 2P** (pass-local set only; check `bd show <id> --json`).

  **Already-landed fix detection.** Scan for a commit that already resolves the
  bead (a human fixed it without the `(refs <id>)` footer):

  ```bash
  bd show <id> --json | jq -r '.[0].commits[]?.hash' | head -3
  git log --since=<bead.created_at> --oneline --format='%h %s' \
    | grep -iE '<2-4 distinctive keywords from bead title, joined by |>' | head -5
  ```

  Establish temporal ordering first:

  ```bash
  bd history <id> --json
  git show -s --format='%cI' <hash>
  ```

  Only beads that have never been closed are eligible for this shortcut.
  If history contains any prior closed episode, leave the bead actionable — do not infer that
  any attached commit resolves the current recurrence, even when its timestamp is
  newer than the reopen. A newer commit on a reopened bead still completes through the normal driver,
  which verifies the current issue and adds the terminal label.

  For a never-closed bead, the commit timestamp must be strictly newer than
  `bead.created_at`; if ordering cannot be established, leave the bead actionable
  (no exclusion, no labels).

  If a candidate passes that gate AND its diff/subject plausibly resolves the bead,
  **exclude AND self-heal** — comment and add the class-terminal chain so Step 2P closes it:

  ```bash
