    bd comment <id> "Orchestrator: bead reached terminal state (closed); archiving worker conversation <child-id>."
    ```
    ```
    mitto_conversation_archive(self_id: "{{ .Session.ID }}", conversation_id: "<child-id>")
    ```

    Then surface the terminal close to the operator (workspace-scoped toast;
    clicking opens the closed bead — mitto-9yz):

