  ## Step 3D — Can a second worker start? (disjointness proof)

  The operator raised the ceiling to **{{ $maxWorkers }} concurrent workers**
  (`MaxParallelWorkers`). That is a **ceiling, not a target**: workers share ONE
  working tree, so two drivers editing the same files corrupt each other's diffs and
  produce commits nobody can untangle. A second worker starts **only** when you can
  prove from *recorded evidence* that the candidates cannot collide.

  Run this only when §B or §C was chosen above and its slot budget is not yet full.
  Candidates are the remaining entries of the chosen class's shortlist (#2, #3 …), in
  rank order; the class chosen in Step 3 does not change (never mix §B and §C in one
  pass — the class-priority rule stands).

  **The burden of proof is on parallelism.** Evaluate each additional candidate `<c>`
  against the already-dispatched target(s). ALL of the following must hold:

  1. **Recorded file surface on both sides.** Each bead must carry an explicit,
     already-written list of the files/directories it will touch — a previous
     driver's `Investigation [tier: …]:` or `Plan [tier: …]:` comment (both record
     code locations / files touched), or the bead's own design/acceptance text.
     Read it, do not derive it:

     ```bash
     bd show <c> --long --json | jq -r '.[0].design, .[0].acceptance_criteria'
     bd show <c> --long --include-comments | grep -E '^(Investigation|Plan) \[tier:'
     ```

     If either bead has **no recorded surface**, the proof fails. Do NOT infer a
     surface by reading code, guessing from the title, or asking a model — an
     unverified guess is exactly the failure mode this gate exists to prevent.
     A never-dispatched bead usually has no recorded surface; that is the normal
     case and the correct answer is a single-worker pass.
  2. **Disjoint at directory granularity.** The two surfaces must share no file AND
     no immediate parent directory. Same-directory work counts as a collision even
     when the file lists differ (drivers routinely touch a sibling test file, a
     `doc.go`, or a shared helper in the same package).
  3. **No shared build/config surface.** Neither may touch a file both would plausibly
     need to re-generate or re-format: `go.mod`, `go.sum`, `package.json`, lockfiles,
     `Makefile`, CI config, generated bundles, or the same schema/migration directory.
  4. **No dependency edge, no shared parent epic.** `bd dep tree <c>` must show no
     path to or from the dispatched target, and the two must not be children of the
     same epic (siblings in one epic almost always share a code surface).
  5. **Same class, independent lifecycles.** Both are §B or both are §C, and neither
     is the `<id>` of a bead already carried by any non-archived child or peer
     conversation (the Step 2B/2C exclusion already removed those — re-check anyway).

  Any criterion you cannot answer from recorded evidence is a **fail**, not a maybe.
  On a fail: leave the candidate as ⏸️ `queued` and stop widening — do not try
  candidate #3 after #2 failed{{ if ne $maxWorkers "2" }} unless #2 failed criterion 5 only (already
  dispatched elsewhere), which says nothing about #3{{ end }}.

  On a pass, record the proof on **both** beads so the decision is auditable and a
  later human can see why they ran together:

  ```bash
  bd comment <c> "Orchestrator: dispatched in parallel with <other-id> (cap {{ $maxWorkers }}). Disjointness: <c> touches <paths-a>; <other-id> touches <paths-b>; no shared directory, no dependency edge, no shared epic."
  ```

  Then dispatch it through the same §B/§C spawn block as the primary target. Every
  additional worker consumes one slot and is counted by the concurrency gate exactly
  like the first{{ if .Args.PostIterationPrompt }}; the Step 5H post-task hook is NEVER one of them — it needs the
  tree to itself and only runs when the live worker count is 0{{ end }}.
  {{- end }}

