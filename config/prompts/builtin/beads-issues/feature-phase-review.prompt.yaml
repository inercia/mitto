icon: search
name: Feature — review phase
menus: internal
parameters:
  - name: IssueID
    type: beadsId
    required: false
    description: The beads issue ID to review
  - name: SubmitStrategy
    type: text
    group: Advanced
    required: false
    description: How finished work is submitted. "Commit" (default) — commit any review-driven changes after this phase. "Pull Request" — same, on the bead's existing feature branch. "None" — leave changes staged for review.
  - name: AdditionalInstructions
    type: text
    group: Advanced
    required: false
    multiLine: true
    description: Optional additional instructions for this phase, forwarded by the driver that dispatched it.
description: Internal phase-tier prompt — self-review a feature against its acceptance criteria and add the `verified` label. Invoked by name from the feature-implementation driver; runs on the Reasoning tier.
group: Tasks
backgroundColor: '#D1C4E9'
preferredModels:
  - modelTag: Reasoning
target:
  reuse:
    issue: true
    coalesce: true
prompt: |
  {{ template "_shared/session-context" . }}

  # Feature Implementation — Review Phase

  This is the **review/verify** stage of the label-encoded feature-implementation state
  machine (`planned` → `implemented` → `tested` → `verified`). It is normally invoked
  by name from the `Loop implementing feature` driver (or by a list orchestrator),
  which selects this phase when the target bead carries `tested` but not yet `verified`.

  {{ $target := "" -}}
  {{ if .Session.BeadsIssue }}{{ $target = .Session.BeadsIssue }}{{ else if .Args.IssueID }}{{ $target = .Args.IssueID }}{{ end -}}
  {{ $submit := .Args.SubmitStrategy -}}
  {{ $commit := ne $submit "None" -}}
  {{ $pr := eq $submit "Pull Request" -}}
  {{ $suffix := "Submit strategy is **None** (`SubmitStrategy` argument) — commit-after-review is disabled." -}}
  {{ if $pr }}{{ $suffix = "Submit strategy is **Pull Request** — committed on the configured task/epic branch." }}{{ else if $commit }}{{ $suffix = "Submit strategy is **Commit** (`SubmitStrategy` argument) — commit-after-review is enabled." }}{{ end -}}
  {{ template "beads-issues/shared/target-bead-header-strict" (dict
      "Target"      $target
      "Noun"        "target feature"
      "FromLink"    (ne .Session.BeadsIssue "")
      "PhaseSuffix" $suffix
  ) }}

  {{ if $target -}}
  {{ template "beads-issues/shared/additional-instructions" . }}

  {{ template "beads-issues/shared/tier-check" (dict
      "Target"    $target
      "Tier"      "Reasoning"
      "Phase"     "review"
      "Confirmed" (Model "Reasoning")
      "ModelName" .Session.ModelName
      "ModelTags" .Session.ModelTags
  ) }}

  ## Step 1 — Load LIVE state

  Labels drift between runs. Load the bead's **current** state fresh:

  ```bash
  bd show {{ $target }} --long --json
  bd comments {{ $target }} --json | jq '.[-10:]'  # recent comments only
  ```

  {{ template "beads-issues/shared/execution-state-read" $target }}

  Read its `labels`, acceptance criteria, and prior comments (`Plan:`,
  `Implementation:`, `Testing:`, `Review:`). If `verified` is already present, this
  phase's work is already done — `bd comment` a note that the phase re-ran redundantly
  and stop **without** re-adding the label. If a prior `Review:` comment records
  NOT VERIFIED while `tested` is still present, a previous run stalled without
  regressing: do not repeat that review — regress per Step 2 before stopping.

  ## Step 2 — Self-review

  This is a **scheduled, silent** phase (invoked by the driver's on-completion loop).
  Do **not** call `mitto_ui_options`, `mitto_ui_form`, or `mitto_ui_textbox` — decide
  autonomously; if something is genuinely unclear or unsolvable without user input,
  defer via **Step 4**.

  Check, concretely:

  - **Build** cleanly with no errors or new warnings.
  - **Vet/lint** clean (run the project's linter/vet tooling).
  - **Docs updated** where the change affects documented behavior, config, or APIs.
  - **Acceptance criteria satisfied** — walk each criterion on the bead and confirm it
    is met by the implementation and tests.
  - **No downstream breakage** — callers, related tests, and configs that reference
    the changed code still work.

  If **any** gap is found, do **NOT** add `verified`. Never stop with the labels
  unchanged: `tested` without `verified` is exactly the state that re-dispatches this
  review, so an unchanged exit is an infinite review loop, not a retry.

  - If you can fix it yourself (a small correction, a missing doc update, a lint
    fix), fix it now and re-check.
  - Otherwise **record the verdict, then regress the state machine** by the smallest
    step that can close the gap:

    ```bash
    bd comment {{ $target }} "Review [tier: Reasoning]: NOT VERIFIED — <gap and the evidence it needs>. Regressed: <labels removed>."
    # choose ONE — the shallowest regression that can close the gap:
    bd update {{ $target }} --remove-label tested                              # tests/evidence gap
    # OR
    bd update {{ $target }} --remove-label tested --remove-label implemented   # code/docs gap
    ```

    - **Tests/evidence only** → remove `tested`, leaving `implemented`: the next run
      dispatches the Test phase.
    - **Implementation, docs, or acceptance behavior** → remove `tested` and
      `implemented`, leaving `planned`: the next run dispatches the Implement phase.
    - **Needs a user decision or an external action** → defer via **Step 4** instead
      of regressing.

    Post the comment **before** removing labels so the reason survives the state
    change. Never remove `planned`; it is the floor of this state machine.

  ## Step 3 — Record, advance the label{{ if $commit }}, and commit{{ end }}

  When genuinely satisfied that every check above passes:

  ```bash
  bd comment {{ $target }} "Review [tier: Reasoning]: <build/lint/test results, acceptance criteria checklist, downstream impact checked>."
  bd update {{ $target }} --add-label verified
  ```

  Only add the label after the comment is posted.

  {{ if $commit -}}
  Then commit any review-driven changes as a **single, focused commit** using the
  project's commit conventions and reference the bead ID in the message.

  {{ template "git/shared/safe-commit" (dict
      "Type"     "chore"
      "Target"   $target
      "Summary"  "<one-line summary of the review fix-ups>"
      "BodyHint" (printf "<body: what changed and why, reference %s>" $target)
  ) }}

  Do **not** push automatically — the driver / user decides when to push. Skip the
  commit if nothing changed.
  {{- else -}}
  Do **not** commit. Leave any review-driven changes staged/unstaged for the user to
  review; the bead comment already records what changed.
  {{- end }}

  Do **not** close the bead in this phase, for any submit strategy. Closure is
  centralized in the driver's Done branch, which submits a PR when requested and
  verifies that every direct child is closed before closing the bead. This phase
  cannot safely decide whether the verified target is a leaf or a parent whose
  decomposed child work remains outstanding.

  Then stop — the driver's next scheduled run will observe `verified` and take its
  inline Done branch (self-terminate).
  {{- end }}

  ## Step 4 — Blocked → Defer + Handoff

  {{ template "beads-issues/shared/blocked-defer-handoff" (dict
      "Target"      $target
      "SessionID"   .Session.ID
      "Placeholder" "<target-feature>"
      "Label"       "verified"
      "Intro"       "(a gap needs a decision only the user can make, an external action is required)"
      "BlockedAt"   "review"
  ) }}

  ## Guidelines

  - **One stage only.** This phase advances at most one label (`verified`). It never
    closes the bead; the driver's child-aware Done branch always self-terminates.
  - **Never rubber-stamp.** Any unmet check means the label must NOT advance — regress
    or defer, never guess that it is "probably fine".
  - **Always leave a decision.** Every run ends in exactly one of: `verified` added;
    `tested` removed after a NOT VERIFIED comment (plus `implemented` when code, docs,
    or behavior must change); or a deferral. Never end on the unchanged `tested`
    state — that is the loop this phase must break.
  {{ template "beads-issues/shared/phase-guidelines-footer" (dict
      "IncludeItemNote" false
      "TagNoun"         "summary"
      "TagPrefix"       "Review"
      "Tier"            "Reasoning"
      "Target"          $target
  ) }}
