icon: question
name: Why needs human?
menus: beadsIssues, conversation
parameters:
  - name: IssueID
    type: beadsId
    required: false
    description: The needs-human beads issue to diagnose
description: Explain why this bead needs human help, identify the exact missing input or action, and ask for what is needed to unblock it
backgroundColor: '#FFCCBC'
group: Tasks
enabledWhen: 'CommandExists("bd") && DirExists(".beads") && ((Item.Id != "" && Item.Status != "closed" && "needs-human" in Item.Labels) || (Item.Id == "" && Session.HasBeadsIssue && BeadIsOpen(Session.BeadsIssue) && BeadHasLabels(Session.BeadsIssue, "needs-human"))) && !(Item.Labels != null && "support-question" in Item.Labels) && !(Session.HasBeadsIssue && BeadHasLabels(Session.BeadsIssue, "support-question"))'
target:
  reuse:
    issue: true
    coalesce: true
prompt: |
  {{- $target := .Session.BeadsIssue -}}
  {{- if not $target -}}{{ $target = .Args.IssueID }}{{- end -}}
  {{ template "_shared/session-context" . }}

  {{ template "beads-issues/shared/state-diagnosis" (dict
      "Target"    $target
      "SessionID" .Session.ID
      "State"     "needs-human"
  ) }}