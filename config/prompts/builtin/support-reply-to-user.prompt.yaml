name: 'Support: reply to user'
description: 'Review and post our draft to a tracked support question (bead in state:drafting) — an answer or a clarifying question. Reuses an existing draft or builds one, saves it on the bead (even on timeout), and posts to Slack only on your approval. Posting an answer moves it to awaiting-customer; posting a clarifying question moves it to need-info.'
group: Support
backgroundColor: '#B3E5FC'
icon: chat-bubble
menus: beadsIssues, conversation, prompts
enabledWhen: 'CommandExists("bd") && DirExists(".beads") && ((Item.Status != "closed" && "support-question" in Item.Labels && "state:drafting" in Item.Labels) || (Session.HasBeadsIssue && BeadHasLabels(Session.BeadsIssue, "support-question,state:drafting")))'
tags:
- support
parameters:
  - name: IssueID
    description: 'The beads issue ID to act on (auto-filled from the Beads issue menu)'
    required: false
    type: beadsId
prompt: |-
  # Support — Reply to User

  ## Session Context

  Your session ID is `{{ .Session.ID }}` — use it as `self_id` for all `mitto_*` MCP tool calls.

  ## Description

  Post our draft to a tracked support question — either an **answer** (we have enough info to help) or
  a **clarifying question** (we still need a detail from the customer, drafted by
  **"Support: investigate"**). Both live on the bead as an `[OUTBOUND]` DRAFT in `state:drafting`; this
  prompt shows the proposed text, lets you edit it, posts it to the Slack thread **on your approval**,
  and records it on the bead. After posting, an **answer** moves the bead to `awaiting-customer`, while
  a **clarifying question** moves it to `need-info` (see Step 7) — `need-info` is only ever reached
  *after* we actually post the question.

  > **Applicable state:** `state:drafting`. If the bead is in a different state, warn and let the
  > user decide whether to continue or stop (see Step 2).

  ## CRITICAL: User Interaction Rules

  > ⚠️ **NEVER use text-based interaction prompts.**
  >
  > - ❌ NEVER ask the user to type a number, command, or keyword to make a selection
  > - ❌ NEVER present numbered options and ask the user to respond with text
  > - ✅ ALWAYS use `mitto_ui_options` for choices, `mitto_ui_textbox` for review/editing,
  >   `mitto_ui_form` for structured input, and `mitto_ui_notify` for non-blocking notifications
  >
  > ⚠️ **NEVER post to Slack without explicit user review and approval.**

  ## Bead writing conventions (descriptions & comments)

  - **Always write in GitHub-flavored Markdown.** Every bead **description** (`-d`) and every
    **comment** you add must be valid markdown — headings, **bold**, `inline code`, fenced code blocks,
    lists and links so it reads well in the UI. Preserve real line breaks with `$'...'` (real `\n`) or,
    for anything multi-line, pipe via stdin (`printf '%s' "$md" | bd comment <id> --stdin`) — never
    collapse a comment into one flat line.
  - **The proposed reply to the user MUST be enclosed in a clearly delimited block** so a human can
    identify *exactly* what we would send to the customer, character-for-character. Wrap **only** the
    reply text between these two fences, on their own lines:
    ```
    --- BEGIN REPLY ---
    <the exact message we would send to the user, in markdown>
    --- END REPLY ---
    ```
    Put nothing else inside the fences — everything outside (the `[OUTBOUND]` header, notes) is context;
    everything *inside* is the verbatim reply. Use this same block for every DRAFT and every POSTED
    reply you record, and when reading a prior draft, treat the text inside the fences as the reply.

  ## Slack tools (names vary by MCP server)

  Match Slack MCP tools **by capability, not exact name**. You need: (a) **read a thread's replies**
  and (b) **post a reply to a thread**. Read the target channel and parent `thread_ts` from the bead
  metadata (`slack_channel` / `slack_thread_ts`).

  ## Step 1: Identify the target bead

  {{ $target := "" -}}
  {{ if .Session.BeadsIssue }}{{ $target = .Session.BeadsIssue }}{{ else if .Args.IssueID }}{{ $target = .Args.IssueID }}{{ end -}}
  {{ if $target }}
  - This prompt was launched from bead **`{{ $target }}`** — operate on it directly (skip the picker).
  {{- else }}
  - **No linked bead** — show a picker: list candidates and keep only those in `state:drafting`:
    `bd list -l support-question --status open,in_progress --all` (read each `state:*` label from
    `bd show`). Present them with `mitto_ui_options` (first option `{label: "None - Cancel"}`, then
    one `{label: "<id> [state] — <short summary>"}` per bead, timeout 300).
  - If there are no `state:drafting` beads, `mitto_ui_notify` (info) that nothing is ready to answer
    and stop. If the user cancels, acknowledge and stop.
  {{- end }}

  ## Step 2: Load history + verify state (self-check)

  - Load the full history: `bd show <id>` and `bd comments <id>`. The bead is the source of truth
    for what has already been said. Note the stored `slack_thread_ts` / `slack_channel` /
    `slack_url` metadata.

  ## Step 2.5: Read the channel playbook

  - Using the bead's `slack_channel` value, read this channel's playbook at
    **`.mitto/slack-support-<channel-id>.md`** (e.g. `slack_channel` `C0XXXXXXX` →
    `.mitto/slack-support-C0XXXXXXX.md`). It is the **authoritative guide** for this channel's tone,
    how to address customers, and reply guidelines (as well as scope and investigation method).
  - **If it exists**, honor its tone/reply guidance when reviewing or building the draft — it
    **overrides** the generic defaults below. **If it does not exist**, fall back to the generic
    defaults below (the watch/investigate prompts are responsible for creating it).
  - Confirm the `state:*` label is `drafting`. If it is **not**, use `mitto_ui_options` to warn:
    - **Question**: "This bead is in `state:<current>`, not `drafting`. Continue anyway?"
    - **Options**: `[{label: "Continue anyway"}, {label: "Cancel"}]`, timeout 300.
    - On "Cancel", stop. On "Continue anyway", proceed.

  ## Step 3: Refresh the thread (guard against new customer messages)

  - Re-fetch the Slack thread (read-thread-replies tool) using the stored `slack_thread_ts`.
  - If **new customer messages** appeared since our last activity and are **not** yet captured on the
    bead, they may change the answer. Use `mitto_ui_options` to recommend running **"Support: check
    status"** first: `[{label: "Run Check status first (stop here)"}, {label: "Continue drafting"}]`.
    Respect the choice.

  ## Step 4: Reuse or build the proposed reply

  A **proposed reply** lives on the bead as an `[OUTBOUND]`-style comment clearly marked
  **"DRAFT — not yet posted"** (created here or by **"Support: investigate"** / the watch loop). It
  is the single source of truth for the draft — never keep it only in memory.

  1. **Look for an existing draft.** Scan `bd comments <id>` for the most recent DRAFT `[OUTBOUND]`
     comment. The reply text is whatever sits **between the `--- BEGIN REPLY ---` and `--- END REPLY ---`
     fences** (see **Bead writing conventions**) — extract exactly that, ignoring the header/notes
     around it.
     - **If one exists** → **reuse it as-is.** Do **not** regenerate or rewrite it; the user may have
       already edited it. This is the text you will show in Step 5.
     - **If none exists** → build one now from the bead history (investigation / info-gathering notes)
       plus the refreshed thread, following the formatting guidelines below. Do not repeat what we
       already said.
  1a. **Note the draft *type* — answer or clarifying question.** A draft is either an **answer** we are
     giving, or a **clarifying question / request for info** we are asking. The DRAFT header records
     this: a request-for-info draft is marked `DRAFT (request for info)` (produced by
     **"Support: investigate"** when a customer detail is still missing); anything else is an answer.
     Remember this classification — it decides the post-posting state transition in Step 7 (an answer
     → `awaiting-customer`; a clarifying question → `need-info`).
  2. **Formatting guidelines (only when building a new draft).** Follow the channel playbook's
     tone/reply guidelines first (Step 2.5); the rules below are the fallback default when the
     playbook is silent:
     1. **No direct addressing** — do not use the user's name.
     2. **No follow-up offers** — do not end with "let me know if you need anything else".
     3. **Hedge** — start with "I think that…", "It seems like…"; we are never 100% sure.
     4. **Ask if unclear** — if scope/context is missing, ask rather than guess.
     5. **Run simple commands** — if we suggest e.g. `curl some.domain.com` and we can run it, run it
        locally and show the command **and** the result.
     6. **Keep it short and conversational** — lead with the single most likely solution or next step;
        avoid walls of text.

  ## Step 5: Persist the draft to the bead (before review)

  Always make sure the current proposed reply is saved on the bead **before** opening the review
  dialog, so nothing is lost if the user is away.

  - **If you built a NEW draft in Step 4**, record it now as a DRAFT `[OUTBOUND]` comment (preserve
    the markdown with `$'...'` or stdin):
    ```
    printf '%s' "$draft_markdown" | bd comment <id> --stdin
    ```
    Header: `**[OUTBOUND us · DRAFT — not yet posted · YYYY-MM-DD HH:MM UTC]**`, then the reply text
    **enclosed in the `--- BEGIN REPLY ---` / `--- END REPLY ---` block** (see **Bead writing
    conventions**).
  - Ensure the bead is in `state:drafting` (swap in place, never `bd set-state`):
    `bd update <id> --remove-label state:<previous> --add-label state:drafting`.
  - **If you reused an existing draft**, it is already persisted — do not add a duplicate comment.

  ## Step 6: Review in an editable textbox

  - Show a clickable link to the thread so the user can review context (use the stored `slack_url`):
    `📤 Replying to [this thread](<slack_url>)`.
  - Use `mitto_ui_textbox`:
    - **Title**: "📤 Review reply before posting to Slack"
    - **Text**: the proposed reply (reused or freshly built)
    - **Result**: "text"
    - **Abort**: true
    - **Timeout**: 300
  - The tool returns `{ result, changed, aborted, timed_out }`. Branch on these in Step 7.

  ## Step 7: Act on the textbox result

  ### On submit (`aborted` and `timed_out` are both false)

  - **The returned `result` is the authoritative final message** — it may differ from the draft we
    proposed because the user edited it in the textbox (`changed == true`). Whatever text the tool
    returns is *exactly* what we send to Slack, and *exactly* what we must record. Never fall back to
    the original draft text; the user's edited version wins, character-for-character.
  - Post that `result` with the post-reply-to-thread tool, using the stored `slack_channel` and the
    thread's parent `slack_thread_ts`.
  - Confirm success and show the permalink (build it from the posted ts: `<slack_url base>/archives/
    <slack_channel>/p<posted_ts_without_dot>`).
  - **Log the exact posted text to the bead** — add a markdown `[OUTBOUND]` comment (this one is the
    **posted** reply, not a draft) recording the **verbatim `result` we just published** (i.e. with the
    user's edits applied), plus the permalink:
    ```
    printf '%s' "$comment_markdown" | bd comment <id> --stdin
    ```
    Header: `**[OUTBOUND us · POSTED · YYYY-MM-DD HH:MM UTC]**`, then the posted text **enclosed in the
    `--- BEGIN REPLY ---` / `--- END REPLY ---` block** so it stays machine-identifiable, followed by
    the permalink outside the fences. This block is our permanent record of *exactly what we said to the
    customer* — it must be the posted `result`, not the pre-edit draft.
  - **Transition state — depends on the draft *type* from Step 1a** (same issue, never `bd set-state`):
    - If we just posted an **answer** → `awaiting-customer` (we replied, ball in their court):
      `bd update <id> --remove-label state:drafting --add-label state:awaiting-customer`.
    - If we just posted a **clarifying question / request for info** → `need-info` (we asked, now waiting
      on the customer to supply the detail):
      `bd update <id> --remove-label state:drafting --add-label state:need-info`.
      This is the **only** correct way to reach `need-info`: it means *we posted the question*. Never set
      `need-info` before the question is actually posted.
    - (If Step 2 continued from a different state, remove that state label instead of `state:drafting`.)

  ### On timeout (`timed_out == true`)

  The user is away — **do NOT post anything to Slack**, and do **not** re-open the dialog (staged
  draft holding pattern).

  - **Persist the proposed reply so it is never lost:**
    - If the draft was **newly built** in Step 4, it was already saved in Step 5 — nothing more to do.
    - If the user **edited** the text before the timeout (`changed == true` and a non-empty `result`
      is returned), update the stored draft to that edited text: add a fresh DRAFT `[OUTBOUND]` comment
      (header `**[OUTBOUND us · DRAFT (edited, not posted) · YYYY-MM-DD HH:MM UTC]**`, the edited reply
      **enclosed in the `--- BEGIN REPLY ---` / `--- END REPLY ---` block**) so the latest version is
      on the bead for next time.
  - Leave the bead in `state:drafting`. `mitto_ui_notify` (info): "Review dialog timed out — assuming
    you're away. Nothing posted; the draft is saved on the bead. Re-run **Support: reply to user** when
    you're back." Then stop (do not re-invoke the dialog or re-fetch).

  ### On abort (`aborted == true`)

  - Do **NOT** post anything to Slack. Leave the bead in `state:drafting` (the saved draft stays
    pending). Acknowledge and stop.

  ## Set priority by intervention urgency (final step)

  Set the bead's priority to match how urgently *you* (the human) must act: while the draft is pending
  **your** approval (`state:drafting`, including after a timeout or abort) it stays **P1**; once posted
  it drops straight to **P3** — whether the post moved it to `awaiting-customer` (we replied) or
  `need-info` (we asked a clarifying question), the ball is now in the customer's court and nothing
  needs your attention until they respond. In general:

  - **P1 (HIGH)** — a draft (reply or clarifying question) is pending **your** approval
    (`state:drafting`); bump to **P0** only if it answers an escalation / outage / broad-impact thread.
  - **P2 (MEDIUM)** — in motion, our court, not blocked on your approval: `triaged` / `gathering-info`
    / `awaiting-us`.
  - **P3 (LOW)** — waiting on the customer, nothing for you to do now: `awaiting-customer` / `need-info`
    (we just posted a reply or a clarifying question; the ball is in their court).

  Apply with `bd update <id> --priority <n>` (n is `0`–`3`, 0 = highest) and add a short
  `**[PRIORITY · <time>]** P<old> → P<new> (<reason>)` comment when it changes.

  ## Notes

  - Load the bead (`bd show` + `bd comments`) **before** drafting — it is the source of truth.
  - The proposed reply always lives on the bead as a DRAFT `[OUTBOUND]` comment; reuse it rather than
    regenerating, and keep it current even when the review dialog times out.
  - **The bead is our record of exactly what we said to the customer.** When a reply is posted, the
    `POSTED` `[OUTBOUND]` comment must contain the **verbatim text we actually published** — the
    textbox `result` with the user's edits applied — not the original draft we proposed.
  - **NEVER** send a reply in the support channel without explicit review and approval.
