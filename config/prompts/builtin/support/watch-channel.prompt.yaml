icon: loop
name: 'Support: watch channel'
menus: prompts
description: 'Watch a Slack channel for customer questions: triage each new question (and its thread) into a beads issue with state labels, gather information to answer, and keep every bead in sync with the real Slack conversation. Never posts to Slack.'
backgroundColor: '#C8E6C9'
group: Support
tags:
- loop
- support
target:
  title: "Support: watch {{ .Args.SlackChannelID }}"
  reuse:
    title: true
    coalesce: true
parameters:
  - name: SlackChannelID
    type: slackChannel
    required: true
    description: 'The Slack channel ID to watch for customer questions (e.g. C0XXXXXXX).'
  - name: SlackWorkspaceURL
    type: text
    required: true
    description: 'Base Slack workspace URL used to build message permalinks (e.g. https://yourteam.slack.com). No trailing slash.'
  - name: LookbackDays
    type: text
    group: Advanced
    required: false
    description: 'How many days of channel history to scan each run. Defaults to StaleDays (so each run re-scans the whole staleness window and no aged-out thread is missed).'
  - name: StaleDays
    type: text
    group: Advanced
    required: false
    description: 'After how many days of no activity a tracked ticket is auto-closed as stale (default 10). Applies regardless of state:* — an unposted draft untouched this long is treated as abandoned.'
enabledWhen: '!Session.IsChild && CommandExists("bd") && Tools.HasAnyPattern(["slack_*", "*_slack"])'
preferredModels:
  - modelTag: Cheap
  - modelTag: Coding
loop:
  trigger: [schedule]
  schedule:
    value: 15
    unit: minutes
  mode: optional
  default: true
prompt: |-
  {{- $channel := .Args.SlackChannelID -}}
  {{- $ws := .Args.SlackWorkspaceURL -}}
  {{- $staleDays := Arg "StaleDays" "10" -}}
  {{- $days := Arg "LookbackDays" $staleDays -}}
  # Support — Watch Channel (Triage + Keep Beads in Sync)

  {{ template "_shared/session-context" . }}
  {{ template "support/shared/playbook-files-policy" . }}
  {{ template "beads-issues/shared/bootstrap" . }}

  Available ACP servers:
  {{ Default "(none)" .ACP.AvailableText }}

  Existing child conversations (spawned by previous runs):
  {{ .Children.MCPText }}

  Spawn one-off investigation conversations on this same server so their per-phase model preferences
  can select from its advertised model catalog. **Never** configure spawned conversations as loops.

  ## What this does

  Listen to the Slack channel **`{{ $channel }}`**. For every **new open customer question**
  (and its thread) create/maintain a **beads** (`bd`) issue whose `state:*` label tracks where the
  conversation stands. Delegate research and drafting to per-ticket children, and keep every tracked
  bead in sync with the real Slack thread.

  > ⚠️ **This prompt NEVER posts to Slack.** Posting a reply is done — with your explicit approval —
  > by the **"Support: reply to user"** and **"Support: gather more information"** prompts.

  ## Run mode
  {{- if and .Session.IsLoop (not .Session.IsLoopForced) }}

  **Silent scheduled run** — nobody is watching.
  - Use **only** `mitto_ui_notify` for status and summaries. Do **NOT** call `mitto_ui_options` /
    `mitto_ui_form` / `mitto_ui_textbox` — they block while nobody is watching.
  - If playbook fragments are missing, warn via `mitto_ui_notify`, use the documented generic
    triage defaults where safe, and leave uncertain questions for human review. Channel playbook
    fragments are read-only unless the user explicitly requests an edit.
  {{- else }}

  **Interactive run** (first send, or force-triggered ▶️) — the user may be present. The playbook
  remains read-only; inspect the channel scope before triaging and ask for guidance only when a
  decision is required. Do not create or modify playbook fragments without an explicit request.
  {{- end }}

  ## CRITICAL: user interaction rules

  > - ❌ NEVER present numbered options and ask the user to type a number/keyword.
  > - ✅ Use `mitto_ui_options` (choices), `mitto_ui_textbox` (review/edit), `mitto_ui_form`
  >   (structured input), `mitto_ui_notify` (non-blocking notifications).
  > - ⚠️ NEVER post a reply to the Slack channel from this prompt.

  ## Slack tools (names vary by MCP server)

  {{ template "support/shared/slack-tools" (dict "Capabilities" "You need tools that can: (a) read recent channel history (e.g. `slack_get_channel_history*`, `conversations_history_slack`), and (b) read a thread's replies (e.g. `slack_get_thread_replies*`)." "NoPosting" true "ReadMetadata" false) }}

  ## Beads tracking model (one bead per Slack thread)

  Run `bd` from the workspace root. If `bd list` reports no database, run `bd init` first.

  - **Deduplicate by thread.** Before creating, look up the thread:
    `bd list --metadata-field slack_thread_ts=<ts> --all`. If a match exists, **reuse** it. Never
    create a second bead for the same thread.
  - **Permalink.** Build it from the thread ts by removing the dot and prefixing `p`:
    `{{ $ws }}/archives/{{ $channel }}/p<ts_without_dot>` (e.g. `1770802214.391359` → `p1770802214391359`).
  - **Create** with the `support, support-question` labels, a priority (`-p`) set by **intervention
    urgency** (see **Priority = urgency of your intervention** below — a freshly-triaged bead is
    `state:triaged` → **P2**), the fixed markdown description via `-d`, and metadata. Use `$'...'` so
    `\n` become real newlines:
    ```
    bd create "<short question summary>" -t task -p P2 -l support,support-question \
      -d $'# Question\n\n<question text>\n\n# User\n\n<display name>\n\n# Links\n\n[Slack]({{ $ws }}/archives/{{ $channel }}/p<ts_without_dot>)\n' \
      --metadata '{"slack_thread_ts":"<ts>","slack_channel":"{{ $channel }}","slack_url":"<permalink>"}'
    ```
    **Never pass a file path to `-d`.** `bd`'s `-d`/`--description` takes the description text
    **literally** — it has **no `@file` expansion** (unlike `gh`). Writing the body to a temp file and
    passing `-d @/tmp/....txt` (or `-d /tmp/....txt`) stores the raw path string as the description. If
    the description is long enough that inline `$'...'` is awkward, write it to a file and read it back
    with **`--body-file <path>`** (or `--stdin`), e.g. `bd create "<summary>" ... --body-file /tmp/desc.md`.
  - **Priority (`-p`):** set by **intervention urgency**, not customer impact — see **Priority =
    urgency of your intervention** below. A brand-new triaged bead is `state:triaged` → **P2**.
  - **Comments = full history.** Log every relevant message as a markdown comment (preserve layout
    with `$'...'` or `printf '%s' "$c" | bd comment <id> --stdin`). Header then blank line then body:
    ```
    **[TAG @author · YYYY-MM-DD HH:MM UTC · ts:<slack_ts>]**

    <content in markdown>
    ```
    Tags: `[INBOUND @user]` customer messages · `[OUTBOUND us]` our posted replies ·
    `[CONTEXT @other]` messages from other participants · `[STATE]` a state transition + reason.

    {{ template "support/shared/message-comment-key" . }}
  - **Everything is GitHub-flavored Markdown.** Both the bead **description** (`-d`) and **every
    comment** must be valid markdown — headings, **bold**, `inline code`, fenced code blocks, lists and
    links so the bead reads well in the UI. Preserve real line breaks with `$'...'` (real `\n`) or
    stdin; never flatten a comment into one line.
  - **Any proposed/draft reply to the customer MUST be enclosed in a clearly delimited block** so the
    exact customer-facing text is unambiguous — wrap **only** the reply between these two fences, on
    their own lines (nothing else inside them):
    ```
    --- BEGIN REPLY ---
    <the exact message we would send to the user, in markdown>
    --- END REPLY ---
    ```
    Everything outside the fences (the `[OUTBOUND]` header, notes, confidence) is context; everything
    *inside* is the verbatim reply. The **"Support: investigate"** children use this same convention.
  - **State via a single `state:*` label** (never `bd set-state` — it spawns child event beads).
    Read the current label from `bd show <id>`, then swap in place:
    `bd update <id> --remove-label state:<previous> --add-label state:<new>` (for the first
    transition just `--add-label state:triaged`). Lifecycle:

    | state | meaning |
    |-------|---------|
    | `triaged` | auto-created during triage, not yet worked (initial) |
    | `gathering-info` | actively working it — investigating to answer (docs/tools/playbook) |
    | `need-info` | need more details from the customer before we can answer |
    | `drafting` | have a draft answer, pending your review |
    | `awaiting-customer` | we posted a reply, waiting on the customer |
    | `awaiting-us` | customer responded, our turn to act |
    | `resolved` | answered/accepted (also `bd close <id>`) |
    | `stale` | auto-closed after {{ $staleDays }}+ days of inactivity, regardless of state:* (also `bd close <id>`) |
    | `out-of-scope` | not our area / not something we will pursue (also `bd close <id>`) |

    > 🚫 **A closed bead is terminal — respect it.** Any ticket already `bd close`d (states `resolved`,
    > `stale`, `out-of-scope`) is intentionally done: we will **not** keep working it. **Never reopen a
    > closed bead and never flip it to an active state** (`awaiting-us`, etc.), even if a new Slack
    > message later lands on its thread. Every reconcile `bd list` here is scoped to
    > `--status open,in_progress`, which already excludes closed beads — do not work around that.

    Whenever you change a bead's `state:*` label, **recompute its priority** per the rubric below.

  ## Priority = urgency of *your* intervention

  Priority does **not** reflect customer-impact severity — it reflects **how urgently _you_ (the human
  operator) must step in**. Recompute it whenever a bead's `state:*` changes and apply it with
  `bd update <id> --priority <n>` (n is `0`–`3`, 0 = highest), adding a short
  `**[PRIORITY · <time>]** P<old> → P<new> (<reason>)` comment:

  | Priority | Intervention urgency | When |
  |----------|----------------------|------|
  | **P1** | HIGH — actionable, waiting on **your** approval | A draft (reply **or** clarifying question) is ready and pending your OK to post — typically `state:drafting`. Bump to **P0** only if that draft answers an escalation / outage / broad-impact thread (you are the bottleneck on an urgent fix). |
  | **P2** | MEDIUM — in motion, our court, not blocked on your approval | `state:triaged`, `state:gathering-info`, `state:awaiting-us` (customer replied, our turn). |
  | **P3** | LOW — waiting on the customer, nothing for you to do now | `state:awaiting-customer` or `state:need-info` — we posted a reply or a clarifying question and are waiting on the customer (also drifting toward the {{ $staleDays }}-day auto-close as time passes). |

  ## Channel playbook gate: read before triage

  Fragments live under **`.mitto/support/{{ $channel }}/`**, one topic per file. Read the available
  guidance on every iteration, but keep the entire directory read-only under the policy above.

  1. **Scope fragment.**
     - {{ template "support/shared/channel-fragment-read" (dict "Channel" $channel "Fragment" "scope" "Purpose" "know what this channel is (and is not) responsible for before triaging" "Owner" "" "OwnerAsk" false) }}
  2. **Tone fragment.**
     - {{ template "support/shared/channel-fragment-read" (dict "Channel" $channel "Fragment" "tone" "Purpose" "keep triage summaries and any notifications consistent with the channel's voice" "Owner" "" "OwnerAsk" false) }}
  3. If either fragment is missing, do not create it or ask to populate it. Continue with the generic
     defaults and mention the missing guidance in the run summary. Record newly discovered patterns
     on the relevant bead, not in `.mitto/support/{{ $channel }}/*.md`.

  ## Instructions

  > **Run the channel playbook gate above FIRST** at the start of every iteration — before Step 0
  > and everything else. The **channel playbook gate** is a read-only,
  > per-iteration safety net for `scope.md`. Children read the other fragments during
  > investigation.

  ### 0. Ensure beads ready + housekeeping

  - Verify the database (`bd list`; if none, `bd init`).
  - Load tracked questions: `bd list -l support-question --all` and review their `state:*` labels.
  - **Auto-close stale (aged-out — applies to EVERY open state, including `drafting`).** Find tracked
    issues with no activity for **{{ $staleDays }}+ days**
    (`bd list -l support-question --status open,in_progress --updated-before <cutoff> --all`, cutoff
    `date -u -v-{{ $staleDays }}d +%Y-%m-%d`). Every bead this filter returns is aged-out **regardless
    of its `state:*` label** — do **not** exempt `state:drafting`. A draft that has sat unposted and
    untouched for {{ $staleDays }}+ days was never approved and its thread has gone quiet, so it is
    **abandoned**: close it as stale (the draft text stays preserved in the bead's comment history).
    The only legitimate skip is a bead the loop simply has not reconciled yet even though its thread
    moved within the last {{ $staleDays }} days — if in doubt, re-fetch that one thread once; if its
    newest message is still older than the cutoff, it is stale.
    - **This close runs in BOTH run modes and must never be dropped.** It is the loop's core hygiene
      action and it is safe — the draft text stays preserved in the bead's comment history, so a
      close is recoverable. On a **silent** run, close directly with no dialog. On an **interactive**
      run you MAY first surface the aged-out batch once via `mitto_ui_options` (short
      `timeout_seconds`, e.g. 60s) for a quick veto — but if nobody answers before the timeout,
      **fall through and close them anyway**, exactly as a silent run would. **Never defer or skip
      the close merely because a confirmation dialog timed out or went unanswered** — an unanswered
      dialog is a proceed, not a hold.
    - For each stale bead:
      `bd update <id> --remove-label state:<prev> --add-label state:stale` then
      `bd close <id> -r "auto-closed: no activity for {{ $staleDays }}+ days"`. Record every
      auto-close in the Step 5 summary so the run's `mitto_ui_notify` surfaces the closed drafts.
  - **Out-of-scope close:** if a tracked ticket is **not our area / not something we will pursue**
    (wrong team, out of our expertise, explicitly declined), close it to
    `state:out-of-scope`: `bd update <id> --remove-label state:<prev> --add-label state:out-of-scope`
    then `bd close <id> -r "out-of-scope: <reason>"`. If a customer is waiting, post a brief, polite
    hand-off (point them to the right team/channel) before closing — do not silently drop them.

  ### 1. Fetch recent questions

  > ⚠️ **Steps 1 and 3 are two separate reads — do NOT collapse them.** Step 1 reads the
  > **channel history** (top-level messages, which is where a brand-new customer question
  > lives). Step 3 reads **thread replies** for each already-tracked bead. Executing only
  > Step 3's thread-reply reads does **not** satisfy Step 1: a new top-level question does
  > not appear in any existing thread's replies, and the tracked bead list from Step 0 by
  > definition contains **no** bead for a question you have not discovered yet. You MUST
  > run Step 1's channel-history fetch on every iteration, even when `bd list` already
  > returns open beads and even when the channel looks quiet.

  - Read the last **{{ $days }} days** of history from `{{ $channel }}`.
  - Keep messages that look like **open** questions/requests for help. Skip ones that already look
    resolved — the asker said "thanks / that worked", someone gave an accepted answer, or a positive
    reaction marks it helpful. Treat a clearly-negative reaction (answer not helpful) as still open.

  > 🔒 **Auditable channel-history gate — this is not satisfiable in prose.** A correct
  > run emits **at least one `slack_get_channel_history*` (or `conversations_history*`)
  > call this iteration**, scoped to channel `{{ $channel }}` and covering the last
  > `{{ $days }}` days. Reading only individual threads (Step 3) is **not** a substitute:
  > a brand-new top-level question does not appear in any tracked bead's thread replies.
  > If by the time you reach Step 2 you have made **zero** channel-history calls this
  > iteration, you have **not** completed Step 1 — go back and fetch channel history
  > now, before triaging or reconciling anything. Do not assert "channel is quiet" or
  > "no new questions" for any run in which you have not actually fetched channel
  > history.

  ### 2. Triage — create a bead per NEW open question

  - For each candidate, dedup by thread ts. If a bead exists **and is still open**
    (`open`/`in_progress`), it is ongoing → handle in Step 3. **If the matching bead is already
    `bd close`d** (`resolved` / `stale` / `out-of-scope`), it is intentionally done: **skip it** —
    do **not** reopen it, do **not** route it to reconcile, and do **not** create a duplicate bead
    for the same thread. (Optionally add a one-line `[CONTEXT]` note on the closed bead recording the
    new message, but leave it closed.) Only treat a thread as genuinely new when it has **no** bead at
    all, open or closed.
  - If none exists, **create** one now (see **Beads tracking model**): priority `-p`, labels
    `support,support-question`, the fixed `# Question / # User / # Links` description via `-d`,
    metadata with `slack_thread_ts` / `slack_channel` / `slack_url`, an `[INBOUND]` comment with the
    original question, and `bd update <id> --add-label state:triaged`.
  - If a **tracked** thread got a helpful reaction / accepted answer, close it:
    `bd update <id> --remove-label state:<prev> --add-label state:resolved` then `bd close <id>`.

  ### 3. Reconcile ongoing threads with their beads

  First list the tracked, still-open beads
  (`bd list -l support-question --status open,in_progress --all`). Let **N** = that count. Then
  **process them one bead at a time, start to finish**, in a loop.

  > 🔁 **Iterate per bead — do NOT batch.** For **each** open bead, complete the full cycle before
  > moving to the next one: (1) `bd show <id>` + `bd comments <id>`, (2) **immediately** fetch *that
  > bead's* Slack thread with one `slack_get_thread_replies*` call, (3) reconcile it (add new
  > comments, apply the state change / closure), (4) **then** move on to the next bead. Do **not**
  > read all beads first and then fetch all threads in a second pass — interleave read-then-reconcile
  > per bead so you hold only one thread's context at a time and reason about it while it is fresh.

  > ⚠️ **Re-read the Slack thread for EVERY open bead — no exceptions.** The beads parked in the
  > customer's court (`state:awaiting-customer` and `state:need-info`) are exactly the ones to check
  > hardest: re-fetch each thread and see **whether the customer has since replied**. If they have (a
  > real answer/follow-up, not a bare "thanks"), the ball is back with us → flip to `state:awaiting-us`.
  > Never skip a bead just because it was "waiting on them" last run — that is precisely where a new
  > customer reply is waiting to be noticed.

  > 🔒 **Auditable thread-reply gate — this is not satisfiable in prose.** Because you fetch exactly
  > one thread per bead, a correct run emits **exactly N `slack_get_thread_replies*` (read-thread-replies)
  > calls** — one per open bead, each using that bead's stored `slack_thread_ts` / `slack_channel`.
  > Reading channel history is **not** a substitute here (and, conversely, satisfying this gate does
  > **not** satisfy Step 1's separate channel-history gate — they are two independent reads):
  > a customer reply posted *inside* a thread does **not** appear in channel history, and a brand-new
  > top-level question does **not** appear in any thread's replies. If by the end of the loop you have
  > made fewer than **N** thread-fetch calls, you have **not** reconciled every bead — go back and
  > process the remaining beads now. Do not assert "no customer replies" for any bead whose thread you
  > have not actually fetched this run.

  For each open bead, in the loop above:

  - Load `bd show <id>` + `bd comments <id>`, then re-fetch its Slack thread using the stored
    `slack_thread_ts`.
  - Add a markdown comment for **each new** thread message not yet captured (`[INBOUND]` customer /
    `[CONTEXT]` others / `[OUTBOUND]` any of our own replies), applying the `ts:` dedup key from
    **Comments = full history**: skip any message whose `ts` already appears in `bd comments <id>`.
  - **First check for closure.** If the customer's last message just **acknowledges / closes** the
    thread — "thanks", "that worked", "got it", "sorted", or a positive reaction on our answer, with
    **no new question** — and we already replied (`awaiting-customer`, or otherwise answered), the
    thread is **resolved**: swap to `state:resolved` and `bd close <id> -r "resolved: customer
    confirmed"`. Do **NOT** flip it to `awaiting-us` (an acknowledgment is not a new question — doing
    so re-opens an answered ticket for another unneeded reply). Only skip resolving if the
    acknowledgment is bundled with a genuine follow-up question.
  - Otherwise update the `state:*` label only when a **newly observed** thread message changes whose
    turn it is. Do not infer a transition merely because the last message is still the same customer
    question that put the bead in `triaged` or `gathering-info`: an unchanged thread leaves those
    states untouched, including while a child is researching or composing. A new customer message
    **needing action** (a real follow-up, not a mere acknowledgment) → `state:awaiting-us`; a reply
    we actually posted, with no later customer response → `state:awaiting-customer` (unless the
    approved reply was a request for information, which is `state:need-info`).
  - **If the bead is in `awaiting-customer` and the customer just replied** (posted anything after our
    last message that is a real answer/follow-up, not a bare "thanks") → `state:awaiting-us`. This is
    the core "did the customer give feedback yet?" check — a bead must never sit in `awaiting-customer`
    once the customer has actually responded.
  - **If the bead is in `need-info` and the customer just replied** (provided the info we asked for,
    answered our clarifying question, or spoke last) → `state:awaiting-us`. Treat `need-info` like
    `awaiting-customer` once the customer responds — never leave it stranded in `need-info`. (The
    closure check above still applies first: a bare "thanks" while in `need-info` still resolves, it
    does not become `awaiting-us`.)
  - Do not override `drafting` if our pending action still stands (a draft awaiting review). Add a
    short `[STATE]` comment noting any change.
  - **After any state change, recompute priority** (see **Priority = urgency of your intervention**):
    `drafting` → P1; `triaged` / `gathering-info` / `awaiting-us` (our court) → P2; `awaiting-customer`
    / `need-info` (we posted a reply or clarifying question, ball in the customer's court) → P3.
  {{- if .Permissions.CanStartConversation }}
  - **Reap finished investigation children.** A child spawned by Step 4 runs **two phases in the same
    conversation**: first "Support: investigate" (research only — the bead stays `gathering-info`),
    then a **queued** "Support: compose draft" turn that writes the draft and moves the bead to
    `drafting` / `need-info`. A child is therefore **done** only once its bead has left the in-flight
    states — i.e. the bead is now `drafting` / `need-info`, or has otherwise moved off `triaged` /
    `gathering-info` / `awaiting-us`. For each such bead, find the matching child in
    `{{ .Children.MCPText }}` (its ID appears in the child's title / `beads_issue`); archive it only
    when **all** of these hold, to free the max-children cap and keep dedup clean for the next
    iteration:
    - the child is **not currently prompting**, and
    - the child has **no queued prompts** (a queued "Support: compose draft" turn means the handoff
      between research and drafting is still in flight — archiving now would destroy the draft phase), and
    - the bead is **no longer** `triaged` / `gathering-info` / `awaiting-us`.
    ```
    mitto_conversation_archive(self_id: "{{ .Session.ID }}", conversation_id: "<child-id>")
    ```
    **Archive, never delete** — the investigation transcript stays inspectable for auditing. **Never
    archive a child between its research and its queued compose turn**: if the child is prompting, has
    a queued prompt, or its bead is still `gathering-info` **while that child is still live**, it is
    mid-flight — leave it running and reap it on a later iteration. A `gathering-info` bead whose
    child is idle with no queued prompt is **not** mid-flight — it may be stranded between its
    research and drafting phases. Leave it alone here (do not archive it, do not re-dispatch it) and
    let Step 4's recovery sub-step judge it.
  {{- end }}

  ### 4. Dispatch investigations — one one-off child per investigable bead

  > ⚠️ **This run is discovery, reconciliation and dispatch only.** You **never** research a bead and
  > you **never** write a draft reply here — not even "just this one", not even when child spawning is
  > unavailable. Both of those belong to the per-ticket children, which run under their own
  > phase-appropriate model tiers. Your job in this step is to decide, for every investigable bead,
  > **who** is going to work it and to record that decision.

  > ⚠️ **This step is ACTION, not description.** A `triaged` (or `awaiting-us`) bead that reaches
  > Step 5 with no investigation dispatched, no existing child covering it, and no explicit deferral
  > note is a **bug in this run**, not a "next action" for the human. Never write a summary that
  > reports investigable beads as pending work; the whole point of Step 4 is to have **already
  > dispatched** them by the time you print Step 5.

  **Delegate each investigable bead to its own one-off child conversation** so they run **in
  parallel**. Each child executes the canonical **"Support: investigate"** prompt, which researches
  the bead against the channel playbook, records `[CONTEXT]` findings, and then **queues a
  "Support: compose draft" turn onto itself** so the draft is written in a separate turn under a
  drafting-appropriate model. You observe the result only through the bead's state on a later
  iteration.

  - **Which beads to investigate.** A bead is **investigable** this run when it is **our turn and not
    already in flight**: its `state:*` is `triaged` or `awaiting-us` (not `drafting` / `need-info` /
    `awaiting-customer` / `resolved` / `stale`), it has a usable `slack_channel` + `slack_thread_ts`,
    and there is no open child already working it (see dedup below). Skip anything already
    `state:gathering-info` or `state:drafting` — it is in progress or waiting on you. **Exception:**
    a `gathering-info` bead whose research already finished but whose compose turn never got queued
    is **stranded**, not in progress; it is handled by the **recovery sub-step** below and must never
    be re-investigated as if it were fresh.
  - **Enumerate first, then act.** Before spawning anything, build (mentally or in a scratch note)
    the **explicit list of investigable beads** for this run — every open bead in `state:triaged` or
    `state:awaiting-us` from Step 3, sorted highest-priority / oldest first. This list is the input
    to the spawn loop below; Step 5's what's-next table must be able to account for **every** bead on
    it with a concrete disposition (`spawned`, `already covered by <child-id>`, or `deferred: over
    3-cap`). If the list is empty, say so explicitly — do not silently skip.
  - **Validate the dispatch permissions before spawning anything.** The two-phase child needs
    **both** permissions on *this* watcher conversation: *Can start conversation* (to spawn it) and
    **Can Send Prompt** (because a spawned child **inherits this conversation's advanced settings**,
    and without it the child cannot queue its own "Support: compose draft" turn). Check both up
    front — never spawn a research child you already know cannot hand off, and never try to set or
    mutate permission flags on the child; inheritance from this conversation is the only mechanism.
  - **Recover stranded post-research beads — do this before the spawn loop.** Research and drafting
    are two separate turns, so a bead can finish research and still never get a draft if the handoff
    failed (the enqueue errored, the watcher lacked *Can Send Prompt*, or the child was archived too
    early). Such a bead sits in `state:gathering-info` with nothing live behind it, and the rule above
    would otherwise skip it on **every** future run. Judge this **only** from what is persisted on the
    bead and from `{{ .Children.MCPText }}` — never from memory of a previous run. A bead is
    **stranded** when **all** of these hold:
    - it is open and in `state:gathering-info`; and
    - its **latest** `[CONTEXT investigation]` findings block ends in an actionable `Conclusion:`
      (answer, specific clarifying question, or redirect), **not** `inconclusive`; and
    - it has **no DRAFT** `[OUTBOUND]` comment from this investigation or a later turn. Earlier
      *posted* `[OUTBOUND]` replies from previous exchanges do not disqualify a new follow-up; and
    - there is no later `[CONTEXT]` NEXT note saying the customer changed the ask and the findings
      no longer apply. That case requires fresh investigation, not a drafting retry; and
    - this run's Step 3 Slack thread fetch for the bead succeeded. If Slack is unavailable, leave a
      deduped NEXT note and warning; do not repeatedly queue a draft that cannot be refreshed; and
    - no child is currently prompting on it **and** none has a queued prompt for it, i.e. nothing is
      about to produce the draft on its own.

    Handle at most **3** stranded beads per run (highest priority first, then oldest). Recovery
    spawns nothing, so this budget is independent of the 3-spawn cap used by the dispatch loop below.
  {{- if .Permissions.CanSendPrompt }}

    For each stranded bead, if an **existing, non-archived, idle** child for that bead is still listed
    in `{{ .Children.MCPText }}`, queue **only the drafting phase** onto that same child — the
    research is already done and must not be repeated:

    ```
    mitto_conversation_send_prompt(
      self_id: "{{ .Session.ID }}",
      conversation_id: "<existing-child-id>",
      prompt_name: "Support: compose draft",
      arguments: { "IssueID": "<bead id>" })
    ```

    Leave the bead's `state:*`, its labels and its findings comment **untouched** — the queued turn
    owns the transition. Tag the bead `recovered: compose re-queued onto <child-id>` for Step 5.

    If that call fails, or **no** usable idle child is left for the bead, do **not** improvise a
    recovery. Leave the bead exactly as it is, record a deduped NEXT note with
    `bd comment <id> --stdin` whose body is
    `**[STATE · YYYY-MM-DD HH:MM UTC]** NEXT: research is complete but the drafting turn never ran — run "Support: compose draft" on this bead to finish it; do not re-investigate it.`
    (skip it if an equivalent note is already the latest `[STATE]` comment), and tag the bead
    `stranded: needs human` for Step 5.
  {{- else }}

    This conversation lacks *Can Send Prompt*, so it **cannot** re-queue the drafting turn onto the
    child and must not pretend otherwise. For each stranded bead: leave it exactly as it is, record
    the same deduped NEXT note as above with the missing watcher permission named in it, and tag the
    bead `stranded: needs human` for Step 5.
  {{- end }}

    If any bead was tagged `stranded: needs human` this run, send **one** `mitto_ui_notify` at warning
    level stating how many tickets have completed research but no draft, and what a human must run to
    finish them. Never report a recovery that did not happen.

    ❌ **Never** re-run **"Support: investigate"** on a bead with actionable findings from its
    latest investigation — only its drafting turn is missing. ❌ **Never** write, rewrite or replace
    a draft here, and never re-queue composition when an unposted DRAFT `[OUTBOUND]` comment
    already exists: that draft is waiting for review in **"Support: reply to user"**.
    ❌ **Never** set or mutate permission flags on a child to make a recovery possible.
  {{- if and .Permissions.CanStartConversation .Permissions.CanSendPrompt }}

  - **Dispatch investigable beads — MANDATORY.** Cap at **3 new children per run** (highest priority /
    oldest first). First dedup against `{{ .Children.MCPText }}` using the bead ID in the child's
    `beads_issue` / title. If its child is prompting or has queued work, leave it alone and tag the
    bead `already covered by <child-id>`. If its child is idle **with no queued prompts**, reuse it:
    ```
    mitto_conversation_send_prompt(
      self_id: "{{ .Session.ID }}",
      conversation_id: "<existing-child-id>",
      prompt_name: "Support: investigate",
      arguments: { "IssueID": "<bead id>" })
    ```
    This handles a new customer follow-up after an earlier inconclusive investigation without
    spawning a duplicate. Count a successful re-queue as `reused <child-id>`; if it fails, write a
    deduped NEXT note with the error and tag it `deferred: dispatch failed` rather than claiming it
    is already covered. Never re-queue research for a bead with an unposted draft or actionable
    findings still awaiting the recovery sub-step.
    For **every remaining** investigable bead up to the new-child cap, issue the spawn call **this
    run** — do not defer it to the next iteration, do not describe it as "ready for investigation",
    do not list it under "next actions". For each selected bead `<id>` spawn (do **not** pre-set the
    state here — the child's own Step 2 owns the `state:gathering-info` transition):
    ```
    mitto_conversation_new(
      self_id: "{{ .Session.ID }}",
      title: "Investigate <id>: <short summary>",
      beads_issue: "<id>",
      prompt_name: "Support: investigate",
      arguments: { "IssueID": "<id>" })
    ```
    Do **not** pin an `acp_server` or a model here — each phase of the child declares its own model
    preference (research runs under a reasoning-tier model, drafting under a coding-tier model), and
    an override at spawn time would fight those per-phase preferences.
    If the spawn fails, record the error in a deduped NEXT note and notify the operator; tag the bead
    `deferred: dispatch failed`. Do not count a failed spawn as a successful dispatch.
    The child derives the Slack channel from the bead's `metadata.slack_channel` at render
    time (set when the bead was created, per the Beads tracking model above), so no channel
    argument is needed here.
    The child then runs **two phases in that one conversation**: (1) "Support: investigate" gathers
    the answer from the channel's playbook fragments under **`.mitto/support/{{ $channel }}/`**
    (owning `investigation.md`, `resources.md`, `escalation.md`, and optionally `redirects.md`) and
    records `[CONTEXT]` findings while the bead stays `gathering-info`; (2) if the findings are
    conclusive it queues **"Support: compose draft"** onto itself, and that next turn writes the
    `[OUTBOUND]` DRAFT and sets `state:drafting`. That self-handoff only works because this
    conversation holds **Can Send Prompt** and the child inherits it — which you verified **before**
    spawning, above. Never spawn the split child when that permission is missing, and never pretend
    the handoff happened; the watcher still never drafts on its behalf. **Do not wait** for the children; they report their
    own results on the bead and via their own notifications. This run continues to its summary while
    investigations proceed in the background; a later iteration's Step 3 reconcile will pick up their
    `state:drafting` / `need-info` outcomes. Because the draft lands a turn **after** the research,
    a bead may legitimately sit at `gathering-info` across one or two iterations — that is in-flight,
    not stuck, and must never be re-dispatched or reaped.
  - **Beyond the cap / already in flight.** Investigable beads not dispatched this run because they
    are over the new-child cap or have a busy existing child are left as-is for the next iteration;
    do **not** investigate them inline. Record the explicit reason (`deferred: over 3-cap (rank #4)`
    or `already covered by <child-id>`).
  - **Pre-Step-5 disposition gate — check before writing the summary.** For **every** bead on your
    investigable list, you must be able to state one of exactly these outcomes for **this run**:
    - `spawned <child-id>` — a fresh `mitto_conversation_new` call landed this run, or
    - `reused <child-id>` — a fresh investigation turn was queued on an idle existing child, or
    - `already covered by <child-id>` — an open, non-idle child from `{{ .Children.MCPText }}` is
      already investigating this bead, or
    - `deferred: over 3-cap` — the bead ranked below the top 3 by priority/age (record its rank), or
    - `deferred: dispatch failed` — a send/spawn attempt failed (record a deduped NEXT note and
      notify the operator).

    If **any** investigable bead has none of these dispositions, you have **not** executed Step 4 —
    go back and dispatch now (respecting the cap). Only once every investigable bead carries one of
    these tags may you move to Step 5.
  {{- else if .Permissions.CanStartConversation }}

  - **Dispatch is blocked: this conversation lacks *Can Send Prompt*.** Children inherit this
    conversation's advanced settings, so a child spawned now could research a bead but could
    **never** queue its own "Support: compose draft" turn — the ticket would stall silently at
    `gathering-info`. **Do not perform the split spawn**, do not spawn a research-only child "to
    make progress", do **not** investigate or draft inline, and do **not** attempt to set or mutate
    permission flags on a child — inheritance from this conversation is the only mechanism. Never
    report a dispatch that did not happen. Instead, for **every** investigable bead:
    1. Leave its `state:*` **unchanged** (nothing is actually investigating it).
    2. Record a short **NEXT note** on the bead so a human (or a later run with the permission
      restored) knows exactly what to do, e.g.:
      ```
      bd comment <id> --stdin
      ```
      with a body like
      `**[STATE · YYYY-MM-DD HH:MM UTC]** NEXT: needs investigation — watcher could not dispatch a child (Can Send Prompt is off on the watcher, so a child could not hand off to "Support: compose draft"). Run "Support: investigate" on this bead manually, or enable Can Send Prompt on the watcher conversation so it can dispatch it.`
      Write this note **once** — if the bead already carries an identical un-actioned NEXT note from a
      previous run, do not duplicate it.
    3. Tag it `deferred: no-send-prompt-permission` for Step 5.

    Then send a single `mitto_ui_notify` naming how many beads are blocked this way and stating that
    **Can Send Prompt** must be enabled on **this watcher conversation** (not on the children) before
    the next run, because children inherit the watcher's advanced settings.
  {{- else }}

  - **Child spawning is unavailable** (the *Can start conversation* permission is off). **Do not fall
    back to investigating or drafting inline** — not for one bead, not for the highest-priority bead,
    not "just to make progress". Research and drafting belong to the per-ticket children and must
    never run in this watcher. Instead, for **every** investigable bead:
    1. Leave its `state:*` **unchanged** (do not move it to `gathering-info` — nothing is actually
      investigating it).
    2. Record a short **NEXT note** on the bead so a human (or a later run with the permission
      restored) knows exactly what to do, e.g.:
      ```
      bd comment <id> --stdin
      ```
      with a body like
      `**[STATE · YYYY-MM-DD HH:MM UTC]** NEXT: needs investigation — watcher could not dispatch a child (Can start conversation is off). Run "Support: investigate" on this bead manually, or re-enable the permission so the watcher can dispatch it.`
      Write this note **once** — if the bead already carries an identical un-actioned NEXT note from a
      previous run, do not duplicate it.
    3. Tag it `deferred: no-spawn-permission` for Step 5.

    Then send a single `mitto_ui_notify` naming how many beads are blocked this way and that the
    *Can start conversation* permission needs enabling. If you learn a reusable in-scope/out-of-scope
    pattern while triaging, record it on the bead; do not append it to the channel playbook.
  {{- end }}

  - If a bead genuinely cannot be answered without more detail from the customer, leave it in our
    court for investigation or a clarifying-question draft. **Never** set `state:need-info` before
    the clarifying question is actually posted by **"Support: reply to user"**.
  - **Never post to Slack here** (nor do the children). Drafts wait for review in
    **"Support: reply to user"**.
  - If `scope.md` does not exist for this channel, use the generic scope defaults and note the
    missing guidance; do not create or repair the file.

  ### 5. Summary

  - **Always end the iteration with a "what's next" table** listing every open tracked bead you
    touched or reviewed this run, one row per bead:
    `| <id> | <state:*> | <what's next> | <last activity> |`. In the
    **Bead** column use the **full bead ID exactly as `bd` reports it, including the project prefix**
    (e.g. `mitto-u2i`, not the bare suffix `u2i`) — Mitto only recognises and links the full ID, so a
    truncated ID renders as plain text. The **what's next** cell is a short human phrase derived from
    the bead's current `state:*` label (use this exact mapping so it reads the same across runs and
    prompts):

    {{ template "support/shared/whats-next-mapping" (dict "IncludeClosed" true) }}

    **The "What's next" cell must be a markdown link to the Slack thread**, using the phrase above as
    the link text and the bead's stored `slack_url` metadata as the target:
    `[<what's next phrase>](<slack_url>)`. Read `slack_url` from the bead you already loaded this run
    (`bd show <id>` metadata); if for some reason a bead has no `slack_url`, reconstruct the permalink
    from its `slack_thread_ts` (`{{ $ws }}/archives/{{ $channel }}/p<ts_without_dot>`). Only fall back
    to plain text if neither is available.

    **`triaged` / `awaiting-us` rows must carry their Step-4 disposition** so "Needs investigation"
    is never printed as a bare "someone should look at this". Append the disposition tag from the
    Step-4 gate — in parentheses, after the link — using this exact vocabulary:
    - `(— investigating: spawned <child-id>)` — a fresh child was spawned **this run**;
    - `(— investigating: reused <child-id>)` — an idle existing child was sent a new investigation;
    - `(— being investigated by <child-id>)` — an existing child is already working it;
    - `(— queued: over 3-cap, rank #<n>)` — deferred to next iteration by the priority cap;
    - `(— queued: dispatch failed)` — send/spawn failed; a NEXT note and warning were recorded;
    - `(— queued: no-spawn-permission)` — `Can start conversation` is off, so no child could be
      dispatched; a NEXT note was recorded on the bead instead.
    - `(— queued: no-send-prompt-permission)` — `Can Send Prompt` is off on this watcher, so a child
      would inherit it and could not queue its compose turn; no child was dispatched and a NEXT note
      was recorded on the bead instead.

    **`gathering-info` rows that Step 4 found stranded must carry their recovery disposition**, in
    the same parenthesised form:

    - `(— recovered: compose re-queued onto <child-id>)` — the missing drafting turn was queued onto
      the bead's existing child during this run;
    - `(— stranded: needs human)` — research is complete but the drafting turn could not be re-queued;
      a NEXT note was recorded on the bead and the operator was notified.

    A `gathering-info` row with neither tag is simply still in flight and needs no disposition.

    If a `triaged` / `awaiting-us` row has none of these dispositions, Step 4 was not executed for
    that bead — go back to Step 4 and act before printing the summary.

    Render it as (note the **full** IDs, the linked what's-next cell, the `triaged` disposition
    tags, and the relative **Last activity** ages):
    ```markdown
    | Bead | State | What's next | Last activity |
    |------|-------|-------------|---------------|
    | mitto-u2i | drafting | [Ready to reply to user](https://acme.slack.com/archives/C02JYLD3FFU/p1770802214391359) | 3h ago |
    | mitto-9e3 | need-info | [Needs more info from user](https://acme.slack.com/archives/C02JYLD3FFU/p1770891133552019) | 2d ago |
    | mitto-5ce | triaged | [Needs investigation](https://acme.slack.com/archives/C02JYLD3FFU/p1770912223441201) (— investigating: spawned 20260721-…-abcd) | 12m ago |
    | mitto-v22 | triaged | [Needs investigation](https://acme.slack.com/archives/C02JYLD3FFU/p1770913001772440) (— queued: over 3-cap, rank #4) | 5d ago |
    ```
  - Then send a `mitto_ui_notify` summarizing the run: new questions triaged, beads updated, how many
    **investigations were spawned** (and for which beads), and how many beads are `drafting` (ready
    for your review) vs `need-info` vs `awaiting-customer`. On silent runs keep the notify concise but
    **still print the what's-next table** in the run output.
  - **Channel-history self-check before you claim "channel is quiet".** If your summary or
    `mitto_ui_notify` is about to say "channel is quiet", "no new questions", or "0 new questions
    triaged", first confirm you actually made **at least one `slack_get_channel_history*` /
    `conversations_history*` call this iteration** (Step 1's auditable gate). If you did not, you
    have not looked at the channel — go back to Step 1 and fetch channel history **now**, then
    re-do Step 2 (triage) before printing the summary. "Quiet" is only a valid conclusion after an
    actual channel-history read.
  - **Never list an investigable bead under a "next actions" / "recommendations" section as work
    still to do** — by the time you write Step 5 you have either spawned it, confirmed an existing
    child is on it, or deferred it over the 3-cap (all captured inline on the bead's row). The only
    genuine human next actions in this summary are: (a) reviewing beads now in `drafting`, and
    (b) responding to beads in `awaiting-us`.

  ## Notes

  - The bead is the single source of truth — always load it (`bd show` + `bd comments`) before acting.
  - Per-bead follow-ups: **"Support: check status"** (refresh a thread onto its bead),
    **"Support: investigate"** (dig for the answer using the channel playbook + record a draft),
    **"Support: gather more information"** (ask the customer), **"Support: reply to user"** (post our
    answer). All posting requires your explicit approval.
  - The channel playbook lives under **`.mitto/support/{{ $channel }}/`** as topical fragments
    (`scope.md`, `tone.md`, `investigation.md`, `resources.md`, `escalation.md`, `redirects.md`).
    All are read-only unless the user directly requests a specific playbook-file change. Read
    `scope.md` before triaging when present, and record newly learned patterns on beads instead.
  - **Discovery / reconcile / dispatch only** — this watcher never researches a bead and never writes
    a draft reply, in either run mode and regardless of permissions. Step 4 delegates investigable
    beads (`state:triaged` / `awaiting-us`) to parallel one-off children, capped at **3 per run** and
    deduped against existing children so a bead is never investigated twice at once. Each child runs
    **"Support: investigate"** (research only, bead stays `gathering-info`) and then queues
    **"Support: compose draft"** onto itself for the drafting turn, so each phase gets its own model
    tier. Spawned children are **never** loops; this run does not block on them — their
    `state:drafting` / `need-info` outcomes are picked up by a later iteration's reconcile (Step 3).
    When the *Can start conversation* permission is off, Step 4 records a NEXT note on each
    investigable bead and notifies — it does **not** investigate inline.
  - **Child cleanup** — Step 3 reaps finished investigation children each iteration: once a child's
    bead has reached a terminal outcome (`state:drafting` / `need-info`) **and** the child is idle
    with **no queued prompts**, it is **archived** (never deleted, so the transcript stays
    inspectable) to free the max-children cap and keep the dedup list clean. A child whose bead is
    still `gathering-info`, or which has a queued **"Support: compose draft"** turn, is mid-flight
    between its research and drafting phases and is **never** archived.
  - **Stranded tickets are recovered, never redone** — because research and drafting are separate
    turns, a bead can complete research and still never get a draft if the handoff failed. Step 4
    detects that from the bead itself (findings present, no draft, nothing live working it) and
    re-queues **only** the drafting turn onto the bead's existing child; when it cannot, it records a
    NEXT note and notifies instead of claiming a recovery. It never re-investigates a bead that
    already has findings, and never rewrites an existing draft.
