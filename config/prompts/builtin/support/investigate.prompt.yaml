name: 'Support: investigate'
description: 'Research a tracked support question internally using the channel playbook fragments (.mitto/support/<channel-id>/{investigation,resources,escalation}.md) and record the findings on the bead. Research only — drafting the reply is handed off to "Support: compose draft". Never posts to Slack.'
group: Support
backgroundColor: '#D1C4E9'
icon: search
menus: beadsIssues, conversation
enabledWhen: 'CommandExists("bd") && DirExists(".beads") && ((Item.Status != "closed" && "support-question" in Item.Labels) || (Session.HasBeadsIssue && BeadIsOpen(Session.BeadsIssue) && BeadHasLabels(Session.BeadsIssue, "support-question")))'
preferredModels:
  - modelTag: Reasoning
tags:
- support
target:
  reuse:
    issue: true
    coalesce: true
parameters:
  - name: IssueID
    description: 'The beads issue ID to act on (auto-filled from the Beads issue menu)'
    required: false
    type: beadsId
prompt: |-
  {{- $bead := .Session.BeadsIssue -}}
  {{- if eq $bead "" -}}{{ $bead = Arg "IssueID" "" }}{{- end -}}
  {{- $channel := BeadMetadata $bead "slack_channel" -}}
  # Support — Investigate

  {{ template "_shared/session-context" . }}

  {{ template "support/shared/playbook-files-policy" . }}

  ## Description

  Investigate a tracked support question **on our side** — do the research needed to actually answer
  it. Use this when we have enough of the customer's context but still need to **find the answer**:
  follow the channel's playbook fragments (`.mitto/support/<channel-id>/{investigation,resources,
  escalation,scope,tone,redirects}.md` — one topic per file), correlate with what is on the bead, and
  record what you learn as `[CONTEXT]` findings.

  > ⚠️ **This prompt is research-only — it never writes the customer-facing draft.** When the research
  > lands a confident conclusion, it hands off to **"Support: compose draft"**, which writes the
  > `[OUTBOUND]` DRAFT under a drafting-tuned model. This split is deliberate: deep research and
  > customer-facing writing want different model tiers, and a model preference only takes effect at the
  > start of a turn — so the draft must be a **separate turn**.

  > **Applicable state:** any open tracked bead. Typically `state:triaged`, `awaiting-us`, or
  > `gathering-info`. This prompt sets `state:gathering-info` while it works and leaves it there;
  > `state:drafting` is set by **"Support: compose draft"**.

  ## CRITICAL: User Interaction Rules

  {{ template "_shared/no-text-ui" . }}
  >
  > ⚠️ **This prompt NEVER posts to Slack, and never writes a draft.** It only investigates and
  > records findings. The draft is written by **"Support: compose draft"**; posting is done — with
  > your approval — by **"Support: reply to user"**.
  >
  > ⚠️ **If this conversation is an unattended spawned child** (`.Session.IsChild` is true, e.g. you
  > were dispatched by **"Support: watch channel"**), there is nobody watching the chat: use
  > `mitto_ui_notify` only, and **never** call a blocking tool (`mitto_ui_options`, `mitto_ui_form`,
  > `mitto_ui_textbox`) — it would hang the child forever.

  ## Bead writing conventions (descriptions & comments)

  {{ template "beads-issues/shared/markdown-convention" . }}

  {{ template "support/shared/message-comment-key" . }}

  ## Slack tools (names vary by MCP server)

  {{ template "support/shared/slack-tools" (dict "Capabilities" "Here you only need to **read a thread's replies** (to make sure you are investigating the latest ask)." "NoPosting" true "ReadMetadata" true) }}

  ## Step 1: Identify the target bead

  {{ template "support/shared/target-bead-picker" (dict "Ctx" . "Filter" "" "EmptyMessage" "") }}

  ## Step 2: Load history + refresh the thread

  - Load the full history: `bd show <id>` and `bd comments <id>`. The bead is the source of truth.
    Note the current `state:*` label and the stored `slack_thread_ts` / `slack_channel` / `slack_url`.
  - **Guard — already `state:drafting`?** If the bead is in `state:drafting`, a draft reply already
    exists and is waiting for your review — re-investigating would discard that work. Do **not** swap
    the state automatically.
  {{- if .Session.IsChild }}
    - This run is an **unattended child**, so do not ask: `mitto_ui_notify` (info) that the bead
      already has a draft awaiting review with **"Support: reply to user"**, and **stop** without
      changing state or re-investigating. Never call a blocking UI tool here.
  {{- else }}
    - Use `mitto_ui_options` (timeout 300):
      - **Question**: "This bead already has a draft (`state:drafting`). Investigate again anyway?"
      - **Options**: `[{label: "Open reply-to-user instead"}, {label: "Re-investigate anyway"}, {label: "Cancel"}]`.
      - On **"Open reply-to-user instead"** or **"Cancel"** (or timeout): `mitto_ui_notify` (info)
        suggesting **"Support: reply to user"**, and stop without changing state.
      - Only on **"Re-investigate anyway"** proceed with the rest of this step.
  {{- end }}
  - Re-fetch the Slack thread (read-thread-replies tool) using the stored `slack_thread_ts`, and add a
    markdown comment for **each new** message (`[INBOUND]` customer / `[CONTEXT]` others) — "new"
    meaning its Slack `ts` is not already in `bd comments <id>` (see the `ts:` dedup rule). This keeps
    the investigation grounded in the latest ask.
  - Mark that we are actively working it: swap the state label in place (never `bd set-state`):
    `bd update <id> --remove-label state:<previous> --add-label state:gathering-info`, and add a short
    `**[STATE · <time>]** <prev> → gathering-info` comment.

  ## Step 3: Read the channel playbook fragments

  You must work using **this channel's documented playbook**, not by guessing. The playbook is
  stored **per channel** as topical fragments under **`.mitto/support/<channel-id>/`**, where
  `<channel-id>` is the bead's stored `slack_channel` value (from Step 2). Build the exact path
  from that value — e.g. if `slack_channel` is `C0XXXXXXX`, fragments live in
  `.mitto/support/C0XXXXXXX/`. Every fragment is read-only under the policy above. If one is missing,
  note that on the bead when relevant and continue with the generic defaults; do not ask to create it.

  ### 3.1 `investigation.md`

  - {{ template "support/shared/channel-fragment-read" (dict "Channel" $channel "Fragment" "investigation" "Purpose" "learn this channel's investigation method (tool order, safe commands, MCP/CLI tools, confidence rules)" "Owner" "" "OwnerAsk" false) }}

  ### 3.2 `resources.md`

  - {{ template "support/shared/channel-fragment-read" (dict "Channel" $channel "Fragment" "resources" "Purpose" "know which repos, runbooks, dashboards, and docs to consult for this channel" "Owner" "" "OwnerAsk" false) }}

  ### 3.3 `escalation.md`

  - {{ template "support/shared/channel-fragment-read" (dict "Channel" $channel "Fragment" "escalation" "Purpose" "know who/when/how to escalate for this channel" "Owner" "" "OwnerAsk" false) }}

  ### 3.4 `redirects.md`

  - {{ template "support/shared/channel-fragment-read" (dict "Channel" $channel "Fragment" "redirects" "Purpose" "know where out-of-scope questions should go" "Owner" "" "OwnerAsk" false) }}

  ### 3.5 `scope.md` and `tone.md` (readers)

  - {{ template "support/shared/channel-fragment-read" (dict "Channel" $channel "Fragment" "scope" "Purpose" "confirm the question is in scope for this channel before investigating" "Owner" "Support: watch channel" "OwnerAsk" false) }}
  - {{ template "support/shared/channel-fragment-read" (dict "Channel" $channel "Fragment" "tone" "Purpose" "understand the channel's reply conventions so your findings note the right framing (the draft itself is written later by \"Support: compose draft\")" "Owner" "Support: reply to user" "OwnerAsk" false) }}

  ### 3.6 Record reusable findings without editing the playbook

  If you discover a useful pattern, record it on the bead as a `[CONTEXT]` note. Do not append it to
  any file under `.mitto/support/<channel-id>/` unless the user directly requested that exact edit.

  ## Step 4: Investigate

  - **Scope check first.** Using `scope.md` (Step 3.5), confirm the question is something this
    channel is responsible for. If it is clearly **out of scope**, do not fabricate a generic
    answer — record a `[CONTEXT]` note that it is out of scope **and** where it should go (per
    `redirects.md` if present), and treat "redirect the customer" as the conclusion to hand off
    (the redirect wording itself is written by **"Support: compose draft"**). If scope is unclear,
    treat it as in-scope but lower your confidence.
  - Follow `investigation.md` and `resources.md` to actually find the answer. Pull in whatever they
    point to: the Q&A / knowledge tool, docs links, repos, related tickets, prior resolved beads on
    the same topic, and — where safe and useful — **run simple read-only commands locally** (e.g.
    `curl some.domain.com`) and capture the command **and** its output.
  - Correlate findings with the question on the bead. Note confidence, caveats, and any documentation
    links you found (they are valuable in the eventual reply).

  ## Step 5: Record findings on the bead

  - Add a markdown `[CONTEXT]` comment capturing what you investigated and concluded — preserve the
    layout with `$'...'` (real `\n`) or stdin:
    ```
    printf '%s' "$findings_markdown" | bd comment <id> --stdin
    ```
    Header: `**[CONTEXT investigation · YYYY-MM-DD HH:MM UTC]**`. Include: what you checked, the key
    finding(s), any commands + results, documentation links, and a confidence note.
  - End the comment with an explicit **`Conclusion:`** line that is what the drafting phase will build
    on — one of: a confident **answer** (with the supporting links), the specific **clarifying
    question** we must ask the customer, an out-of-scope **redirect** target, or **inconclusive** plus
    what is blocking. Do **not** write customer-facing prose here; this is an internal finding.

  ## Step 6: Decide the outcome (research verdict — no draft here)

  You reach exactly one of two verdicts. **In neither case do you write customer-facing text.**

  - **Findings ready** → the `Conclusion:` from Step 5 is actionable: a confident answer, a specific
    clarifying question we must ask, or an out-of-scope redirect. Leave the bead at
    `state:gathering-info` (the drafting phase moves it to `state:drafting`) and hand off per Step 7.
  - **Inconclusive** → leave `state:gathering-info`, record an explicit `[CONTEXT]` note naming what is
    blocking and what would unblock it, **do not hand off**, **do not write a draft**, and
    `mitto_ui_notify` (info) with the suggested next step. Then stop.

  Never set `need-info` here: `need-info` is a *post-ask* state (we already posted the clarifying
  question and are waiting on the customer), reached only after **"Support: reply to user"** posts.

  ## Step 7: Hand off to the drafting phase

  The customer-facing draft is written by a **separate prompt, in a separate turn**, so it runs under a
  drafting-tuned model. Only do this when Step 6 returned **findings ready**.

  {{- if .Permissions.CanSendPrompt }}

  Queue the drafting phase **onto this same conversation** (not a new child — the research context you
  just built is here, and re-spawning would lose it):

  ```
  mitto_conversation_send_prompt(
    self_id: "{{ .Session.ID }}",
    conversation_id: "{{ .Session.ID }}",
    prompt_name: "Support: compose draft",
    arguments: { "IssueID": "<bead id>" }
  )
  ```

  - `self_id` and `conversation_id` are **both** this conversation's ID — this is a deliberate
    self-enqueue. It lands as the **next turn** of this conversation, which is exactly what makes the
    drafting model preference take effect.
  - Call it **once**, and **only** when the findings are ready. Never call it from the inconclusive
    branch, and never call it twice for the same bead in one run.
  - ✅ After a successful enqueue: `mitto_ui_notify` (info) that research is recorded on the bead and
    the drafting turn is queued. End with a one-line chat summary. **Do not** write a draft yourself,
    and do not keep working — end the turn so the queued drafting turn can start.
  - ❌ If the enqueue **fails** (error, tool unavailable, rejected): do **not** fall back to drafting
    here. Record a `[CONTEXT]` NEXT note on the bead —
    `**[STATE · <time>]** NEXT: findings ready, drafting turn could not be queued (<reason>) — run
    "Support: compose draft" on this bead` — then `mitto_ui_notify` (warning) naming the bead and the
    failure. **Leave the Step 5 findings comment on the bead untouched** — the research must survive the
    failed handoff so the drafting run can pick it up. Leave `state:gathering-info`.
  {{- else }}

  ⚠️ **This conversation cannot queue prompts** (no send-prompt permission), so the drafting phase
  cannot be handed off automatically. **Do not draft here as a fallback** — drafting deliberately runs
  under a different model.

  - Record a `[CONTEXT]` NEXT note on the bead:
    `**[STATE · <time>]** NEXT: findings ready — run "Support: compose draft" on this bead (this
    conversation has no send-prompt permission)`.
  - `mitto_ui_notify` (warning) naming the bead and that **"Support: compose draft"** must be run
    manually. **Leave the Step 5 findings comment on the bead untouched** — the research must survive so
    a later drafting run can pick it up. Leave `state:gathering-info`. Then stop.
  {{- end }}

  - ❌ **NEVER** write an `[OUTBOUND]` comment, a reply fence (the `BEGIN`/`END REPLY` markers), or
    any customer-facing prose in this prompt — in **either** branch.
  - ❌ **NEVER** set `state:drafting` here.
  - ❌ **NEVER** archive or close this conversation after queueing: archiving between the research turn
    and the queued drafting turn destroys the handoff.

  ## Set priority by intervention urgency (final step)

  Finish by setting the bead's priority to match how urgently *you* (the human) must act. This prompt
  is research-only, so it never produces the P1 "draft awaiting your approval" state: findings ready
  with the drafting turn queued, and inconclusive, both leave the bead at `state:gathering-info` and
  therefore **P2** — nothing is waiting on you yet. **P1** arrives later, when
  **"Support: compose draft"** saves the draft and sets `state:drafting`. In general:

  {{ template "support/shared/priority-rubric" . }}

  ## Notes

  - Load the bead (`bd show` + `bd comments`) **before** investigating — it is the source of truth.
  - This prompt is **research-and-record only** — it never posts a reply to the Slack channel, never
    writes a draft, and never presents anything for approval. It records findings and hands off to
    **"Support: compose draft"**, which hands off to **"Support: reply to user"**.
  - Keep the bead the single source of truth: log findings as `[CONTEXT]` and every state change as
    `[STATE]`. The chat transcript is **not** a store — the findings must live on the bead, never only
    in chat.
  - This prompt is usable **manually** (from the Beads issue menu or a conversation) exactly as it is
    from a dispatched child. The only difference is the `state:drafting` guard in Step 2 (blocking
    question when attended, notify-and-stop when unattended) and the handoff in Step 7 (self-enqueue
    when permitted, explicit NEXT note + warning notification when not).
  {{- template "support/shared/channel-post-phase" (dict "Channel" $channel "Phase" "investigate" "When" "the research is complete (Steps 5–7)" "ChannelStep" " (Step 2)") }}
