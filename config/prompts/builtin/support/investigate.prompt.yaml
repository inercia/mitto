name: 'Support: investigate'
description: 'Investigate a tracked support question internally using the channel playbook (.mitto/slack-support-<channel-id>.md), record findings on the bead, and produce a draft reply. Never posts to Slack.'
group: Support
backgroundColor: '#D1C4E9'
icon: search
menus: beadsIssues, conversation, prompts
enabledWhen: 'CommandExists("bd") && DirExists(".beads") && ((Item.Status != "closed" && "support-question" in Item.Labels) || (Session.HasBeadsIssue && BeadIsOpen(Session.BeadsIssue) && BeadHasLabels(Session.BeadsIssue, "support-question")))'
tags:
- support
target:
  reuse:
    issue: true
    coalesce: true
parameters:
  - name: IssueID
    description: 'The beads issue ID to act on (auto-filled from the Beads issue menu)'
    required: false
    type: beadsId
prompt: |-
  # Support — Investigate

  {{ template "_shared/session-context" . }}

  ## Description

  Investigate a tracked support question **on our side** — do the work needed to actually answer it.
  Use this when we have enough of the customer's context but still need to **find the answer**: follow
  the channel's playbook (`.mitto/slack-support-<channel-id>.md` — scope, docs, runbooks, repos, a
  Q&A/knowledge MCP tool, commands, escalation paths, tone/reply guidelines), correlate with what is
  on the bead, record what you learn, and — if you reach a confident answer — leave a **draft reply**
  ready for review.

  > **Applicable state:** any open tracked bead. Typically `state:triaged`, `awaiting-us`, or
  > `gathering-info`. This prompt sets `state:gathering-info` while it works.

  ## CRITICAL: User Interaction Rules

  > ⚠️ **NEVER use text-based interaction prompts.**
  >
  > - ❌ NEVER ask the user to type a number, command, or keyword to make a selection
  > - ❌ NEVER present numbered options and ask the user to respond with text
  > - ✅ ALWAYS use `mitto_ui_options` for choices, `mitto_ui_textbox` for review/editing,
  >   `mitto_ui_form` for structured input, and `mitto_ui_notify` for non-blocking notifications
  >
  > ⚠️ **This prompt NEVER posts to Slack.** It only investigates and records a draft. Posting is
  > done — with your approval — by **"Support: reply to user"**.

  ## Bead writing conventions (descriptions & comments)

  - **Always write in GitHub-flavored Markdown.** Every bead **description** (`-d`) and every
    **comment** you add must be valid markdown — use headings, **bold**, `inline code`, fenced code
    blocks, bullet/numbered lists and links so the bead is readable in the UI. Preserve real line
    breaks: build the text with `$'...'` (real `\n`) or, for anything multi-line, pipe via stdin
    (`printf '%s' "$md" | bd comment <id> --stdin`) — never collapse a comment into one flat line.
  - **The proposed reply to the user MUST be enclosed in a clearly delimited block** so a human (or a
    downstream prompt) can identify *exactly* what we would send to the customer, character-for-character.
    Wrap **only** the reply text between these two fences, on their own lines:
    ```
    --- BEGIN REPLY ---
    <the exact message we would send to the user, in markdown>
    --- END REPLY ---
    ```
    Put nothing else inside the fences (no meta-commentary, no headers) — everything outside the fences
    (the `[OUTBOUND]` header, notes, confidence) is context, and everything *inside* is the verbatim
    reply. Use this same block anywhere a draft or a to-be-posted reply is recorded.

  ## Slack tools (names vary by MCP server)

  Match Slack MCP tools **by capability, not exact name**. Here you only need to **read a thread's
  replies** (to make sure you are investigating the latest ask). Read the target channel and parent
  `thread_ts` from the bead metadata (`slack_channel` / `slack_thread_ts`). No posting tool is needed.

  ## Step 1: Identify the target bead

  {{ $target := "" -}}
  {{ if .Session.BeadsIssue }}{{ $target = .Session.BeadsIssue }}{{ else if .Args.IssueID }}{{ $target = .Args.IssueID }}{{ end -}}
  {{ if $target }}
  - This prompt was launched from bead **`{{ $target }}`** — operate on it directly (skip the picker).
  {{- else }}
  - **No linked bead** — show a picker: list open tracked questions
    `bd list -l support-question --status open,in_progress --all` (read each `state:*` label from
    `bd show`). Present them with `mitto_ui_options` (first option `{label: "None - Cancel"}`, then
    one `{label: "<id> [state] — <short summary>"}` per bead, timeout 300). If the user cancels,
    acknowledge and stop.
  {{- end }}

  ## Step 2: Load history + refresh the thread

  - Load the full history: `bd show <id>` and `bd comments <id>`. The bead is the source of truth.
    Note the current `state:*` label and the stored `slack_thread_ts` / `slack_channel` / `slack_url`.
  - **Guard — already `state:drafting`?** If the bead is in `state:drafting`, a draft reply already
    exists and is waiting for your review — re-investigating would discard that work. Do **not** swap
    the state automatically. Instead use `mitto_ui_options` (timeout 300):
    - **Question**: "This bead already has a draft (`state:drafting`). Investigate again anyway?"
    - **Options**: `[{label: "Open reply-to-user instead"}, {label: "Re-investigate anyway"}, {label: "Cancel"}]`.
    - On **"Open reply-to-user instead"** or **"Cancel"** (or timeout): `mitto_ui_notify` (info)
      suggesting **"Support: reply to user"**, and stop without changing state.
    - Only on **"Re-investigate anyway"** proceed with the rest of this step.
  - Re-fetch the Slack thread (read-thread-replies tool) using the stored `slack_thread_ts`, and add a
    markdown comment for **each new** message not yet captured (`[INBOUND]` customer / `[CONTEXT]`
    others). Do not duplicate existing comments — this keeps the investigation grounded in the latest
    ask.
  - Mark that we are actively working it: swap the state label in place (never `bd set-state`):
    `bd update <id> --remove-label state:<previous> --add-label state:gathering-info`, and add a short
    `**[STATE · <time>]** <prev> → gathering-info` comment.

  ## Step 3: Read the channel playbook (the per-channel knowledge file)

  You must work using **this channel's documented playbook**, not by guessing. The playbook is stored
  **per channel** in **`.mitto/slack-support-<channel-id>.md`**, where `<channel-id>` is the bead's
  stored `slack_channel` value (from Step 2). Build the exact path from that value — e.g. if
  `slack_channel` is `C0XXXXXXX`, the file is `.mitto/slack-support-C0XXXXXXX.md`.

  This file is the **authoritative guide for everything about this channel**, not just investigation.
  A complete playbook covers:
  - **Areas of expertise / scope** — what this channel is (and is **not**) responsible for; the
    topics we are experts in versus questions to redirect elsewhere.
  - **Investigation method** — which repos to search, which docs/runbooks/knowledge bases to consult,
    common patterns, and how to use any relevant MCP tools.
  - **Escalation paths** — who/what to escalate to, and when.
  - **Tone & addressing customers** — how we speak to this channel's audience.
  - **Reply guidelines** — house style for answers (length, hedging, links, do's and don'ts).

  1. **Read it.** Check whether the channel playbook exists.
     - **If it exists** — read it in full. Follow its investigation method and scope rules in Step 4,
       and honor its tone/reply guidelines when you draft.
     - **If it does NOT exist** — do not silently guess. Create the `.mitto/` directory if missing,
       then use `mitto_ui_form` / `mitto_ui_textbox` to ASK the user for this channel's playbook: its
       areas of expertise / scope, how to investigate answers (repos, docs, commands, knowledge
       bases, MCP tools, people), escalation paths, and how to address/reply to customers. Do not
       settle for a vague answer — re-ask for specifics. Write it to
       `.mitto/slack-support-<channel-id>.md` (create the file) and confirm the write, so future runs
       find it. If nobody responds (timeout), record a `[CONTEXT]` note that no playbook exists yet
       and stop.
  2. **Keep it current.** If you discover a new useful pattern during this investigation (a better
     search, a docs link that answered it, a recurring issue + resolution, an escalation contact, or
     a tone/phrasing that worked well), **append it** to `.mitto/slack-support-<channel-id>.md` so
     future runs benefit.

  ## Step 4: Investigate

  - **Scope check first.** Using the playbook's *areas of expertise / scope*, confirm the question is
    something this channel is responsible for. If it is clearly **out of scope**, do not fabricate a
    generic answer — record a `[CONTEXT]` note that it is out of scope (and where it should go, if the
    playbook says), and draft a brief redirect instead of a solution. If scope is unclear, treat it as
    in-scope but lower your confidence.
  - Follow the channel playbook to actually find the answer. Pull in whatever it points to: the
    Q&A / knowledge tool, docs links, repos, related tickets, prior resolved beads on the same topic,
    and — where safe and useful — **run simple read-only commands locally** (e.g. `curl
    some.domain.com`) and capture the command **and** its output.
  - Correlate findings with the question on the bead. Note confidence, caveats, and any documentation
    links you found (they are valuable in the eventual reply).

  ## Step 5: Record findings on the bead

  - Add a markdown `[CONTEXT]` comment capturing what you investigated and concluded — preserve the
    layout with `$'...'` (real `\n`) or stdin:
    ```
    printf '%s' "$findings_markdown" | bd comment <id> --stdin
    ```
    Header: `**[CONTEXT investigation · YYYY-MM-DD HH:MM UTC]**`. Include: what you checked, the key
    finding(s), any commands + results, documentation links, and a confidence note.

  ## Step 6: Decide the outcome

  - **Confident answer found** → record a **proposed reply** as an `[OUTBOUND]`-style *draft* comment
    clearly marked **"DRAFT — not yet posted"** (this is the same draft **"Support: reply to user"**
    reuses). Header `**[OUTBOUND us · DRAFT — not yet posted · YYYY-MM-DD HH:MM UTC]**`, then the reply
    itself **enclosed in the `--- BEGIN REPLY ---` / `--- END REPLY ---` block** (see **Bead writing
    conventions**) so the exact customer-facing text is unambiguous. Then set `state:drafting`
    (`bd update <id> --remove-label state:gathering-info --add-label state:drafting`) and hand off per
    Step 7.
  - **Still missing customer detail** → we need to **ask the customer**, but we must not mark the bead
    as `need-info` yet: `need-info` means *we have already posted the question and are waiting on the
    customer*. Until we actually post, the clarifying question is **our** pending action, exactly like an
    answer draft. So treat the clarifying **question as a draft**: record it as an `[OUTBOUND]`-style
    *draft* comment clearly marked **"DRAFT — not yet posted"** (header
    `**[OUTBOUND us · DRAFT (request for info) — not yet posted · YYYY-MM-DD HH:MM UTC]**`), with the
    question itself **enclosed in the `--- BEGIN REPLY ---` / `--- END REPLY ---` block** (see **Bead
    writing conventions**). Then set `state:drafting`
    (`bd update <id> --remove-label state:gathering-info --add-label state:drafting`), note what is
    missing, and hand off per Step 7 — **"Support: reply to user"** reviews and posts it (a clarifying
    question posts through the same review/approve/post path as any answer). Do **not** set `need-info`
    here.
  - **Inconclusive** → leave `state:gathering-info`, record what is blocking, and `mitto_ui_notify`
    (info) with the suggested next step. Then stop.

  ## Step 7: Hand off the draft (do NOT dump it as chat text, do NOT ask for approval here)

  Once a draft is saved and the bead is `state:drafting`, your job is done. **Posting — with an
  editable review and explicit approval — is the job of "Support: reply to user", not this prompt.**

  - ❌ **NEVER** paste the full draft into the chat as plain text.
  - ❌ **NEVER** ask a free-text "approve / hold / post?" question. This prompt does not post, so it
    must not offer to post.
  - ✅ **Persist first** — the draft is already saved as an `[OUTBOUND]` DRAFT comment on the bead
    (Step 6); that bead comment is the single source of truth for the reply. Do not rely on the chat
    transcript to carry the draft.
  - ✅ Send a short **`mitto_ui_notify`** (success): a draft is ready and **saved on the bead**, review
    and post it with **"Support: reply to user"**. Include the bead ID. Do not include the full draft
    body in the notification — just confirm it is saved and where to review it.
  - ✅ End with a brief one-line chat summary (state is now `drafting`; draft saved on the bead;
    next step is **"Support: reply to user"**). Do not reproduce the draft.

  ## Set priority by intervention urgency (final step)

  Whatever outcome you reached in Step 6, finish by setting the bead's priority to match how urgently
  *you* (the human) must act. This prompt produces one of two outcomes and prices them accordingly: a
  saved draft — whether it is an **answer** or a **clarifying question** — makes it **P1**
  (`state:drafting`, pending *your* approval to post), while still-investigating (`gathering-info`)
  makes it **P2**. Note we never set `need-info` here: `need-info` is a *post-ask* state (we already
  posted the clarifying question and are waiting on the customer), reached only after
  **"Support: reply to user"** posts the draft. In general:

  - **P1 (HIGH)** — a draft (reply or clarifying question) is pending **your** approval
    (`state:drafting`); bump to **P0** only if it answers an escalation / outage / broad-impact thread.
  - **P2 (MEDIUM)** — in motion, our court, not blocked on your approval: `triaged` / `gathering-info`
    / `awaiting-us`.
  - **P3 (LOW)** — waiting on the customer, nothing for you to do now: `awaiting-customer` / `need-info`
    (we just posted a reply or a clarifying question; the ball is in their court).

  Apply with `bd update <id> --priority <n>` (n is `0`–`3`, 0 = highest) and add a short
  `**[PRIORITY · <time>]** P<old> → P<new> (<reason>)` comment when it changes.

  ## Notes

  - Load the bead (`bd show` + `bd comments`) **before** investigating — it is the source of truth.
  - This prompt is **investigate-and-record** — it never posts a reply to the Slack channel, and it
    never presents the draft for approval. It saves the draft on the bead and hands off.
  - Keep the bead the single source of truth: log findings as `[CONTEXT]`, the draft as a marked
    `[OUTBOUND]` DRAFT, and every state change as `[STATE]`. The chat transcript is **not** a store —
    the draft must live on the bead, never only in chat.
