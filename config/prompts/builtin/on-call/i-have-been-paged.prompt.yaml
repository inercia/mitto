icon: alert-circle
name: 'On-Call: I have been paged'
menus: prompts, !promptsLoop
description: 'Kick off incident triage — read the incident sources (links, Slack channels, tickets, notes) supplied as a parameter, create a beads epic, ingest context from Slack / web pages / GitHub in parallel, decompose into sub-tasks, and dispatch a curious child investigator per sub-task. Every finding is written back to the corresponding bead.'
group: On-Call
backgroundColor: '#FFCDD2'
enabledWhen: '!Session.IsChild && CommandExists("bd") && Permissions.CanStartConversation'
preferredModels:
  - modelTag: Coding
parameters:
  - name: Title
    type: text
    required: false
    description: >-
      Short one-line incident title, used as the beads epic title. If omitted,
      the agent derives one from the supplied sources.
  - name: Sources
    type: text
    multiLine: true
    required: false
    description: >-
      One entry per line — any mix of incident links (Slack war-room URLs,
      JIRA / GitHub / PagerDuty / Statuspage tickets, Grafana / Splunk / Datadog
      dashboards, runbooks, past reports, code), bare Slack channel names, and
      free-form notes from the pager or hand-off. The agent parses this list,
      classifies each entry, and gathers context from every source.
  - name: InvestigationInstructions
    type: filename
    group: Advanced
    required: false
    default: .mitto/cso/investigation.md
    dir: .mitto/cso
    glob:
      - "*.md"
    remember: folder
    description: >-
      Workspace-relative primary investigation playbook, inlined verbatim into
      every child investigator's prompt. Defaults to `.mitto/cso/investigation.md`.
  - name: EscalationInstructions
    type: filename
    group: Advanced
    required: false
    default: .mitto/cso/escalation.md
    dir: .mitto/cso
    glob:
      - "*.md"
    remember: folder
    description: >-
      Workspace-relative escalation playbook, consulted when a credible
      mitigation cannot be found. Defaults to `.mitto/cso/escalation.md`.
  - name: ReportsDir
    type: text
    group: Advanced
    required: false
    default: reports
    remember: folder
    description: >-
      Workspace-relative folder holding one report file per calendar day, named
      `<ReportsDir>/YYYY-MM-DD.md`. Shared with `On-Call: watch and summarize`
      (kept in sync). When the folder exists, a child searcher mines it for
      past incidents similar to this one. Defaults to `reports`.
prompt: |-
  {{ $investigationFile := Arg "InvestigationInstructions" ".mitto/cso/investigation.md" -}}
  {{ $escalationFile := Arg "EscalationInstructions" ".mitto/cso/escalation.md" -}}
  {{ $reportsDir := Arg "ReportsDir" "reports" -}}
  {{ $title := Arg "Title" "" -}}
  {{ $sources := Arg "Sources" "" -}}
  {{ template "_shared/session-context" . }}
  Available ACP servers: `{{ Default "(none)" .ACP.AvailableText }}`
  Existing children: `{{ Default "(none)" .Children.MCPText }}`

  # On-Call: I Have Been Paged

  You are helping an on-call engineer triage a live incident. This prompt orchestrates the opening minutes: parse the incident sources, open a tracker epic, ingest context in parallel, decompose the epic into sub-tasks, and dispatch one curious child investigator per sub-task. You act as the **coordinator** — real digging happens in the children.

  ## Communication style

  This is a live Ops incident — the operator is under pressure and scanning fast. Communicate accordingly throughout every step below:

  - **Be concise.** Prioritize short, focused answers over comprehensive explanations. Direct language, no filler, no over-explaining, no restating the obvious. If one line will do, use one line.
  - **Format for scannability.** Lead with the key fact. Use **bold** for the signal that matters (bead IDs, symptoms, decisions, blockers), and lean on lists, tables, code blocks, and short headings so the operator can absorb your output at a glance rather than reading prose.
  - **Narrate progress.** Before and between significant actions (ingesting a source, creating the epic, dispatching investigators), post a brief status update saying **what you're doing and why** — never disappear into silent long-running work. Keep each update to a sentence or two.

  {{ template "beads-issues/shared/bootstrap" . }}

  ## Step 1 — Parse the incident sources

  The operator supplied the incident sources as a parameter — do NOT open a form or ask questions in text.

  **Incident title (from the `Title` parameter):**

  ```
  {{ $title }}
  ```

  {{ if $title -}}
  **First, rename this conversation to the incident title** so it is easy to spot in the conversation list — do this immediately, before anything else:

  ```
  mitto_conversation_update(self_id: "{{ .Session.ID }}", conversation_id: "self", name: "{{ $title }}")
  ```
  {{- else -}}
  The `Title` parameter is empty, so defer renaming this conversation until you have derived a concise incident title below. As soon as you have that derived title, rename this conversation to it (before Step 2):

  ```
  mitto_conversation_update(self_id: "{{ .Session.ID }}", conversation_id: "self", name: "<derived incident title>")
  ```
  {{- end }}

  **Incident sources (from the `Sources` parameter, one entry per line):**

  ```
  {{ $sources }}
  ```

  Parse the `Sources` block **line by line**. Trim whitespace, ignore blank lines, and classify each non-blank line into exactly one bucket:

  1. **Slack** — a Slack war-room / archive URL (`https://<workspace>.slack.com/archives/…`) **or** a bare channel reference (`#incident-foo`, `incident-foo`).
  2. **Ticket** — JIRA (`…/browse/…`), GitHub issue/PR (`github.com/…/issues|pull/…`), PagerDuty, Statuspage, etc.
  3. **Dashboard** — Grafana, Splunk, Datadog, Kibana, or any other observability URL.
  4. **Other reference** — runbook, past report, code link, or any URL that fits none of the above.
  5. **Note** — any line that is not a URL and not a bare channel name is treated as a free-form note.

  Build the bucketed list before continuing; it drives Step 3. Determine the epic title: use the `Title` parameter verbatim if non-empty; otherwise derive a concise one-line title from the strongest signal in the sources (the first ticket summary, Slack channel topic, or the first note).

  Validate: if **both** `Title` and `Sources` are empty, there is nothing to triage — notify via `mitto_ui_notify(self_id: "{{ .Session.ID }}", style: "warning", title: "No incident sources supplied", message: "Re-run this prompt with at least one link, channel, ticket, or note in the Sources parameter.")` and stop.

  ## Step 2 — Create the tracking epic in beads

  Compose an epic body from the parsed sources — the title (Step 1), a "Reported at" timestamp, the raw entries grouped by the buckets from Step 1, and the free-form notes verbatim. Create the epic with `bd`:

  ```bash
  bd create "<title from Step 1>" \
    --type epic \
    --priority 1 \
    --label on-call,incident \
    --body-file /tmp/on-call-epic-body.md
  ```

  Capture the returned bead ID (call it `<EPIC_ID>`) and immediately attach this conversation to the epic so the UI links the two:

  ```
  mitto_conversation_update(self_id: "{{ .Session.ID }}", conversation_id: "self", beads_issue: "<EPIC_ID>")
  ```

  Then surface progress: `mitto_ui_notify(self_id: "{{ .Session.ID }}", title: "Incident epic created", message: "<EPIC_ID> — ingesting context…", style: "info", beads_issue: "<EPIC_ID>")`.

  ## Step 3 — Ingest context from the incident sources (sequential, in this conversation)

  Do **not** spawn children for this step. The goal here is only to read what the operator already handed you and consolidate it into the epic — that is a straight information-gathering pass, not reasoning, and it belongs in the coordinator's own turn so the results are immediately available for Step 4 without any cross-conversation coordination.

  Walk the buckets from Step 1 **in this order**, and within each bucket process the entries **one at a time** (never in parallel batches):

  1. **Slack** — for each Slack URL, use the Slack MCP tools if available (`conversations_history_*`, `conversations_replies_*`, `conversations_get_permalink_*`) to fetch the parent message and full thread. For a bare channel name (`#incident-foo`), resolve it to a channel via the Slack MCP tools and read its recent history. Fall back to `web-fetch` only if no Slack MCP tool is configured.
  2. **Tickets** — JIRA, GitHub issues/PRs, PagerDuty, Statuspage. Prefer the specialised MCP tool (JIRA MCP, GitHub MCP) when available; fall back to `web-fetch` or `Playwright`.
  3. **Dashboards** — Grafana, Splunk, Datadog, Kibana, etc. Use `web-fetch` for a snapshot of what the operator was looking at; if a dashboard requires interaction (login, time-range picker), use Playwright to open it and capture the visible panels. Do NOT try to run new queries — only capture what the URL itself points at.
  4. **Other references** — runbooks, past reports, code links. Use `web-fetch` (or the repo's file-reading tools if the link points into this workspace).
  5. **Notes** — the free-form note lines from Step 1 are already text; fold them directly into your working notes (nothing to fetch).

  For every source, extract into your working notes: **who / what / where / when / affected components / timeline / what has already been tried / open questions / references cited inside the fetched content**. Keep observations separate from hypotheses.

  If a source fails to fetch (auth wall, 404, network error), record the failure with the entry and the error message — do NOT retry more than twice, and do NOT abort the whole step because one link is unreachable.

  Once every source has been walked, consolidate all findings into a single Markdown document with these sections:

  - **Ingested sources** — bullet list of every source, tagged `[ok]` / `[failed: <reason>]`.
  - **Situation summary** — 5–10 bullets covering who / what / where / when / affected components.
  - **Timeline so far** — chronological bullets (`HH:MM UTC — <event>`) extracted from the fetched material.
  - **Actions already taken** — anything the pager thread or ticket comments say has been tried.
  - **Open questions & gaps** — what the fetched material does NOT answer.
  - **Cross-references** — bead IDs, related tickets, related PRs / commits, dashboards mentioned inside the fetched content.

  Write this document to `/tmp/on-call-ingest-<EPIC_ID>.md` and append it to the epic:

  ```bash
  bd comment <EPIC_ID> --file /tmp/on-call-ingest-<EPIC_ID>.md
  ```

  (Use `--file`, never a backtick heredoc — see the `.mitto` conventions rule about `bd comment`.)

  Surface progress once: `mitto_ui_notify(self_id: "{{ .Session.ID }}", title: "Context ingested", message: "<EPIC_ID>: <N> sources processed (<K> failed).", style: "info", beads_issue: "<EPIC_ID>")`.
  {{ template "on-call/shared/prior-reports" (dict "Ctx" . "ReportsDir" $reportsDir "Mode" "search") }}
  ## Step 4 — Investigation playbook

  {{ template "on-call/shared/investigation-playbook" (dict "File" $investigationFile) }}

  ## Step 5 — Synthesize context and decompose the epic

  Read the epic's fresh comments (`bd comments <EPIC_ID>`) — the ingest document you wrote in Step 3 is now on the epic. Cross-reference the incident's symptoms (from Step 3) against the playbook you loaded in Step 4: the playbook's failure-mode sections tell you which components/data-sources to interrogate for the symptoms you saw. Produce, inline in this conversation:

  1. A **consolidated situation summary** (5–10 bullets: symptoms, blast radius, timeline, current hypotheses, gaps).
  2. A **sub-task list** — 2–5 independent investigation angles you would pursue in parallel, each grounded in a specific playbook section when possible (e.g. "Symptom = intermittent 5xx from service-X + Playbook §DNS → sub-task: verify CoreDNS health and resolution latency for service-X's dependencies"). Each sub-task must be **disjoint** (different services / dashboards / hypotheses) so multiple children can work at once without stepping on each other. Do NOT include remediation or mitigation actions here — this prompt only opens investigation angles. For **each** sub-task, also record its **prerequisites** — the specific facts/identifiers a child would need up front to investigate it (service name, pod/host, exact error signature, time window, dashboard URL, dependency endpoint, etc.) — and mark whether each prerequisite is already known from Step 3 or still missing. A sub-task whose prerequisites you cannot satisfy is not a viable child yet.

  Present the sub-task list as a Markdown table (columns: `#`, `Title`, `Investigation angle`, `Playbook section` (cite the runbook heading, or `—` if none), `Prerequisites` (what the child must know up front, and whether it is known), `Data sources to consult`), then proceed to Step 6. Do **not** blindly spawn every row: Step 6 first checks each sub-task's prerequisites and only dispatches the ones that are ready (gathering any cheaply-obtainable missing prerequisite inline first, and deferring any sub-task whose prerequisites cannot be obtained). Do NOT ask the operator to confirm before spawning the ready ones — this is a live incident and the investigators are read-only, non-destructive information gatherers, so opening the ready ones automatically is safe and saves the operator's attention for decisions that actually need it. Post the table as a status update (so the operator can see what you are spawning, unblocking, and deferring).

  ## Step 6 — Dispatch investigators and synthesize

  {{ template "on-call/shared/dispatch-investigators" . }}

  {{ template "on-call/shared/escalation-playbook" (dict "File" $escalationFile) }}

  ## Step 7 — Self-reflection and playbook improvement

  Once the investigation angles have been dispatched and their findings synthesized, step back and reflect on **the triage process itself** — not the incident. The goal is to turn each incident into a lesson that sharpens the next one.

  Think honestly through:

  - **What went well** — which steps flowed smoothly, which sources were quick to ingest, which playbook sections pointed you straight at the right components, which sub-task decomposition proved accurate.
  - **What went badly** — where you stalled, backtracked, or chased a dead end; which sources were hard to reach or ambiguous; where the sub-tasks overlapped or missed an obvious angle.
  - **Instructions quality** — which parts of *this* prompt and the investigation playbook (`{{ $investigationFile }}`) were **accurate and helpful**, which were **confusing, misleading, ambiguous, or outdated**, and which were **missing** (a technique, query, dashboard, or failure mode you needed but the playbook did not cover).

  Write a concise **Self-reflection summary** (5–10 bullets) covering the above, and append it to the epic so it travels with the incident record:

  ```bash
  bd comment <EPIC_ID> --file /tmp/on-call-reflection-<EPIC_ID>.md
  ```

  (Use `--file`, never a backtick heredoc.)

  Then, **only if the reflection surfaced clear, concrete improvements** to the investigation rules, propose them:

  - If the investigation playbook exists at `{{ $investigationFile }}`, draft a precise, minimal patch (which section to add/edit, the exact wording, and *why* — grounded in what you just observed this incident). Present the proposed change to the operator via `mitto_ui_options(self_id: "{{ .Session.ID }}", timeout_seconds: 180)` with **Question**: "Apply this improvement to the investigation playbook?" and **Options**: `[{label: "Yes — apply the edit"}, {label: "Edit the proposal first"}, {label: "No — just record it"}]`.
    - On **"Yes"**, apply the edit to `{{ $investigationFile }}` and note it in the reflection summary.
    - On **"Edit the proposal first"**, use `mitto_ui_textbox` to let the operator revise the wording, then apply the revised version.
    - On **"No"** or timeout, record the proposed improvement in the reflection summary only (do not modify the file).
  - If the playbook does **not** exist, record any recurring gaps in the reflection summary as a recommendation to create one — do not create the file unprompted.

  Keep proposals surgical: only suggest a change when the incident gave you concrete evidence that the current instructions were wrong, confusing, or incomplete. If nothing clear emerged, state that explicitly ("No playbook changes warranted this incident") and move on.

  {{ template "on-call/shared/guardrails" . }}
