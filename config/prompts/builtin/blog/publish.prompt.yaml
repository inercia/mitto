icon: rocket-launch
name: 'Blog: publish'
menus: beadsIssues, prompts
parameters:
  - name: IssueID
    type: beadsId
    required: false
    description: The bead whose blog draft to publish
description: 'Blog - publish a finalised blog/blog:draft post whose body lives in the bead description, following .mitto/blog/publish.md (asking + persisting it when absent); best-effort converts the Markdown body to the destination format, records a publish comment and adds blog:published/removes blog:draft+blog:needs-*+blog:ready (does NOT close the bead)'
backgroundColor: '#C8E6C9'
group: Blog
enabledWhen: 'CommandExists("bd") && DirExists(".beads") && (("blog" in Item.Labels && "blog:draft" in Item.Labels && !("blog:published" in Item.Labels)) || (Session.HasBeadsIssue && BeadIsOpen(Session.BeadsIssue) && BeadHasLabels(Session.BeadsIssue, "blog,blog:draft") && !BeadHasLabels(Session.BeadsIssue, "blog:published")))'
target:
  reuse:
    issue: true
    coalesce: true
preferredModels:
  - modelTag: Coding
prompt: |
  {{ $target := "" -}}
  {{ if .Session.BeadsIssue }}{{ $target = .Session.BeadsIssue }}{{ else if .Args.IssueID }}{{ $target = .Args.IssueID }}{{ end -}}
  {{ template "_shared/session-context" . }}

  # Blog: Publish -- finalise a draft post

  {{ template "beads-issues/shared/target-bead-header-strict" (dict
      "Target"   $target
      "Noun"     "target blog bead"
      "Scope"    "for this publish run"
      "FromLink" (ne .Session.BeadsIssue "")
      "FailStop" "then stop without changing anything."
  ) }}

  This prompt drives the final `blog:draft` -> `blog:published` transition of
  the blog suite state machine. It is a **one-shot per-bead** flow (NOT a loop).
  The post body lives in the bead's **description**; publishing turns that body
  into a published artefact by following the project's own
  `.mitto/blog/publish.md` instructions (target repo/CMS, path convention,
  front-matter, deploy command). When those instructions are absent it asks
  the author how to publish and offers to persist the answer for next time.
  It then records a publish comment and applies the `blog:published` label. It
  does NOT close the bead -- closure is left to the author, who decides when the
  downstream work (e.g. `linkedin-post`) is truly done.

  ## Step 1 -- Load the post from the bead

  {{ template "blog/shared/load-post-from-bead" (dict "Target" $target) }}

  ## Step 2 -- Load the drafting voice

  Bring the standard drafting voice into context so the metadata confirmation
  in Step 4 measures the final title/description against the same yardstick
  the ideation and polish passes used:

  {{ template "blog/shared/blog-config-fragment"
       (dict "Name"        "audience"
             "DefaultText" "Expert practitioners: engineers, technical leads, and hands-on architects. Assume familiarity with the domain; do not hand-hold on basics.") }}

  {{ template "blog/shared/blog-config-fragment"
       (dict "Name"        "style"
             "DefaultText" "Direct, slightly informal, opinionated where the argument warrants it. No marketing filler; no needless hedging.") }}

  ## Step 3 -- Load (or ask for) the publish instructions

  Publishing is inherently project-specific, so there is no built-in default.
  Read the project's publish instructions; if they are absent, ask the author
  and offer to persist the answer so future runs are automated:

  {{ template "blog/shared/read-or-ask-persist"
       (dict "Name"      "publish"
             "SessionID" .Session.ID
             "Purpose"   "how and where to publish this blog post"
             "AskFields" "  - `target` (textarea) — \"Where does the post get published? Target repo/CMS, and the repo-relative path convention for post files (e.g. `content/posts/YYYY-MM-DD-<slug>.md` for Hugo, `_posts/YYYY-MM-DD-<slug>.md` for Jekyll).\"\n  - `format` (textarea) — \"What format does the destination expect the post body in? The post is stored as Markdown in the bead, so name the destination format so it can be converted: e.g. `markdown` (Hugo/Jekyll), `mdx` (Next.js/Docusaurus), `html` (a CMS rich-text/HTML field), `rst` (Sphinx), `asciidoc`, or Confluence storage format. Leave blank for Markdown (no conversion).\"\n  - `frontmatter` (textarea) — \"Front-matter policy: which YAML keys to populate (title, description, date, tags, ...), which to strip, which to preserve.\"\n  - `deploy` (textarea, optional) — \"Deploy/build command to run after writing the file (e.g. `git add && git commit && git push`, or a CI trigger). Leave blank if publishing is manual.\"\n  - `notes` (textarea, optional) — \"Anything else relevant (canonical URL scheme, slug rules, image handling).\"") }}

  ## Step 4 -- Confirm finalised metadata with the author

  The post title is the bead's `$post_title` and the post body is `$post_file`
  (loaded in Step 1). Present the finalisable metadata back to the author for
  last-minute edits using `mitto_ui_form_mitto(self_id: "{{ .Session.ID }}")`
  (NOT `mitto_ui_options` -- free-text fields): labels `Title` (pre-filled with
  `$post_title`), `Description` (a one-line summary you derive from the body),
  and `Tags (comma-separated)`. After submission, print the confirmed values
  back before proceeding:

  ```
  Confirmed title:       <form.Title>
  Confirmed description: <form.Description>
  Confirmed tags:        <form.Tags>
  ```

  ## Step 5 -- Convert the body to the destination format and produce the artefact

  Follow the publish instructions from Step 3 to turn the post into its
  published form. The body in `$post_file` is **Markdown** -- that is the
  canonical storage format in the bead -- but the destination may expect a
  **different** format, so convert before writing.

  1. **Determine the destination format.** Take it from the Step-3 instructions'
     `format` field, or infer it from the destination path's extension and the
     target CMS. Common cases: `markdown`/`md` (Hugo, Jekyll -- no conversion),
     `mdx` (Next.js, Docusaurus), `html` (a CMS rich-text/HTML field),
     `rst` (Sphinx), `asciidoc`, or Confluence storage format. If the format is
     Markdown, skip the conversion and use `$post_file` as-is.

  2. **Convert the body (best effort).** When the destination format is not
     Markdown, convert the body from Markdown into it. Prefer a real converter
     when one is installed (for example `pandoc -f markdown -t <fmt>`); fall
     back to a careful, faithful manual conversion when no tool is available.
     Preserve the document structure and semantics -- headings, lists, code
     blocks (and their language hints), tables, links, images, and inline
     emphasis. Where a construct has no clean equivalent in the target format,
     choose the closest faithful representation rather than dropping it, and
     keep a short list of anything that could not be converted losslessly so it
     can be noted in the Step-6 publish comment. Write the converted body to a
     temp file:

     ```bash
     pub_file="$post_file"   # default: no conversion (Markdown destination)
     fmt="<destination format from Step 3, lower-cased>"
     if [[ -n "$fmt" && "$fmt" != "markdown" && "$fmt" != "md" ]]; then
       pub_file=$(mktemp "/tmp/blog-pub-XXXXXX")
       if command -v pandoc >/dev/null 2>&1; then
         pandoc -f markdown -t "$fmt" "$post_file" -o "$pub_file"
       else
         # No converter available -- convert manually and write the result to
         # "$pub_file" (best effort; preserve structure and semantics).
         cp -f "$post_file" "$pub_file"
       fi
     fi
     echo "pub_file=$pub_file (format=${fmt:-markdown})"
     ```

  3. **Compute the destination path** per the instructions' path convention
     (fall back to `blog/posts/YYYY-MM-DD-<slug>.<ext>` with today's UTC date, a
     kebab-case slug derived from the confirmed title, and the extension that
     matches the destination format only if the instructions do not specify a
     path).

  4. **Assemble the final file:** the front-matter block per the instructions'
     front-matter policy (populated from the Step-4 confirmed title /
     description / tags and today's UTC date, in whatever syntax the destination
     format uses for metadata), followed by the converted body from `$pub_file`.
     Write the file, creating parent directories as needed:

     ```bash
     dest="<computed destination path>"
     mkdir -p "$(dirname "$dest")"
     {
       printf -- '---\n'
       # ... front-matter keys per the Step-3 policy ...
       printf -- '---\n\n'
       cat "$pub_file"
     } > "$dest"
     echo "wrote $dest"
     ```

  5. Run any deploy/build command the instructions specify. If they specify
     none, leave the file staged for the author and note that in Step 6.

  ## Step 6 -- Record the publish as a bead comment

  Record what was published as a **comment** on the bead (the description stays
  the post body; publish metadata is a note):

  ```bash
  rec=$(mktemp)
  cat > "$rec" <<'MITTO_PUBLISH'
  ## Published — $(date -u +%Y-%m-%dT%H:%MZ)

  - **Path:** <destination path>
  - **Format:** <destination format> (converted from Markdown via <pandoc | manual | no conversion>)
  - **URL:** <canonical URL if known, else "n/a">
  - **Deploy:** <command run, or "left staged for author">
  - **Conversion notes:** <anything that could not be converted losslessly, or "none">
  MITTO_PUBLISH
  bd comment {{ $target }} --file "$rec"
  rm -f "$rec"
  ```

  ## Step 7 -- Update labels

  ```bash
  bd update {{ $target }} --add-label blog:published
  bd update {{ $target }} --remove-label blog:draft
  bd update {{ $target }} --remove-label blog:ready
  for l in blog:needs-polish blog:needs-fact-check blog:needs-references; do
    bd update {{ $target }} --remove-label "$l" 2>/dev/null || true
  done
  ```

  Do **not** run `bd close` here. Closing the bead is the author's decision
  and is intentionally left as a manual step after any downstream work
  (e.g. `linkedin-post`) is complete.

  ## Step 8 -- Notify

  Report via `mitto_ui_notify_mitto` -- title `"Blog post published"`,
  message `"{{ $target }} - <destination path> (bead left open for author to close)"`.
