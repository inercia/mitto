  - name: IssueID
    type: beadsId
    required: false
    description: The bead whose blog draft to audit for missing references
  - name: Folder
    type: text
    default: blog/posts
    required: false
    description: Folder where blog post files live (repo-relative)
description: Blog — audit a `blog`/`draft` post for missing citations; classifies each as REQUIRED (direct claim) or RECOMMENDED (further reading), and flags the bead for fact-check when any REQUIRED link is absent
backgroundColor: '#C8E6C9'
group: Blog
enabledWhen: CommandExists("bd") && DirExists(".beads") && "blog" in Item.Labels && "draft" in Item.Labels
