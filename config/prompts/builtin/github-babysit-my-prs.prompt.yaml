icon: globe
name: 'GitHub: babysit my PRs'
menus: prompts
parameters:
  - name: Repository
    type: text
    required: false
    description: 'Optional GitHub repository (owner/repo) to babysit. If omitted, the repository of the current folder is used.'
description: 'Regularly check your own open PRs: rebase stale branches, report CI failures, flag ready-to-merge PRs, and address review comments'
group: GitHub
backgroundColor: '#BBDEFB'
tags:
- loop
- github
enabledWhen: FileExists(".git/config") && (Tools.HasPattern("github_*") || CommandExists("gh"))
loop:
  mode: optional
  default: true
  trigger: onCompletion
  delay: 3600
  maxIterations: 30
prompt: |
  {{- $repoFlag := "" -}}
  {{- if .Args.Repository }}{{ $repoFlag = printf " --repo %s" .Args.Repository }}{{ end -}}
  Monitor your own open pull requests for the target repository (the current
  folder's repo by default, or the one supplied via the `Repository` parameter),
  keeping them up-to-date and reporting issues. Only acts on PRs where you are
  the author. Designed to be run as a loop via `mitto_conversation_set_loop`.

  ## Session Context

  Your session ID is `{{ .Session.ID }}` — use this as `self_id` for all `mitto_*` MCP tool calls.

  Available ACP servers:
  {{ .ACP.AvailableText }}

  When spawning new conversations to fix issues, prefer `"coding"` or `"fast"`
  tagged servers for straightforward fixes. **Never** configure spawned conversations
  as loops — they are one-off tasks.

  ## Spawn Deduplication

  Existing child conversations (spawned by previous runs):
  {{ .Children.MCPText }}

  Before spawning any new conversation, **check the list above**. Search for a
  child whose title matches the PR you are about to spawn for (e.g., title
  contains "PR #<number>"). If a child conversation already exists for that PR
  and check type, **skip spawning** — the previous run already created one and
  it may still be working.

  **Spawn cap:** spawn at most **3 conversations per run**. If more PRs need
  attention, prioritize by severity: rebase conflicts > CI failures > unresolved
  comments. Notify the user about any remaining items that were not spawned.

  ## Interaction Mode
  {{- if and .Session.IsLoop (not .Session.IsLoopForced) }}

  **Silent mode** — a scheduled loop run; the user is not watching.
  - Use **only** `mitto_ui_notify` for all communication — non-blocking notifications only.
  - Do **NOT** use `mitto_ui_options`, `mitto_ui_form`, `mitto_ui_textbox`, or any
    interactive/blocking UI tool.
  - Act autonomously when safe (e.g., clean rebases), otherwise just notify.
  {{- else }}

  **Interactive mode** — a force-triggered run or a non-loop conversation; the user may be present.
  - You may freely interact with the user using `mitto_ui_options`, `mitto_ui_form`,
    and other interactive tools in addition to `mitto_ui_notify`.
  - For example: ask the user whether to proceed with a risky rebase, which failing
    PRs to investigate, or whether to spawn fix conversations.
  {{- end }}

  ## Step 1 — Identify the repository
  {{- if .Args.Repository }}

  A target repository was supplied: **`{{ .Args.Repository }}`**. Every `gh`
  command in this prompt already targets it via `--repo {{ .Args.Repository }}`,
  so you do not need to be inside that repository's checkout.

  ```bash
  gh repo view {{ .Args.Repository }} --json nameWithOwner,defaultBranchRef -q '.nameWithOwner + " (default: " + .defaultBranchRef.name + ")"'
  ```

  **Local git operations** (the rebase in Step 3a) still need a local clone of
  the target repo. If the current folder is already a checkout of
  `{{ .Args.Repository }}`, use it; otherwise clone it on demand into a temp dir
  (`gh repo clone {{ .Args.Repository }} "$(mktemp -d)"`) and run the git
  commands there.
  {{- else }}

  No repository was supplied, so operate on the repository of the **current
  folder** where this prompt runs.

  ```bash
  git remote -v
  git rev-parse --show-toplevel
  gh repo view --json nameWithOwner,defaultBranchRef -q '.nameWithOwner + " (default: " + .defaultBranchRef.name + ")"'
  ```
  {{- end }}

  If `gh` is not authenticated (`gh auth status` fails), inform the user and stop.

  Identify **all** GitHub users you may act as. `gh auth status` can list
  multiple `github.com` accounts (e.g. a work account and a personal one), but
  `--author @me` and `gh api user -q '.login'` only ever resolve to the single
  currently-active account — which means PRs authored by any of your other
  logged-in accounts are silently invisible.

  Enumerate every `github.com` account (active or not) from `gh auth status`:

  ```bash
  gh auth status 2>&1 \
    | awk '
        /^[^ ]/            { host=$1; next }
        /Logged in to/     { if (host=="github.com") { for (i=1;i<=NF;i++) if ($i=="account") print $(i+1) } }
      ' \
    | sort -u
  ```

  Store this as the **owned-logins set** — every login in this set counts as
  "you" for the rest of the prompt. Only act on PRs where `author.login` is a
  member of this set (rebase, merge, spawn fix conversations). If the set is
  empty for some reason, fall back to `gh api user -q '.login'`.

  Once you have the `nameWithOwner` (e.g., `some-org/some-repo`), rename this
  conversation so it's easy to identify — but only if the current name
  (`{{ .Session.Name }}`) doesn't already start with "Babysit my PRs":

  ```
  mitto_conversation_update(self_id: "{{ .Session.ID }}",
    conversation_id: "{{ .Session.ID }}",
    name: "Babysit my PRs in <nameWithOwner>")
  ```

  ## Step 2 — List my open PRs

  Only process PRs authored by one of the logins in the owned-logins set from
  Step 1. Do **not** rebase, merge, or spawn fix conversations for other
  people's PRs.

  `--author @me` resolves to the single active `gh` account, so it misses PRs
  authored by any other logged-in account. Instead, run one `gh pr list` per
  login and merge the results, deduplicating by PR number:

  ```bash
  # For each LOGIN in the owned-logins set from Step 1:
  gh pr list{{ $repoFlag }} --state open --author "$LOGIN" \
    --json number,title,headRefName,baseRefName,statusCheckRollup,mergeable,updatedAt,isDraft,reviewDecision,author,reviewRequests,labels \
    --limit 50
  ```

  Concatenate the JSON arrays and deduplicate by `.number` (a PR only ever has
  one author, so no PR should appear in more than one list, but dedupe anyway
  as a safety net).

  If no open PRs, skip to the Summary (Step 4).

  ## Step 3 — Process each of my PRs

  For each of your open PRs (order doesn't matter), perform all applicable checks
  below. **Before acting on any PR, verify that `author.login` is a member of the
  owned-logins set** (obtained in Step 1). If it isn't, skip the PR entirely.

  ### 3a. Merge/rebase check

  Determine whether the PR branch is behind its target (base) branch and cannot
  be cleanly merged.

  ```bash
  gh pr view <number>{{ $repoFlag }} --json mergeStateStatus,mergeable,baseRefName,headRefName
  ```

  **If the PR is behind its target branch and needs rebasing:**

  1. **In interactive mode** (force-triggered or non-loop), ask the user first:
     ```
     mitto_ui_options(self_id: "{{ .Session.ID }}",
       question: "PR #<number> (<title>) is behind <baseRefName>. Rebase now?",
       options: [
         { label: "Yes, rebase now" },
         { label: "Skip this PR" },
         { label: "Spawn a conversation to handle it" }
       ])
     ```
     If the user chooses "Skip", move to the next PR. If "Spawn a conversation",
     go to the spawn step below. Otherwise proceed.

     **In scheduled mode**, notify and proceed automatically:
     ```
     mitto_ui_notify(self_id: "{{ .Session.ID }}",
       title: "Rebasing PR #<number>",
       message: "<title> — branch <headRefName> is behind <baseRefName>, rebasing now",
       style: "info")
     ```

  2. **Important**: Do NOT modify the local checkout — the user may be working there.
     Use a temporary worktree or bare operations.
     {{- if .Args.Repository }}
     Run the git commands below inside a checkout of `{{ .Args.Repository }}` —
     the current folder if it is that repo, otherwise the temp clone from Step 1.
     {{- end }}

     ```bash
     # Fetch latest from remote
     git fetch origin <baseRefName>
     git fetch origin <headRefName>

     # Create a temporary worktree for the rebase
     TMPDIR=$(mktemp -d)
     git worktree add "$TMPDIR" origin/<headRefName> --detach

     # Rebase in the temporary worktree
     cd "$TMPDIR"
     git rebase origin/<baseRefName>
     ```

  3. If the rebase has conflicts or fails:
     - Abort the rebase (`git rebase --abort`)
     - Clean up the temporary worktree (`git worktree remove "$TMPDIR" --force`)
     - Notify the user that manual intervention is needed:
       ```
       mitto_ui_notify(self_id: "{{ .Session.ID }}",
         title: "⚠️ PR #<number> needs manual rebase",
         message: "<title> — rebase onto <baseRefName> has conflicts, please rebase manually",
         style: "warning",
         sound: true,
         native: true)
       ```
     - **If `mitto_conversation_new` is available**, spawn a one-off conversation
       to resolve the conflicts (**in scheduled mode**, do this automatically;
       **in interactive mode**, only if the user chose "Spawn" above or confirm now):
       ```
       mitto_conversation_new(self_id: "{{ .Session.ID }}",
         title: "Rebase PR #<number>: <title>",
         initial_prompt: "PR #<number> (<title>) needs rebasing onto <baseRefName> but has conflicts.
           Please check out branch <headRefName>, rebase it onto origin/<baseRefName>,
           resolve the conflicts, and force-push with --force-with-lease.
           The repo is at: <repo path>",
         acp_server: <prefer "coding" or "fast" tagged server>)
       ```
     - Skip to the next PR.

  4. If the rebase succeeds:
     ```bash
     git push --force-with-lease origin HEAD:refs/heads/<headRefName>
     ```
     Then clean up the temporary worktree:
     ```bash
     cd -
     git worktree remove "$TMPDIR" --force
     ```

  5. Notify the user of the successful rebase:
     ```
     mitto_ui_notify(self_id: "{{ .Session.ID }}",
       title: "✅ PR #<number> rebased",
       message: "<title> — successfully rebased onto <baseRefName> and pushed",
       style: "success")
     ```

  ### 3b. CI status check

  Check whether CI checks are failing on the PR:

  ```bash
  gh pr checks <number> --json name,state,description,detailsUrl
  ```

  **If any checks are failing:**

  1. Attempt to retrieve failure logs:
     ```bash
     # Find the failing run
     gh run list{{ $repoFlag }} --branch <headRefName> --status failure --limit 1 --json databaseId,name,conclusion
     # Get failure details
     gh run view <run-id>{{ $repoFlag }} --log-failed 2>/dev/null | tail -80
     ```

  2. Notify the user with failure details:
     ```
     mitto_ui_notify(self_id: "{{ .Session.ID }}",
       title: "❌ CI failing on PR #<number>",
       message: "<title>\nFailing checks: <check names>\n<brief failure summary if available>",
       style: "error",
       sound: true,
       native: true)
     ```

  3. **If `mitto_conversation_new` is available:**

     First compute the same working-copy decision documented in Step 3d (is the
     local checkout on `<headRefName>`, at `<PR_HEAD>`, and completely clean?):
     `WORKING_MODE` is `local` or `worktree`, `WORKING_PATH` is the path to use.

     **Dedup guard**: skip spawning if an existing child titled `Fix CI for
     PR #<number>` is still running or was updated after the failing run
     completed. Prefer sending a follow-up prompt to that existing child (via
     `mitto_conversation_send_prompt`) over spawning a duplicate.

     **In interactive mode**, ask the user whether to spawn a fix conversation:
     ```
     mitto_ui_options(self_id: "{{ .Session.ID }}",
       question: "PR #<number> (<title>) has CI failures. Spawn a conversation to fix?",
       options: [
         { label: "Yes, spawn a fix conversation" },
         { label: "No, just notify" }
       ])
     ```

     **In scheduled mode**, spawn automatically:
     ```
     mitto_conversation_new(self_id: "{{ .Session.ID }}",
       title: "Fix CI for PR #<number>: <title>",
       initial_prompt: "PR #<number> (<title>) in <owner/repo> has failing CI checks on branch <headRefName>.
         Failing checks: <check names>
         Error summary: <brief failure details from logs>

         Working-copy mode: <WORKING_MODE>  ('local' = reuse repo path as-is;
                                               'worktree' = create a fresh worktree, do NOT touch the main checkout)
         Repo path:         <WORKING_PATH>
         PR branch:         <headRefName>   (head commit <PR_HEAD>)
         Base branch:       <baseRefName>

         Working-copy rules:
           - If 'local': operate directly in the given repo path. If anything
             is dirty at start, abort and re-plan in a worktree instead.
           - If 'worktree': create a fresh worktree with
               git -C <WORKING_PATH> fetch origin <headRefName>
               TMPDIR=\$(mktemp -d) && git -C <WORKING_PATH> worktree add \"\$TMPDIR\" origin/<headRefName>
             Do all edits inside \$TMPDIR. Never modify files under
             <WORKING_PATH> itself; the user may be working there.

         Please diagnose and fix the CI failures. Run the project's full local
         gate before pushing (format → lint → unit → integration — whatever
         the repo's Makefile or docs specify). Only push once every gate step
         passes. Force-push with --force-with-lease.

         If a failure is NOT caused by this PR (i.e. it also fails on the
         base branch's latest commit), do not push a spurious fix; instead
         report back with the diagnosis and file a beads issue for the
         pre-existing failure, so the babysit parent can surface it.

         When done, report back a per-check summary: which CI checks passed
         after your push and which remain failing (with root cause).",
       acp_server: <prefer "coding" or "fast" tagged server>)
     ```

  **If all checks are passing**, no notification is needed.

  ### 3c. Ready-to-merge check

  If a PR has **all approvals** (`reviewDecision == "APPROVED"`) **and** all CI
  checks are passing **and** it is not a draft:

  **In interactive mode**, offer to merge:
  ```
  mitto_ui_options(self_id: "{{ .Session.ID }}",
    question: "🚀 PR #<number> (<title>) is approved with passing CI. Merge it?",
    options: [
      { label: "Yes, merge now" },
      { label: "No, just notify" }
    ])
  ```
  If the user selects "Yes": `gh pr merge <number>{{ $repoFlag }} --merge` (or `--squash`/`--rebase`
  based on repo settings). Then notify success.

  **In scheduled mode**, just notify:
  ```
  mitto_ui_notify(self_id: "{{ .Session.ID }}",
    title: "🚀 PR #<number> is ready to merge",
    message: "<title> — approved with passing CI, waiting to be merged",
    style: "success")
  ```

  ### 3d. Unresolved review comments

  `gh pr view --json reviewThreads` is **not supported** by the `gh` CLI — the
  field only exists via GraphQL. Use `gh api graphql` to fetch the unresolved
  threads:

  ```bash
  # Fetches every unresolved (and not-outdated) review thread with the first
  # comment of each thread (author, path, line, body, thread id).
  {{- if .Args.Repository }}
  REPO_OWNER=$(echo "{{ .Args.Repository }}" | cut -d/ -f1)
  REPO_NAME=$(echo "{{ .Args.Repository }}" | cut -d/ -f2)
  {{- else }}
  REPO_OWNER=$(gh repo view --json owner -q .owner.login)
  REPO_NAME=$(gh repo view --json name  -q .name)
  {{- end }}
  gh api graphql -f query='
  query($owner:String!,$name:String!,$number:Int!) {
    repository(owner:$owner, name:$name) {
      pullRequest(number:$number) {
        reviewThreads(first:100) { nodes {
          id isResolved isOutdated
          comments(first:1) { nodes {
            author { login } path line originalLine body
          } }
        } }
      }
    }
  }' -F owner="$REPO_OWNER" -F name="$REPO_NAME" -F number=<number> \
    --jq '[.data.repository.pullRequest.reviewThreads.nodes[]
           | select(.isResolved == false and .isOutdated == false)
           | {id, path: .comments.nodes[0].path,
              line: (.comments.nodes[0].line // .comments.nodes[0].originalLine),
              author: .comments.nodes[0].author.login,
              body: .comments.nodes[0].body}]'
  ```

  Save the JSON array as `THREADS_JSON`. Its length is the unresolved count.
  If the count is 0, this substep is done — skip to 3e.

  **If there are unresolved threads:**

  ```
  mitto_ui_notify(self_id: "{{ .Session.ID }}",
    title: "💬 PR #<number> has unresolved comments",
    message: "<title> — <count> unresolved review threads need attention",
    style: "warning")
  ```

  **Dedup guard**: check the Existing children list at the top of this prompt.
  If a child titled `Address review comments on PR #<number>` (or containing
  that exact substring) already exists **and is still running or was updated
  after the newest thread's `createdAt`**, skip spawning — the previous run
  already handled it. Otherwise proceed to spawn (or in interactive mode, ask).

  **Working-copy decision** (which the spawned child will honour):

  Compute in this parent, then pass the decision explicitly in the child's
  initial prompt — do **not** let the child guess.

  ```bash
  # Are we sitting on the PR branch, clean, and at the PR's head commit?
  CUR_BRANCH=$(git -C "<repo path>" rev-parse --abbrev-ref HEAD 2>/dev/null || echo "")
  CUR_HEAD=$(git -C "<repo path>" rev-parse HEAD 2>/dev/null || echo "")
  PR_HEAD=$(gh pr view <number>{{ $repoFlag }} --json headRefOid -q .headRefOid)
  DIRTY=$(git -C "<repo path>" status --porcelain 2>/dev/null | head -c 1)
  # STAGED includes staged-only-not-committed changes
  STAGED=$(git -C "<repo path>" diff --cached --name-only 2>/dev/null | head -c 1)

  if [ "$CUR_BRANCH" = "<headRefName>" ] && [ "$CUR_HEAD" = "$PR_HEAD" ] \
     && [ -z "$DIRTY" ] && [ -z "$STAGED" ]; then
    WORKING_MODE="local"
    WORKING_PATH="<repo path>"
  else
    WORKING_MODE="worktree"
    WORKING_PATH="(child will create a fresh worktree via 'git worktree add')"
  fi
  ```

  **If `mitto_conversation_new` is available:**

  **In interactive mode**, ask whether to spawn a conversation to address the feedback:
  ```
  mitto_ui_options(self_id: "{{ .Session.ID }}",
    question: "PR #<number> (<title>) has <count> unresolved review threads. Spawn a conversation to address them?",
    options: [
      { label: "Yes, address review comments" },
      { label: "No, just notify" }
    ])
  ```

  **In scheduled mode**, spawn automatically. Pass the full `THREADS_JSON`
  payload plus the working-copy decision so the child can address each comment
  individually (either fix + reply, or reply-explaining-why-not — but **never**
  silently ignore):

  ```
  mitto_conversation_new(self_id: "{{ .Session.ID }}",
    title: "Address review comments on PR #<number>: <title>",
    initial_prompt: "PR #<number> (<title>) in <owner/repo> has <count> unresolved review threads.

      Working-copy mode: <WORKING_MODE>  ('local' = reuse repo path as-is;
                                            'worktree' = create a fresh worktree, do NOT touch the main checkout)
      Repo path:         <WORKING_PATH>
      PR branch:         <headRefName>   (head commit <PR_HEAD>)
      Base branch:       <baseRefName>

      Unresolved threads (JSON, one object per thread — id / path / line / author / body):
      <THREADS_JSON>

      For EACH thread you MUST do exactly one of:
        (a) Apply a code fix that addresses the comment, then reply to the
            thread on the PR referencing the commit that fixed it.
        (b) Reply to the thread with a concrete reason it will not be fixed
            (e.g., 'out of scope for this PR — filed as beads mitto-XXX',
            'disagree with reviewer because <reason>', 'already addressed in
            commit abc123', etc.).
      Never silently skip a thread. Never mark a thread resolved without either
      a code fix or a substantive reply.

      Working-copy rules:
        - If 'local': operate directly in the given repo path. Never leave
          uncommitted files behind; if anything is dirty at start, abort and
          switch to worktree mode.
        - If 'worktree': create a fresh worktree with
            git -C <WORKING_PATH> fetch origin <headRefName>
            TMPDIR=\$(mktemp -d) && git -C <WORKING_PATH> worktree add \"\$TMPDIR\" origin/<headRefName>
          Do all edits inside \$TMPDIR. Never modify files under
          <WORKING_PATH> itself; the user may be working there.

      To post a reply on a review thread, use the GraphQL addPullRequestReviewThreadReply mutation
      (or 'gh api /repos/{owner}/{repo}/pulls/{number}/comments' with in_reply_to=<thread's first comment id>).
      To mark it resolved, use the resolveReviewThread mutation with the thread id from the JSON.

      Local gate before pushing: run the project's format → lint → unit → integration
      steps (whatever the repo's Makefile or docs specify) and only push once
      they all pass. Force-push with --force-with-lease.

      When done, either mark all threads resolved (if fixed) or leave them
      unresolved with your reply comment (if pushed back). Report back with a
      per-thread summary: which threads got fixed vs replied-only.",
    acp_server: <prefer "coding" or "fast" tagged server>)
  ```

  ### 3e. Stale PR detection

  If a non-draft PR has not been updated in **14+ days** (based on `updatedAt`),
  collect it. After processing all PRs, **batch stale PRs into a single
  notification** rather than one per PR:

  ```
  mitto_ui_notify(self_id: "{{ .Session.ID }}",
    title: "🕸️ <count> stale PRs",
    message: "PRs not updated in 14+ days:\n• #<N> <title> (<days> days)\n• #<M> <title> (<days> days)\n...",
    style: "warning")
  ```

  ### 3f. Long-lived draft PRs

  If a draft PR (`isDraft == true`) has not been updated in **21+ days**,
  collect it. After processing all PRs, **batch into a single notification:**

  ```
  mitto_ui_notify(self_id: "{{ .Session.ID }}",
    title: "📝 <count> long-lived draft PRs",
    message: "Drafts open 21+ days:\n• #<N> <title> (<days> days)\n• #<M> <title> (<days> days)\n...",
    style: "info")
  ```

  ## Step 4 — Summary

  After processing everything, produce a brief summary:

  ```console
  📊 PR Babysit Summary

  | PR | Title | Rebase | CI | Review | Notes |
  |----|-------|--------|----|--------|-------|
  | #1 | Fix bug | ✅ Rebased | ✅ Passing | Approved | 🚀 Ready to merge |
  | #2 | Add feature | — Up to date | ❌ Failing | Changes requested | 3 unresolved threads |
  | #3 | Refactor | ⚠️ Conflicts | ✅ Passing | Pending | 🕸️ Stale (18 days) |

  Next check: <if loop, mention the schedule>
  ```

  ## Guidelines

  - **Target repository**:
  {{- if .Args.Repository }}
    operate on `{{ .Args.Repository }}`; all `gh` commands target it via
    `--repo {{ .Args.Repository }}`. When spawning fix conversations, tell them
    the repository is `{{ .Args.Repository }}` and to clone it if the current
    folder is a different repo.
  {{- else }}
    no repository was supplied; operate on the repository of the current folder.
  {{- end }}
  - **Working-copy rule for spawned children** (CI-fix and review-comment
    children): the parent (this prompt) decides `WORKING_MODE` before spawning.
    Reuse the local checkout only when it is on the PR branch, at the PR's head
    commit, and completely clean (no unstaged AND no staged changes); otherwise
    the child must operate in a fresh `git worktree add` and never touch the
    main checkout. This is a hard rule — the user may be working in that
    checkout, so silently overwriting it is unacceptable.
  - **Rebase step (3a) always uses a temporary worktree** regardless of the
    above — rebases are destructive and rebasing the user's live checkout is
    never safe.
  - Use `--force-with-lease` when force-pushing (never `--force`).
  - **Review comments must be addressed, never ignored** (Step 3d):
    every unresolved review thread either gets a code fix + reply referencing
    the fix commit, OR a substantive reply explaining why it will not be
    fixed (out of scope, disagree with reviewer, already addressed elsewhere,
    etc.). Silently skipping a thread is not an option. The spawned
    `Address review comments on PR #<n>` child must report a per-thread
    outcome (fixed vs replied-only) back to this parent.
  - **CI failures must be fixed, not ignored** (Step 3b): failing lint or
    tests are surfaced with a fix child. If a failure is not caused by this
    PR (also fails on the base branch's latest commit), the child must file
    a beads issue for the pre-existing failure instead of pretending it's
    fine — the babysit parent then reports "CI blocked by pre-existing
    issue mitto-XXX" in its Summary rather than a green "passing" status.
  - If `gh` authentication fails, stop immediately and inform the user.
  - **Interaction mode** (see "Interaction Mode" section above):
  {{- if and .Session.IsLoop (not .Session.IsLoopForced) }}
    - **Scheduled loop**: Use only `mitto_ui_notify`. No interactive UI. Act
      autonomously when safe, otherwise notify. Skip the summary table — only send
      notifications for actionable items.
  {{- else }}
    - **Force-triggered or non-loop**: You may use `mitto_ui_options`,
      `mitto_ui_form`, and other interactive tools. Ask the user before risky
      actions (merges). Show the full summary table at the end.
  {{- end }}
  - **Spawn deduplication** (see "Spawn Deduplication" section above):
    Check `{{ .Children.MCPText }}` for existing child conversations before spawning.
    Skip if a child for the same PR already exists. Max 3 spawns per run.
  - **Spawned conversations must never be loops.** They are one-off tasks that
    should complete and stop. Do not call `mitto_conversation_set_loop` on them.
  - Only spawn conversations when `mitto_conversation_new` is available. If Mitto
    MCP tools are not present, just send notifications and let the user act.
  - **Notification batching**: batch repetitive informational items (stale PRs,
    draft PRs) into a single notification per category to avoid spamming the
    user — especially important in loop mode.
  - Use `sound: true, native: true` for critical notifications (CI failures,
    rebase conflicts) so the user notices immediately.
  - In **scheduled mode**: do not merge PRs automatically — only notify.
    In **interactive mode**: offer to merge with user confirmation.
  - If a PR has draft status, still check CI and staleness but skip merge-readiness.
  - **Only act on your own PRs** — i.e. PRs whose `author.login` is in the
    owned-logins set enumerated from `gh auth status` in Step 1 (not just the
    single currently-active `gh` account, which is what `--author @me` resolves
    to). Do not rebase, merge, spawn fix conversations, or take any modifying
    action on PRs authored by others.
