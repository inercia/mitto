icon: search
name: Mention — investigate phase
menus: internal
parameters:
  - name: IssueID
    type: beadsId
    required: false
    description: The beads issue ID whose @mitto mention is being investigated
  - name: MentionTS
    type: text
    required: false
    description: RFC3339 timestamp of the @mitto mention being processed (dedup key)
  - name: MentionBody
    type: text
    required: false
    description: Verbatim body of the @mitto mention (already scoped by the router)
description: Internal phase-tier prompt — investigate a fix-style @mitto mention and add the `mention-investigated` label. Invoked by name from the mention driver; runs on the Reasoning tier.
group: Tasks
backgroundColor: '#B3E5FC'
preferredModels:
  - modelTag: Reasoning
prompt: |
  ## Session Context

  Your session ID is `{{ .Session.ID }}` — use this as `self_id` for all `mitto_*` MCP tool calls.

  # Mention — Investigate Phase

  This is the **investigate** stage of the label-encoded @mitto-mention state machine
  (`mention-investigated` → `mention-planned` → `mention-implemented` for the fix/feature
  route; `mention-answered` for the question route). It is normally invoked by name from
  the `Mention — driver` router, which selects this phase when a fix-style mention has
  none of `mention-investigated`/`mention-planned`/`mention-implemented` yet.

  {{ $target := "" -}}
  {{ if .Session.BeadsIssue }}{{ $target = .Session.BeadsIssue }}{{ else if .Args.IssueID }}{{ $target = .Args.IssueID }}{{ end -}}
  {{ if $target -}}
  The **target bead** for this phase is `{{ $target }}`{{ if .Session.BeadsIssue }} (from this conversation's linked beads issue){{ else }} (supplied as the `IssueID` argument){{ end }}.
  {{ if .Args.MentionTS -}}Mention timestamp (dedup key): `{{ .Args.MentionTS }}`.{{- end }}
  {{- else -}}
  No target bead is resolvable (neither `.Session.BeadsIssue` nor an `IssueID` argument
  was supplied). Do not guess. Post a `mitto_ui_notify` explaining the missing target,
  then stop this phase without changing anything.
  {{- end }}

  {{ if $target -}}
  ## Step 1 — Load LIVE state

  Labels drift between runs. Load the bead's **current** state fresh:

  ```bash
  bd show {{ $target }} --json --include-comments
  ```

  Read its `labels` array and prior comments. If `mention-investigated` is already
  present, this phase's work is already done — `bd comment` a note that the phase
  re-ran redundantly and stop **without** re-adding the label.

  ## Step 2 — Investigate the mention

  This is a **scheduled, silent** phase (invoked by the router's on-completion loop).
  Do **not** call `mitto_ui_options`, `mitto_ui_form`, or `mitto_ui_textbox` — decide
  autonomously; if something is genuinely unclear or unsolvable without user input,
  defer via **Step 4**.

  The mention body (already scoped by the router){{ if .Args.MentionBody }}:

  ```
  {{ .Args.MentionBody }}
  ```
  {{ else }} is available in the bead's comment stream at the timestamp above.{{ end }}

  Read the relevant code, logs, and bead history to understand what the mention is
  asking for — do not speculate about code you have not opened. Gather concrete
  evidence: root-cause hypothesis (if it is a fix), affected code locations, any logs
  or reproduction preconditions the mention referenced.

  ## Step 3 — Record findings and advance the label

  When you understand the mention well enough for the plan phase to design a
  response, record your findings on the bead and advance the state:

  ```bash
  bd comment {{ $target }} "Investigation [tier: Reasoning]: <root cause hypothesis, code locations, evidence — scoped to the @mitto mention>."
  bd update {{ $target }} --add-label mention-investigated
  ```

  Only add the label after the comment is posted. Then stop — the router's next
  scheduled run will observe `mention-investigated` and dispatch the plan phase.
  {{- end }}

  ## Step 4 — Blocked → Defer + Handoff

  Use this whenever this phase cannot make progress autonomously (something unclear,
  a decision only the user can give, an external action is required). **Do not**
  advance the `mention-investigated` label. Instead:

  1. Defer and flag the bead so it drops out of `bd ready`:

     ```bash
     bd update {{ if $target }}{{ $target }}{{ else }}<target-bead>{{ end }} --add-label needs-human --defer <when>
     ```

  2. Write a structured handoff comment (the FIRST line must be the `[deferred: <ts>]`
     marker so the orchestrator's Step 2Z can undefer on human reply):

     ```bash
     bd comment {{ if $target }}{{ $target }}{{ else }}<target-bead>{{ end }} "[deferred: <now-RFC3339>]
     Why: Blocked at mention-investigate — <root cause>.
     What human intervention is required: <the ONE concrete question/decision/info/action>.
     How to resume: reply to this bead; the orchestrator will detect the reply on its next pass, clear needs-human, and re-queue."
     ```

  3. End with a concise handoff and disable the enclosing conversation's loop flag so
     the router loop does not spin on the blocker:

     ```
     mitto_conversation_update(self_id: "{{ .Session.ID }}", conversation_id: "self", loop_enabled: false)
     ```

  ## Guidelines

  - **One stage only.** This phase advances at most one label
    (`mention-investigated`). Do not plan, implement, or answer — those are separate
    phases.
  - **Live state only.** Always re-read labels via `bd show --json` at the start of
    the phase; never assume labels from a prior run or from `Item.*`.
  - **Always log to the tracker** with `bd comment` so progress is auditable.
  - **Tier tag every comment.** Prefix findings with `Investigation [tier: Reasoning]:`
    so the tier split is observable in the bead history (mitto-91wk acceptance
    criteria).
