icon: list
name: Refine issue implementation details
menus: prompts, beadsList
description: Analyze open beads that have not yet been refined, fill in enough implementation detail for a faster model to implement them, label the refined ones, and defer the ones that cannot be refined. Runs on a smart model as an onTasks loop that fires whenever beads change.
backgroundColor: '#C5CAE9'
group: Tasks
target:
  title: "Refine issue implementation details"
  reuse:
    title: true
enabledWhen: CommandExists("bd") && DirExists(".beads")
preferredModels:
  - modelTag: Smart
loop:
  trigger: [onTasks]
  onTasks:
    condition: 'Changes.Touched.exists(i, i.status == "open" && !("implementation-refined" in i.labels))'
    # Opt in to per-event re-fire (mitto-dmb): when beads change during a run,
    # the accumulated delta is exposed as .Trigger.OnTasks.* on the follow-up fire
    # so newly-arrived candidates are picked up promptly instead of waiting for
    # the next external change.
    coalesceDuringBusy: false
  mode: always
  maxIterations: 20
  maxDuration: "4h"
prompt: |
  {{ template "_shared/session-context" . }}

  # Beads: Refine Implementation Details

  Beads is a CLI issue tracker (`bd`). Issues are called "beads" and have IDs like `bd-xyz`.

  You are running on a **smart / high-reasoning model**. Your job is to take beads that have
  **not yet been refined** and leave each one with **enough concrete implementation detail that a
  faster, cheaper model can fully implement it without further design work** — or, when that is not
  possible, **defer** the bead so it drops out of the active queue until a human clarifies it.

  The label **`implementation-refined`** is the flag that marks a bead as already refined. A bead
  is a candidate for this pass when it is **open**, **not deferred**, and does **not** carry the
  `implementation-refined` label.

  {{- if or .Iteration.IsUninterrupted (and .Session.IsLoop (not .Session.IsLoopForced)) }}
  **Silent mode** (scheduled loop run — the user is not watching): act autonomously and safely. Do
  **not** use interactive tools (`mitto_ui_options`, `mitto_ui_form`, `mitto_ui_textbox`). Report
  outcomes and failures with `mitto_ui_notify` only.
  {{- else }}
  **Interactive mode** (forced run or first/normal send): you may summarize your findings and use
  interactive tools where helpful, but the refinement itself should still be applied autonomously.
  {{- end }}

  {{- with .Trigger }}{{ with .OnTasks }}

  ## Triggered by these beads changes

  This run was fired by the following beads changes since the previous baseline. Prefer these when
  they still match the candidate filter (open, not deferred, not yet `implementation-refined`); fall
  back to the broader candidate list from Step 1 when they don't:

  {{- if .Changes.Touched }}
  {{ range .Changes.Touched -}}
  - `{{ .id }}` ({{ .status }}, P{{ .priority }}): {{ .title }}
  {{ end -}}
  {{- else }}
  _(no touched beads reported)_
  {{- end }}
  {{ end }}{{ end }}

  ## Step 1 — Select the beads to refine

  Load the candidate beads (open, not deferred, not yet refined):

  ```bash
  bd list --status open --exclude-label implementation-refined -n 0 --json
  ```

  If the list is empty, there is nothing to do — skip to Step 5 and report "no unrefined beads".

  **Cap this run at ~5 beads.** Prefer the highest-priority (lowest P number) and oldest beads first.
  The label/defer flags below make the pass idempotent, so remaining beads are picked up on the next run.

  ## Step 2 — Analyze each selected bead

  For each selected bead, load its full state and understand what it really requires:

  {{ template "beads-issues/shared/load-context-min" "<bead-id>" }}

  Then investigate the **actual codebase** so the plan is grounded in reality — find the files,
  functions, types, and existing patterns the work will touch (use your code-search and file-reading
  tools). Do not guess at structure you can verify.

  Decide whether the bead can be turned into an **implementation-ready** spec. It is ready only when a
  faster model could implement it end-to-end **without further design decisions**, i.e. you can state:

  - **Scope**: precisely what to change and, importantly, what is out of scope.
  - **Files & symbols**: the concrete files, functions, types, and call sites to touch (with paths).
  - **Approach**: the step-by-step implementation plan, in order.
  - **Edge cases & downstream impact**: callers, tests, migrations, config that must be updated.
  - **Acceptance criteria**: how to verify it is done (tests to add/run, expected behavior).

  ## Step 3 — When the bead CAN be refined

  Write the implementation detail back into the bead and flag it as refined:

  ```bash
  bd update <bead-id> --design "<full implementation plan: scope, files & symbols, ordered approach, edge cases, downstream impact>"
  bd update <bead-id> --acceptance "<clear, checkable acceptance criteria>"   # only if missing or thin
  bd update <bead-id> --append-notes "Refined for implementation on {{ .Session.ID }}: plan added to design; ready for a faster model to implement."
  bd label add implementation-refined <bead-id>
  ```

  Keep the design **self-contained** — a faster model should not need to re-derive context. Reference
  exact paths and existing patterns rather than vague descriptions.

  ## Step 4 — When the bead CANNOT be refined → defer it

  If, after honest analysis, the bead is not implementation-ready — **open questions remain**,
  **key details are missing**, requirements are **ambiguous or contradictory**, it needs a
  **product/human decision**, or the design cannot be pinned down — do **not** guess and do **not**
  add the `implementation-refined` label. Instead, record why and defer it:

  ```bash
  bd update <bead-id> --append-notes "Deferred during refinement on {{ .Session.ID }}: cannot produce an implementation-ready spec. Blockers/questions: <list the specific open questions or missing information a human must resolve>."
  bd defer <bead-id>
  ```

  Deferred beads leave the active queue (they no longer match the open + unrefined filter) until a
  human revisits them, so they will not be re-processed on the next run.

  ## Step 5 — Report

  Finish with a concise summary:

  ### Refined
  For each bead you refined: `bead-id` · title · one line on the plan you wrote.

  ### Deferred
  For each bead you deferred: `bead-id` · title · the specific open question(s) blocking refinement.

  {{- if or .Iteration.IsUninterrupted (and .Session.IsLoop (not .Session.IsLoopForced)) }}
  Deliver this summary via `mitto_ui_notify` (silent mode). Use `style: "warning"` if any bead was
  deferred or any `bd` command failed, otherwise `style: "success"`. Report failing commands verbatim.
  {{- else }}
  Present this summary directly. Report any `bd` command that failed and why.
  {{- end }}
