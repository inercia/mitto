  # Beads: Reevaluate All Issues

  Beads is a CLI issue tracker (`bd`). Issues are called "beads" and have IDs like `bd-xyz`.

  Your job is to take a fresh, critical look at **every** open bead in this repo and reassess
  its **priority**, **dependencies**, **grouping** and **importance** — and check whether any open
  or in-progress beads are **already completed** and can be closed — then propose corrections where
  the current state no longer reflects reality.

  ## Step 1 — Gather the full picture

  Run the following to load all the data you need:

  ```bash
  bd list --json                  # every bead (all statuses)
  bd ready --json                 # beads with no active blockers (claimable now)
  bd dep cycles                   # detect dependency cycles
  bd list --type epic --all --json  # existing epics (parents) and their state
  ```

  For any bead whose scope, blockers, or rationale is unclear, fetch its full detail and
  dependency tree (do this for the beads that matter — you do not need every field of every bead):

  {{ template "beads-issues/shared/load-context-min" "<bead-id>" }}

  Optionally cross-reference real implementation progress so importance reflects reality:

  ```bash
  git log --oneline --all -200
  git branch -a
  ```

  ## Step 2 — Reevaluate every open bead

  For each non-closed bead, reason carefully across five axes:

  - **Priority (P0–P4)**: Does the assigned priority still match the bead's real impact and
    urgency? Look for under-prioritised work (high user/blocking impact at low priority) and
    over-prioritised work (P0/P1 that is actually speculative or low-impact).
  - **Dependencies**: Are the blocking relationships correct and complete? Look for
    **missing** dependencies (a bead that clearly cannot start before another), **stale**
    dependencies (blockers that are already closed/obsolete), and **cycles**.
  - **Importance**: How much does this bead matter relative to the others *right now*?
    Consider user impact, how many other beads it unblocks, staleness, and whether it is a
    duplicate or no longer relevant.
  - **Completion**: Is the work already done? Cross-check `open` and `in_progress` beads against
    the current codebase, recent commits, and merged branches. A bead whose acceptance criteria
    are already satisfied should be **closed** rather than left lingering. Be conservative — only
    treat a bead as complete when there is concrete evidence the work is actually finished, and do
    not close an `in_progress` bead with active work unless it is a clear duplicate.
  - **Grouping (epic hierarchy)**: Beads supports first-class parent/child hierarchy — an **epic**
    is a parent bead grouping related children. Assess whether the current hierarchy still holds:
    a bead that clearly belongs to an **existing** open epic but has no `parent`; a bead parented
    under an epic whose theme it no longer shares; and clusters of two or more ungrouped beads
    that share a genuinely specific objective and would warrant a **new** epic. Apply a
    **high-confidence bar** — shared type, priority, or broad area (e.g. "both touch the frontend")
    is **not** a shared objective, and leaving beads ungrouped is usually the right answer.

  ## Step 3 — Delegate deep evaluation where needed

  Most beads can be reassessed directly from the data gathered in Step 1. Some, however, need
  **deeper investigation** before you can judge them fairly — for example a bead whose:

  - relevance is unclear and must be checked against the **current codebase** (is it already done? still needed?),
  - scope or acceptance criteria are ambiguous and require reading related code or design,
  - priority depends on real implementation status, or
  - suspected duplication with another bead needs a careful side-by-side comparison.

  For these beads — and **only** when the conversation-spawning tools (`mitto_conversation_*`)
  are available and you have permission to start conversations and send prompts — delegate the
  deep evaluation to child conversations instead of investigating inline:

  1. Select the beads that genuinely warrant deep evaluation. **Cap this at ~3–5 per run** to
     avoid spawning excessively; prefer the highest-impact or most-uncertain beads. Reuse an
     existing child from `{{ .Children.AllText }}` if one already covers the same bead rather than
     spawning a duplicate.

  2. For each selected bead, call `mitto_conversation_new_mitto` with `self_id: "{{ .Session.ID }}"` and:
     - `title`: the bead ID and a short label (e.g., `"bd-1234 · deep reevaluation"`)
     - `beads_issue`: the bead ID (links the child to this bead)
     - `acp_server`: choose from `{{ .ACP.AvailableText }}` — prefer a faster/cheaper model
       for simple checks, and a slower/more capable model for complex reasoning
     - `initial_prompt`: a **self-contained** prompt that includes the bead ID, title, full
       description and acceptance criteria; the specific question(s) to answer (relevance,
       correct priority, missing/stale dependencies, duplication); an instruction to verify
       against the actual codebase where relevant; and an instruction to report a concise
       recommendation (keep / close / reprioritise / re-scope, with justification) via
       `mitto_children_tasks_report_mitto` when done.

  3. Spawn all the deep-evaluation children in parallel — do **not** wait between spawns.

  4. Wait for their findings with
     `mitto_children_tasks_wait_mitto(self_id: "{{ .Session.ID }}", children_list: [...], task_id: "reevaluate", timeout_seconds: 600)`,
     then fold each child's recommendation into your reevaluation.

  If the spawning tools are unavailable, perform this deeper evaluation inline yourself using
  `bd show`, `bd dep tree`, and the codebase, then continue.

  ## Step 4 — Detect anomalies

  Explicitly look for and flag:

  - **Priority inversions** — a high-priority bead blocked by a lower-priority one.
  - **Blocked-by-closed** — beads still listing blockers that are already done.
  - **Dependency cycles** — from `bd dep cycles`.
  - **Stale claims** — `in_progress` beads with no evidence of work.
  - **Already completed** — `open`/`in_progress` beads whose work is already implemented (per the
    codebase, commits, or merged branches) and can now be closed.
  - **Orphans / duplicates** — beads that overlap heavily or appear abandoned.
  - **Misplaced in the hierarchy** — a bead that clearly belongs to an existing open epic but has
    no `parent`, or a child whose parent epic no longer matches its theme.
  - **Epic-worthy clusters** — two or more ungrouped beads sharing a specific objective that has
    no epic yet.
  - **Empty / completed epics** — epics whose children are all closed (the epic itself can be
    closed), or epics left with fewer than two open children (the grouping no longer earns its
    keep).

  ## Step 5 — Compose a proposal

  Produce a concise **Reevaluation Report** with a table of every change you recommend:

  | Bead | Title | Change | From → To | Why |
  |------|-------|--------|-----------|-----|
  | `bd-1` | `<title>` | Priority | P3 → P1 | Blocks 3 other beads |
  | `bd-2` | `<title>` | Add dep | — → blocked by `bd-9` | Needs schema first |
  | `bd-3` | `<title>` | Remove dep | blocked by `bd-7` (closed) | Blocker already done |
  | `bd-4` | `<title>` | Close | open → closed | Already implemented in `abc1234` / `path/to/file` |
  | `bd-5` | `<title>` | Reparent | — → child of epic `bd-3` | Same objective as that epic |
  | `bd-6` | `<title>` | New epic | `bd-6`, `bd-8` → new epic "<name>" | Shared objective: <specific theme> |

  For a **New epic** row, also state the proposed epic name, a one-line description of the shared
  objective, and every member bead — the user is approving the epic's shape, not just its existence.

  If, after analysis, **no changes are warranted**, say so clearly and skip Steps 6–7 — but
  still produce the final summary in Step 8.

  ## Step 6 — Confirm before changing anything

  This reevaluation is **read-only until you confirm** — including closing any already-completed
  beads. Present your single best proposal and confirm via
  `mitto_ui_options(self_id: "{{ .Session.ID }}", allow_free_text: true)`,
  e.g. "Apply these N proposed changes (including closures) to the beads tracker?" with options:

  - **"Apply all proposed changes"**
  - **"Apply only some"** (let the user specify which via free text)
  - **"Don't change anything — report only"**

  Honour the user's choice. Do not apply changes they did not approve.

  ## Step 7 — Apply the approved changes

  For each approved change, run the appropriate command:

  ```bash
  bd update <bead-id> --priority <0-4>          # reprioritise
  bd dep add <blocked-id> <blocker-id>          # add a blocking dependency
  bd dep remove <blocked-id> <blocker-id>       # remove a stale dependency
  bd close <bead-id> --reason "<why, e.g. 'Already implemented in abc1234; acceptance criteria met'>"   # close an already-completed bead
  bd update <bead-id> --parent <epic-id>        # move a bead under an existing epic
  bd create "<epic name>" --type epic --body-file /tmp/epic-desc.md   # create a new epic, then --parent its members
  ```

  When creating a new epic, write its description to a temporary file and pass it via `--body-file`
  to preserve formatting, capture the new epic's ID from the output, then reparent each approved
  member with `bd update <member-id> --parent <epic-id>`. Skip any approved epic that ends up with
  fewer than two members.

  If a full grouping pass is warranted rather than the few clear-cut moves found here, point the
  user at the dedicated **"Group issues in Epics"** prompt instead of expanding this run.

  For each bead you change but do **not** close, append an audit note recording what changed and
  why (closed beads already carry their rationale in the `--reason` above):

  ```bash
  bd update <bead-id> --append-notes "Reevaluation: <what changed — e.g. priority P2→P1, added blocker bd-12> — <why, from the assessment above>."
  ```

  After wiring dependencies and hierarchy, verify integrity:

  ```bash
  bd dep cycles
  bd dep tree <epic-id>   # for each epic you created or reparented into
  ```

  Report any command that failed and why.

  ## Step 8 — Final summary

  Always finish with two clearly separated sections:

  ### Changes
  A bullet summary of what was **actually changed** (or, if the user declined, what was
  **proposed** but not applied). Group by type: priority changes, dependency changes, epic/hierarchy
  changes (epics created, beads reparented, epics closed), beads closed
  as already-completed, other.

  ### Most important things to do now
  A short, ranked list (top ~3–5) of the beads that matter most to tackle next, based on your
  reevaluation — favouring high-priority, ready (unblocked) work that unblocks the most other
  beads. For each, give the bead ID, title, and a one-line justification.

  ## Step 9 — Clean up the deep-evaluation children

  {{ template "_shared/cleanup-child-conversations" . }}

  ## Final step — Offer to delete this conversation

  {{ template "_shared/offer-delete-conversation" . }}
