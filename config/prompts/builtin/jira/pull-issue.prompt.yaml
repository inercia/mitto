icon: tag
name: 'JIRA: pull issue'
menus: beadsIssues, conversation
description: Pull the latest JIRA changes for the current bead — refresh the managed body block, mirror new JIRA comments, and close the bead if the JIRA ticket has reached a terminal status
backgroundColor: '#D1C4E9'
group: JIRA
tags:
- jira
parameters:
  - name: IssueID
    type: beadsId
    required: false
    description: The beads issue ID to fix
enabledWhen: '(Tools.Names.exists(n, n.matches("(?i)jira")) || CommandExists("jira")) && CommandExists("bd") && DirExists(".beads") && (("jira-sync" in Item.Labels) || (Session.HasBeadsIssue && BeadHasLabels(Session.BeadsIssue, "jira-sync")))'
preferredModels:
  - modelTag: Coding
target:
  title: 'JIRA: sync tasks'
  reuse:
    title: true
    coalesce: true
prompt: |
  {{ template "_shared/session-context" . }}

  {{ $target := "" -}}
  {{ if .Session.BeadsIssue }}{{ $target = .Session.BeadsIssue }}{{ else if .Args.IssueID }}{{ $target = .Args.IssueID }}{{ end -}}
  {{ if not $target -}}
  There is **no linked bead** for this conversation and no `IssueID` argument was provided. This prompt only pulls JIRA updates for a specific bead — send one `mitto_ui_notify` explaining that a bead is required, then **stop**.
  {{- else }}

  The **target bead** is `{{ $target }}`. Pull the latest changes from its linked JIRA ticket into this bead — refresh the managed body block, mirror any new JIRA comments, and reflect a terminal JIRA status by closing the bead. This prompt only writes to JIRA when the user explicitly confirms a reconciliation option (see Step 7.5); otherwise it is read-only — full push flows live in `JIRA: push issue`.
  {{- end }}

  {{ template "_shared/interaction-mode" . }}

  ## Access Method

  This prompt talks to JIRA in one of two ways: **JIRA MCP tools** (e.g. `jira_get_issue_jira`, `jira_search_jira`) or the **`jira` CLI** (ankitpokhrel/jira-cli). **Prefer MCP tools whenever they are available** — they return structured JSON, avoid a subprocess round-trip, and do not depend on the user's local `jira` config. Fall back to the CLI only when the matching MCP tool is not present.
  {{- if Cond "Tools.Names.exists(n, n.matches('(?i)jira'))" }}

  **This run has JIRA MCP tools available** (a tool whose name contains `jira` is reachable). Every JIRA read below should go through the MCP tool named in the step (e.g. `jira_get_issue_jira` in Step 2). Names may be namespaced by the client (`mcp__<server>__<op>`); prefer whichever exact name is exposed to you.
  {{- else }}

  **This run has no JIRA MCP tools** (no tool name contains `jira`) but the `jira` command is on PATH — use it as the fallback. Wherever a step names an MCP tool, run the CLI equivalent instead. Set `PAGER=cat` before `jira issue view` to bypass the pager.
  {{- end }}

  ## Step 1 — Load the bead and extract the JIRA key

  ```bash
  bd show {{ $target }} --json
  bd comments {{ $target }} --json    # or the equivalent JSON subcommand for this bd version
  ```

  From the bead capture: `title`, `description` (the full body), `status`, `priority`, `type`, `external_ref`, and `metadata.jira_updated` / `metadata.jira_synced_comments`. Also capture every existing beads comment (id, author, created, body) — needed to know which ids are new and to leave `[jira]`-prefixed comments untouched.

  The JIRA key comes from `external_ref`, which must have the form `jira-<key-lower>` (this is what `JIRA: sync tasks` writes on create). Strip the `jira-` prefix and uppercase the remainder to get the JIRA key used against the API (e.g. `external_ref = "jira-abc-123"` → key `ABC-123`). If `external_ref` is empty or does not start with `jira-`, this bead is not linked to a JIRA ticket even though it carries the `jira-sync` label — send one `mitto_ui_notify` explaining that the label was likely applied manually and there is nothing to pull, then **stop**.

  ## Step 2 — Fetch the JIRA ticket
  {{- if Cond "Tools.Names.exists(n, n.matches('(?i)jira'))" }}

  Call **`jira_get_issue_jira`** for the key with `fields="*all"` and `expand="renderedFields"`.
  {{- else }}

  Run:

  ```bash
  jira issue list -q "key = <KEY>" --raw
  PAGER=cat jira issue view <KEY> --comments 200
  ```

  Comment bodies may be omitted from list `--raw`; the `jira issue view --comments` output is what to convert.
  {{- end }}

  Capture: key, summary, status name, priority, issue type, labels, assignee, the `updated` timestamp, and every comment (id, author, created, body). For the **description** and each **comment body**, capture the **raw** field value — on JIRA Server / Data Center this is JIRA wiki markup, which Step 3 converts to Markdown. Keep the `renderedFields` HTML only as a fallback for content the converter does not handle.

  ## Step 3 — JIRA wiki markup → Markdown helper

  {{ template "jira/shared/jira2md" . }}

  ## Step 4 — Detect whether anything actually changed

  Compare the fetched ticket against the bead's stored sync state:

  - If `metadata.jira_updated` **equals** the ticket's `updated` timestamp **and** every comment id on the ticket is already listed in `metadata.jira_synced_comments`, there is nothing to do. In interactive mode print a one-line "already up to date" message; in silent mode stay silent. Then **stop** (do not run Steps 5–7).
  - Otherwise continue to Step 5.

  ## Step 5 — Update the bead body (preserve local edits)

  {{ template "jira/shared/managed-body" . }}

  Apply the update:

  ```bash
  bd update {{ $target }} --title "[<KEY>] <summary>" \
    --priority <mapped-priority> --type <mapped-type> \
    --body-file /tmp/jira-<key>.md \
    --set-metadata jira_updated="<ticket.updated>"
  ```

  ## Step 6 — Mirror new JIRA comments

  {{ template "jira/shared/mirror-comments-in" . }}

  In this prompt, `<bead-id>` is `{{ $target }}`.

  ## Step 7 — Reflect terminal JIRA status (conservative)

  If the JIRA ticket is in a **terminal** status and the bead is still open, close the bead:

  ```bash
  bd close {{ $target }} --reason "Closed in JIRA (<status>)"
  ```

  (In interactive mode you may confirm first with `mitto_ui_options`.)

  {{ template "jira/shared/terminal-status" . }}

  When the status name is not on the allow-list, note that the current status is already mirrored into the managed block by Step 5 so a human sees the JIRA state without an automated close.

  ## Step 7.5 — Reconcile inconsistencies

  After Step 7, check for a specific inconsistency: **the bead is closed locally but the JIRA ticket is not in a terminal status** (the terminal allow-list is the one enumerated in Step 7). If the bead's `status` is `closed` and the JIRA status `name` is **not** on that allow-list (case-insensitive, exact match), the two sides disagree about whether the work is done.

  **Interactive mode** — present a `mitto_ui_options` prompt with question `"Bead <beadId> is closed locally but JIRA <KEY> is still \"<status>\". How should we reconcile?"` and these options (labels exactly as shown):

  - `"Close JIRA ticket too"` — description: `"Transition <KEY> to a terminal status (prefer Done) via jira_transition_issue / 'jira issue move'. Falls back to a [mitto] comment if no terminal transition is available."`
  - `"Reopen the local bead"` — description: `"Run 'bd reopen <beadId>' so the bead matches JIRA's open state."`
  - `"Leave as-is"` — description: `"Do nothing; record the inconsistency in the summary table so a human can decide later."`

  Set `allow_free_text: true` with placeholder `"Type a note for the summary row"`. Apply the chosen action, then add a row to the Step 8 summary table with `↔️ reconciled: <action>` in the "Change / notes" column (or `⚠️ inconsistency (left as-is): <status>` when the user chose "Leave as-is" or entered free text).

  **Silent mode** — never prompt, never write. Record the inconsistency for Step 8's table with `⚠️ Inconsistency: bead closed locally but JIRA is "<status>" — deferred to next interactive run.`, and let Step 8 emit the `mitto_ui_notify` (only when the table has at least one non-trivial row).

  ## Step 8 — Summary

  Render a **markdown summary table** describing what was done for this bead. Use exactly these columns and formatting:

  ```
  | JIRA ticket | Beads ticket | Change / notes |
  |---|---|---|
  | <KEY> | {{ $target }} | <short human sentence, actions joined with `; `> |
  ```

  Column rules:

  - **JIRA ticket** — the JIRA key (e.g. `ABC-123`) or `—` when unknown.
  - **Beads ticket** — the beads id (e.g. `mitto-abc`).
  - **Change / notes** — a short human sentence describing the row's contents (body refreshed, N JIRA comments mirrored, bead closed due to terminal status, etc.). Combine multiple actions with `; `. Prefix with `⚠️` when the row reports an inconsistency or an error; prefix with `↔️` when a reconciliation choice from Step 7.5 was applied.

  Frame the run's outcome (body refreshed, comments mirrored, bead closed, no change, inconsistency detected) as the **contents of the row** — do not restate them as free-form prose above or below the table.

  **Interactive mode** — always render the full table, even when nothing changed (a single row saying `no change` is still emitted).

  **Silent mode** (scheduled loop) — send a single `mitto_ui_notify` only when the table would have at least one non-trivial row (any change, any inconsistency, any error). The `message` field of that `mitto_ui_notify` call must contain the markdown table verbatim. Stay silent otherwise. Never truncate the table.

  ## Guidelines

  - **Idempotent**: `metadata.jira_updated` skips unchanged tickets; `metadata.jira_synced_comments` prevents duplicate comments. Running this prompt twice in a row must produce no spurious changes.
  - **Loop-safe**: `[jira]`-prefixed beads comments are the sync marker — never edit or remove them. `[mitto]`-prefixed JIRA comments (written by `JIRA: push issue`) come back through this pull as `[jira] <author> @ <time>: [mitto] <body>` and are dedup-tracked by `jira_synced_comments`, so the round-trip never duplicates.
  - Always `--body-file` for descriptions and `--file`/inline text for comments to avoid shell-quoting issues.
  - **Good-enough conversion**: JIRA wiki markup is converted to Markdown on a best-effort basis (Step 3) — headers and code blocks are the priority; perfect fidelity is not a goal.
  - **Preserve local information**: local body edits (below the `jira-sync:end` marker) and local comments/notes (those without a `[jira]` prefix) must survive every pull. When unsure, keep the content rather than overwrite it.
  - **Terminal status (conservative)**: only close the bead when the JIRA status `name` is on the small allow-list above; never rely on `statusCategory`. A mistakenly-open bead is harmless; a mistakenly-closed one can silently drop local work.
  - **Scope**: this prompt is pull-first — it only writes to JIRA when the user explicitly confirms a reconciliation option in Step 7.5 (close the ticket or add a `[mitto]` comment); otherwise it is read-only. It never wires dependencies (that is a bulk-sync concern) and never touches other beads. Use `JIRA: push issue` to mirror local changes back to JIRA, or `JIRA: sync tasks` for a full two-way batch sync.
