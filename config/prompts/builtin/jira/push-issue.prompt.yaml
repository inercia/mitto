icon: tag
name: 'JIRA: push issue'
menus: beadsIssues, conversation
description: Push local bead changes back to JIRA — transition the JIRA ticket to Done when the bead is closed locally, and mirror local beads comments as [mitto]-tagged JIRA comments
backgroundColor: '#D1C4E9'
group: JIRA
tags:
- jira
parameters:
  - name: IssueID
    type: beadsId
    required: false
    description: The beads issue ID to fix
enabledWhen: '(Tools.Names.exists(n, n.matches("(?i)jira")) || CommandExists("jira")) && CommandExists("bd") && DirExists(".beads") && (("jira-sync" in Item.Labels) || (Session.HasBeadsIssue && BeadHasLabels(Session.BeadsIssue, "jira-sync")))'
preferredModels:
  - modelTag: Coding
target:
  reuse:
    issue: true
    coalesce: true
prompt: |
  {{ template "_shared/session-context" . }}

  {{ $target := "" -}}
  {{ if .Session.BeadsIssue }}{{ $target = .Session.BeadsIssue }}{{ else if .Args.IssueID }}{{ $target = .Args.IssueID }}{{ end -}}
  {{ if not $target -}}
  There is **no linked bead** for this conversation and no `IssueID` argument was provided. This prompt only pushes local changes for a specific bead back to JIRA — send one `mitto_ui_notify` explaining that a bead is required, then **stop**.
  {{- else }}

  The **target bead** is `{{ $target }}`. Push local changes on this bead back to its linked JIRA ticket — transition the JIRA ticket to a Done status if the bead is closed locally, and mirror any local beads comments back to JIRA as `[mitto]`-tagged comments. This prompt only ever **adds** to JIRA (a comment or a status transition); it never edits or deletes existing JIRA content.
  {{- end }}

  ## Interaction Mode
  {{- if and .Session.IsLoop (not .Session.IsLoopForced) }}

  **Silent mode** — a scheduled loop run; the user is not watching.
  - Use **only** `mitto_ui_notify` — non-blocking notifications only.
  - Do **NOT** use `mitto_ui_options`, `mitto_ui_form`, or `mitto_ui_textbox`.
  {{- else }}

  **Interactive mode** — a regular conversation or a force-triggered loop run; the user is present.
  - Use interactive tools (`mitto_ui_options`, `mitto_ui_form`, `mitto_ui_textbox`) as well as `mitto_ui_notify`. This is the default when run on demand.
  {{- end }}

  ## Access Method

  This prompt talks to JIRA in one of two ways: **JIRA MCP tools** (e.g. `jira_get_transitions`, `jira_transition_issue`, `jira_add_comment`) or the **`jira` CLI** (ankitpokhrel/jira-cli). **Prefer MCP tools whenever they are available** — they return structured JSON, avoid a subprocess round-trip, and do not depend on the user's local `jira` config. Fall back to the CLI only when the matching MCP tool is not present.
  {{- if Cond "Tools.Names.exists(n, n.matches('(?i)jira'))" }}

  **This run has JIRA MCP tools available** (a tool whose name contains `jira` is reachable). Every JIRA write below should go through the MCP tool named in the step (the transitions / transition-issue tools in Step 3, the add-comment tool in Step 4). Names may be namespaced by the client (`mcp__<server>__<op>`); prefer whichever exact name is exposed to you.
  {{- else }}

  **This run has no JIRA MCP tools** (no tool name contains `jira`) but the `jira` command is on PATH — use it as the fallback. Wherever a step names an MCP tool, run the CLI equivalent instead.
  {{- end }}

  ## Step 1 — Load the bead and extract the JIRA key

  ```bash
  bd show {{ $target }} --json
  bd comments {{ $target }} --json    # or the equivalent JSON subcommand for this bd version
  ```

  From the bead capture: `status`, `external_ref`, `metadata.jira_pushed_status`, `metadata.jira_pushed_comments`, and every existing beads comment (id, author, created, body).

  The JIRA key comes from `external_ref`, which must have the form `jira-<key-lower>` (this is what `JIRA: sync tasks` writes on create). Strip the `jira-` prefix and uppercase the remainder to get the JIRA key used against the API (e.g. `external_ref = "jira-abc-123"` → key `ABC-123`). If `external_ref` is empty or does not start with `jira-`, this bead is not linked to a JIRA ticket even though it carries the `jira-sync` label — send one `mitto_ui_notify` explaining that the label was likely applied manually and there is nothing to push, then **stop**.

  ## Step 2 — Fetch the JIRA ticket's current status

  Look up the ticket's current status name so Steps 3 and 4 can act idempotently.
  {{- if Cond "Tools.Names.exists(n, n.matches('(?i)jira'))" }}

  Call **`jira_get_issue_jira`** for the key with `fields="status"` (or `fields="*all"` if the tool does not accept a subset).
  {{- else }}

  Run:

  ```bash
  jira issue list -q "key = <KEY>" --raw
  ```

  and read `fields.status.name` from the result.
  {{- end }}

  Skip Step 3 entirely if the bead is not closed locally. Skip Step 4 for any comment already listed in `metadata.jira_pushed_comments`.

  ## Step 3 — Close JIRA when the bead is closed locally

  If the bead is **closed** locally and the JIRA ticket is **not** already in a **terminal** status (see Guidelines "Terminal status"), transition JIRA to a terminal status. JIRA workflows vary per project, so look up the available transitions for this ticket and pick a transition whose **target status name** matches the terminal allow-list (`Done` / `Closed` / `Resolved` / `Cancelled`/`Canceled` / `Won't Do` / `Won't Fix`/`Wontfix` / `Duplicate`, case-insensitive, exact). Prefer `Done` when multiple terminal transitions are available.

  Do **not** pick a transition merely because its target `statusCategory` is `done` — deployment-pipeline statuses like `Deployed to Stage`, `Released`, or `Ready for Prod` often live in the green category but are not terminal, and transitioning there would misrepresent the ticket state.
  {{- if Cond "Tools.Names.exists(n, n.matches('(?i)jira'))" }}

  Use **JIRA MCP tools**: `jira_get_transitions` to list the workflow's transitions for `<KEY>`, then `jira_transition_issue` to apply the chosen one.
  {{- else }}

  Use the **`jira` CLI**:

  ```bash
  jira issue transitions <KEY>                                        # list available transitions
  jira issue move <KEY> "Done" --resolution "Done" --comment "Closed in beads ({{ $target }})"
  # (name of the target status may differ per workflow — fall back to whatever
  # 'jira issue transitions <KEY>' lists as the done-category transition)
  ```
  {{- end }}

  If **no** terminal transition is available (workflow restriction, permission denied, or the only reachable done-category transitions are non-terminal names like `Deployed to Stage`), do **not** force it — instead add a `[mitto]` comment saying the bead was closed locally, so a human can transition manually
  ({{- if Cond "Tools.Names.exists(n, n.matches('(?i)jira'))" }} via `jira_add_comment`{{- else }} via `jira issue comment add <KEY> --body-file /tmp/jira-<key>.mitto.close.md`{{- end }}). The comment body starts with `[mitto] Closed in beads: <reason>`.

  Record what was done on the bead so re-runs are idempotent:

  ```bash
  bd update {{ $target }} --set-metadata jira_pushed_status="<new-status>"
  ```

  Skip this whole step if `metadata.jira_pushed_status` already matches the JIRA ticket's current status (nothing changed since the last push).

  ## Step 4 — Mirror local beads comments back to JIRA

  For each of the bead's comments loaded in Step 1:

  - **Skip** any comment whose body starts with `[jira]` — that comment was mirrored **from** JIRA by `JIRA: pull issue` (or `JIRA: sync tasks`) and must not loop back.
  - **Skip** any comment whose id is already listed in `metadata.jira_pushed_comments` (already mirrored on a prior run).
  - Otherwise, post the comment to JIRA prefixed with `[mitto]` so the pull side can recognise the round-trip. Compose the body as `[mitto] <bd-author> @ <bd-created>: <body>`. It will still come back on the next pull as `[jira] <author> @ <time>: [mitto] <body>` and be tracked by `jira_synced_comments` without duplication.
    {{- if Cond "Tools.Names.exists(n, n.matches('(?i)jira'))" }}

    Use **`jira_add_comment`**. Capture the resulting JIRA comment id if the tool returns it.
    {{- else }}

    Use the **`jira` CLI**:

    ```bash
    # write the composed body to a temp file, then:
    jira issue comment add <KEY> --body-file /tmp/jira-<key>.push-<comment-id>.md
    ```
    {{- end }}

  After all eligible comments for this bead are pushed, extend the metadata list:

  ```bash
  bd update {{ $target }} --set-metadata jira_pushed_comments="<previous ids + new bead-comment ids>"
  ```

  **Never push** in silent mode when a comment/transition tool errors with a permission or auth failure — record it in the summary and continue instead of retrying (retries against a permission failure just waste API budget).

  ## Step 5 — Summary

  Report what changed: whether the JIRA ticket was transitioned (and to which status), whether a `[mitto]` close-comment was posted because no terminal transition was available, how many local beads comments were pushed to JIRA, and any push failures (grouped by cause). In silent mode send a single `mitto_ui_notify` only if anything changed; stay silent otherwise. In interactive mode print the full summary.

  ## Guidelines

  - **Idempotent**: `metadata.jira_pushed_status` skips already-transitioned beads; `metadata.jira_pushed_comments` prevents re-pushing the same beads comment. Running this prompt twice in a row must produce no spurious JIRA writes.
  - **Loop-safe**: `[jira]`-prefixed beads comments are **never** pushed to JIRA; `[mitto]`-prefixed JIRA comments still come back through pull but are dedup-tracked by `jira_synced_comments`, so the round-trip never duplicates.
  - **Push safety**: on any transition or comment permission/auth failure, record it in the run summary and move on — do not retry against a permission wall. Never edit or delete existing JIRA content; this prompt only **adds** (a new comment) or **transitions** (status only).
  - **Terminal status (conservative)**: a JIRA ticket is treated as **closed** only when its status `name` is one of a small allow-list — `Done`, `Closed`, `Resolved`, `Cancelled`/`Canceled`, `Won't Do`, `Won't Fix`/`Wontfix`, `Duplicate` (case-insensitive, exact match). **Do not** rely on `statusCategory == "done"`: many workflows place deployment-pipeline statuses (`Deployed to Stage`, `Deployed`, `Released`, `Ready for Prod`, `In UAT`, `Verified`, `Awaiting Deploy`, `On Prod`, etc.) in the green category even though real work remains. The same allow-list gates transition targets in Step 3.
  - **Scope**: this prompt is push-only — it never pulls from JIRA, never touches the bead body, never wires dependencies (that is a bulk-sync concern), and never touches other beads. Use `JIRA: pull issue` to refresh this bead from JIRA, or `JIRA: sync tasks` for a full two-way batch sync.
