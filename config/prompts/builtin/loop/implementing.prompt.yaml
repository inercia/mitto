icon: refresh
name: Loop implementing
menus: promptsLoop
parameters:
  - name: Commit
    type: boolean
    description: Commit the changes made at the end of each iteration
description: Continue iterating to implement the feature we have been working on
group: Development
backgroundColor: '#BBDEFB'
loop:
  mode: always
  trigger: onCompletion
  coalesceDuringBusy: true
  delay: 30
  maxIterations: 20
prompt: |
  {{- if .Iteration.IsUninterrupted }}
  Continue implementing the feature you have been working on in this loop. Read the
  state file `implement-<problem>-<date>.md` and the relevant source first — do
  not speculate about code you haven't opened.

  Do exactly one increment this run (a single increment may itself fan out into
  parallel children — see "Parallelize independent subtasks" below):

  1. Review the state file: what's done and what's still missing.
  2. Pick the next work item from the spec — no extra features or abstractions. Before
     implementing, check whether it decomposes into independent parts you can run in
     parallel (see "Parallelize independent subtasks" below).
  3. Implement it.
  4. Verify the implementation.
  5. Update the state file (Progress / Issues remaining).
  {{- if eq .Args.Commit "true" }}
  6. Commit only the files you changed, staged explicitly by path (never
     `git add -A`, `git add .`, or `git commit -a`); concise conventional
     message; skip the commit if nothing changed.
  {{- end }}

  **Decide autonomously; do not ask the user.** Only when part of the spec is
  genuinely ill-defined, record it under "Issues remaining", report it, and stop
  — never guess.
  {{- else }}
  Read the state file and relevant source files first. Do not speculate about
  code you haven't opened.

  Continue implementing features using a state file to track progress across iterations.

  Only implement what's in the spec. No extra features or abstractions.

  **Decide autonomously; do not ask the user.** Take every decision needed to make
  progress yourself. The sole exception is when part of the spec is **not properly
  defined or understood** (a genuinely ambiguous requirement or unknown you cannot
  resolve from the available context): then do **not** guess — record it in the state
  file under "Issues remaining", report it, and stop rather than asking.

  # Preparation

  State file: `implement-<problem>-<date>.md` (date as `YYYY-MM-DD`).

  Template:
  ```markdown
  # The problem
  [description]
  # Progress
  ## [num] [issue title]
  [description] [fix applied]
  # Issues remaining
  ## [num] [issue title]
  ```

  # The Task

  1. Read state file (create if missing)
  2. Review current state and what's still missing
  3. Analyze remaining issues
  4. Prioritize and implement next work item
  5. Verify implementation
  6. Update state file
  {{- if eq .Args.Commit "true" }}
  7. Commit your work — but only if you actually changed files this iteration.
     Stage **only** the files you changed for this work, explicitly by path
     (`git add <file> ...`). Do **NOT** use `git add -A`, `git add .`, or
     `git commit -a`: other unrelated, uncommitted changes may exist in the repo
     and must be left untouched. Write a concise, conventional commit message
     describing this increment. If nothing changed this iteration, skip the commit.
  {{- end }}

  Once complete, verify against original problem description.
  {{- end }}

  ## Parallelize independent subtasks when possible

  A single increment may itself decompose into **two or more genuinely independent
  subtasks** — ones that touch **different files/modules**, have **no ordering
  dependencies** between them, and cannot conflict. When such a clean split exists,
  prefer to run the subtasks **in parallel across child conversations** rather than
  serially inline; this still counts as one increment for the run.

  Only fan out when **all** of these hold; otherwise do the increment inline as above:

  - this conversation can spawn children — it is **top-level** (not itself a child) and
    the **Can start conversation** + **Can Send Prompt** advanced-settings flags are on;
  - the subtasks are **disjoint** — no shared files, no shared state, and none depends on
    another's output. **Never** split work that has interdependencies or could produce
    conflicting edits;
  - splitting genuinely saves wall-clock time (skip it for one-file or trivial changes).

  To fan out (use `{{ .Session.ID }}` as `self_id` for every `mitto_*` call):

  1. Define each subtask completely and self-contained: what to do, the **disjoint** set
     of files/modules it owns (verify the sets do not overlap), expected outcome,
     constraints, and a definition of done. Cap at **3–4** parallel subtasks per run.
  2. For each subtask, reuse a suitable **idle** existing child when available, otherwise
     `mitto_conversation_new` one — preferring a faster/cheaper agent for routine work —
     seeding a fully self-contained worker prompt that ends by reporting via
     `mitto_children_tasks_report`.
  3. Block on all of them at once:
     `mitto_children_tasks_wait(self_id: "{{ .Session.ID }}", children_list: [<child ids>], task_id: "<short label>", timeout_seconds: 1800)`.
     On timeout, retry the pending children with the **same** `task_id` (omit the prompt
     to avoid duplicates); after a second timeout treat those subtasks as failed.
  4. **Synthesize** the reports, verify the combined result, then update the state file
     (and commit, if enabled) exactly as for an inline increment. Clean up finished
     children you no longer need.

  If any subtask reports a conflict with another, stop parallelizing that work and finish
  it inline on a subsequent run. If a spawn call errors because a flag is off, fall back
  to doing the increment inline.
