icon: loop
name: Loop until ...
menus: prompts, promptsLoop, conversation
parameters:
  - name: Condition
    type: text
    required: true
    description: The stop condition — keep iterating until this is true (e.g. "all tests pass and the linter is clean")
  - name: Commit
    type: boolean
    description: Commit the changes made at the end of each iteration
description: Make this conversation a loop (on completion) and keep iterating until your condition is met, then self-terminate
backgroundColor: '#D1C4E9'
group: Work flow
enabledWhen: 'Session.HasMessages && !Session.IsChild'
loop:
  trigger: [onCompletion]
  onCompletion:
    delay: 30
  mode: always
  maxIterations: 20
  maxDuration: "4h"
prompt: |
  {{ template "_shared/session-context" . }}

  # Iterate Until a Condition Is Met

  This conversation is a self-driving loop: do **one increment per run** until the
  stop condition is true, then self-terminate. Each run fires automatically a short
  while after you stop responding (an "on completion" trigger) and continues
  unattended — you do not need to arm anything.

  **The stop condition is:**

  > {{ .Args.Condition }}

  ## Each run
  {{- if .Iteration.IsUninterrupted }}

  Automated, unattended run — use `mitto_ui_notify` only; never call
  `mitto_ui_options`, `mitto_ui_form`, or `mitto_ui_textbox`, and never ask the user
  to make work decisions. Decide autonomously.
  {{- end }}

  1. Review the real current state — read the relevant files, run the relevant
     checks, inspect git status. Never speculate about code you have not opened.
  2. Evaluate the stop condition against that observed state (test output, file
     contents, command exit codes), never against your intentions. If you cannot
     verify it is true, treat it as not yet met.
  3. If it is TRUE: disable the loop —
     mitto_conversation_update(self_id: "{{ .Session.ID }}", conversation_id: "self", loop_enabled: false) —
     then mitto_ui_notify(self_id: "{{ .Session.ID }}", title: "Iteration complete",
     message: "<how the condition was satisfied>", style: "success"). Do nothing further.
  4. If it is NOT met: do exactly ONE concrete increment toward it, verify that
     increment, briefly note progress, then stop responding so the next run continues.
     When that increment decomposes into two or more genuinely independent subtasks
     (different files/modules, no ordering dependencies, no possible conflict) and
     this conversation can spawn children (Can start conversation + Can Send Prompt
     flags on), fan them out to run in parallel instead of serially: give each child a
     self-contained task over a DISJOINT file set that ends by reporting via
     mitto_children_tasks_report, block on them all with
     mitto_children_tasks_wait(self_id: "{{ .Session.ID }}", children_list: [...],
     task_id: "<label>", timeout_seconds: 1800), then synthesize the reports and
     verify the combined result. Never split work with interdependencies or shared
     files; do it inline instead. If a spawn call errors because a flag is off, fall
     back to doing the increment inline.
  {{- if eq .Args.Commit "true" }}

     If you changed files and verified them, commit them.
     {{ template "git/shared/safe-stage" . }}
  {{- end }}

  If part of the work is **not properly defined** (the condition is unclear or a
  requirement is genuinely ambiguous) or the `mitto_*` tools are unavailable, do
  NOT guess — disable the loop, report what is blocking via `mitto_ui_notify`,
  and stop.
