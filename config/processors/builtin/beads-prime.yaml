##########################################################################################
# Builtin processor: injects a compact beads memory INDEX (keys only, no bodies) at the
# start of a conversation, so agents know what persistent knowledge exists without
# paying the full context cost of every memory body up front.
#
# When the `bd` command is available AND the workspace contains a `.beads` directory
# (i.e. beads has been initialized for this project), this processor runs
# `bd --readonly prime --memories-only` using the bd 1.2.2-compatible syntax, extracts just
# the memory headings (titles/keys), and PREPENDS a
# short markdown index plus on-demand lookup instructions to the user's first message.
# The user's original message is always preserved. Agents then pull full bodies only
# for the memories that turn out to be relevant, via `bd memories <keyword>` (search)
# or `bd recall <key>` (read one in full).
#
# Activation conditions:
#   1. The `bd` command exists on PATH (CommandExists CEL gate)
#   2. The workspace contains a `.beads` directory (DirExists CEL gate)
#   3. `sh` and `awk` exist on PATH (CommandExists CEL gates) — needed to reduce
#      the memory markdown to a validated title/key index.
#
# Throttling:
#   - Fires on the first message, then re-runs only after enough token budget has
#     been consumed (afterTokens) to justify a fresh index. Time/message-count
#     reruns were removed (mitto-telc) to avoid repeatedly re-injecting the same
#     index during a long-lived conversation.
#
# Implementation note: command-mode processors exec their `command` directly (no
# shell), so the `bd --readonly prime | awk ...` pipeline requires an explicit `sh -c`
# wrapper (mirrors the pattern in internal/web/handlers/badge_click.go). The script
# captures `bd`'s exit status explicitly and exits with it BEFORE piping to awk, so a
# `bd` failure (e.g. no beads database) still surfaces as processor failure instead of
# silently producing an empty/misleading index.
#
# Uses command-mode with outputFormat:raw so that the plain-text markdown output is
# injected directly without a JSON wrapper.
#
# Cold-restart fallback (mitto-9zp): immediately after a server restart, `bd prime`
# can transiently emit output with neither the counted "## Persistent Memories (N)"
# heading nor the steady-state zero-shape markers (index not built yet for that
# workspace). The awk parser treats that specific shape — zero `### key` lines and
# no recognized heading — as "no memories yet" and succeeds with an empty index,
# instead of exiting 65 with a `format/count mismatch`. A keys-without-count
# response (keys parsed but no count heading) is still a genuine shape mismatch and
# still fails, preserving the original validation for real corruption.
#
# Memory-index context cap (mitto-i69): unbounded corpora make this processor's
# payload grow linearly forever (measured: 272 keys ~= 3,582 estimated tokens,
# 71.6% of the processor's context). `bd prime` already implements bounded,
# deterministic (alphabetical) whole-memory-boundary selection via
# `--max-memories N`, plus an elision banner — we thread that flag through instead
# of reimplementing selection here. Default cap is 60 entries; override via the
# `MITTO_BEADS_PRIME_MEMORY_LIMIT` env var (empty => default 60, `0` => unlimited,
# forwarded to `bd` unchanged). On the 272-key reference corpus this caps the
# rendered index to ~60 keys plus a one-line truncation notice (~800 tokens, a
# ~77% reduction) while keeping every omitted memory reachable via the existing
# `bd memories <keyword>` / `bd recall <key>` on-demand instructions below. The awk
# parser recognizes both the unbounded heading (`## Persistent Memories (N)`) and
# the capped heading `bd` emits when `--max-memories` truncates
# (`## Persistent Memories (showing K of TOTAL, alphabetical)`), and appends its
# own truncation line (distinct from `bd`'s own banner, which is stripped along
# with the rest of the body text) whenever TOTAL > K.
##########################################################################################
name: beads-prime
description: "Injects a compact beads memory index (keys only) plus bd memories/bd recall lookup instructions at the start of a conversation"
enabled: true
enabledWhen: 'CommandExists("bd") && DirExists(".beads") && CommandExists("sh") && CommandExists("awk")'
when:
  on: userPrompt
  match: first
  rerun:
    afterTokens: 80000
command: sh
args:
  - -c
  - |
    limit="${MITTO_BEADS_PRIME_MEMORY_LIMIT:-60}"
    attempt=1
    while [ "$attempt" -le 2 ]; do
      out=$(bd --readonly prime --memories-only --max-memories "$limit")
      rc=$?
      if [ "$rc" -ne 0 ]; then
        exit "$rc"
      fi
      parsed=$(printf '%s' "$out" | awk '
        BEGIN {
          n = 0
          expected = -1
          total = -1
          zero_heading = 0
          zero_marker = 0
        }
        /^## Persistent Memories \([0-9]+\)$/ {
          line = $0
          sub(/^## Persistent Memories \(/, "", line)
          sub(/\)$/, "", line)
          expected = line + 0
          total = expected
        }
        /^## Persistent Memories \(showing [0-9]+ of [0-9]+, alphabetical\)$/ {
          line = $0
          sub(/^## Persistent Memories \(showing /, "", line)
          sub(/, alphabetical\)$/, "", line)
          split(line, parts, " of ")
          expected = parts[1] + 0
          total = parts[2] + 0
        }
        /^# Beads Persistent Memories$/ { zero_heading = 1 }
        /^No memories stored\./ { zero_marker = 1 }
        /^### / {
          key = $0
          sub(/^### /, "", key)
          keys[n++] = key
        }
        END {
          if (expected < 0 && zero_heading && zero_marker) {
            expected = 0
            total = 0
          }
          # mitto-9zp: at restart, `bd prime` can transiently emit output with
          # neither the counted "## Persistent Memories (N)" heading nor the
          # zero-shape markers above (index not built yet). Treat that as
          # "no memories yet" and succeed with an empty index rather than
          # exiting 65 — but only when zero `### key` lines were parsed; a
          # keys-without-count response (n > 0) is still a genuine shape
          # mismatch and must still fail below.
          if (expected < 0 && n == 0) {
            expected = 0
            total = 0
          }
          if (expected < 0 || n != expected) {
            printf "expected=%d actual=%d\n", expected, n > "/dev/stderr"
            exit 65
          }
          print "## Beads Memory Index"
          print ""
          if (n == 0) {
            print "No persistent memories recorded yet."
          } else {
            print "Titles/keys of persistent memories (bodies omitted to save context):"
            print ""
            for (i = 0; i < n; i++) {
              print "- `" keys[i] "`"
            }
            # mitto-i69: the elision banner bd emits in its body text is
            # discarded along with everything else but the headings/keys, so
            # re-surface the same fact with a single line pointing at the
            # existing on-demand lookup commands documented below.
            if (total > expected) {
              printf "\n> _...and %d more memories not shown (alphabetical cap). Use `bd memories <keyword>` to search or `bd recall <key>` to read one._\n", total - expected
            }
          }
          print ""
          print "Use `bd memories <keyword>` to search memory bodies by keyword, or `bd recall <key>` to read one memory in full."
        }
      ' 2>&1)
      rc=$?
      if [ "$rc" -eq 0 ]; then
        printf '%s\n' "$parsed"
        exit 0
      fi
      if [ "$attempt" -eq 2 ]; then
        printf 'beads-prime: memory index format/count mismatch workspace=%s %s\n' "$(pwd -P)" "$parsed" > /dev/stderr
        exit "$rc"
      fi
      attempt=$((attempt + 1))
    done
input: none
output: prepend
outputFormat: raw
priority: 92
timeout: 30s
