##########################################################################################
# Builtin processor: injects session identity and context into the first message.
# This helps the AI agent understand its session context, parent/child relationships,
# and which ACP servers are available for the current workspace.
#
# Uses text-mode (no external command) with Go-template {{ }} accessors that are
# rendered at runtime against the live session context (.Session, .ACP, .Parent,
# .Children, .Workspace).
#
# Throttling (retuned mitto-8n5):
#   - Fires on the first message, then re-runs only after enough token budget
#     (afterTokens) has been consumed. The rendered header embeds the LIVE
#     child/agent list, which changes as children spawn or die, so a
#     periodic refire is justified — but token count (which tracks real
#     context turnover) is a better proxy than wall-clock time or message
#     count. A genuine fresh-context event (session resume/compaction) also
#     naturally refires this processor via IsFirstMessage.
##########################################################################################
name: session-context
description: "Injects session identity and context into the first message"
enabled: true
when:
  on: userPrompt
  match: first
  rerun:
    afterTokens: 80000
mutate: prepend
priority: 10
text: |
  [Session Context]
  Session: {{ .Session.ID }} ({{ .Session.Name }})
  Agent: {{ .ACP.Name }}
  Working Directory: {{ .Workspace.Folder }}
  Parent: {{ .Parent.Ref }}
  Children: {{ .Children.AllText }}
  Available Agents: {{ .ACP.AvailableText }}
  ---
