##########################################################################################
# Builtin processor: reminds the agent that this project uses beads (bd) for issue tracking.
#
# When the `bd` command is available on the system PATH, this processor appends a
# reminder instructing the agent to track tasks and work items in beads instead of
# ad-hoc markdown TODO lists, and to check ready tasks before starting new work.
# (This processor also subsumes the former beads-ready-tasks processor.)
#
# Activation conditions:
#   - The `bd` command exists on PATH (CommandExists CEL gate)
#
# Throttling (retuned mitto-8n5):
#   - Fires on the first message, then re-runs only after enough token budget
#     (afterTokens) has been consumed. The bullet-list body is immutable
#     static guidance — a fixed 30-minute/20-message cadence was reinjecting
#     it while still retained in context. Token consumption correlates with
#     actual context turnover, unlike wall-clock time or message count; a
#     genuine fresh-context event (session resume/compaction) already
#     refires match:first processors naturally via IsFirstMessage.
#
# Dedup (mitto-2kw): this processor keeps firing even when a standing
# agent-instructions file (AGENTS.md and friends) already covers the same
# ground, because it also carries the one thing no static file can supply --
# the runtime-resolved `.Workspace.BeadsDatabaseMode` value. When
# HasStandingBeadsGuidance() is true the static bullet list is dropped and
# only the title, database-mode block, and the always-on issue-writing
# guidance (not covered by standing files) are emitted.
#
# Uses text-mode (no external command).
##########################################################################################
name: beads-track-tasks
description: "Reminds the agent to track tasks in beads (bd) and review ready tasks"
enabled: true
enabledWhen: 'CommandExists("bd")'
when:
  on: userPrompt
  match: first
  rerun:
    afterTokens: 15000
mutate: append
priority: 93

text: |
  ---
  # Beads Issue Tracker Reminder

  {{ if HasStandingBeadsGuidance -}}
  This project uses `bd` (beads) for issue and task tracking. See the standing
  agent-instructions file (e.g. `AGENTS.md`) for the full workflow.
  {{ else -}}
  This project uses `bd` (beads) for issue and task tracking. Use it for ALL task
  tracking — do NOT use markdown TODO lists or ad-hoc task files.
  {{ end -}}

  {{ if eq .Workspace.BeadsDatabaseMode "shared" -}}
  - **Database mode: shared.** Beads database replication is permitted when the
    repository workflow calls for it. This does not select an external task
    system; `.Workspace.TasksUpstream` does that independently.
  {{ else -}}
  - **Database mode: local-only.** Beads changes must remain on this machine.
    Never run `bd dolt push`, `bd dolt pull`, `bd dolt bootstrap`, or otherwise
    publish/synchronize the Beads database. This restriction applies only to
    Beads data — normal source-code Git operations remain unaffected.
  {{ end -}}
  - **Writing beads.** When creating or updating issues, write descriptions in
    plain, unambiguous language as one coherent message: context → problem →
    desired outcome.
  - Format issue bodies AND comments as Markdown: headings, bullet lists, code
    fences for commands/paths/identifiers, **bold** for key terms, short
    paragraphs.
  - Keep tone consistent across title, description, and comments so the issue
    reads as one thread, not disjointed notes.

  {{ if not HasStandingBeadsGuidance -}}
  - Before starting new work, run `bd ready --exclude-label in-flight` to find
    unblocked tasks, then `bd show <id>`. The `in-flight` label marks beads held by
    automated drivers; excluding it avoids colliding with an active driver.
  - If a ready task matches the user's request, claim it with
    `bd update <id> --claim` and `bd close <id>` when done. If your work relates
    to an existing issue, update it rather than duplicating it; surface relevant
    ready tasks to the user.
  - File new issues with `bd` for any follow-up work you discover.
  - Run `bd prime` if you need the full workflow and command reference.
  {{ end -}}
