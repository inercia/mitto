##########################################################################################
# Builtin processor: curates the beads memory store on close — primarily by MERGING
# overlapping memories into a canonical survivor, and only secondarily by forgetting
# entries that are demonstrably dead.
#
# Complements `extract-memories-on-close` (which ADDS/refines memories via
# `bd remember`) by reducing redundancy and pruning dead entries. Runs at conversation
# close as a fire-and-forget auxiliary agent; the session is already archived and
# there is no UI to notify.
#
# Primary action — merge, not delete:
#   - `merge`     : two or more memories cover the same topic → consolidate the
#                   essential facts into one canonical survivor via
#                   `bd remember --key <survivor>`, verified with `bd recall`. Losers
#                   are marked SUPERSEDED (naming the survivor) so they become
#                   `forget`-eligible on a LATER run — never forgotten in the same
#                   run they were merged in.
#   - `forget`    : the memory body ALREADY self-declares OBSOLETE/SUPERSEDED and
#                   NAMES a survivor key (e.g. from a prior run's merge step) → auto
#                   `bd forget <key>`, subject to guardrails (age, cap, verification).
#   - `uncertain` : refers to files, PRs, issue IDs, or branches that may no longer
#                   apply → collected across the whole run and filed as AT MOST ONE
#                   deduplicated `bd create --type task --priority p3` (never one
#                   issue per candidate).
#   - `keep`      : everything else (default when unsure).
#
# Activation gates (all must hold):
#   1. `bd` command exists on PATH (CommandExists CEL gate)
#   2. The workspace contains a `.beads` directory (DirExists CEL gate)
#   3. The session is NOT a loop conversation (loops routinely open/close and would
#      otherwise thrash the memories store on every iteration)
#
# Priority 210 — runs AFTER extract-memories-on-close (200) so the curator can also
# consider any memories that processor may have just added in this session.
#
# Workspace-scoped maintenance gating (mitto-1kl): unlike ordinary close-phase
# processors, this one does NOT dispatch on every eligible conversation close.
# ApplyOnClose (internal/processors/apply.go, name-guarded on
# "curate-memories-on-close") gates dispatch against a persisted, workspace-scoped
# memory-curation.json ledger: a run only fires once MinInterval has elapsed since
# the last completed run OR at least MinChangedMemories memories have been added or
# removed since then. Concurrent conversation closes coalesce into at most one
# in-flight dispatch. This processor's own close-history snapshot is deliberately
# dropped — global memory compaction does not depend on any single conversation's
# transcript — and its input here is a bounded, index-first `bd prime` scan (see
# step 1 below), never the full `bd memories --json` store.
#
# Enabled by default — disable per workspace in the Workspaces dialog or .mittorc.
##########################################################################################
name: curate-memories-on-close
description: "Merges overlapping bd memories into a canonical survivor, forgets only self-declared obsolete/superseded entries (guarded), and files at most one deduplicated review task for uncertain candidates"
enabled: true
when:
  on: conversationClosed
  match: all
priority: 210
timeout: 300s
onError: skip

# Only fire when beads is initialised in this workspace, and never for loop sessions
# (they archive/unarchive frequently and would repeatedly re-scan the same store).
enabledWhen: 'CommandExists("bd") && DirExists(".beads") && !Session.IsLoop'

# Gating knobs read by the mitto-1kl name-guarded orchestration in
# internal/processors/apply.go (parseMemoryCurationDuration/parseMemoryCurationInt).
# Overridable per workspace via .mittorc without editing this file.
parameters:
  - name: MinInterval
    type: text
    description: "Minimum time between maintenance runs (Go duration syntax, e.g. 24h)"
    default: "24h"
  - name: MinChangedMemories
    type: text
    description: "Minimum number of memories added/removed since the last run that forces an early re-run even before MinInterval elapses"
    default: "5"
  - name: IndexMaxMemories
    type: text
    description: "Max memory keys included in the bounded bd prime index handed to the agent"
    default: "60"
  - name: BodyRecallCap
    type: text
    description: "Max number of full memory bodies (bd recall) the agent may pull in one run"
    default: "20"

prompt: |
  You curate the beads memory store for {{ .Workspace.Folder }} after a conversation
  has closed. Your PRIMARY job is to reduce redundancy by MERGING memories that cover
  the same topic into one canonical survivor. Your SECONDARY job is to forget entries
  that are DEMONSTRABLY dead — nothing more. When in doubt, KEEP the memory.

  This is a gated, infrequent workspace-maintenance pass (not a per-conversation
  step) — Mitto only dispatches you after enough time or enough memory churn has
  accumulated, so treat this as a periodic bounded scan, not a full audit.

  ## 1. Load a bounded index — do NOT load the full store

  Run:

      bd --readonly prime --memories-only --max-memories {{ .Args.IndexMaxMemories }}

  This returns KEYS/TITLES ONLY, never full bodies. Do **NOT** run
  `bd memories --json` — loading the entire store defeats the purpose of this
  bounded pass (a 273-memory store costs ~190k estimated tokens as full JSON vs a
  few hundred tokens as this index). If the index is empty or lists fewer than 3
  keys, exit silently.

  ## 2. Pull full bodies only for promising candidates

  From the index, pick AT MOST {{ .Args.BodyRecallCap }} keys that look like
  merge/forget/uncertain candidates (similar-sounding titles, keys referencing the
  same file/feature/issue, or titles suggesting staleness). For each picked key,
  run `bd recall <key>` to read its full body. Do not exceed the cap — if more keys
  look promising than the cap allows, prioritize the strongest candidates and leave
  the rest for a later run; everything not recalled this run is implicitly `keep`.

  ## 3. Classify each recalled memory

  For each key, decide exactly one of:

  - `merge`     — two or more memories clearly cover the same topic and should be
                  consolidated. Pick the most complete / most recent as the
                  survivor; the rest are losers for that cluster.
  - `forget`    — the memory body ALREADY, EXPLICITLY declares OBSOLETE or
                  SUPERSEDED (typically near the start of the body) AND NAMES the
                  key of the memory that supersedes it. Do not infer this from
                  context or from your own judgment that another memory covers the
                  same ground — the self-declaration must be literal and must name
                  a survivor key. (This is normally the result of a PRIOR run's
                  merge step — see step 4 — reaching the age guardrail.)
  - `uncertain` — refers to concrete files, PRs, issue IDs, branches, or ticket
                  numbers that may no longer exist / be current, but you cannot
                  confidently confirm it is stale, and it is not a `merge` case.
  - `keep`      — anything else. This is the default.

  ## 4. Merge overlapping memories (primary action)

  For each `merge` cluster:

  1. Compose ONE coherent merged body that inlines the essential facts from every
     member of the cluster — do not simply concatenate the bodies.
  2. Write it to the survivor's key (this updates that entry in place):

         bd remember --key <survivor-key> "<merged-content>"

  3. Verify: run `bd recall <survivor-key>` and confirm the merged body actually
     contains the essential facts from every loser in the cluster. If any fact is
     missing, redo step 2 before continuing — do not proceed to step 4 until the
     survivor is verified complete.
  4. Mark each loser as superseded, naming the survivor, so it becomes `forget`-
     eligible on a LATER run once the age guardrail (below) clears it. Preserve
     the loser's FULL original body after the marker so a later run can verify
     that the survivor really contains every essential fact. Do NOT forget a
     loser in the same run it was merged:

         bd remember --key <loser-key> "SUPERSEDED by <survivor-key> on <YYYY-MM-DD UTC> -- merged into that entry. Original memory: <full-original-body>"

  ## 5. Enforce guardrails BEFORE forgetting

  Apply ALL of these; violating any single one means the memory stays:

  - **KEEP is the default.** When in any doubt, keep the memory.
  - **Cap forgets at 3 this run.** If more `forget`-eligible candidates exist, leave
    the excess for a later run — do not rush them through.
  - **Verify the survivor before forgetting.** Run `bd recall <survivor-key>` (the
    key named in the candidate's own OBSOLETE/SUPERSEDED declaration) and confirm
    its body inlines the essential facts of the candidate being forgotten. If it
    does not, keep the candidate.
  - **Do not forget memories younger than 7 days.** Require an explicit UTC marker
    date in the candidate's own declaration (the `on <YYYY-MM-DD UTC>` written in
    step 4) and verify that at least 7 days have elapsed. The recalled body is the
    only source of per-memory timestamps — this index-first pass never loads the
    full store, so there is no other place to check. If the declaration has no
    date or the date is malformed, keep the memory and include its key in the
    review task instead.
  - **No secrets in `bd create`/`bd comment` titles or descriptions.** When filing
    or updating the review task in step 7, copy memory KEYS only — never paste a
    memory body verbatim into the beads issue.

  ## 6. Act on `forget` candidates

  For each `forget` candidate that PASSES every guardrail above (up to the cap of 3
  total this run):

      bd forget <key>

  For `keep`: do nothing.

  ## 7. File AT MOST ONE review task for `uncertain` candidates

  Collect ALL `uncertain` candidates from this run — do not create one issue per
  candidate. If the list is empty, skip this section entirely.

  1. Search for an existing, still-open review task with the exact stable title
     `Review possibly-stale beads memories`:

         bd query 'title="Review possibly-stale beads memories" AND (status=open OR status=in_progress OR status=blocked OR status=deferred)' --json

     `title=` in `bd query` is a CONTAINS match, not exact — treat a result as a
     match only if its own `title` field is character-for-character identical to
     `Review possibly-stale beads memories`.

  2. If a match exists, load its full description and comments first:

         bd show <id> --json

     Remove keys already present anywhere in that issue. If no new keys remain,
     do nothing. Otherwise append one comment instead of creating a duplicate:

         bd comment <id> --stdin

     with only the new keys/one-line reasons.

  3. If no exact match exists, create exactly ONE new issue covering every
     `uncertain` candidate collected in this run:

         bd create --type task --priority p3 \
           --title "Review possibly-stale beads memories" \
           --description "The following memory keys may no longer apply. For each, \
         run 'bd recall <key>' and either 'bd forget <key>' or keep it:
         - <key-1>: <one-sentence reason>
         - <key-2>: <one-sentence reason>"

  The description (and any comment in step 2) lists ONLY keys and one-line reasons
  — never memory bodies, and never secrets.

  ## 8. Completion

  This is a background clean-up processor with no attached UI — do NOT call
  `mitto_ui_notify` (it requires a live session and will fail here). If nothing
  needed doing (no merge/forget/uncertain candidates, or every candidate failed a
  guardrail), just exit silently — do NOT call any notify tool.

  If you DID call `bd remember --key`, `bd forget`, `bd create`, or `bd comment`,
  surface it as a workspace-scoped toast (visible to any client currently viewing
  this workspace) instead of a chat message. Get your own session ID via
  `mitto_conversation_get_current` first, then:

  {{ if .Workspace.UUID -}}
  ```
  mitto_workspace_ui_notify(
    self_id: "<your session ID, from mitto_conversation_get_current>",
    workspace_uuid: "{{ .Workspace.UUID }}",
    title: "Memories curated",
    message: "<one line: how many merged / how many forgotten / how many flagged for review>",
    style: "success"
  )
  ```
  {{- else -}}
  No workspace UUID is available for this run — skip the toast and exit silently
  even if you made changes.
  {{- end }}
