##########################################################################################
# Builtin processor: updates Claude Code memory files when a conversation is archived.
#
# Companion to claude-manage-memory.yaml (which handles initial generation).
# Fires once when the session enters the closed (archived or deleted) state — either
# through a manual archive from the UI, an automatic archive triggered by inactivity,
# or a session delete. The processor asks a workspace-scoped auxiliary AI agent to
# review the full archived conversation and update the CLAUDE.md / .claude/ files with
# new patterns, conventions, and lessons learned.
#
# Running at close time (rather than every few turns) means the reviewer sees the
# completed exchange in full instead of a mid-burst snapshot, and only one auxiliary
# LLM invocation is spent per session.
#
# Only activates when memory files already exist (initial generation already done).
#
# Fire-and-forget: the auxiliary agent works in the background after the main
# conversation is already archived.
#
# Enabled by default — disable per workspace in the Workspaces dialog or .mittorc.
# Only activates when the ACP server is Claude Code.
##########################################################################################
name: claude-update-memory
description: "Update Claude Code memory files based on insights from an archived conversation"
enabled: true
when:
  on: conversationClosed
  match: all
priority: 200
timeout: 300s
onError: skip

# Only for Claude Code sessions, skip loop conversations, and only when memory files
# already exist (initial generation already done).
enabledWhen: 'ACP.MatchesServerType("claude-code") && !Session.IsLoop && (FileExists("CLAUDE.md") || DirExists(".claude"))'

prompt: |
  You update Claude Code memory files for this workspace based on recent conversation insights.

  Working directory: {{ .Workspace.Folder }}

  ## Memory File Locations

  - `./CLAUDE.md` or `./.claude/CLAUDE.md` - Project memory (shared)
  - `./.claude/rules/*.md` - Modular project rules
  - `./CLAUDE.local.md` - Personal preferences (not committed)

  Review the recent conversation messages below and update memory files based on
  insights and lessons learned:

  1. Add new architectural patterns or components introduced
  2. Document new conventions, best practices, or anti-patterns discovered
  3. Update outdated or incomplete sections
  4. Add sections for uncovered areas
  5. Ensure examples reflect current codebase

  If no meaningful updates are needed, do nothing — do NOT modify any files.

  ## Size and Scope Control

  Memory files are loaded into every AI conversation, so bloated files waste context
  and degrade quality. Keep them lean.

  - **Hard limit**: Each individual file MUST stay under 150 lines. If a file grows
    beyond this, split it or aggressively trim.
  - **Total budget**: Aim for a single `CLAUDE.md` under 200 lines for small projects,
    or no more than ~10 files under `.claude/rules/` for large projects.
  - **Prune ruthlessly**: On every update, actively look for content to remove:
    - Outdated patterns that no longer match the codebase
    - Redundant entries that repeat information already in other files
    - Obvious guidance that any competent AI would follow without being told
    - Verbose examples that could be shortened without losing clarity
  - **Never duplicate docs**: If the project has its own documentation, reference it
    by path instead of copying content into memory files.
  - **Prefer bullet points and tables** over prose paragraphs.

  ## Content Guidelines

  - Be specific: "Use 2-space indentation" not "Format properly"
  - Show SHORT code examples demonstrating correct usage. Prefer snippets.
  - Use bullet points, group with headings
  - Include commands, examples, rationale
  - Include anti-pattern examples
  - Reference existing repo docs rather than duplicating

  === Conversation ===

  Use the `mitto_conversation_history` MCP tool to retrieve the archived session's
  full history. Call it with:
  - `self_id`: your session ID (from `mitto_conversation_get_current`)
  - `conversation_id`: "{{ .Session.ID }}"
  - `event_types`: ["user_prompt", "agent_message"]
  - `last_n`: 200

  Review these messages for patterns, conventions, and lessons learned.

  ## Completion

  This is a background clean-up processor with no attached UI — do NOT call
  `mitto_ui_notify` (it requires a live session and will fail here). If no changes
  were needed, just exit silently — do NOT call any notify tool.

  If you DID update memory files, surface it as a workspace-scoped toast (visible
  to any client currently viewing this workspace) instead of a chat message. Get
  your own session ID via `mitto_conversation_get_current` first, then:

  {{ if .Workspace.UUID -}}
  ```
  mitto_workspace_ui_notify(
    self_id: "<your session ID, from mitto_conversation_get_current>",
    workspace_uuid: "{{ .Workspace.UUID }}",
    title: "Updated Claude Code memory",
    message: "<one line: which memory file(s) changed and why>",
    style: "success"
  )
  ```
  {{- else -}}
  No workspace UUID is available for this run — skip the toast and exit silently
  even if you made changes.
  {{- end }}
