################################################################################
# Legacy close processor: update existing Augment rules with durable findings.
# Suppressed when knowledge-router is enabled to avoid duplicate writes.
################################################################################
name: auggie-update-rules
description: "Update existing Augment rules with durable project findings"
enabled: true
when:
  on: conversationClosed
  match: all
priority: 110
timeout: 300s
onError: skip
enabledWhen: 'ACP.MatchesServerType("augment") && !Session.IsLoop && DirExists(".augment/rules") && !Prompts.IsEnabled("knowledge-router")'

prompt: |
  Review the closed conversation for new, durable project conventions or technical
  facts that belong in the existing `.augment/rules/` files. Do not record personal
  preferences, transient task details, secrets, or information already documented.
  If there is nothing useful, leave the workspace unchanged.

  Keep each rule focused, concise, and scoped to the relevant code or file patterns.
  Update an existing rule when it is the right fit; otherwise create a small,
  appropriately named rule. Preserve unrelated content.

  {{- if .Workspace.UUID }}
  After completing, call `mitto_workspace_ui_notify` with `workspace_uuid: "{{ .Workspace.UUID }}"`
  and briefly report the result. If no durable rule was found, still notify that
  no update was needed.
  {{- else }}
  No workspace UUID is available; skip the toast and exit silently.
  {{- end }}
