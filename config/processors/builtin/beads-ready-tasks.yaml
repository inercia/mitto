##########################################################################################
# Builtin processor: reminds the agent to review pending beads tasks when a beads
# database is present in the workspace.
#
# When the `bd` command is available AND the workspace contains a `.beads` directory
# (i.e. beads has been initialized for this project), this processor appends a reminder
# nudging the agent to check the list of ready tasks and consider picking up open work.
#
# Activation conditions:
#   1. The `bd` command exists on PATH (CommandExists CEL gate)
#   2. The workspace contains a `.beads` directory (DirExists CEL gate)
#   3. No standing agent-instructions file (AGENTS.md and friends) already
#      carries this same guidance (mitto-2kw: !HasStandingBeadsGuidance() CEL
#      gate). Unlike beads-track-tasks.yaml, this processor has no dynamic
#      content to preserve, so it is fully suppressed rather than shrunk.
#
# Throttling (retuned mitto-8n5):
#   - Fires on the first message, then re-runs only after enough token budget
#     (afterTokens) has been consumed to justify a fresh reminder. This text
#     is immutable static guidance — a fixed 30-minute/20-message cadence was
#     reinjecting the same reminder while it was still retained in context.
#     Token consumption correlates with actual context turnover, unlike
#     wall-clock time or message count; a genuine fresh-context event
#     (session resume/compaction) already refires match:first processors
#     naturally via the IsFirstMessage reset, with no extra mechanism needed.
#
# Uses text-mode (no external command). The agent itself runs `bd ready` to see the
# current list of available tasks.
##########################################################################################
name: beads-ready-tasks
description: "Reminds the agent to review available tasks in the beads database"
enabled: true
enabledWhen: 'CommandExists("bd") && DirExists(".beads") && !HasStandingBeadsGuidance()'
when:
  on: userPrompt
  match: first
  rerun:
    afterTokens: 80000
mutate: append
priority: 94
text: |
  ---
  [Beads Ready Tasks Reminder]
  This workspace has a beads database (`.beads/`) with tracked issues. Before
  starting new work, run `bd ready --exclude-label in-flight` to see tasks that
  have no active blockers and are ready to be picked up. The `in-flight` label
  is written by automated drivers on beads they are actively working on;
  omitting `--exclude-label in-flight` risks colliding with an active driver.

  - If a ready task matches what the user is asking for, claim it with
    `bd update <id> --claim` and close it with `bd close <id>` when finished.
  - If your current work relates to an existing open issue, link or update it
    rather than duplicating it.
  - Surface relevant ready tasks to the user when they might want to tackle them.
