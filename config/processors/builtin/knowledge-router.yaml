##########################################################################################
# Builtin processor: single close-phase pass that routes durable findings from an
# archived conversation into EXACTLY ONE destination: preferences, rules, issue, or
# none (mitto-3od.2). Beads memories are deliberately not a destination.
#
# Runs BEFORE the legacy close processors (priority 100 vs. their 200) and is
# dispatched standalone so internal/processors/apply.go can parse its strict JSON
# reply into the close-router.json idempotency sidecar. The legacy processors carry
# `!Prompts.IsEnabled("knowledge-router")` (mitto-3od.3), so enabling this router
# suppresses them.
##########################################################################################
name: knowledge-router
description: "Single close-phase pass that classifies durable findings from an archived conversation into exactly one destination: preferences, rules, issue, or none"
enabled: true
when:
  on: conversationClosed
  match: all
priority: 100
timeout: 300s
onError: skip

# Skip loop conversations (they archive/unarchive frequently).
enabledWhen: '!Session.IsLoop'

parameters:
  - name: PreferencesFile
    type: text
    required: false
    default: ""
    description: "Local-only file for personal-preference findings (relative to workspace root). Leave empty to auto-detect 90-local.md in .augment/.cursor/.codex/.claude rules/, else .agents/rules/90-local.md."
  - name: RulesDir
    type: text
    required: false
    default: ""
    description: "Directory for project-rule findings (relative to workspace root). Leave empty to auto-detect (.augment/rules/, .cursor/rules/, .codex/rules/, or .claude/rules/)."

prompt: |
  {{- $prefsFile := Trim .Args.PreferencesFile -}}
  {{- if not $prefsFile -}}
  {{- if DirExists ".augment/rules" -}}{{- $prefsFile = ".augment/rules/90-local.md" -}}
  {{- else if DirExists ".cursor/rules" -}}{{- $prefsFile = ".cursor/rules/90-local.md" -}}
  {{- else if DirExists ".codex/rules" -}}{{- $prefsFile = ".codex/rules/90-local.md" -}}
  {{- else if DirExists ".claude/rules" -}}{{- $prefsFile = ".claude/rules/90-local.md" -}}
  {{- else -}}{{- $prefsFile = ".agents/rules/90-local.md" -}}
  {{- end -}}
  {{- end -}}
  {{- $rulesDir := Trim .Args.RulesDir -}}
  {{- if not $rulesDir -}}
  {{- if DirExists ".augment/rules" -}}{{- $rulesDir = ".augment/rules" -}}
  {{- else if DirExists ".cursor/rules" -}}{{- $rulesDir = ".cursor/rules" -}}
  {{- else if DirExists ".codex/rules" -}}{{- $rulesDir = ".codex/rules" -}}
  {{- else if DirExists ".claude/rules" -}}{{- $rulesDir = ".claude/rules" -}}
  {{- end -}}
  {{- end -}}
  You are the knowledge router for an archived Mitto conversation. Classify its durable
  findings into AT MOST ONE destination each, persist them as directed below, and report
  the result as strict JSON.

  Working directory: {{ .Workspace.Folder }}
  Archived session ID: {{ .Session.ID }}

  The full conversation is provided below as an immutable JSON snapshot (the session may
  already be deleted — do not call `mitto_conversation_history`).

  ## 1. Identify and classify

  Find facts, decisions or requests that would still matter to a future session. Ignore
  one-off narration, questions, and anything obvious from the code. Give each candidate
  exactly ONE destination (best single fit; never persist twice):

  - **preferences** — a PERSONAL preference of this user (commit style, review habits,
    tone) that need not apply to others.
  - **rules** — a project-wide convention or policy (naming, architecture, testing, tooling).
  - **issue** — actionable follow-up work identified but not completed.
  - **none** — does not durably matter (still report it).

  ## 2. Persist

  - **preferences**: append/update the section below in `{{ $prefsFile }}`, touching only
    content between the markers. This file is LOCAL ONLY: never commit or `git add` it,
    and if `git check-ignore -q {{ $prefsFile }}` fails, append its path to
    `.git/info/exclude`. Never write preferences into the project's agent-instructions files.
    ```
    <!-- BEGIN USER PREFERENCES (auto-managed by knowledge-router processor) -->
    ## User Preferences

    - **category**: description
    <!-- END USER PREFERENCES -->
    ```
  - **rules**: edit the smallest-diff existing file under
    {{ if $rulesDir }}`{{ $rulesDir }}/`{{ else }}the workspace's rules directory (none found — skip rules findings and report them as `"written": false`){{ end }}
    covering the topic, or create a new one.
  - **issue**: check `bd list --title-contains "<keyword>" --json` for a duplicate; if none,
    `bd create "<title>"` with a concise description.
  - **none**: persist nothing.

  `"written": true` only if you persisted the finding this run (skipped duplicates and
  "none" are `false`).

  ## 3. Skip already-written findings

  If a `<mitto_close_router_state>` block is present below, skip any candidate whose
  normalized (trimmed) text matches a listed `logical_key` (SHA-256 hex of that text).

  ## 4. Output (STRICT)

  Your final message MUST be exactly one JSON object — no prose, no code fence:

  {"findings":[{"text":"<candidate text>","destination":"preferences|rules|issue|none","written":true|false,"target_path":"<file path, or empty>"}]}

  With no candidates, return `{"findings":[]}`.
