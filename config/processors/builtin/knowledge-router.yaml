##########################################################################################
# Builtin processor: single close-phase pass that routes durable findings from an
# archived conversation into EXACTLY ONE destination: preferences, rules, memory,
# issue, or none (mitto-3od.2).
#
# Runs BEFORE the legacy single-purpose close processors (priority: 100, vs. their
# priority: 200) so it gets first look at the conversation. It is dispatched
# standalone (never batched with other prompt-mode close processors) so its terminal
# response can be parsed as one strict JSON object by internal/processors/apply.go,
# which persists the classification into a per-session close-router.json sidecar
# (idempotency ledger — see internal/session/close_router_sidecar.go) so a retry
# against the same immutable history snapshot never re-classifies or double-writes
# an already-persisted finding.
#
# NOTE: legacy processors (memorize-preferences, extract-memories-on-close,
# auggie-update-rules, claude-update-memory) are NOT yet suppressed when this router
# is enabled — that gating (`enabledWhen: '!Prompts.IsEnabled("knowledge-router")'`
# on each of them) is a separate, deferred sub-issue (mitto-3od.3). Until it lands,
# enabling this router means findings may be classified/persisted by BOTH this
# processor and the legacy ones.
##########################################################################################
name: knowledge-router
description: "Single close-phase pass that classifies durable findings from an archived conversation into exactly one destination: preferences, rules, memory, issue, or none"
enabled: true
when:
  on: conversationClosed
  match: all
priority: 100
timeout: 300s
onError: skip

# Skip loop conversations (they archive/unarchive frequently and would repeatedly
# re-scan the same history).
enabledWhen: '!Session.IsLoop'

parameters:
  - name: PreferencesFile
    type: text
    required: false
    default: ""
    description: "File where personal-preference findings are saved (relative to workspace root). Leave empty to auto-detect (.augment/rules/, .cursor/rules/, or .codex/rules/)."
  - name: RulesDir
    type: text
    required: false
    default: ""
    description: "Directory where project-rule findings are saved (relative to workspace root). Leave empty to auto-detect (.augment/rules/, .cursor/rules/, or .codex/rules/)."

prompt: |
  {{- $prefsFile := Trim .Args.PreferencesFile -}}
  {{- if not $prefsFile -}}
  {{- if DirExists ".augment/rules" -}}{{- $prefsFile = ".augment/rules/90-local.md" -}}
  {{- else if DirExists ".cursor/rules" -}}{{- $prefsFile = ".cursor/rules/90-local.md" -}}
  {{- else if DirExists ".codex/rules" -}}{{- $prefsFile = ".codex/rules/90-local.md" -}}
  {{- end -}}
  {{- end -}}
  {{- $rulesDir := Trim .Args.RulesDir -}}
  {{- if not $rulesDir -}}
  {{- if DirExists ".augment/rules" -}}{{- $rulesDir = ".augment/rules" -}}
  {{- else if DirExists ".cursor/rules" -}}{{- $rulesDir = ".cursor/rules" -}}
  {{- else if DirExists ".codex/rules" -}}{{- $rulesDir = ".codex/rules" -}}
  {{- end -}}
  {{- end -}}
  You are the knowledge router for a Mitto conversation that has just been archived.
  Your ONLY job this run is to classify durable findings from the conversation into
  AT MOST ONE destination each, then report the classification as strict JSON. You do
  NOT decide whether to write memories/rules/preferences yourself beyond what this
  prompt directs — follow the per-destination instructions below exactly.

  Working directory: {{ .Workspace.Folder }}
  Archived session ID: {{ .Session.ID }}

  The full archived conversation is provided below as an immutable JSON snapshot (the
  original session may already be deleted — do not call `mitto_conversation_history`).

  ## 1. Identify candidates

  Read the conversation snapshot and identify durable findings worth persisting —
  facts, decisions, or requests that would still matter to a future session. Ignore
  one-off task narration, questions, and anything already obvious from the code.

  ## 2. Classify EACH candidate into exactly one destination

  - **preferences** — a PERSONAL, user-specific preference (how THIS user likes to
    work: commit style, review habits, communication tone) that would not
    necessarily apply to other people working on the project.
  - **rules** — a project-wide convention, standard, or policy that applies to
    anyone working on the project (naming, architecture, testing style, tooling).
  - **memory** — a durable, project-level fact that is neither a personal preference
    nor a project rule (architectural decision rationale, a gotcha, a discovered
    invariant).
  - **issue** — actionable follow-up work that was identified but not completed in
    this conversation.
  - **none** — anything that does not durably matter (drop it, but still report it
    with `"destination": "none"`).

  Each candidate gets EXACTLY ONE destination. When a finding could plausibly fit two
  categories, pick the single best fit — never persist the same finding twice.

  ## 3. Persist each classified finding

  - **preferences**: append/update the personal-preferences section of
    {{ if $prefsFile }}`{{ $prefsFile }}`{{ else }}the workspace's rules file (no rules directory found — skip preferences findings and report them as `"written": false`){{ end }}
    using this format (create the section if missing, only touch content between the
    markers):
    ```
    <!-- BEGIN USER PREFERENCES (auto-managed by knowledge-router processor) -->
    ## User Preferences

    - **preference category**: description of preference
    <!-- END USER PREFERENCES -->
    ```
  - **rules**: write/update the smallest-diff file under
    {{ if $rulesDir }}`{{ $rulesDir }}/`{{ else }}the workspace's rules directory (none found — skip rules findings and report them as `"written": false`){{ end }}
    that already covers this topic, or create a new one if none does.
  - **memory**: run a TARGETED search first — `bd memories "<keyword>"` — never
    `bd memories --json` (that dumps the entire store into context). If the finding
    refines an existing memory, update it in place with
    `bd remember --key <existing-key> "<full merged content>"`; otherwise
    `bd remember "<concise, self-contained finding>"`.
  - **issue**: run a TARGETED search first — `bd list --title-contains "<keyword>" --json`
    — to check for an existing duplicate. If none exists, `bd create "<title>"` with a
    concise description; if one exists, skip (do not create a duplicate).
  - **none**: do not persist anything.

  Set `"written": true` only when you actually persisted the finding this run (a
  skipped duplicate, or "none", is `"written": false`).

  ## 4. Skip already-written findings

  If a `<mitto_close_router_state>` block is present below, it lists findings already
  persisted by an earlier run against this EXACT history snapshot (identified by the
  SHA-256 hex hash of their normalized text). Do not re-classify or re-persist any
  candidate whose normalized (trimmed) text matches a listed `logical_key` — treat it
  as already handled.

  ## 5. Output contract (STRICT)

  Your final message MUST be exactly one JSON object, no prose, no fenced code block,
  no preamble, no trailing narration:

  ```
  {"findings":[{"text":"<candidate text>","destination":"preferences|rules|memory|issue|none","written":true|false,"target_path":"<file path, or empty>"}]}
  ```

  If there are no candidates at all, return `{"findings":[]}`.
