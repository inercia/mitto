# Cline agent configuration
name: "Cline"
displayName: "Cline"
acpId: "cline"
description: "Autonomous coding agent CLI - capable of creating/editing files, running commands, using the browser, and more"
website: "https://cline.bot/cli"
repository: "https://github.com/cline/cline"
license: "Apache-2.0"
install:
  method: "npx"
  package: "cline"
  args: ["--acp"]
mcp:
  scopes: ["user", "project"]
defaults:
  # Raise Node/V8 old-space heap cap for the ACP subprocess (mitto-54k.10).
  # See augment/metadata.yaml for rationale.
  env:
    NODE_OPTIONS: "--max-old-space-size=12288"
