# Claude Code agent configuration
name: "Claude Code"
displayName: "Claude Code"
acpId: "claude-code"
description: "ACP wrapper for Anthropic's Claude"
repository: "https://github.com/agentclientprotocol/claude-agent-acp"
license: "proprietary"
# claude-agent-acp forks a fresh `claude` OS process per ACP session/new,
# unlike auggie which multiplexes over one node process. The aux-prewarm
# scheduler uses this to widen its stagger and rely on rush-on-demand so it
# does not fork N cold `claude` processes back-to-back at cold start
# (mitto-7yj).
sessionSpawnsProcess: true
install:
  method: "npx"
  package: "@agentclientprotocol/claude-agent-acp"
mcp:
  scopes: ["user", "project", "local"]
defaults:
  contextFlushCommand: "/clear"
# Per-agent stderr patterns (mitto-k6h). Unioned with the hardcoded baseline.
stderrPatterns:
  crash:
    # Rust-layer panics from claude-code-agent-sdk that don't already match
    # baseline substrings.
    - "^thread '.*' panicked at"
  ignore:
    - "(?i)method not found"
    # OpenTelemetry startup warnings are informational.
    - "(?i)OTEL_"
  degraded:
    # Anthropic quota / rate-limit chatter (plumbed only, mitto-k6h).
    - "(?i)rate limit"
    - "(?i)429 Too Many Requests"
