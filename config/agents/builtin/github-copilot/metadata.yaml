# GitHub Copilot agent configuration
name: "GitHub Copilot"
displayName: "GitHub Copilot"
acpId: "github-copilot"
description: "GitHub's AI pair programmer"
website: "https://github.com/features/copilot/cli/"
repository: "https://github.com/github/copilot-cli"
license: "proprietary"
install:
  method: "npx"
  package: "@github/copilot"
  args: ["--acp"]
mcp:
  scopes: ["user", "project"]
defaults:
  # Raise Node/V8 old-space heap cap for the ACP subprocess (mitto-54k.10).
  # See augment/metadata.yaml for rationale.
  env:
    NODE_OPTIONS: "--max-old-space-size=12288"
  # copilot --acp connects ALL configured MCP servers BEFORE it answers the
  # ACP `initialize` RPC. A cold MCP connect can exceed Mitto's default
  # per-attempt Initialize deadline (25s), causing a spurious failed_to_start
  # (mitto-sbj). 90s gives that pre-handshake phase enough room.
  initializeTimeout: "90s"
