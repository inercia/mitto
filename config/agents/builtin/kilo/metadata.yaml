# Kilo Code agent configuration
name: "Kilo"
displayName: "Kilo"
acpId: "kilo"
description: "The open source coding agent"
website: "https://kilo.ai/"
repository: "https://github.com/Kilo-Org/kilocode"
license: "MIT"
install:
  method: "npx"
  package: "@kilocode/cli"
  args: ["acp"]
mcp:
  scopes: ["user", "project"]
defaults:
  # Raise Node/V8 old-space heap cap for the ACP subprocess (mitto-54k.10).
  # See augment/metadata.yaml for rationale.
  env:
    NODE_OPTIONS: "--max-old-space-size=12288"
