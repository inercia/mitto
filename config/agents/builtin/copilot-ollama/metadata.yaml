# GitHub Copilot CLI running against a local Ollama server (BYOK)
name: "Copilot (Ollama)"
displayName: "Copilot (Ollama)"
acpId: "copilot-ollama"
description: "GitHub Copilot CLI backed by a local Ollama model (requires a tool-calling, thinking-capable model)"
website: "https://docs.ollama.com/integrations/copilot-cli"
repository: "https://github.com/github/copilot-cli"
license: "proprietary"
install:
  method: "npx"
  package: "@github/copilot"
  args: ["--acp"]
  note: "Also requires Ollama (https://ollama.com) with a model that supports tools and thinking. Override COPILOT_MODEL in the server's env."
mcp:
  scopes: ["user", "project"]
defaults:
  env:
    NODE_OPTIONS: "--max-old-space-size=12288"
    COPILOT_PROVIDER_BASE_URL: "http://localhost:11434/v1"
    COPILOT_PROVIDER_API_KEY: ""
    COPILOT_PROVIDER_WIRE_API: "responses"
    COPILOT_MODEL: "qwen3:4b-thinking-2507-q4_K_M"
    COPILOT_OFFLINE: "true"
  # Same pre-handshake MCP connect delay as github-copilot (mitto-sbj); a cold
  # local model adds no init cost, so the same budget applies.
  initializeTimeout: "90s"
